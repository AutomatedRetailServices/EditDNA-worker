name: CutSell
options:
  bundleIdPrefix: ai.cutsell
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: "5.10"
    # Shown to users / used by TestFlight. Raise CURRENT_PROJECT_VERSION for every upload.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set to the Apple Developer Team ID once the membership is active (needed to archive/upload).
    DEVELOPMENT_TEAM: ""
  configs:
    # Debug (Simulator / local development) talks to a server on this machine.
    Debug:
      CUTSELL_API_BASE_URL: http://127.0.0.1:8000
    # Release (TestFlight / App Store) talks to the hosted API.
    Release:
      CUTSELL_API_BASE_URL: https://cutsell-api.onrender.com
targets:
  CutSell:
    type: application
    platform: iOS
    sources:
      - CutSell
      # The nine caption typefaces (and their licence texts) are the server's own files, so the
      # editor preview and the exported video use exactly the same letters. One copy in the repo.
      - path: ../../cutsell_worker/fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.cutsell.app
        GENERATE_INFOPLIST_FILE: YES
        # Custom keys (API base URL, export-compliance flag) live in this small file; Xcode merges
        # it with the generated keys below. A custom key set through INFOPLIST_KEY_* is not written
        # to the built Info.plist, which left the app pointing at 127.0.0.1.
        INFOPLIST_FILE: Config/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: CutSell
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: CutSell needs access to videos you choose to edit.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: CutSell can save finished videos to your library.
        INFOPLIST_KEY_NSCameraUsageDescription: CutSell can record product footage.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: CutSell records audio with your product footage.
