name: CutSell iOS editor probe

# One-off check that the iPhone editor really opens a finished cut (TestFlight report:
# "tapping a project does not open the Editor"). Makes ONE short cut on the live server from a
# synthetic spoken clip (macOS "say", no real video or personal data), then opens it in the
# Debug app in the Simulator and takes a screenshot. The throwaway session token is masked.
# Runs only when pushed to probe/editor (manual).

on:
  workflow_dispatch: {}
  push:
    branches: [probe/editor]

concurrency:
  group: cutsell-ios-editor-probe
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$latest"

      - name: Build for the Simulator
        working-directory: mobile/ios
        run: |
          brew install xcodegen ffmpeg >/dev/null
          xcodegen generate
          set +e
          xcodebuild -project CutSell.xcodeproj -scheme CutSell -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1
          status=$?
          grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -8 | while IFS= read -r l; do echo "::error title=build::$(echo "$l" | sed 's#.*/mobile/ios/##' | cut -c1-300)"; done
          exit $status

      - name: Make a short spoken test clip
        run: |
          say -v Samantha -o "$RUNNER_TEMP/speech.aiff" "Hi everyone. Today I want to show you my favorite water bottle. It keeps drinks cold for twenty four hours. It fits in any car cup holder. And right now it is on sale in my shop. Grab yours today."
          ffmpeg -loglevel error -f lavfi -i color=c=0x203060:s=720x1280:r=30 -i "$RUNNER_TEMP/speech.aiff" \
            -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac "$RUNNER_TEMP/probe.mp4"
          ls -la "$RUNNER_TEMP/probe.mp4"

      - name: Make one cut on the live server (same calls as the app)
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          API = "https://cutsell-api.onrender.com"; T = None
          video = os.path.join(os.environ["RUNNER_TEMP"], "probe.mp4")
          def call(m, p, b=None, q=""):
              r = urllib.request.Request(API + p + q, method=m, data=None if b is None else json.dumps(b).encode(),
                  headers={"content-type": "application/json", **({"authorization": "Bearer " + T} if T else {})})
              with urllib.request.urlopen(r, timeout=120) as x: return json.load(x)
          s = call("POST", "/v1/auth/session"); T = s["access_token"]; u = s["user_id"]
          print("::add-mask::" + T)
          p = call("POST", "/v1/projects", {"user_id": u, "title": "copy_9E4975E5-7A1B"}); pid = p["project_id"]
          data = open(video, "rb").read()
          st = call("POST", "/v1/uploads/multipart/start", {"project_id": pid, "user_id": u, "original_name": "probe.mp4",
                    "content_type": "video/mp4", "size_bytes": len(data)})
          parts = []
          for n in range(1, st["part_count"] + 1):
              sg = call("POST", f"/v1/uploads/multipart/{st['upload_id']}/parts/{n}/presign", {"project_id": pid, "user_id": u})
              req = urllib.request.Request(sg["upload_url"], data=data[(n-1)*st["part_size"]: n*st["part_size"]], method="PUT")
              req.add_header("Content-Type", "")
              with urllib.request.urlopen(req, timeout=300) as r: parts.append({"part_number": n, "etag": r.headers["ETag"]})
          done = call("POST", f"/v1/uploads/multipart/{st['upload_id']}/complete", {"project_id": pid, "user_id": u, "parts": parts})
          job = call("POST", "/v1/flow-b/jobs", {"project_id": pid, "user_id": u, "audio_overlap": False, "language_hint": None,
                     "sources": [{"original_name": "probe.mp4", "uri": done["source_uri"], "source_order": 0, "duration_sec": 20.0}]})
          t0 = time.time()
          while True:
              j = call("GET", f"/v1/jobs/{job['job_id']}")
              if j["state"] in ("finished", "failed", "canceled") or time.time() - t0 > 900: break
              time.sleep(5)
          proj = call("GET", f"/v1/projects/{pid}", q=f"?user_id={u}")
          print(f"::notice title=cut::job {j['state']} in {int(time.time()-t0)} s, project {proj['state']}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"PROBE_TOKEN={T}\nPROBE_USER={u}\nPROBE_PROJECT={pid}\n")
          PY

      - name: Place a voice-over and a B-roll (same calls as the app)
        run: |
          say -v Samantha -o "$RUNNER_TEMP/vo.aiff" "This is a test voice over."
          ffmpeg -loglevel error -y -i "$RUNNER_TEMP/vo.aiff" -c:a aac -ar 48000 "$RUNNER_TEMP/voice-over.m4a"
          ffmpeg -loglevel error -y -f lavfi -i color=c=0x30A060:s=720x1280:r=30:d=3 -f lavfi -i sine=frequency=440:duration=3 \
            -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac "$RUNNER_TEMP/broll.mp4"
          python3 - <<'PY'
          import json, os, subprocess, urllib.request, urllib.error
          API = "https://cutsell-api.onrender.com"; T = os.environ["PROBE_TOKEN"]; u = os.environ["PROBE_USER"]
          pid = os.environ["PROBE_PROJECT"]; tmp = os.environ["RUNNER_TEMP"]
          def call(m, p, b=None, q=""):
              r = urllib.request.Request(API + p + q, method=m, data=None if b is None else json.dumps(b).encode(),
                  headers={"content-type": "application/json", "authorization": "Bearer " + T})
              try:
                  with urllib.request.urlopen(r, timeout=180) as x: return json.load(x)
              except urllib.error.HTTPError as e:
                  print(f"::error title={m} {p.split('/')[-1]}::HTTP {e.code} {e.read()[:300]!r}"); raise
          assets = call("GET", f"/v1/projects/{pid}/timeline-assets", q=f"?user_id={u}")["assets"]
          primary = [a for a in assets if a["role"] == "PRIMARY_SOURCE" and a["qualification_status"] == "READY"]
          print(f"::notice title=primary video::{'registered' if primary else 'MISSING'} ({len(assets)} timeline assets)")
          if not primary: raise SystemExit(1)
          def add(path, media_class, name, ctype, role, kind):
              size = os.path.getsize(path)
              auth = call("POST", f"/v1/projects/{pid}/timeline-uploads", {"user_id": u, "media_class": media_class,
                          "original_name": name, "content_type": ctype, "size_bytes": size})
              form = []
              for k in sorted(auth["fields"]): form += ["-F", f"{k}={auth['fields'][k]}"]
              code = subprocess.run(["curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", *form,
                                     "-F", f"file=@{path};type={ctype}", auth["upload_url"]], capture_output=True, text=True).stdout
              print(f"::notice title=upload {name}::storage answered {code}")
              made = call("POST", f"/v1/projects/{pid}/timeline-assets", {"user_id": u, "role": role,
                          "media_kind": kind, "upload_id": auth["upload_id"]})
              print(f"::notice title=asset {name}::{made['qualification_status']} {made['duration_sec']:.1f}s")
              return made
          vo = add(f"{tmp}/voice-over.m4a", "voice_over", "voice-over.m4a", "audio/mp4", "VOICE_OVER", "AUDIO")
          br = add(f"{tmp}/broll.mp4", "video", "broll.mp4", "video/mp4", "SUPPLEMENTAL_BROLL", "VIDEO")
          draft = call("GET", f"/v1/projects/{pid}/draft", q=f"?user_id={u}")["draft"]
          dur = sum(max(0, c["end"] - c["start"]) for c in draft.get("selected", []))
          vo_end = min(dur, 1.0 + vo["duration_sec"]); br_end = min(dur, 4.0 + br["duration_sec"])
          saved = call("PUT", f"/v1/projects/{pid}/timeline", {"user_id": u, "base_edit_asset_id": primary[0]["asset_id"],
              "timeline_duration_sec": dur,
              "voice_over_placements": [{"placement_id": "probe-vo", "asset_id": vo["asset_id"], "timeline_start_sec": 1.0,
                  "timeline_end_sec": vo_end, "source_in_sec": 0.0, "source_out_sec": vo_end - 1.0}],
              "broll_placements": [{"placement_id": "probe-broll", "asset_id": br["asset_id"], "timeline_start_sec": 4.0,
                  "timeline_end_sec": br_end, "source_in_sec": 0.0, "source_out_sec": br_end - 4.0}]})
          tl = call("GET", f"/v1/projects/{pid}/timeline", q=f"?user_id={u}")
          print(f"::notice title=timeline::{saved['outcome']}; voice-over placements {len(tl['voice_over_placements'])}, B-roll placements {len(tl['broll_placements'])}")
          # A photo overlay (synthetic graphic), the same calls as the app's Overlay tool.
          png = f"{tmp}/overlay.png"
          subprocess.run(["ffmpeg", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "color=c=0x19E6FF:s=600x250", "-frames:v", "1", png], check=True)
          size = os.path.getsize(png)
          pre = call("POST", "/v1/overlays/uploads/presign", {"project_id": pid, "user_id": u, "original_name": "overlay.png",
                     "content_type": "image/png", "size_bytes": size})
          form = []
          for k in sorted(pre["fields"]): form += ["-F", f"{k}={pre['fields'][k]}"]
          subprocess.run(["curl", "-s", "-o", "/dev/null", *form, "-F", f"file=@{png};type=image/png", pre["upload_url"]], check=True)
          snap = call("GET", f"/v1/projects/{pid}/draft", q=f"?user_id={u}")
          edited = call("POST", "/v1/overlays/add", {"project_id": pid, "user_id": u, "draft": snap["draft"], "kind": pre["kind"],
                        "uri": pre["uri"], "start": 0.0, "end": min(dur, 6.0), "x": 0.5, "y": 0.3, "width": 0.55})
          call("PUT", f"/v1/projects/{pid}/draft", {"user_id": u, "expected_revision": snap["revision"], "draft": edited})
          print("::notice title=overlay::photo overlay added")
          PY

      - name: Open the cut in the editor (Simulator)
        working-directory: mobile/ios
        run: |
          udid="$(xcrun simctl list devices available --json | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=sorted((r,x["name"],x["udid"]) for r,v in d.items() if "iOS" in r for x in v if x["name"].startswith("iPhone"))
          print(c[-1][2])')"
          xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" appearance dark || true
          APP="build/Build/Products/Debug-iphonesimulator/CutSell.app"
          BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          xcrun simctl install "$udid" "$APP"
          # Test media in Photos and every permission granted up front (no system prompt over the app).
          ffmpeg -loglevel error -y -f lavfi -i "testsrc2=s=1080x1080:d=1" -frames:v 1 "$RUNNER_TEMP/overlay-photo.jpg"
          xcrun simctl addmedia "$udid" "$RUNNER_TEMP/overlay-photo.jpg" "$RUNNER_TEMP/broll.mp4" || true
          xcrun simctl privacy "$udid" grant all "$BUNDLE" || true
          SIMCTL_CHILD_CUTSELL_PROBE_TOKEN="$PROBE_TOKEN" SIMCTL_CHILD_CUTSELL_PROBE_USER="$PROBE_USER" \
          SIMCTL_CHILD_CUTSELL_PROBE_PROJECT="$PROBE_PROJECT" SIMCTL_CHILD_CUTSELL_PROBE_API="https://cutsell-api.onrender.com" \
            xcrun simctl launch "$udid" "$BUNDLE" -CutSellScreen editor_probe >/dev/null
          mkdir -p "$RUNNER_TEMP/probe" "$RUNNER_TEMP/rec"
          sleep 12; xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/probe/editor_12s.png" >/dev/null 2>&1
          sleep 18; xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/probe/editor_30s.png" >/dev/null 2>&1
          # The same real cut opened in each Editor v4 state (Figma screens 1-11).
          for state in base caption_edit vo_record vo_review cap_highlight cap_box cap_fonts overlay_gallery overlay_selected mic style; do
            xcrun simctl terminate "$udid" "$BUNDLE" >/dev/null 2>&1 || true
            SIMCTL_CHILD_CUTSELL_PROBE_TOKEN="$PROBE_TOKEN" SIMCTL_CHILD_CUTSELL_PROBE_USER="$PROBE_USER" \
            SIMCTL_CHILD_CUTSELL_PROBE_PROJECT="$PROBE_PROJECT" SIMCTL_CHILD_CUTSELL_PROBE_API="https://cutsell-api.onrender.com" \
            SIMCTL_CHILD_CUTSELL_PROBE_STATE="$state" \
              xcrun simctl launch "$udid" "$BUNDLE" -CutSellScreen editor_probe >/dev/null
            sleep 14
            xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/probe/real_$state.png" >/dev/null 2>&1
          done
          # 10 quick edits in a row on the real cut, starting from a stale local revision (the 409 report).
          xcrun simctl terminate "$udid" "$BUNDLE" >/dev/null 2>&1 || true
          SIMCTL_CHILD_CUTSELL_PROBE_TOKEN="$PROBE_TOKEN" SIMCTL_CHILD_CUTSELL_PROBE_USER="$PROBE_USER" \
          SIMCTL_CHILD_CUTSELL_PROBE_PROJECT="$PROBE_PROJECT" SIMCTL_CHILD_CUTSELL_PROBE_API="https://cutsell-api.onrender.com" \
          SIMCTL_CHILD_CUTSELL_PROBE_STATE="stress" \
            xcrun simctl launch "$udid" "$BUNDLE" -CutSellScreen editor_probe >/dev/null
          sleep 50
          xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/probe/real_stress.png" >/dev/null 2>&1
          line="$(xcrun simctl spawn "$udid" log show --last 3m --style compact --predicate 'eventMessage CONTAINS "CUTSELLSTRESS"' 2>/dev/null | grep -v predicate | grep CUTSELLSTRESS | tail -1 | sed 's/.*CUTSELLSTRESS//')"
          echo "::notice title=stress::${line:-no stress line found}"
          # Screen recording of the same flow as the report: play to the end, then quick edits.
          xcrun simctl terminate "$udid" "$BUNDLE" >/dev/null 2>&1 || true
          SIMCTL_CHILD_CUTSELL_PROBE_TOKEN="$PROBE_TOKEN" SIMCTL_CHILD_CUTSELL_PROBE_USER="$PROBE_USER" \
          SIMCTL_CHILD_CUTSELL_PROBE_PROJECT="$PROBE_PROJECT" SIMCTL_CHILD_CUTSELL_PROBE_API="https://cutsell-api.onrender.com" \
          SIMCTL_CHILD_CUTSELL_PROBE_STATE="flow" \
            xcrun simctl launch "$udid" "$BUNDLE" -CutSellScreen editor_probe >/dev/null
          # Recordings stay on this test machine ($RUNNER_TEMP/rec, never pushed): only frames go to the repo.
          mkdir -p "$RUNNER_TEMP/rec"
          xcrun simctl io "$udid" recordVideo --codec=h264 --force "$RUNNER_TEMP/rec/flow.mp4" > /dev/null 2>&1 &
          rec=$!
          sleep 45
          kill -INT $rec; sleep 3
          # Trim by the edges and Voice Over on the same real cut: screenshots at key moments, a
          # recording kept here, and the app's own log lines (CUTSELLTRIM / CUTSELLVO).
          for state in trim voiceover; do
            xcrun simctl terminate "$udid" "$BUNDLE" >/dev/null 2>&1 || true
            SIMCTL_CHILD_CUTSELL_PROBE_TOKEN="$PROBE_TOKEN" SIMCTL_CHILD_CUTSELL_PROBE_USER="$PROBE_USER" \
            SIMCTL_CHILD_CUTSELL_PROBE_PROJECT="$PROBE_PROJECT" SIMCTL_CHILD_CUTSELL_PROBE_API="https://cutsell-api.onrender.com" \
            SIMCTL_CHILD_CUTSELL_PROBE_STATE="$state" \
              xcrun simctl launch "$udid" "$BUNDLE" -CutSellScreen editor_probe >/dev/null
            xcrun simctl io "$udid" recordVideo --codec=h264 --force "$RUNNER_TEMP/rec/$state.mp4" > /dev/null 2>&1 &
            rec=$!
            if [ "$state" = trim ]; then
              sleep 7;  xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/probe/trim_1_handles.png" >/dev/null 2>&1
              sleep 2;  xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/probe/trim_2_drag_frame.png" >/dev/null 2>&1
              sleep 6;  xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/probe/trim_3_stretched.png" >/dev/null 2>&1
              sleep 16; xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/probe/trim_4_after_undo_redo.png" >/dev/null 2>&1
            else
              sleep 5;  xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/probe/vo_1_saved_at_once.png" >/dev/null 2>&1
              sleep 16; xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/probe/vo_2_uploaded.png" >/dev/null 2>&1
              sleep 6;  xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/probe/vo_3_video_sound.png" >/dev/null 2>&1
              sleep 6;  xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/probe/vo_4_voice_panel.png" >/dev/null 2>&1
            fi
            kill -INT $rec; sleep 3
            xcrun simctl spawn "$udid" log show --last 2m --style compact \
              --predicate 'eventMessage CONTAINS "CUTSELLTRIM" OR eventMessage CONTAINS "CUTSELLVO"' 2>/dev/null \
              | grep -oE 'CUTSELL(TRIM|VO).*' >> "$RUNNER_TEMP/probe/probe_log.txt" || true
          done
          # Overlay (photo + video), full-screen B-roll by the video row's +, moving a clip / the voice /
          # an overlay with Undo and Redo, and Export with everything -- on the same real cut. The
          # photo and the video come from the Simulator's Photos (synthetic test media).
          xcrun simctl terminate "$udid" "$BUNDLE" >/dev/null 2>&1 || true
          SIMCTL_CHILD_CUTSELL_PROBE_TOKEN="$PROBE_TOKEN" SIMCTL_CHILD_CUTSELL_PROBE_USER="$PROBE_USER" \
          SIMCTL_CHILD_CUTSELL_PROBE_PROJECT="$PROBE_PROJECT" SIMCTL_CHILD_CUTSELL_PROBE_API="https://cutsell-api.onrender.com" \
          SIMCTL_CHILD_CUTSELL_PROBE_STATE="media" \
            xcrun simctl launch "$udid" "$BUNDLE" -CutSellScreen editor_probe >/dev/null
          xcrun simctl io "$udid" recordVideo --codec=h264 --force "$RUNNER_TEMP/rec/media.mp4" > /dev/null 2>&1 &
          rec=$!
          for i in $(seq 1 120); do
            sleep 5
            [ $((i % 6)) -eq 0 ] && xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/probe/media_$(printf %03d $((i*5))).png" >/dev/null 2>&1
            if xcrun simctl spawn "$udid" log show --last 1m --style compact --predicate 'eventMessage CONTAINS "CUTSELLMEDIA done"' 2>/dev/null | grep -q "CUTSELLMEDIA done error"; then break; fi
          done
          xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/probe/media_end.png" >/dev/null 2>&1
          kill -INT $rec; sleep 3
          xcrun simctl spawn "$udid" log show --last 15m --style compact \
            --predicate 'eventMessage CONTAINS "CUTSELLMEDIA" OR eventMessage CONTAINS "CUTSELLEXPORT"' 2>/dev/null \
            | grep -oE 'CUTSELL(MEDIA|EXPORT).*' >> "$RUNNER_TEMP/probe/probe_log.txt" || true
          # Processing screen: the brand ring turning (5 s recording kept here; 2 frames go to the repo).
          xcrun simctl terminate "$udid" "$BUNDLE" >/dev/null 2>&1 || true
          xcrun simctl launch "$udid" "$BUNDLE" -CutSellScreen processing >/dev/null
          sleep 3
          xcrun simctl io "$udid" recordVideo --codec=h264 --force "$RUNNER_TEMP/rec/processing_ring.mp4" > /dev/null 2>&1 &
          rec=$!
          sleep 5
          kill -INT $rec; sleep 3
          ffmpeg -loglevel error -y -ss 1.0 -i "$RUNNER_TEMP/rec/processing_ring.mp4" -frames:v 1 -vf "scale=390:-2" "$RUNNER_TEMP/probe/processing_ring_1.png" || true
          ffmpeg -loglevel error -y -ss 2.25 -i "$RUNNER_TEMP/rec/processing_ring.mp4" -frames:v 1 -vf "scale=390:-2" "$RUNNER_TEMP/probe/processing_ring_2.png" || true
          mv "$RUNNER_TEMP/rec/processing_ring.mp4" "$RUNNER_TEMP/processing_ring_kept_here.mp4" || true
          cat "$RUNNER_TEMP/probe/probe_log.txt" 2>/dev/null | while read -r l; do echo "::notice title=probe::$l"; done
          # Frames (PNG) from each recording: one every 2 s. The MP4s themselves stay here.
          for f in "$RUNNER_TEMP"/rec/*.mp4; do
            [ -s "$f" ] || continue
            name="$(basename "$f" .mp4)"
            every=2; [ "$name" = media ] && every=10
            ffmpeg -loglevel error -i "$f" -vf "fps=1/$every,scale=390:-2" "$RUNNER_TEMP/probe/${name}_frame_%02d.png" || true
          done
          ls -la "$RUNNER_TEMP/rec" || true
          echo "::notice title=probe::screenshots taken"

      - name: Push the screenshots to design-screenshots/probe
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/out"
          git clone --quiet --branch design-screenshots "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$dir"
          cd "$dir"
          # Only pictures and the log text: never a video or audio file in the repo.
          rm -rf probe && mkdir -p probe && cp "$RUNNER_TEMP"/probe/*.png probe/
          cp "$RUNNER_TEMP"/probe/probe_log.txt probe/ 2>/dev/null || true
          find probe -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.m4a' -o -iname '*.caf' -o -iname '*.wav' \) -delete
          echo "source commit: ${{ github.sha }}" > probe/SOURCE.txt
          git add -A probe
          git -c user.name="cutsell-ci" -c user.email="ci@cutsell.invalid" commit --quiet -m "editor probe for ${{ github.sha }}"
          git push --quiet origin design-screenshots
