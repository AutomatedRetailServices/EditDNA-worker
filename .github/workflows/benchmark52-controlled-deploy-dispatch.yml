name: Benchmark 52 Controlled Deploy and Dispatch
run-name: Benchmark 52 exact-image staging deploy and single benchmark dispatch

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/benchmark52-controlled-deploy-dispatch.yml

permissions:
  contents: read
  actions: write

jobs:
  deploy-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      RUNPOD_TEMPLATE_NAME: EditDNA-Worker-2
      SOURCE_SHA: 2200dc61a9140f5675b6e7eee432c4acc60b5e74
      IMAGE_REPO: ghcr.io/automatedretailservices/cutsell-worker
      EXPECTED_DIGEST: sha256:2022dedadd7a6005ff76e8b8417019cc37fac5e057a7855aea87194c8bfb5076
      POD_ID: ''
      DISPATCHED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutsell/mobile-v1-clean
          fetch-depth: 1

      - name: Validate inputs and exact immutable image
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}"
          test -n "${REDIS_URL:-}"
          test -n "${GEMINI_API_KEY:-}"
          echo "::add-mask::$GEMINI_API_KEY"
          source_image="$IMAGE_REPO:$SOURCE_SHA"
          docker buildx imagetools inspect "$source_image" > image-inspect.txt
          resolved=$(awk '/^Digest:/ {print $2; exit}' image-inspect.txt)
          test "$resolved" = "$EXPECTED_DIGEST" || { echo "Digest mismatch: $resolved"; exit 3; }
          IMMUTABLE_IMAGE="$source_image@$resolved"
          echo "IMMUTABLE_IMAGE=$IMMUTABLE_IMAGE" >> "$GITHUB_ENV"
          echo "BENCHMARK52_IMMUTABLE_IMAGE=$IMMUTABLE_IMAGE"

      - name: Refuse duplicate staging worker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output pods-before.json
          count=$(jq '[.[] | select(.name == "cutsell-staging-worker")] | length' pods-before.json)
          test "$count" = "0" || { echo "cutsell-staging-worker already exists ($count); refusing duplicate paid Pod"; exit 4; }

      - name: Snapshot existing RQ workers
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'redis>=5.0' 'rq>=2.6'
          python - <<'PY'
          import json, os
          from redis import Redis
          from rq import Worker
          connection = Redis.from_url(os.environ['REDIS_URL'])
          names = sorted(worker.name for worker in Worker.all(connection=connection))
          json.dump(names, open('rq-workers-before.json','w',encoding='utf-8'))
          print('RQ workers before:', names)
          PY

      - name: Build safe runtime baseline from EditDNA-Worker-2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/templates" --header "Authorization: Bearer $RUNPOD_API_KEY" --output templates.json
          TEMPLATE=$(jq -c --arg name "$RUNPOD_TEMPLATE_NAME" '[.[] | select(.name == $name)][0]' templates.json)
          test "$TEMPLATE" != "null"
          printf '%s' "$TEMPLATE" | jq -c '{ASR_DEVICE:.env.ASR_DEVICE,ASR_ENABLED:.env.ASR_ENABLED,BAD_TAKES_ENABLED:.env.BAD_TAKES_ENABLED,BOUNDARY_REFINER_ENABLED:.env.BOUNDARY_REFINER_ENABLED,BOUNDARY_REFINER_HEAD_STEP_SEC:.env.BOUNDARY_REFINER_HEAD_STEP_SEC,BOUNDARY_REFINER_MIN_DURATION_SEC:.env.BOUNDARY_REFINER_MIN_DURATION_SEC,BOUNDARY_REFINER_TAIL_STEP_SEC:.env.BOUNDARY_REFINER_TAIL_STEP_SEC,FFMPEG_BIN:.env.FFMPEG_BIN,FFPROBE_BIN:.env.FFPROBE_BIN,HEAD_TRIM_SEC:.env.HEAD_TRIM_SEC,PRESIGN_EXPIRES:.env.PRESIGN_EXPIRES,PYTHONPATH:.env.PYTHONPATH,S3_ACL:.env.S3_ACL,S3_BUCKET:.env.S3_BUCKET,S3_PREFIX:.env.S3_PREFIX,TAIL_TRIM_SEC:.env.TAIL_TRIM_SEC,VISION_ENABLED:.env.VISION_ENABLED,VISION_INTERVAL_SEC:.env.VISION_INTERVAL_SEC,VISION_MAX_SAMPLES:.env.VISION_MAX_SAMPLES,VISUAL_BAD_THRESHOLD:.env.VISUAL_BAD_THRESHOLD,WHISPER_DEVICE:.env.WHISPER_DEVICE,WHISPER_MODEL:.env.WHISPER_MODEL,W_FACE:.env.W_FACE,W_VISION:.env.W_VISION,W_VISUAL:.env.W_VISUAL,AWS_ACCESS_KEY_ID:.env.AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY:.env.AWS_SECRET_ACCESS_KEY,AWS_REGION:.env.AWS_REGION} | with_entries(select(.value != null and .value != ""))' > safe-template-env.json
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_BUCKET; do
            value=$(jq -r --arg key "$key" '.[$key] // empty' safe-template-env.json)
            test -n "$value" || { echo "$key missing"; exit 6; }
            echo "::add-mask::$value"
          done
          VOLUME_MOUNT=$(printf '%s' "$TEMPLATE" | jq -r '.volumeMountPath // "/workspace"')
          echo "VOLUME_MOUNT=$VOLUME_MOUNT" >> "$GITHUB_ENV"

      - name: Create exactly one staging GPU worker
        shell: bash
        run: |
          set -euo pipefail
          jq --arg name "cutsell-staging-worker" --arg image "$IMMUTABLE_IMAGE" --arg redis "$REDIS_URL" --arg gemini "$GEMINI_API_KEY" --arg mount "$VOLUME_MOUNT" '. + {REDIS_URL:$redis,GEMINI_API_KEY:$gemini,CUTSELL_BRAIN_BACKEND:"runpod_local",CUTSELL_EDITORIAL_MODE:"clean_cut",CUTSELL_ASR_MODEL:"medium",CUTSELL_CLEAN_CUT_JUDGE:"0",CUTSELL_HYBRID_PROVIDER:"google",CUTSELL_HYBRID_LLM_ENABLED:"1",CUTSELL_HYBRID_PRIMARY_MODEL:"gemini-3.5-flash-lite",CUTSELL_HYBRID_ESCALATION_MODEL:"gemini-3.6-flash",CUTSELL_HYBRID_MAX_SESSION_USD:"0.0075",CUTSELL_HYBRID_TEST_BUDGET_USD:"0.50"} | {name:$name,imageName:$image,cloudType:"COMMUNITY",computeType:"GPU",gpuCount:1,gpuTypeIds:["NVIDIA RTX A5000","NVIDIA RTX A4000","NVIDIA L4","NVIDIA A40","NVIDIA RTX A6000","NVIDIA GeForce RTX 3090","NVIDIA GeForce RTX 4090"],gpuTypePriority:"custom",interruptible:false,containerDiskInGb:30,volumeInGb:20,volumeMountPath:$mount,env:.}' safe-template-env.json > create-pod.json
          if jq -e 'has("dockerEntrypoint") or has("dockerStartCmd")' create-pod.json >/dev/null; then exit 7; fi
          if jq -e '.env | has("OPENAI_API_KEY") or has("EDITDNA_USE_LLM") or has("EDITDNA_LLM_MODEL")' create-pod.json >/dev/null; then exit 7; fi
          code=$(curl --silent --show-error --write-out '%{http_code}' --request POST --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --header "Content-Type: application/json" --data @create-pod.json --output pod.json)
          rm -f create-pod.json safe-template-env.json
          test "$code" = "201" || { echo "RunPod create HTTP status: $code"; cat pod.json; exit 8; }
          POD_ID=$(jq -r '.id // empty' pod.json)
          test -n "$POD_ID"
          echo "POD_ID=$POD_ID" >> "$GITHUB_ENV"
          echo "POD_CREATED_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
          echo "BENCHMARK52_POD_ID=$POD_ID"
          jq '{id,name,desiredStatus,imageName,costPerHr,adjustedCostPerHr}' pod.json

      - name: Confirm exact Pod identity and image
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods/$POD_ID" --header "Authorization: Bearer $RUNPOD_API_KEY" --output pod-confirm.json; then break; fi
            sleep 2
          done
          test "$(jq -r '.id // empty' pod-confirm.json)" = "$POD_ID"
          test "$(jq -r '.name // empty' pod-confirm.json)" = "cutsell-staging-worker"
          test "$(jq -r '.imageName // empty' pod-confirm.json)" = "$IMMUTABLE_IMAGE"

      - name: Wait for fresh RQ worker from exact Pod
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from datetime import datetime, timezone
          from redis import Redis
          from rq import Worker
          connection = Redis.from_url(os.environ['REDIS_URL'])
          before = set(json.load(open('rq-workers-before.json', encoding='utf-8')))
          created_epoch = float(os.environ['POD_CREATED_EPOCH'])
          deadline = time.time() + 600
          while time.time() < deadline:
              now = datetime.now(timezone.utc)
              for worker in Worker.all(connection=connection):
                  heartbeat = worker.last_heartbeat
                  if heartbeat is None or worker.name in before:
                      continue
                  if heartbeat.tzinfo is None:
                      heartbeat = heartbeat.replace(tzinfo=timezone.utc)
                  if heartbeat.timestamp() >= created_epoch - 5 and (now-heartbeat).total_seconds() <= 30 and worker.get_state() in {'idle','busy'}:
                      print('Fresh Benchmark 52 RQ worker:', worker.name)
                      raise SystemExit(0)
              time.sleep(10)
          raise SystemExit('No fresh RQ worker registered by exact Benchmark 52 Pod')
          PY

      - name: Reconfirm exact Pod before dispatch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods/$POD_ID" --header "Authorization: Bearer $RUNPOD_API_KEY" --output pod-ready.json
          test "$(jq -r '.id // empty' pod-ready.json)" = "$POD_ID"
          test "$(jq -r '.imageName // empty' pod-ready.json)" = "$IMMUTABLE_IMAGE"

      - name: Dispatch exactly one validation benchmark
        shell: bash
        run: |
          set -euo pipefail
          DISPATCH_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "DISPATCH_AT=$DISPATCH_AT" >> "$GITHUB_ENV"
          jq -n --arg ref "cutsell/mobile-v1-clean" --arg pod "$POD_ID" '{ref:$ref,inputs:{approval_token:"RUN39",pod_id:$pod}}' > dispatch.json
          code=$(curl --silent --show-error --write-out '%{http_code}' --request POST --url "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/cutsell-unseen-clean-cut-benchmark.yml/dispatches" --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" --header "Content-Type: application/json" --data @dispatch.json --output dispatch-response.txt)
          rm -f dispatch.json
          test "$code" = "204" || { echo "Benchmark dispatch HTTP status: $code"; cat dispatch-response.txt; exit 10; }
          echo "DISPATCHED=1" >> "$GITHUB_ENV"
          echo "BENCHMARK52_DISPATCH_AT=$DISPATCH_AT"

      - name: Capture exact dispatched benchmark run
        shell: bash
        run: |
          set -euo pipefail
          found=''
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error --url "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/cutsell-unseen-clean-cut-benchmark.yml/runs?event=workflow_dispatch&branch=cutsell%2Fmobile-v1-clean&per_page=10" --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --output benchmark-runs.json
            found=$(jq -r --arg t "$DISPATCH_AT" '[.workflow_runs[] | select(.created_at >= $t)] | sort_by(.created_at) | last | .id // empty' benchmark-runs.json)
            [ -n "$found" ] && break
            sleep 2
          done
          test -n "$found" || { echo 'Dispatch accepted but exact run ID not observable; benchmark cleanup owns Pod'; exit 11; }
          run_number=$(jq -r --argjson id "$found" '.workflow_runs[] | select(.id == $id) | .run_number' benchmark-runs.json)
          echo "BENCHMARK52_RUN_ID=$found"
          echo "BENCHMARK52_RUN_NUMBER=$run_number"

      - name: Cleanup exact Pod only if deployment failed before benchmark dispatch
        if: ${{ failure() && env.POD_ID != '' && env.DISPATCHED != '1' }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --write-out '%{http_code}' --request DELETE --url "https://rest.runpod.io/v1/pods/$POD_ID" --header "Authorization: Bearer $RUNPOD_API_KEY" --output cleanup.txt)
          echo "pre-dispatch cleanup DELETE status: $code"
          test "$code" = "204" || test "$code" = "404"
