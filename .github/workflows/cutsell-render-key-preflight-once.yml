name: CutSell Render Key Preflight Once

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - ".cutsell/render-key-preflight-once.txt"

permissions:
  contents: read

jobs:
  render-key-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require one-shot marker
        run: grep -qx 'check=render-key' .cutsell/render-key-preflight-once.txt
      - name: Verify Render API key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}" || { echo 'RENDER_API_KEY=missing'; exit 3; }
          code=$(curl --silent --show-error --write-out '%{http_code}' \
            --url 'https://api.render.com/v1/owners?limit=20' \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --output owners.json)
          echo "Render owners HTTP status: $code"
          if [ "$code" != "200" ]; then
            jq '{message,error,status}' owners.json 2>/dev/null || cat owners.json
            exit 4
          fi
          jq '[.[] | {id:(.owner.id // .id), name:(.owner.name // .name), type:(.owner.type // .type)}]' owners.json
