name: CutSell Video00 Pod RAW (QA execution fallback)

# D-042: CutSell QA GPU execution fallback -- RunPod Pod On-Demand automation.
# KEEP SERVERLESS FULLY AVAILABLE. This is a separate, manual-dispatch-only
# QA workflow -- it does NOT replace, modify, or share a trigger with
# cutsell-video00-raw-v5-auto-microtrim.yml (RunPod Serverless remains the
# production RAW backend, untouched by this file). Deliberately has no
# `push:` trigger of any kind: ordinary code pushes to
# cutsell/mobile-v1-clean must never provision an on-demand Pod.
#
# Current phase: HEALTH-ONLY. Per the standing directive, the first live
# action on a real GPU is strictly POD PROVISION/REUSE -> HEALTH -> STOP,
# with a report -- never Video00. The full canonical benchmark
# (`execution_backend: pod`) stays gated on separate, explicit
# authorization once this health-only gate has passed and been reviewed.
#
# Bootstrap note (resolved): GitHub's workflow_dispatch REST API 404s for a
# workflow that has never completed a run via any trigger, on any branch. A
# narrow, self-scoped `push:` trigger (limited to this file's own path, on
# this isolated QA branch only) registered this workflow on its first push.
# workflow_dispatch has been confirmed working since (runs #2-5+), so that
# trigger is removed here -- it served no further purpose and every push
# to this file was otherwise firing a wasted (harmless but slow) run.

on:
  workflow_dispatch:
    inputs:
      existing_pod_id:
        description: >-
          Optional: reuse this QA Pod id (from a previous run's summary)
          instead of creating a fresh one. Leave blank to let the provider
          search the approved GPU pool and create a new Pod.
        required: false
        default: ""
      qa_pod_cost_ceiling_usd_per_hr:
        description: "QA Pod hourly cost ceiling in USD. Never provisions above this."
        required: false
        default: "1.50"
      diagnose_pod_id:
        description: >-
          Optional, read-only diagnostic mode: fetch state + best-effort
          container logs for this EXISTING (already stopped) Pod id and
          exit -- never creates/starts a Pod, never builds an image, zero
          GPU cost. Leave blank for a normal provision/health/stop run.
        required: false
        default: ""
      template_action:
        description: >-
          Template-management mode (D-042 follow-up: CutSell-Pod-QA
          cloned from EditDNA-Worker-2). "fetch_base": read-only, zero
          cost -- print the live base template config (env values
          redacted). "create_qa_template": clone the live base template
          into a new one (see qa_template_* inputs below), never mutates
          the base. Leave blank for a normal Pod provision/health/stop
          run or a diagnose_pod_id run.
        required: false
        type: choice
        options:
          - ""
          - fetch_base
          - create_qa_template
        default: ""
      base_template_name:
        description: "Live RunPod template to read/clone from."
        required: false
        default: "EditDNA-Worker-2"
      qa_template_name:
        description: "Name for the new template (create_qa_template mode only)."
        required: false
        default: "CutSell-Pod-QA"
      qa_template_image_override:
        description: >-
          Optional (create_qa_template mode only): use this exact
          image@digest instead of building the current HEAD fresh.
          Leave blank to build and use the current commit's canonical
          image (preferred -- guarantees current CutSell code/head).
        required: false
        default: ""
      qa_template_start_command:
        description: >-
          Optional (create_qa_template mode only): space-separated
          override for the new template's dockerStartCmd. Leave blank to
          preserve the base template's own start command untouched
          (startup parity -- do not assume replacing it is safe).
        required: false
        default: ""
      qa_template_env_overrides_json:
        description: >-
          Optional (create_qa_template mode only): JSON object of env
          vars to add/override on top of the base template's own env
          (which is otherwise preserved in full). e.g. {"CUTSELL_BRAIN_BACKEND":"runpod_local"}
        required: false
        default: "{}"

concurrency:
  # Same officially-supported mechanism the Serverless RAW workflow already
  # uses for its own concurrency group -- prevents two Pod-QA workflow runs
  # from touching the same QA Pod identity at once. Deliberately does NOT
  # cancel-in-progress: a running QA Pod test must finish (and STOP the
  # Pod) rather than be killed mid-flight and leave a paid GPU running.
  group: cutsell-video00-pod-qa
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/automatedretailservices/cutsell-serverless
  QA_POD_COST_CEILING_USD_PER_HR: ${{ github.event.inputs.qa_pod_cost_ceiling_usd_per_hr }}
  EXISTING_POD_ID: ${{ github.event.inputs.existing_pod_id }}
  DIAGNOSE_POD_LOGS_ID: ${{ github.event.inputs.diagnose_pod_id }}
  TEMPLATE_ACTION: ${{ github.event.inputs.template_action }}
  BASE_TEMPLATE_NAME: ${{ github.event.inputs.base_template_name }}
  QA_TEMPLATE_NAME: ${{ github.event.inputs.qa_template_name }}
  QA_TEMPLATE_IMAGE_OVERRIDE: ${{ github.event.inputs.qa_template_image_override }}
  QA_TEMPLATE_START_COMMAND: ${{ github.event.inputs.qa_template_start_command }}
  QA_TEMPLATE_ENV_OVERRIDES_JSON: ${{ github.event.inputs.qa_template_env_overrides_json }}

jobs:
  pod-health-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Checkout exact test head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      # Skipped for: DIAGNOSE_POD_LOGS_ID (pure read, no image needed),
      # template_action=fetch_base (pure read, no image needed), and
      # template_action=create_qa_template when an explicit image digest
      # override was supplied (no need to rebuild). Built otherwise --
      # including the default create_qa_template path, so the new
      # template gets an immutable digest of the CURRENT commit's code,
      # per D-042 follow-up's "current CutSell code/head" requirement.
      - name: Login GHCR
        if: >-
          env.DIAGNOSE_POD_LOGS_ID == '' && env.TEMPLATE_ACTION != 'fetch_base' &&
          (env.TEMPLATE_ACTION != 'create_qa_template' || env.QA_TEMPLATE_IMAGE_OVERRIDE == '')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push canonical CutSell image (same Dockerfile as Serverless)
        if: >-
          env.DIAGNOSE_POD_LOGS_ID == '' && env.TEMPLATE_ACTION != 'fetch_base' &&
          (env.TEMPLATE_ACTION != 'create_qa_template' || env.QA_TEMPLATE_IMAGE_OVERRIDE == '')
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE_REPO:pod-qa-$GITHUB_SHA"
          docker build -t "$image" -f Dockerfile.cutsell.serverless .
          docker push "$image"
          docker buildx imagetools inspect "$image" > /tmp/image.txt
          digest=$(awk '/^Digest:/ {print $2; exit}' /tmp/image.txt)
          test -n "$digest"
          echo "POD_IMAGE=$IMAGE_REPO@$digest" >> "$GITHUB_ENV"

      - name: Resolve QA template image (create_qa_template mode only)
        if: env.TEMPLATE_ACTION == 'create_qa_template'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${QA_TEMPLATE_IMAGE_OVERRIDE:-}" ]; then
            echo "QA_TEMPLATE_IMAGE=$QA_TEMPLATE_IMAGE_OVERRIDE" >> "$GITHUB_ENV"
          else
            test -n "${POD_IMAGE:-}"
            echo "QA_TEMPLATE_IMAGE=$POD_IMAGE" >> "$GITHUB_ENV"
          fi

      # Dispatches internally on DIAGNOSE_POD_LOGS_ID / TEMPLATE_ACTION /
      # neither (normal Pod provision/reuse + HEALTH ONLY + guaranteed
      # STOP) -- see runpod_pod_health_gate.py's main().
      - name: Run health gate / diagnostic / template action
        shell: bash
        run: python3 runpod_pod_health_gate.py

      - name: Upload Pod health summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-video00-pod-raw-health-summary
          path: pod-health-summary.json
          retention-days: 14
          if-no-files-found: warn

      - name: Print Pod health summary + reuse hint
        if: always()
        shell: bash
        run: |
          set +e
          if [ -s pod-health-summary.json ]; then
            cat pod-health-summary.json
            pod_id=$(jq -r '.pod_id // empty' pod-health-summary.json)
            if [ -n "$pod_id" ]; then
              echo "To reuse this Pod on the next manual run, pass existing_pod_id=$pod_id."
            fi
          else
            echo "No pod-health-summary.json was written -- the health gate script did not complete normally."
          fi

      # Belt-and-suspenders (D-042 "automatic stop guarantee, non-negotiable"):
      # runpod_pod_health_gate.py's own `finally` block already calls
      # provider.teardown() (which itself retries STOP once on failure).
      # This step is a second, independent safety net in case the Python
      # process itself never reached that finally block (e.g. the runner
      # was killed) -- it re-reads the pod id from the summary artifact (if
      # any was written) and re-issues STOP directly against the RunPod
      # REST API, exactly like the Serverless RAW workflow's own redundant
      # teardown step.
      - name: Force-stop QA Pod (independent safety net)
        if: always()
        shell: bash
        run: |
          set +e
          pod_id=""
          if [ -s pod-health-summary.json ]; then
            pod_id=$(jq -r '.pod_id // empty' pod-health-summary.json)
          fi
          if [ -z "$pod_id" ]; then
            pod_id="${EXISTING_POD_ID:-}"
          fi
          if [ -z "$pod_id" ]; then
            echo "No Pod id known to this run; nothing to force-stop."
            exit 0
          fi
          curl --silent --show-error \
            --request POST \
            --url "https://rest.runpod.io/v1/pods/$pod_id/stop" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output /tmp/pod-force-stop-response.json || true
          echo "Force-stop issued for Pod $pod_id (safety net; a no-op if the health gate already stopped it)."
