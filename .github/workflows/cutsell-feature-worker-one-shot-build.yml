name: CutSell Benchmark 41 Worker Build

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/cutsell-feature-worker-one-shot-build.yml

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/automatedretailservices/cutsell-worker:${{ github.sha }}
      BUILD_REASON: benchmark41-attempt-session-reconstruction
    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Hybrid Flow B CutSell worker image
        run: docker build -t "$IMAGE" -f Dockerfile.cutsell.worker .
      - name: Prove OpenAI SDK is absent from worker image
        run: |
          docker run --rm --entrypoint python "$IMAGE" - <<'PY'
          import importlib.util
          if importlib.util.find_spec('openai') is not None:
              raise SystemExit('OpenAI SDK unexpectedly present in RunPod worker image')
          print('openai_sdk_absent=true')
          PY
      - name: Push immutable CutSell worker image
        run: docker push "$IMAGE"
      - name: Resolve pushed image digest
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" | tee image-inspect.txt
          digest=$(awk '/^Digest:/ {print $2; exit}' image-inspect.txt)
          test -n "$digest" || { echo 'Unable to resolve pushed image digest'; exit 9; }
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "image_digest=$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Print immutable image reference
        run: |
          echo "$IMAGE@$IMAGE_DIGEST"
          echo "build_reason=$BUILD_REASON"
      - name: Record benchmark 41 immutable build status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          cat > ops/benchmark41-build-status.json <<EOF
          {
            "run_id": ${GITHUB_RUN_ID},
            "head_sha": "${GITHUB_SHA}",
            "image": "${IMAGE}@${IMAGE_DIGEST}",
            "image_digest": "${IMAGE_DIGEST}",
            "build_reason": "${BUILD_REASON}",
            "conclusion": "success"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/benchmark41-build-status.json
          git commit -m "Record benchmark 41 immutable worker build" || exit 0
          git push origin HEAD:cutsell/mobile-v1-clean
