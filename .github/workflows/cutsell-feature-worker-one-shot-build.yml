name: CutSell Feature Worker One-Shot Build

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/cutsell-feature-worker-one-shot-build.yml

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/automatedretailservices/cutsell-worker:${{ github.sha }}
      BUILD_REASON: run39-rq-longform-worker-ttl-14400
    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Hybrid Flow B CutSell worker image
        run: docker build -t "$IMAGE" -f Dockerfile.cutsell.worker .
      - name: Prove OpenAI SDK is absent from worker image
        run: |
          docker run --rm --entrypoint python "$IMAGE" - <<'PY'
          import importlib.util
          if importlib.util.find_spec('openai') is not None:
              raise SystemExit('OpenAI SDK unexpectedly present in RunPod worker image')
          print('openai_sdk_absent=true')
          PY
      - name: Push immutable CutSell worker image
        run: docker push "$IMAGE"
      - name: Resolve pushed image digest
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" | tee image-inspect.txt
          digest=$(awk '/^Digest:/ {print $2; exit}' image-inspect.txt)
          test -n "$digest" || { echo 'Unable to resolve pushed image digest'; exit 9; }
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "image_digest=$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Print immutable image reference
        run: |
          echo "$IMAGE@$IMAGE_DIGEST"
          echo "build_reason=$BUILD_REASON"
