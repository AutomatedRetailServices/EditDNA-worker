name: Benchmark 45 Status Probe

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/benchmark45-status-probe.yml

permissions:
  contents: read
  actions: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Show exact Benchmark 45 control and benchmark status
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --url "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/benchmark45-controlled-deploy-dispatch.yml/runs?event=push&branch=cutsell%2Fmobile-v1-clean&per_page=5" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output deploy-runs.json
          echo 'BENCHMARK45_DEPLOY_RUNS'
          jq -c '.workflow_runs[] | {id,status,conclusion,head_sha,created_at,updated_at}' deploy-runs.json

          curl --fail --silent --show-error \
            --url "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/cutsell-unseen-clean-cut-benchmark.yml/runs?event=workflow_dispatch&branch=cutsell%2Fmobile-v1-clean&per_page=5" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output benchmark-runs.json
          echo 'RECENT_BENCHMARK_RUNS'
          jq -c '.workflow_runs[] | {id,run_number,status,conclusion,head_sha,created_at,updated_at}' benchmark-runs.json

          if [ -n "${RUNPOD_API_KEY:-}" ]; then
            curl --fail --silent --show-error \
              --url "https://rest.runpod.io/v1/pods" \
              --header "Authorization: Bearer $RUNPOD_API_KEY" \
              --output pods.json
            echo 'CUTSELL_STAGING_PODS'
            jq -c '.[] | select(.name == "cutsell-staging-worker") | {id,name,desiredStatus,imageName,costPerHr,adjustedCostPerHr}' pods.json
          fi
