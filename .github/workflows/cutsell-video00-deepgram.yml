name: CutSell Video00 Deepgram
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cutsell-video00-modal-raw-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    if: >-
      github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'benchmark: authorized Video00 Deepgram')
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      UPLOAD_SINGLE_PROVIDER: deepgram
      UPLOAD_EXPECTED_SHA: b37059b1790cf3eb0447bb54595cc99f6668aadc5f65dafa9cdf6181621ef9f5
      UPLOAD_EXPECTED_BYTES: "38700219"
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install CPU transport and media tools
        run: |
          pip install -q modal boto3 requests cryptography
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Prepare existing source configuration
        run: python benchmarks/run_uploaded_asr_comparison.py prepare-existing 'Editdna longform validation/VIDEO-2026-07-30-09-18-03.mp4'
      - name: Verify exact uploaded video before GPU
        id: source
        run: python benchmarks/run_uploaded_asr_comparison.py await-upload
      - name: Full engine with deepgram
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        continue-on-error: true
        run: python benchmarks/run_uploaded_asr_comparison.py run deepgram
      - name: Preserve deepgram reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-deepgram-reports
          path: uploaded-comparison-artifacts/deepgram/reports/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve deepgram A
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-deepgram-A
          path: uploaded-comparison-artifacts/deepgram/A/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve deepgram B
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-deepgram-B
          path: uploaded-comparison-artifacts/deepgram/B/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve deepgram C
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-deepgram-C
          path: uploaded-comparison-artifacts/deepgram/C/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve deepgram D
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-deepgram-D
          path: uploaded-comparison-artifacts/deepgram/D/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve deepgram E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-deepgram-E
          path: uploaded-comparison-artifacts/deepgram/E/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve deepgram F
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-deepgram-F
          path: uploaded-comparison-artifacts/deepgram/F/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve deepgram G
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-deepgram-G
          path: uploaded-comparison-artifacts/deepgram/G/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve deepgram H
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-deepgram-H
          path: uploaded-comparison-artifacts/deepgram/H/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve deepgram I
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-deepgram-I
          path: uploaded-comparison-artifacts/deepgram/I/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve deepgram J
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-deepgram-J
          path: uploaded-comparison-artifacts/deepgram/J/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve deepgram K
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-deepgram-K
          path: uploaded-comparison-artifacts/deepgram/K/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve deepgram L
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-deepgram-L
          path: uploaded-comparison-artifacts/deepgram/L/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve comparison manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-comparison-manifest
          path: uploaded-comparison-artifacts/manifest.json
          if-no-files-found: warn
      - name: Remove private runtime files
        if: always()
        run: python -c 'import os,shutil;from pathlib import Path;shutil.rmtree(Path(os.environ["RUNNER_TEMP"])/"cutsell-upload-comparison",ignore_errors=True)'
