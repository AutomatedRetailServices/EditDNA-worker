name: CutSell iOS CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/cutsell-ios-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/cutsell-ios-ci.yml'
  # D-131 (docs/CUTSELL_DECISIONS.md D-131): bounded manual-dispatch trigger
  # so this SAME existing macos-latest build job can be run on demand
  # against a feature branch for a one-off build-verification task,
  # without waiting for a PR/push to main. Adds no new build step and no
  # new infrastructure -- it is the same job this workflow already runs.
  workflow_dispatch: {}

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Build CutSell for iOS Simulator
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project CutSell.xcodeproj \
            -scheme CutSell \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty

      # D-132 (docs/CUTSELL_DECISIONS.md D-132): the ONLY change to the
      # build step above this comment is the added -derivedDataPath build
      # flag, so CutSell.app lands at a deterministic, known path for the
      # runtime-verification steps below. No build flag was removed and
      # no build behavior otherwise changed.

      - name: Discover and boot an iOS Simulator
        id: sim
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, shlex, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"])
          data = json.loads(raw)
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and str(d.get("name", "")).startswith("iPhone"):
                      candidates.append((runtime, d["name"], d["udid"]))
          if not candidates:
              print("NO_DEVICE_FOUND", file=sys.stderr)
              sys.exit(1)
          # Deterministic: sort by (runtime, name, udid) and always take the
          # first -- reproducible given this runner's own device list, never
          # a hardcoded model/runtime that could be absent.
          candidates.sort()
          runtime, name, udid = candidates[0]
          version = runtime.rsplit(".", 1)[-1].replace("iOS-", "").replace("-", ".")
          runtime_label = f"iOS {version}"
          # $GITHUB_OUTPUT wants plain key=value (no shell quoting -- GitHub
          # does not shell-parse it). Values like "iPhone 16e" contain a
          # space, so this is safe there but NOT safe to `source` as shell
          # variables directly (D-132's own first attempt broke exactly this
          # way: `source`-ing an unquoted `name=iPhone 16e` ran "16e" as a
          # separate command). Write a SEPARATE, shell-quoted file for this
          # same step's own immediate use below.
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"udid={udid}\nname={name}\nruntime={runtime_label}\n")
          with open("/tmp/sim_selection.sh", "w") as f:
              f.write(f"udid={shlex.quote(udid)}\n")
              f.write(f"name={shlex.quote(name)}\n")
              f.write(f"runtime={shlex.quote(runtime_label)}\n")
          PY
          source /tmp/sim_selection.sh
          echo "Selected simulator: udid=$udid name=$name runtime=$runtime"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Install and launch CutSell in Simulator
        if: steps.sim.outcome == 'success'
        id: launch
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP_PATH="$(pwd)/build/Build/Products/Debug-iphonesimulator/CutSell.app"
          test -d "$APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "Bundle identifier (read from built Info.plist): $BUNDLE_ID"

          xcrun simctl install "$UDID" "$APP_PATH"
          echo "install_result=success" >> "$GITHUB_OUTPUT"

          LAUNCH_OUTPUT="$(xcrun simctl launch "$UDID" "$BUNDLE_ID" 2>&1)"
          echo "$LAUNCH_OUTPUT"
          PID="$(echo "$LAUNCH_OUTPUT" | grep -oE '[0-9]+$' | tail -1 || true)"
          echo "pid=${PID:-unknown}" >> "$GITHUB_OUTPUT"

          # Bounded observation window -- not an arbitrary long sleep, just
          # enough to distinguish "started" from "crashed on launch".
          sleep 5

          if [ -n "${PID:-}" ] && ps -p "$PID" > /dev/null 2>&1; then
            echo "process_alive=yes" >> "$GITHUB_OUTPUT"
          else
            echo "process_alive=no" >> "$GITHUB_OUTPUT"
          fi

          CRASH_REPORTS="$(find "$HOME/Library/Logs/DiagnosticReports" -iname 'CutSell*' -newermt '-2 minutes' 2>/dev/null || true)"
          if [ -n "$CRASH_REPORTS" ]; then
            echo "crash_reports_found=yes" >> "$GITHUB_OUTPUT"
            echo "--- Crash report(s) found ---"
            echo "$CRASH_REPORTS"
          else
            echo "crash_reports_found=no" >> "$GITHUB_OUTPUT"
          fi

          echo "--- Bounded CutSell process log (last 1 minute) ---"
          xcrun simctl spawn "$UDID" log show --style compact \
            --predicate 'processImagePath contains "CutSell"' --last 1m \
            2>/dev/null | tail -n 200 || echo "(no log output captured)"

      - name: Capture simulator screenshot
        if: steps.launch.outputs.process_alive == 'yes'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/cutsell-sim"
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot \
            "$RUNNER_TEMP/cutsell-sim/launch-screenshot.png"

      - name: Upload simulator screenshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-ios-simulator-screenshot
          path: ${{ runner.temp }}/cutsell-sim/launch-screenshot.png
          if-no-files-found: ignore

      - name: Shut down iOS Simulator
        if: always() && steps.sim.outcome == 'success'
        run: xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" || true

      - name: Notify Claude Routine
        if: always()
        shell: bash
        env:
          CLAUDE_ROUTINE_URL: ${{ secrets.CUTSELL_CLAUDE_ROUTINE_URL }}
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CUTSELL_CLAUDE_ROUTINE_TOKEN }}
          WORKFLOW_STATUS: ${{ job.status }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          if [ -z "${CLAUDE_ROUTINE_URL:-}" ]; then
            echo "CUTSELL_CLAUDE_ROUTINE_URL not set; skipping Claude Routine notification."
            exit 0
          fi
          # Small, safe run-identity payload only: no secrets, logs, artifact
          # contents, S3 URLs, or provider keys.
          payload=$(jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg head_branch "$HEAD_BRANCH" \
            --arg head_sha "$HEAD_SHA" \
            --arg status "$WORKFLOW_STATUS" \
            '{repository:$repository, workflow:$workflow, run_id:$run_id, run_attempt:$run_attempt, head_branch:$head_branch, head_sha:$head_sha, status:$status}')
          curl --silent --show-error --max-time 15 \
            --request POST \
            --url "$CLAUDE_ROUTINE_URL" \
            --header "Authorization: Bearer $CLAUDE_ROUTINE_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            || echo "Claude Routine notification failed (non-blocking)."
          exit 0
