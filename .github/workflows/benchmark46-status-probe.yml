name: Benchmark 46 Status Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/benchmark46-status-probe.yml

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Show recent benchmark and deploy runs
        shell: bash
        run: |
          set -euo pipefail
          echo '=== RECENT CLEAN CUT BENCHMARK RUNS ==='
          curl --fail --silent --show-error \
            --url "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/cutsell-unseen-clean-cut-benchmark.yml/runs?event=workflow_dispatch&branch=cutsell%2Fmobile-v1-clean&per_page=10" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            | jq -c '.workflow_runs[] | {id,run_number,status,conclusion,head_sha,created_at,updated_at}'
          echo '=== RECENT BENCHMARK 46 DEPLOY RUNS ==='
          curl --fail --silent --show-error \
            --url "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/benchmark46-controlled-deploy-dispatch.yml/runs?branch=cutsell%2Fmobile-v1-clean&per_page=10" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            | jq -c '.workflow_runs[] | {id,run_number,status,conclusion,head_sha,created_at,updated_at}'
      - name: Show current staging workers safely
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RUNPOD_API_KEY:-}" ]; then
            echo 'RUNPOD_API_KEY unavailable to probe'
            exit 0
          fi
          curl --fail --silent --show-error \
            --url "https://rest.runpod.io/v1/pods" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            | jq -c '.[] | select(.name == "cutsell-staging-worker") | {id,name,desiredStatus,imageName}'
