name: CutSell V30 AV Window Unit QA
on:
  push:
    branches:
      - feat/editorial-engine-v2-whole-video-rebuild
    paths:
      - .github/workflows/cutsell-v30-targeted-qa.yml
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg pkg-config libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev libavfilter-dev libswscale-dev libswresample-dev
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.cutsell.worker.txt pytest
      - name: Verify focused visual and continuation contracts
        run: |
          python -m pytest -q tests/test_whole_video_av.py tests/test_v2_focused_continuation.py tests/test_cutsell_unified_selection_reasoner.py tests/test_cutsell_editorial_engine_v2.py
