name: CutSell Unseen Clean Cut Benchmark

on:
  workflow_dispatch:
    inputs:
      approval_token:
        description: 'Explicit paid-benchmark approval token'
        required: true
        type: string
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/cutsell-unseen-clean-cut-benchmark.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      REDIS_URL: ${{ secrets.REDIS_URL }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      CUTSELL_VALIDATION_PREFIX: Editdna bloopers videos/
      VIDEO_LIMIT: "8"
      BENCHMARK_ID: unseen-${{ github.run_id }}-${{ github.sha }}
    steps:
      - name: Require explicit paid-benchmark approval token
        shell: bash
        env:
          APPROVAL_TOKEN: ${{ inputs.approval_token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            echo 'Using one-shot RUN31 user-approved benchmark trigger'
          else
            test "$APPROVAL_TOKEN" = "RUN31" || { echo 'Paid Hybrid benchmark not explicitly approved for RUN31'; exit 2; }
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install orchestration client only
        run: pip install 'redis>=5.0' 'rq>=2.6' 'boto3>=1.34'

      - name: Load missing S3 credentials from RunPod template vault
        shell: bash
        run: |
          set -euo pipefail
          test -n "${REDIS_URL:-}" || { echo 'REDIS_URL missing'; exit 3; }
          missing=0
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_BUCKET; do
            [ -n "${!key:-}" ] || missing=1
          done
          [ "$missing" = "1" ] || exit 0
          test -n "${RUNPOD_API_KEY:-}" || { echo 'S3 runtime credentials unavailable'; exit 3; }
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/templates" --header "Authorization: Bearer $RUNPOD_API_KEY" --output templates.json
          TEMPLATE=$(jq -c '[.[] | select(.name == "EditDNA-Worker-2")][0]' templates.json)
          test "$TEMPLATE" != "null" || { echo 'EditDNA-Worker-2 template not found'; exit 4; }
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_BUCKET; do
            if [ -z "${!key:-}" ]; then
              value=$(printf '%s' "$TEMPLATE" | jq -r --arg key "$key" '.env[$key] // empty')
              test -n "$value" || { echo "$key missing"; exit 5; }
              echo "::add-mask::$value"
              printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
            fi
          done

      - name: Enqueue Hybrid benchmark on approved RunPod GPU worker
        id: enqueue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from redis import Redis
          from rq import Queue, Worker

          connection = Redis.from_url(os.environ['REDIS_URL'])
          workers = Worker.all(connection=connection)
          if not workers:
              raise SystemExit('No RQ worker is registered on Redis; refusing to enqueue benchmark')
          print('Registered workers:', [worker.name for worker in workers])

          payload = {
              'benchmark_id': os.environ['BENCHMARK_ID'],
              'source_prefix': os.environ['CUTSELL_VALIDATION_PREFIX'],
              'video_limit': int(os.environ.get('VIDEO_LIMIT') or 8),
              'expected_external_brain_calls_enabled': True,
          }
          queue = Queue('cutsell', connection=connection)
          job = queue.enqueue(
              'cutsell_worker.validation_job.run_unseen_clean_cut_benchmark',
              payload,
              job_timeout=10800,
              result_ttl=86400,
              failure_ttl=86400,
              meta={
                  'benchmark_id': payload['benchmark_id'],
                  'brain_backend': 'runpod_local',
                  'external_brain_calls_enabled': True,
                  'hybrid_provider': 'google',
                  'hybrid_primary_model': 'gemini-3.5-flash-lite',
              },
          )
          print(json.dumps({'job_id': job.id, 'queue': queue.name, **payload}, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'job_id={job.id}\n')
          PY

      - name: Wait for RunPod Hybrid benchmark
        env:
          JOB_ID: ${{ steps.enqueue.outputs.job_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from redis import Redis
          from rq.job import Job

          connection = Redis.from_url(os.environ['REDIS_URL'])
          job = Job.fetch(os.environ['JOB_ID'], connection=connection)
          deadline = time.monotonic() + 10200
          last = None
          while time.monotonic() < deadline:
              status = job.get_status(refresh=True)
              value = getattr(status, 'value', str(status))
              meta = dict(job.meta or {})
              snapshot = (value, meta.get('stage'), meta.get('progress_percent'), meta.get('current_source'))
              if snapshot != last:
                  print(json.dumps({
                      'status': value,
                      'stage': meta.get('stage'),
                      'progress_percent': meta.get('progress_percent'),
                      'current_source': meta.get('current_source'),
                      'brain_backend': meta.get('brain_backend'),
                      'external_brain_calls_enabled': meta.get('external_brain_calls_enabled'),
                  }, ensure_ascii=False))
                  last = snapshot
              if value == 'finished':
                  result = job.result
                  if not isinstance(result, dict):
                      raise SystemExit('RunPod benchmark returned invalid result')
                  if result.get('brain_backend') != 'runpod_local':
                      raise SystemExit('RunPod benchmark escaped local perception brain')
                  if result.get('external_brain_calls_enabled') is not True:
                      raise SystemExit('RunPod benchmark did not activate approved Hybrid judge')
                  if result.get('hybrid_provider') != 'google' or result.get('hybrid_primary_model') != 'gemini-3.5-flash-lite':
                      raise SystemExit('RunPod benchmark used unexpected Hybrid provider/model')
                  with open('runpod-benchmark-result.json', 'w', encoding='utf-8') as handle:
                      json.dump(result, handle, ensure_ascii=False, indent=2, sort_keys=True)
                  print(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True))
                  break
              if value in {'failed', 'stopped', 'canceled'}:
                  print(job.exc_info or 'RunPod benchmark failed')
                  raise SystemExit(f'RunPod benchmark job {value}')
              time.sleep(15)
          else:
              raise SystemExit('Timed out waiting for RunPod benchmark')
          PY

      - name: Download RunPod benchmark artifacts from S3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cutsell-unseen-clean-cut-previews
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlparse
          import boto3

          result = json.load(open('runpod-benchmark-result.json', encoding='utf-8'))
          s3 = boto3.client('s3', region_name=os.environ.get('AWS_REGION') or 'us-east-1')

          def parts(uri):
              parsed = urlparse(uri)
              if parsed.scheme != 's3' or not parsed.netloc or not parsed.path.lstrip('/'):
                  raise ValueError(f'invalid S3 artifact URI: {uri}')
              return parsed.netloc, parsed.path.lstrip('/')

          bucket, key = parts(result['report_uri'])
          s3.download_file(bucket, key, 'cutsell-unseen-clean-cut-benchmark.json')
          report = json.load(open('cutsell-unseen-clean-cut-benchmark.json', encoding='utf-8'))
          if report.get('brain_backend') != 'runpod_local' or report.get('external_brain_calls_enabled') is not True:
              raise SystemExit('report does not prove approved Hybrid execution')
          if report.get('hybrid_provider') != 'google' or report.get('hybrid_primary_model') != 'gemini-3.5-flash-lite':
              raise SystemExit('report contains unexpected Hybrid provider/model')

          requested = int(report.get('total_hybrid_requested_groups') or 0)
          available = int(report.get('total_hybrid_available_groups') or 0)
          availability_ratio = (available / requested) if requested else 0.0

          for uri in result.get('preview_uris') or []:
              bucket, key = parts(uri)
              destination = Path('cutsell-unseen-clean-cut-previews') / Path(key).name
              s3.download_file(bucket, key, str(destination))
          print(json.dumps({
              key: report.get(key) for key in (
                  'benchmark_id', 'brain_backend', 'external_brain_calls_enabled',
                  'hybrid_provider', 'hybrid_primary_model',
                  'source_count', 'completed_count', 'execution_failure_count',
                  'provider_failure_count', 'total_hybrid_requested_groups',
                  'total_hybrid_available_groups', 'total_hybrid_deleted',
                  'selected_to_input_ratio', 'total_clean_cut_removed', 'total_temporal_trimmed'
              )
          } | {'hybrid_chunk_availability_ratio': round(availability_ratio, 4)}, indent=2))
          if report.get('execution_failure_count') or report.get('provider_failure_count'):
              raise SystemExit('RunPod Hybrid unseen benchmark reported failures')
          if requested <= 0:
              raise SystemExit('RunPod Hybrid unseen benchmark requested zero semantic chunks')
          if availability_ratio < 0.80:
              raise SystemExit(f'Hybrid chunk availability below Run31 floor: {available}/{requested}')
          PY

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-unseen-clean-cut-report-${{ github.sha }}
          path: cutsell-unseen-clean-cut-benchmark.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload preview videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-unseen-clean-cut-previews-${{ github.sha }}
          path: cutsell-unseen-clean-cut-previews/*.mp4
          if-no-files-found: warn
          retention-days: 14
