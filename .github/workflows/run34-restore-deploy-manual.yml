name: Run34 Restore Deploy Manual

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/run34-restore-deploy-manual.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutsell/mobile-v1-clean
      - name: Restore paid deploy workflow to manual-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/cutsell-feature-runpod-one-shot-deploy.yml')
          text = p.read_text()
          push_block = '''  push:\n    branches:\n      - cutsell/mobile-v1-clean\n    paths:\n      - .github/workflows/cutsell-feature-runpod-one-shot-deploy.yml\n'''
          text = text.replace(push_block, '')
          text = text.replace('          EVENT_NAME: ${{ github.event_name }}\n', '')
          old = '''          if [ "$EVENT_NAME" = "push" ]; then\n            echo 'Using user-approved continuous improvement Run34 push trigger'\n          else\n            test "$APPROVAL_TOKEN" = "RUN34" || { echo 'Paid RunPod deploy not explicitly approved'; exit 2; }\n          fi\n'''
          new = '''          test "$APPROVAL_TOKEN" = "RUN34" || { echo 'Paid RunPod deploy not explicitly approved for RUN34'; exit 2; }\n'''
          if old not in text:
              raise SystemExit('Expected Run34 temporary push guard not found')
          text = text.replace(old, new)
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/cutsell-feature-runpod-one-shot-deploy.yml
          git diff --cached --quiet && exit 0
          git commit -m "Restore Run34 deploy workflow to manual-only"
          git push origin HEAD:cutsell/mobile-v1-clean

# trigger
