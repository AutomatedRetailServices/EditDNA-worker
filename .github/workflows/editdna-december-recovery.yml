name: Recover December evidence CPU only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests boto3
      - run: python benchmarks/recover_december_result.py
      - uses: actions/upload-artifact@v4
        with:
          name: december-recovered-evidence
          path: december-recovery/
