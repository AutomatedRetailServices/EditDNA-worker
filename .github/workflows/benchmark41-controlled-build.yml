name: Benchmark 41 Controlled Worker Build

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/benchmark41-controlled-build.yml

permissions:
  contents: write
  packages: write

concurrency:
  group: cutsell-benchmark41-worker-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: cutsell/mobile-v1-clean
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Guard exact PR and branch
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$PR_NUMBER" = "25" || { echo 'Benchmark 41 build restricted to PR #25'; exit 2; }
          test "$PR_HEAD" = "$TARGET_BRANCH" || { echo 'Benchmark 41 build restricted to cutsell/mobile-v1-clean'; exit 2; }
          test -n "$HEAD_SHA" || { echo 'Missing PR head SHA'; exit 2; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable CutSell worker
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/automatedretailservices/cutsell-worker:${HEAD_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" -f Dockerfile.cutsell.worker .

      - name: Prove OpenAI SDK is absent
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python "$IMAGE" - <<'PY'
          import importlib.util
          if importlib.util.find_spec('openai') is not None:
              raise SystemExit('OpenAI SDK unexpectedly present in RunPod worker image')
          print('openai_sdk_absent=true')
          PY

      - name: Push image and resolve digest
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          docker buildx imagetools inspect "$IMAGE" | tee image-inspect.txt
          digest=$(awk '/^Digest:/ {print $2; exit}' image-inspect.txt)
          test -n "$digest" || { echo 'Unable to resolve image digest'; exit 9; }
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "immutable_image=${IMAGE}@${digest}" >> "$GITHUB_STEP_SUMMARY"

      - name: Record benchmark 41 immutable build status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          cat > ops/benchmark41-build-status.json <<EOF
          {
            "build_run_id": ${GITHUB_RUN_ID},
            "head_sha": "${HEAD_SHA}",
            "image": "${IMAGE}@${IMAGE_DIGEST}",
            "image_digest": "${IMAGE_DIGEST}",
            "build_reason": "benchmark41-attempt-session-reconstruction",
            "conclusion": "success"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/benchmark41-build-status.json
          git commit -m "Record benchmark 41 immutable worker build"
          git push origin HEAD:$TARGET_BRANCH
