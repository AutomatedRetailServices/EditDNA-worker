name: Focused 00-02-03 Orchestrator
run-name: Focused 00-02-03 direct RQ benchmark

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/benchmark52-controlled-build.yml

permissions:
  contents: read
  actions: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RUNPOD_TEMPLATE_NAME: EditDNA-Worker-2
      SOURCE_SHA: b02cec5afe2087b4de59747c027098b8fdebd8d7
      IMAGE_REPO: ghcr.io/automatedretailservices/cutsell-worker
      EXPECTED_DIGEST: sha256:6dd7ec029acb9ea1b553b7ab69f6a31ba8ad8b771bd2bdeaf76ae1756b3b3f07
      POD_ID: ''
    steps:
      - name: Resolve exact immutable focused worker image
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}"
          test -n "${REDIS_URL:-}"
          test -n "${GEMINI_API_KEY:-}"
          echo "::add-mask::$GEMINI_API_KEY"
          source_image="$IMAGE_REPO:$SOURCE_SHA"
          docker buildx imagetools inspect "$source_image" > image-inspect.txt
          resolved=$(awk '/^Digest:/ {print $2; exit}' image-inspect.txt)
          test "$resolved" = "$EXPECTED_DIGEST" || { echo "Digest mismatch: $resolved"; exit 3; }
          IMMUTABLE_IMAGE="$source_image@$resolved"
          echo "IMMUTABLE_IMAGE=$IMMUTABLE_IMAGE" >> "$GITHUB_ENV"
          echo "FOCUSED_IMMUTABLE_IMAGE=$IMMUTABLE_IMAGE"

      - name: Refuse duplicate staging worker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output pods-before.json
          count=$(jq '[.[] | select(.name == "cutsell-staging-worker")] | length' pods-before.json)
          test "$count" = "0" || { echo "cutsell-staging-worker already exists ($count); refusing duplicate paid Pod"; exit 4; }

      - name: Install orchestration client and snapshot RQ workers
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'redis>=5.0' 'rq>=2.6' 'boto3>=1.34'
          python - <<'PY'
          import json, os
          from redis import Redis
          from rq import Worker
          connection = Redis.from_url(os.environ['REDIS_URL'])
          names = sorted(worker.name for worker in Worker.all(connection=connection))
          json.dump(names, open('rq-workers-before.json','w',encoding='utf-8'))
          print('RQ workers before:', names)
          PY

      - name: Build safe runtime baseline from EditDNA-Worker-2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/templates" --header "Authorization: Bearer $RUNPOD_API_KEY" --output templates.json
          TEMPLATE=$(jq -c --arg name "$RUNPOD_TEMPLATE_NAME" '[.[] | select(.name == $name)][0]' templates.json)
          test "$TEMPLATE" != "null"
          printf '%s' "$TEMPLATE" | jq -c '{ASR_DEVICE:.env.ASR_DEVICE,ASR_ENABLED:.env.ASR_ENABLED,BAD_TAKES_ENABLED:.env.BAD_TAKES_ENABLED,BOUNDARY_REFINER_ENABLED:.env.BOUNDARY_REFINER_ENABLED,BOUNDARY_REFINER_HEAD_STEP_SEC:.env.BOUNDARY_REFINER_HEAD_STEP_SEC,BOUNDARY_REFINER_MIN_DURATION_SEC:.env.BOUNDARY_REFINER_MIN_DURATION_SEC,BOUNDARY_REFINER_TAIL_STEP_SEC:.env.BOUNDARY_REFINER_TAIL_STEP_SEC,FFMPEG_BIN:.env.FFMPEG_BIN,FFPROBE_BIN:.env.FFPROBE_BIN,HEAD_TRIM_SEC:.env.HEAD_TRIM_SEC,PRESIGN_EXPIRES:.env.PRESIGN_EXPIRES,PYTHONPATH:.env.PYTHONPATH,S3_ACL:.env.S3_ACL,S3_BUCKET:.env.S3_BUCKET,S3_PREFIX:.env.S3_PREFIX,TAIL_TRIM_SEC:.env.TAIL_TRIM_SEC,VISION_ENABLED:.env.VISION_ENABLED,VISION_INTERVAL_SEC:.env.VISION_INTERVAL_SEC,VISION_MAX_SAMPLES:.env.VISION_MAX_SAMPLES,VISUAL_BAD_THRESHOLD:.env.VISUAL_BAD_THRESHOLD,WHISPER_DEVICE:.env.WHISPER_DEVICE,WHISPER_MODEL:.env.WHISPER_MODEL,W_FACE:.env.W_FACE,W_VISION:.env.W_VISION,W_VISUAL:.env.W_VISUAL,AWS_ACCESS_KEY_ID:.env.AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY:.env.AWS_SECRET_ACCESS_KEY,AWS_REGION:.env.AWS_REGION} | with_entries(select(.value != null and .value != ""))' > safe-template-env.json
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_BUCKET; do
            value=$(jq -r --arg key "$key" '.[$key] // empty' safe-template-env.json)
            test -n "$value" || { echo "$key missing"; exit 6; }
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
          VOLUME_MOUNT=$(printf '%s' "$TEMPLATE" | jq -r '.volumeMountPath // "/workspace"')
          echo "VOLUME_MOUNT=$VOLUME_MOUNT" >> "$GITHUB_ENV"

      - name: Create exactly one staging GPU worker
        shell: bash
        run: |
          set -euo pipefail
          jq --arg name "cutsell-staging-worker" --arg image "$IMMUTABLE_IMAGE" --arg redis "$REDIS_URL" --arg gemini "$GEMINI_API_KEY" --arg mount "$VOLUME_MOUNT" '. + {REDIS_URL:$redis,GEMINI_API_KEY:$gemini,CUTSELL_BRAIN_BACKEND:"runpod_local",CUTSELL_EDITORIAL_MODE:"clean_cut",CUTSELL_ASR_MODEL:"medium",CUTSELL_CLEAN_CUT_JUDGE:"0",CUTSELL_HYBRID_PROVIDER:"google",CUTSELL_HYBRID_LLM_ENABLED:"1",CUTSELL_HYBRID_PRIMARY_MODEL:"gemini-3.5-flash-lite",CUTSELL_HYBRID_ESCALATION_MODEL:"gemini-3.6-flash",CUTSELL_HYBRID_MAX_SESSION_USD:"0.0075",CUTSELL_HYBRID_TEST_BUDGET_USD:"0.20"} | {name:$name,imageName:$image,cloudType:"COMMUNITY",computeType:"GPU",gpuCount:1,gpuTypeIds:["NVIDIA RTX A5000","NVIDIA RTX A4000","NVIDIA L4","NVIDIA A40","NVIDIA RTX A6000","NVIDIA GeForce RTX 3090","NVIDIA GeForce RTX 4090"],gpuTypePriority:"custom",interruptible:false,containerDiskInGb:30,volumeInGb:20,volumeMountPath:$mount,env:.}' safe-template-env.json > create-pod.json
          if jq -e 'has("dockerEntrypoint") or has("dockerStartCmd")' create-pod.json >/dev/null; then exit 7; fi
          if jq -e '.env | has("OPENAI_API_KEY") or has("EDITDNA_USE_LLM") or has("EDITDNA_LLM_MODEL")' create-pod.json >/dev/null; then exit 7; fi
          code=$(curl --silent --show-error --write-out '%{http_code}' --request POST --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --header "Content-Type: application/json" --data @create-pod.json --output pod.json)
          rm -f create-pod.json safe-template-env.json
          test "$code" = "201" || { echo "RunPod create HTTP status: $code"; cat pod.json; exit 8; }
          POD_ID=$(jq -r '.id // empty' pod.json)
          test -n "$POD_ID"
          echo "POD_ID=$POD_ID" >> "$GITHUB_ENV"
          echo "POD_CREATED_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
          echo "FOCUSED_POD_ID=$POD_ID"
          jq '{id,name,desiredStatus,imageName,costPerHr,adjustedCostPerHr}' pod.json

      - name: Confirm exact Pod identity and wait for fresh RQ worker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods/$POD_ID" --header "Authorization: Bearer $RUNPOD_API_KEY" --output pod-confirm.json
          test "$(jq -r '.id // empty' pod-confirm.json)" = "$POD_ID"
          test "$(jq -r '.name // empty' pod-confirm.json)" = "cutsell-staging-worker"
          test "$(jq -r '.imageName // empty' pod-confirm.json)" = "$IMMUTABLE_IMAGE"
          python - <<'PY'
          import json, os, time
          from datetime import datetime, timezone
          from redis import Redis
          from rq import Worker
          connection = Redis.from_url(os.environ['REDIS_URL'])
          before = set(json.load(open('rq-workers-before.json', encoding='utf-8')))
          created_epoch = float(os.environ['POD_CREATED_EPOCH'])
          deadline = time.time() + 600
          while time.time() < deadline:
              now = datetime.now(timezone.utc)
              for worker in Worker.all(connection=connection):
                  heartbeat = worker.last_heartbeat
                  if heartbeat is None or worker.name in before:
                      continue
                  if heartbeat.tzinfo is None:
                      heartbeat = heartbeat.replace(tzinfo=timezone.utc)
                  if heartbeat.timestamp() >= created_epoch - 5 and (now-heartbeat).total_seconds() <= 30 and worker.get_state() in {'idle','busy'}:
                      print('Fresh focused RQ worker:', worker.name)
                      raise SystemExit(0)
              time.sleep(10)
          raise SystemExit('No fresh RQ worker registered by exact focused Pod')
          PY

      - name: Enqueue exact 00-02-03 focused benchmark
        id: enqueue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from redis import Redis
          from rq import Queue
          connection = Redis.from_url(os.environ['REDIS_URL'])
          payload = {
              'benchmark_id': f"focused-{os.environ['GITHUB_RUN_ID']}-{os.environ['SOURCE_SHA'][:12]}",
              'source_prefix': 'Editdna longform validation/',
              'source_keys': [
                  'Editdna longform validation/VIDEO-2026-07-30-09-18-03.mp4',
                  'Editdna longform validation/VIDEO-2026-07-30-09-24-13.mp4',
                  'Editdna longform validation/VIDEO-2026-07-30-10-22-46.mp4',
              ],
              'expected_external_brain_calls_enabled': True,
          }
          queue = Queue('cutsell', connection=connection)
          job = queue.enqueue(
              'cutsell_worker.focused_validation_job.run_focused_clean_cut_benchmark',
              payload,
              job_timeout=6600,
              result_ttl=86400,
              failure_ttl=86400,
              meta={
                  'benchmark_id': payload['benchmark_id'],
                  'dataset_role': 'clean_cut_gold_raw_focused',
                  'source_keys': payload['source_keys'],
                  'brain_backend': 'runpod_local',
                  'external_brain_calls_enabled': True,
                  'hybrid_provider': 'google',
                  'hybrid_primary_model': 'gemini-3.5-flash-lite',
              },
          )
          print(json.dumps({'job_id': job.id, **payload}, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'job_id={job.id}\n')
          PY

      - name: Wait for exact focused benchmark
        env:
          JOB_ID: ${{ steps.enqueue.outputs.job_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from redis import Redis
          from rq.job import Job
          connection = Redis.from_url(os.environ['REDIS_URL'])
          job = Job.fetch(os.environ['JOB_ID'], connection=connection)
          deadline = time.monotonic() + 6600
          last = None
          while time.monotonic() < deadline:
              status = job.get_status(refresh=True)
              value = getattr(status, 'value', str(status))
              meta = dict(job.meta or {})
              snapshot = (value, meta.get('stage'), meta.get('progress_percent'), meta.get('current_source'))
              if snapshot != last:
                  print(json.dumps({'status': value, 'stage': meta.get('stage'), 'progress_percent': meta.get('progress_percent'), 'current_source': meta.get('current_source')}, ensure_ascii=False))
                  last = snapshot
              if value == 'finished':
                  result = job.result
                  if not isinstance(result, dict):
                      raise SystemExit('Focused benchmark returned invalid result')
                  if result.get('dataset_role') != 'clean_cut_gold_raw_focused':
                      raise SystemExit('Focused benchmark returned wrong dataset role')
                  expected = [
                      'Editdna longform validation/VIDEO-2026-07-30-09-18-03.mp4',
                      'Editdna longform validation/VIDEO-2026-07-30-09-24-13.mp4',
                      'Editdna longform validation/VIDEO-2026-07-30-10-22-46.mp4',
                  ]
                  if result.get('source_keys') != expected:
                      raise SystemExit('Focused benchmark used unexpected source keys')
                  json.dump(result, open('focused-result.json','w',encoding='utf-8'), ensure_ascii=False, indent=2, sort_keys=True)
                  print(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True))
                  break
              if value in {'failed','stopped','canceled'}:
                  print(job.exc_info or 'Focused benchmark failed')
                  raise SystemExit(f'Focused benchmark job {value}')
              time.sleep(10)
          else:
              raise SystemExit('Timed out waiting for focused benchmark')
          PY

      - name: Download focused report and previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p focused-previews
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlparse
          import boto3
          result = json.load(open('focused-result.json', encoding='utf-8'))
          s3 = boto3.client('s3', region_name=os.environ.get('AWS_REGION') or 'us-east-1')
          def parts(uri):
              parsed = urlparse(uri)
              if parsed.scheme != 's3':
                  raise ValueError(uri)
              return parsed.netloc, parsed.path.lstrip('/')
          bucket, key = parts(result['report_uri'])
          s3.download_file(bucket, key, 'cutsell-focused-clean-cut-benchmark.json')
          report = json.load(open('cutsell-focused-clean-cut-benchmark.json', encoding='utf-8'))
          if report.get('source_count') != 3 or report.get('completed_count') != 3:
              raise SystemExit('Focused report did not complete exactly 3 sources')
          if report.get('execution_failure_count') or report.get('provider_failure_count'):
              raise SystemExit('Focused report contains failures')
          for uri in result.get('preview_uris') or []:
              bucket, key = parts(uri)
              destination = Path('focused-previews') / Path(key).name
              s3.download_file(bucket, key, str(destination))
          previews = sorted(Path('focused-previews').glob('*.mp4'))
          if len(previews) != 3:
              raise SystemExit(f'Expected 3 focused previews, found {len(previews)}')
          print(json.dumps({
              'source_count': report.get('source_count'),
              'completed_count': report.get('completed_count'),
              'execution_failure_count': report.get('execution_failure_count'),
              'provider_failure_count': report.get('provider_failure_count'),
              'hybrid_requested': report.get('total_hybrid_requested_groups'),
              'hybrid_available': report.get('total_hybrid_available_groups'),
              'preview_files': [p.name for p in previews],
          }, indent=2))
          PY

      - name: Upload focused JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-focused-00-02-03-report-${{ github.sha }}
          path: cutsell-focused-clean-cut-benchmark.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload focused preview videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-focused-00-02-03-previews-${{ github.sha }}
          path: focused-previews/*.mp4
          if-no-files-found: warn
          retention-days: 14

      - name: Always terminate exact staging GPU worker
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${POD_ID:-}" ]; then
            echo 'No focused Pod was created'
            exit 0
          fi
          code=$(curl --silent --show-error --write-out '%{http_code}' --request DELETE --url "https://rest.runpod.io/v1/pods/$POD_ID" --header "Authorization: Bearer $RUNPOD_API_KEY" --output cleanup.txt)
          echo "focused cleanup DELETE status: $code"
          test "$code" = "204" || test "$code" = "404"
          sleep 2
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output cleanup-after.json
          remaining=$(jq --arg id "$POD_ID" '[.[] | select(.id == $id)] | length' cleanup-after.json)
          test "$remaining" = "0" || { echo 'Focused Pod still present after cleanup'; exit 12; }
          echo "Focused Pod deleted and verified absent: $POD_ID"
