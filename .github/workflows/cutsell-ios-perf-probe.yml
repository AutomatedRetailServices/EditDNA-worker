name: CutSell iOS perf probe

# Times the app's own steps (upload, editor load, preview build, each editor action) against the
# live server, with a synthetic 60 s test video (macOS "say" voice over a moving test pattern; no
# real video or personal data). Same steps before and after a change. Debug app in the Simulator.
# Runs only when pushed to probe/perf (manual). Makes one short cut on the live server.

on:
  workflow_dispatch: {}
  push:
    branches: [probe/perf]

concurrency:
  group: cutsell-ios-perf-probe
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  perf:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$latest"

      - name: Build for the Simulator
        working-directory: mobile/ios
        run: |
          brew install xcodegen ffmpeg >/dev/null
          xcodegen generate
          set +e
          xcodebuild -project CutSell.xcodeproj -scheme CutSell -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1
          status=$?
          grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -8 | while IFS= read -r l; do echo "::error title=build::$(echo "$l" | sed 's#.*/mobile/ios/##' | cut -c1-300)"; done
          exit $status

      - name: Make a 60 s synthetic test video (about 1 minute of phone video)
        run: |
          say -v Samantha -o "$RUNNER_TEMP/speech.aiff" "Hi everyone. Today I want to show you my favorite water bottle. It keeps drinks cold for twenty four hours. It fits in any car cup holder. The lid does not leak, even in my bag. I use it at the gym, at work and on long drives. It comes in six colors and the black one is my favorite. Right now it is on sale in my shop. The price is lower than ever this week. If you want one, the link is in my bio. Grab yours today before they sell out. Thank you for watching and see you in the next video."
          ffmpeg -loglevel error -y -f lavfi -i "testsrc2=s=1080x1920:r=30:d=60" -i "$RUNNER_TEMP/speech.aiff" \
            -vf "noise=alls=30:allf=t" -t 60 -c:v libx264 -b:v 11M -maxrate 11M -bufsize 22M -pix_fmt yuv420p -c:a aac -ar 48000 -af apad "$RUNNER_TEMP/perf.mp4"
          ls -la "$RUNNER_TEMP/perf.mp4"

      - name: Upload timing (old way vs new way) and one cut, same calls as the app
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, concurrent.futures
          API = "https://cutsell-api.onrender.com"; T = None
          video = os.path.join(os.environ["RUNNER_TEMP"], "perf.mp4"); data = open(video, "rb").read()
          def call(m, p, b=None, q=""):
              r = urllib.request.Request(API + p + q, method=m, data=None if b is None else json.dumps(b).encode(),
                  headers={"content-type": "application/json", **({"authorization": "Bearer " + T} if T else {})})
              with urllib.request.urlopen(r, timeout=300) as x: return json.load(x)
          s = call("POST", "/v1/auth/session"); T = s["access_token"]; u = s["user_id"]
          print("::add-mask::" + T)
          results = []
          def upload(parallel):
              p = call("POST", "/v1/projects", {"user_id": u, "title": "Perf probe"}); pid = p["project_id"]
              t0 = time.time()
              st = call("POST", "/v1/uploads/multipart/start", {"project_id": pid, "user_id": u, "original_name": "perf.mp4",
                        "content_type": "video/mp4", "size_bytes": len(data)})
              def part(n):
                  sg = call("POST", f"/v1/uploads/multipart/{st['upload_id']}/parts/{n}/presign", {"project_id": pid, "user_id": u})
                  req = urllib.request.Request(sg["upload_url"], data=data[(n-1)*st["part_size"]: n*st["part_size"]], method="PUT")
                  req.add_header("Content-Type", "")
                  with urllib.request.urlopen(req, timeout=600) as r: return {"part_number": n, "etag": r.headers["ETag"]}
              numbers = list(range(1, st["part_count"] + 1))
              if parallel:
                  with concurrent.futures.ThreadPoolExecutor(3) as pool: parts = list(pool.map(part, numbers))
              else:
                  parts = [part(n) for n in numbers]
              done = call("POST", f"/v1/uploads/multipart/{st['upload_id']}/complete", {"project_id": pid, "user_id": u, "parts": parts})
              ms = int((time.time() - t0) * 1000)
              mb = len(data) / 1048576
              row = {"step": "upload_" + ("3_at_a_time" if parallel else "one_by_one"), "ms": str(ms), "mb": f"{mb:.1f}",
                     "mb_per_s": f"{mb / max(0.001, ms / 1000):.2f}", "parts": str(st["part_count"])}
              results.append(row); print(f"::notice title={row['step']}::ms={ms} mb={mb:.1f} parts={st['part_count']}")
              return pid, done["source_uri"]
          upload(parallel=False)
          pid, uri = upload(parallel=True)
          t0 = time.time()
          job = call("POST", "/v1/flow-b/jobs", {"project_id": pid, "user_id": u, "audio_overlap": False, "language_hint": None,
                     "sources": [{"original_name": "perf.mp4", "uri": uri, "source_order": 0, "duration_sec": 60.0}]})
          while True:
              j = call("GET", f"/v1/jobs/{job['job_id']}")
              if j["state"] in ("finished", "failed", "canceled") or time.time() - t0 > 900: break
              time.sleep(3)
          results.append({"step": "server_cut", "ms": str(int((time.time() - t0) * 1000)), "state": j["state"]})
          print(f"::notice title=server_cut::{j['state']} in {int(time.time()-t0)} s")
          json.dump(results, open(os.path.join(os.environ["RUNNER_TEMP"], "upload.json"), "w"))
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"PROBE_TOKEN={T}\nPROBE_USER={u}\nPROBE_PROJECT={pid}\n")
          PY

      - name: Run the perf probe in the Simulator
        working-directory: mobile/ios
        run: |
          udid="$(xcrun simctl list devices available --json | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=sorted((r,x["name"],x["udid"]) for r,v in d.items() if "iOS" in r for x in v if x["name"].startswith("iPhone"))
          print(c[-1][2])')"
          xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b
          APP="build/Build/Products/Debug-iphonesimulator/CutSell.app"
          BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          xcrun simctl install "$udid" "$APP"
          SIMCTL_CHILD_CUTSELL_PROBE_TOKEN="$PROBE_TOKEN" SIMCTL_CHILD_CUTSELL_PROBE_USER="$PROBE_USER" \
          SIMCTL_CHILD_CUTSELL_PROBE_PROJECT="$PROBE_PROJECT" SIMCTL_CHILD_CUTSELL_PROBE_API="https://cutsell-api.onrender.com" \
            xcrun simctl launch --stdout="$RUNNER_TEMP/app_stdout.txt" --stderr="$RUNNER_TEMP/app_stderr.txt" "$udid" "$BUNDLE" -CutSellScreen perf_probe >/dev/null
          data="$(xcrun simctl get_app_container "$udid" "$BUNDLE" data)"
          for i in $(seq 1 120); do
            if [ -f "$data/Documents/perf.json" ] && grep -q '"done"\|"error"' "$data/Documents/perf.json"; then break; fi
            sleep 5
          done
          grep -h "CUTSELL_PERF" "$RUNNER_TEMP/app_stdout.txt" | tail -25 | while IFS= read -r l; do echo "::notice title=app::$l"; done || true
          tail -5 "$RUNNER_TEMP/app_stderr.txt" 2>/dev/null | while IFS= read -r l; do echo "::warning title=stderr::$(echo "$l" | cut -c1-200)"; done || true
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i cutsell | head -3 | while IFS= read -r l; do echo "::warning title=crash::$l"; done || true
          mkdir -p "$RUNNER_TEMP/perf"
          cp "$data/Documents/perf.json" "$RUNNER_TEMP/perf/app.json" || echo '[]' > "$RUNNER_TEMP/perf/app.json"
          python3 -c "import json,sys; json.dump(json.load(open(sys.argv[1]))+json.load(open(sys.argv[2])), open(sys.argv[3],'w'), indent=1)" \
            "$RUNNER_TEMP/upload.json" "$RUNNER_TEMP/perf/app.json" "$RUNNER_TEMP/perf/perf.json"
          python3 - "$RUNNER_TEMP/perf/perf.json" <<'PY'
          import json, sys
          for row in json.load(open(sys.argv[1])):
              step = row.pop("step")
              print(f"::notice title={step}::" + " ".join(f"{k}={v}" for k, v in sorted(row.items())))
          PY

      - name: Save the results to perf-results
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/out"
          if git ls-remote --exit-code --heads "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" perf-results >/dev/null; then
            git clone --quiet --branch perf-results "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$dir"
          else
            mkdir -p "$dir"; cd "$dir"; git init -q; git checkout -q -b perf-results
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; cd -
          fi
          cp "$RUNNER_TEMP/perf/perf.json" "$dir/perf-${{ github.sha }}.json"
          cd "$dir"
          git add .
          git -c user.name="cutsell-ci" -c user.email="ci@cutsell.invalid" commit --quiet -m "perf probe for ${{ github.sha }}"
          git push --quiet origin perf-results
