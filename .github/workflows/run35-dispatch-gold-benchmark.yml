name: Run35 Dispatch Gold Benchmark

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/run35-dispatch-gold-benchmark.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutsell/mobile-v1-clean
      - name: Dispatch exact Run35 Gold benchmark and capture run id
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          code=$(curl --silent --show-error --write-out '%{http_code}' \
            --request POST \
            --url "$api/actions/workflows/cutsell-unseen-clean-cut-benchmark.yml/dispatches" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "Content-Type: application/json" \
            --data '{"ref":"cutsell/mobile-v1-clean","inputs":{"approval_token":"RUN35"}}' \
            --output dispatch-response.txt)
          test "$code" = "204" || { echo "benchmark dispatch failed HTTP $code"; cat dispatch-response.txt; exit 2; }
          run_id=""
          for i in $(seq 1 30); do
            runs=$(curl --fail --silent --show-error --header "Authorization: Bearer $GH_TOKEN" "$api/actions/workflows/cutsell-unseen-clean-cut-benchmark.yml/runs?branch=cutsell/mobile-v1-clean&event=workflow_dispatch&per_page=20")
            run_id=$(printf '%s' "$runs" | jq -r --arg started "$started" '[.workflow_runs[] | select(.created_at >= $started)][0].id // empty')
            head_sha=$(printf '%s' "$runs" | jq -r --arg started "$started" '[.workflow_runs[] | select(.created_at >= $started)][0].head_sha // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 2
          done
          test -n "$run_id" || { echo 'Run35 Gold benchmark run not found'; exit 3; }
          jq -n --argjson run_id "$run_id" --arg head_sha "$head_sha" '{run_id:$run_id,head_sha:$head_sha,dataset_role:"clean_cut_gold_raw",source_prefix:"Editdna/ longform validation/",status:"dispatched"}' > run35-gold-benchmark-status.json
      - name: Persist Run35 Gold benchmark run id
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p ops
          mv run35-gold-benchmark-status.json ops/run35-gold-benchmark-status.json
          git add ops/run35-gold-benchmark-status.json
          git commit -m 'Record Run35 Gold benchmark run'
          git push origin HEAD:cutsell/mobile-v1-clean
