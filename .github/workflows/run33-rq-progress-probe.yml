name: Run33 RQ Progress Probe

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/run33-rq-progress-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REDIS_URL: ${{ secrets.REDIS_URL }}
    steps:
      - name: Read active CutSell RQ state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${REDIS_URL:-}" || { echo 'REDIS_URL missing'; exit 3; }
          python -m pip install -q 'redis>=5.0' 'rq>=2.6'
          python - <<'PY'
          import json, os
          from redis import Redis
          from rq import Worker
          from rq.registry import StartedJobRegistry
          from rq.job import Job
          conn = Redis.from_url(os.environ['REDIS_URL'])
          workers = Worker.all(connection=conn)
          print(json.dumps({'workers':[{'name':w.name,'state':w.get_state(),'current_job_id':w.get_current_job_id(),'last_heartbeat':str(w.last_heartbeat)} for w in workers]}, indent=2))
          for job_id in StartedJobRegistry('cutsell', connection=conn).get_job_ids():
              job = Job.fetch(job_id, connection=conn)
              print(json.dumps({'job_id':job.id,'status':str(job.get_status(refresh=True)),'meta':dict(job.meta or {})}, ensure_ascii=False, indent=2, default=str))
          PY
