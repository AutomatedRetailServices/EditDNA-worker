name: Run35 Probe Retry Deploy

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/run35-probe-retry-deploy.yml

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutsell/mobile-v1-clean
      - name: Probe dispatcher and child deploy status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          d=$(curl --fail --silent --show-error --header "Authorization: Bearer $GH_TOKEN" "$api/actions/workflows/run35-dispatch-deploy.yml/runs?branch=cutsell/mobile-v1-clean&per_page=20")
          dispatcher=$(printf '%s' "$d" | jq -c '[.workflow_runs[] | select(.head_sha == "92e0c02bcc815d093dfc9f472f543e3de2618d5b")][0] // {}')
          child=$(curl --fail --silent --show-error --header "Authorization: Bearer $GH_TOKEN" "$api/actions/workflows/cutsell-feature-runpod-one-shot-deploy.yml/runs?branch=cutsell/mobile-v1-clean&event=workflow_dispatch&per_page=10" | jq -c '.workflow_runs[0] // {}')
          mkdir -p ops
          jq -n --argjson dispatcher "$dispatcher" --argjson child "$child" '{dispatcher:{id:$dispatcher.id,status:$dispatcher.status,conclusion:$dispatcher.conclusion,created_at:$dispatcher.created_at,updated_at:$dispatcher.updated_at},child:{id:$child.id,status:$child.status,conclusion:$child.conclusion,created_at:$child.created_at,updated_at:$child.updated_at}}' > ops/run35-retry-deploy-probe.json
      - name: Persist probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/run35-retry-deploy-probe.json
          git commit -m 'Probe Run35 retry deploy status'
          git pull --rebase origin cutsell/mobile-v1-clean
          git push origin HEAD:cutsell/mobile-v1-clean
