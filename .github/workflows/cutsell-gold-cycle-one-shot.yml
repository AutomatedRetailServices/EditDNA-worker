name: CutSell Gold Cycle One-Shot

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/cutsell-gold-cycle-one-shot.yml

permissions:
  contents: read
  packages: write

jobs:
  gold-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      CUTSELL_VALIDATION_PREFIX: Editdna longform validation/
      VIDEO_LIMIT: "16"
      RUNPOD_TEMPLATE_NAME: EditDNA-Worker-2
      POD_ID: ""

    steps:
      - uses: actions/checkout@v4

      - name: Build immutable worker image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="ghcr.io/automatedretailservices/cutsell-worker:${GITHUB_SHA}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE_TAG" -f Dockerfile.cutsell.worker .
          docker run --rm --entrypoint python "$IMAGE_TAG" - <<'PY'
          import importlib.util
          if importlib.util.find_spec('openai') is not None:
              raise SystemExit('OpenAI SDK unexpectedly present in RunPod worker image')
          print('openai_sdk_absent=true')
          PY
          docker push "$IMAGE_TAG"
          docker buildx imagetools inspect "$IMAGE_TAG" | tee image-inspect.txt
          digest=$(awk '/^Digest:/ {print $2; exit}' image-inspect.txt)
          test -n "$digest" || { echo 'Unable to resolve pushed image digest'; exit 9; }
          IMAGE_REF="ghcr.io/automatedretailservices/cutsell-worker@$digest"
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"
          echo "immutable_image=$IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate paid staging prerequisites and refuse duplicate
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}" || { echo 'RUNPOD_API_KEY missing'; exit 3; }
          test -n "${REDIS_URL:-}" || { echo 'REDIS_URL missing'; exit 3; }
          test -n "${GEMINI_API_KEY:-}" || { echo 'GEMINI_API_KEY missing'; exit 3; }
          test -n "${IMAGE_REF:-}" || { echo 'immutable image missing'; exit 3; }
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output pods-before.json
          count=$(jq '[.[] | select(.name == "cutsell-staging-worker")] | length' pods-before.json)
          test "$count" = "0" || { echo 'cutsell-staging-worker already exists; refusing duplicate paid worker'; exit 4; }

      - name: Load safe RunPod template baseline
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/templates" --header "Authorization: Bearer $RUNPOD_API_KEY" --output templates.json
          TEMPLATE=$(jq -c --arg name "$RUNPOD_TEMPLATE_NAME" '[.[] | select(.name == $name)][0]' templates.json)
          test "$TEMPLATE" != "null" || { echo 'RunPod baseline template not found'; exit 5; }
          printf '%s' "$TEMPLATE" | jq -c '{ASR_DEVICE:.env.ASR_DEVICE,ASR_ENABLED:.env.ASR_ENABLED,BAD_TAKES_ENABLED:.env.BAD_TAKES_ENABLED,BOUNDARY_REFINER_ENABLED:.env.BOUNDARY_REFINER_ENABLED,BOUNDARY_REFINER_HEAD_STEP_SEC:.env.BOUNDARY_REFINER_HEAD_STEP_SEC,BOUNDARY_REFINER_MIN_DURATION_SEC:.env.BOUNDARY_REFINER_MIN_DURATION_SEC,BOUNDARY_REFINER_TAIL_STEP_SEC:.env.BOUNDARY_REFINER_TAIL_STEP_SEC,FFMPEG_BIN:.env.FFMPEG_BIN,FFPROBE_BIN:.env.FFPROBE_BIN,HEAD_TRIM_SEC:.env.HEAD_TRIM_SEC,PRESIGN_EXPIRES:.env.PRESIGN_EXPIRES,PYTHONPATH:.env.PYTHONPATH,S3_ACL:.env.S3_ACL,S3_BUCKET:.env.S3_BUCKET,S3_PREFIX:.env.S3_PREFIX,TAIL_TRIM_SEC:.env.TAIL_TRIM_SEC,VISION_ENABLED:.env.VISION_ENABLED,VISION_INTERVAL_SEC:.env.VISION_INTERVAL_SEC,VISION_MAX_SAMPLES:.env.VISION_MAX_SAMPLES,VISUAL_BAD_THRESHOLD:.env.VISUAL_BAD_THRESHOLD,WHISPER_DEVICE:.env.WHISPER_DEVICE,WHISPER_MODEL:.env.WHISPER_MODEL,W_FACE:.env.W_FACE,W_VISION:.env.W_VISION,W_VISUAL:.env.W_VISUAL,AWS_ACCESS_KEY_ID:.env.AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY:.env.AWS_SECRET_ACCESS_KEY,AWS_REGION:.env.AWS_REGION} | with_entries(select(.value != null and .value != ""))' > safe-template-env.json
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_BUCKET; do
            value=$(jq -r --arg key "$key" '.[$key] // empty' safe-template-env.json)
            test -n "$value" || { echo "$key missing from EditDNA-Worker-2"; exit 6; }
            echo "::add-mask::$value"
            if [ -z "${!key:-}" ]; then
              printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
            fi
          done
          CONTAINER_DISK=30
          VOLUME_GB=20
          VOLUME_MOUNT=$(printf '%s' "$TEMPLATE" | jq -r '.volumeMountPath // "/workspace"')
          printf 'CONTAINER_DISK=%s\nVOLUME_GB=%s\nVOLUME_MOUNT=%s\n' "$CONTAINER_DISK" "$VOLUME_GB" "$VOLUME_MOUNT" >> "$GITHUB_ENV"

      - name: Create exactly one staging GPU worker
        shell: bash
        run: |
          set -euo pipefail
          START_CMD='python -m rq.cli worker -u "$REDIS_URL" --worker-ttl 1200 cutsell'
          jq --arg name "cutsell-staging-worker" --arg image "$IMAGE_REF" --arg cmd "$START_CMD" --arg redis "$REDIS_URL" --arg gemini "$GEMINI_API_KEY" --arg mount "$VOLUME_MOUNT" --argjson disk "$CONTAINER_DISK" --argjson volume "$VOLUME_GB" '. + {REDIS_URL:$redis,GEMINI_API_KEY:$gemini,CUTSELL_BRAIN_BACKEND:"runpod_local",CUTSELL_EDITORIAL_MODE:"clean_cut",CUTSELL_ASR_MODEL:"medium",CUTSELL_CLEAN_CUT_JUDGE:"0",CUTSELL_HYBRID_PROVIDER:"google",CUTSELL_HYBRID_LLM_ENABLED:"1",CUTSELL_HYBRID_PRIMARY_MODEL:"gemini-3.5-flash-lite",CUTSELL_HYBRID_ESCALATION_MODEL:"gemini-3.6-flash",CUTSELL_HYBRID_MAX_SESSION_USD:"0.0075",CUTSELL_HYBRID_TEST_BUDGET_USD:"0.50"} | {name:$name,imageName:$image,cloudType:"COMMUNITY",computeType:"GPU",gpuCount:1,gpuTypeIds:["NVIDIA RTX A5000","NVIDIA RTX A4000","NVIDIA L4","NVIDIA A40","NVIDIA RTX A6000","NVIDIA GeForce RTX 3090","NVIDIA GeForce RTX 4090"],gpuTypePriority:"custom",interruptible:false,containerDiskInGb:$disk,volumeInGb:$volume,volumeMountPath:$mount,dockerEntrypoint:["bash","-lc"],dockerStartCmd:[$cmd],env:.}' safe-template-env.json > create-pod.json
          if jq -e '.env | has("OPENAI_API_KEY") or has("EDITDNA_USE_LLM") or has("EDITDNA_LLM_MODEL")' create-pod.json >/dev/null; then
            echo 'Refusing deployment: forbidden OpenAI/legacy provider key present'; exit 7
          fi
          code=$(curl --silent --show-error --write-out '%{http_code}' --request POST --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --header "Content-Type: application/json" --data @create-pod.json --output pod.json)
          rm -f create-pod.json safe-template-env.json
          test "$code" = "201" || { echo "RunPod create HTTP status: $code"; jq '{error,errors,message}' pod.json || true; exit 8; }
          created=$(jq -r '.id // empty' pod.json)
          test -n "$created" || { echo 'RunPod returned no Pod id'; exit 8; }
          echo "POD_ID=$created" >> "$GITHUB_ENV"
          echo "staging_pod_id=$created" >> "$GITHUB_STEP_SUMMARY"
          jq '{id,name,desiredStatus,imageName,costPerHr,adjustedCostPerHr}' pod.json

      - name: Wait for exact new RQ worker
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'redis>=5.0' 'rq>=2.6' 'boto3>=1.34'
          python - <<'PY'
          import os, time
          from datetime import datetime, timezone
          from redis import Redis
          from rq import Worker
          connection = Redis.from_url(os.environ['REDIS_URL'])
          deadline = time.time() + 600
          while time.time() < deadline:
              workers = Worker.all(connection=connection)
              now = datetime.now(timezone.utc)
              for worker in workers:
                  heartbeat = worker.last_heartbeat
                  if heartbeat is None:
                      continue
                  if heartbeat.tzinfo is None:
                      heartbeat = heartbeat.replace(tzinfo=timezone.utc)
                  age = (now - heartbeat).total_seconds()
                  if age <= 30 and worker.get_state() in {'idle','busy'}:
                      print('fresh_worker=', worker.name, 'state=', worker.get_state(), 'age=', round(age, 1))
                      raise SystemExit(0)
              time.sleep(10)
          raise SystemExit('RunPod Pod exists but no fresh RQ worker registered within 10 minutes')
          PY
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods/$POD_ID" --header "Authorization: Bearer $RUNPOD_API_KEY" | jq '{id,name,desiredStatus,imageName,costPerHr,adjustedCostPerHr}'

      - name: Enqueue Clean Cut Gold benchmark on exact worker pool
        id: enqueue
        shell: bash
        run: |
          set -euo pipefail
          BENCHMARK_ID="gold-${GITHUB_RUN_ID}-${GITHUB_SHA}"
          echo "BENCHMARK_ID=$BENCHMARK_ID" >> "$GITHUB_ENV"
          python - <<'PY'
          import json, os
          from redis import Redis
          from rq import Queue, Worker
          connection = Redis.from_url(os.environ['REDIS_URL'])
          workers = Worker.all(connection=connection)
          if not workers:
              raise SystemExit('No RQ worker is registered on Redis; refusing benchmark')
          payload = {
              'benchmark_id': os.environ['BENCHMARK_ID'],
              'source_prefix': os.environ['CUTSELL_VALIDATION_PREFIX'],
              'video_limit': int(os.environ.get('VIDEO_LIMIT') or 16),
              'expected_external_brain_calls_enabled': True,
          }
          if payload['source_prefix'] != 'Editdna longform validation/':
              raise SystemExit('Refusing non-Gold source prefix')
          queue = Queue('cutsell', connection=connection)
          job = queue.enqueue(
              'cutsell_worker.validation_job.run_unseen_clean_cut_benchmark',
              payload,
              job_timeout=10800,
              result_ttl=86400,
              failure_ttl=86400,
              meta={
                  'benchmark_id': payload['benchmark_id'],
                  'dataset_role': 'clean_cut_gold_raw',
                  'source_prefix': payload['source_prefix'],
                  'brain_backend': 'runpod_local',
                  'external_brain_calls_enabled': True,
                  'hybrid_provider': 'google',
                  'hybrid_primary_model': 'gemini-3.5-flash-lite',
                  'staging_pod_id': os.environ['POD_ID'],
              },
          )
          print(json.dumps({'job_id': job.id, 'pod_id': os.environ['POD_ID'], **payload}, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'job_id={job.id}\n')
          PY

      - name: Wait for Gold benchmark
        env:
          JOB_ID: ${{ steps.enqueue.outputs.job_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from redis import Redis
          from rq.job import Job
          connection = Redis.from_url(os.environ['REDIS_URL'])
          job = Job.fetch(os.environ['JOB_ID'], connection=connection)
          deadline = time.monotonic() + 10200
          while time.monotonic() < deadline:
              value = getattr(job.get_status(refresh=True), 'value', str(job.get_status(refresh=True)))
              if value == 'finished':
                  result = job.result
                  if not isinstance(result, dict):
                      raise SystemExit('RunPod benchmark returned invalid result')
                  checks = {
                      'dataset_role': 'clean_cut_gold_raw',
                      'source_prefix': 'Editdna longform validation/',
                      'brain_backend': 'runpod_local',
                      'hybrid_provider': 'google',
                      'hybrid_primary_model': 'gemini-3.5-flash-lite',
                  }
                  for key, expected in checks.items():
                      if result.get(key) != expected:
                          raise SystemExit(f'Gold benchmark identity mismatch: {key}={result.get(key)!r}')
                  if result.get('external_brain_calls_enabled') is not True:
                      raise SystemExit('Hybrid judge was not active')
                  with open('runpod-benchmark-result.json', 'w', encoding='utf-8') as handle:
                      json.dump(result, handle, ensure_ascii=False, indent=2, sort_keys=True)
                  print(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True))
                  raise SystemExit(0)
              if value in {'failed','stopped','canceled'}:
                  print(job.exc_info or 'RunPod benchmark failed')
                  raise SystemExit(f'RunPod benchmark job {value}')
              time.sleep(15)
          raise SystemExit('Timed out waiting for RunPod benchmark')
          PY

      - name: Download and validate Gold artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cutsell-gold-previews
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlparse
          import boto3
          result = json.load(open('runpod-benchmark-result.json', encoding='utf-8'))
          s3 = boto3.client('s3', region_name=os.environ.get('AWS_REGION') or 'us-east-1')
          def parts(uri):
              parsed = urlparse(uri)
              if parsed.scheme != 's3' or not parsed.netloc or not parsed.path.lstrip('/'):
                  raise ValueError(f'invalid S3 artifact URI: {uri}')
              return parsed.netloc, parsed.path.lstrip('/')
          bucket, key = parts(result['report_uri'])
          s3.download_file(bucket, key, 'cutsell-gold-report.json')
          report = json.load(open('cutsell-gold-report.json', encoding='utf-8'))
          if report.get('dataset_role') != 'clean_cut_gold_raw' or report.get('source_prefix') != 'Editdna longform validation/':
              raise SystemExit('Downloaded report is not Clean Cut Gold RAW')
          for uri in result.get('preview_uris') or []:
              bucket, key = parts(uri)
              destination = Path('cutsell-gold-previews') / Path(key).name
              s3.download_file(bucket, key, str(destination))
          requested = int(report.get('total_hybrid_requested_groups') or 0)
          available = int(report.get('total_hybrid_available_groups') or 0)
          ratio = available / requested if requested else 0.0
          summary = {
              'source_count': report.get('source_count'),
              'completed_count': report.get('completed_count'),
              'execution_failure_count': report.get('execution_failure_count'),
              'provider_failure_count': report.get('provider_failure_count'),
              'hybrid_requested': requested,
              'hybrid_available': available,
              'hybrid_availability_ratio': round(ratio, 4),
              'selected_to_input_ratio': report.get('selected_to_input_ratio'),
              'total_clean_cut_removed': report.get('total_clean_cut_removed'),
              'total_temporal_trimmed': report.get('total_temporal_trimmed'),
              'total_hybrid_deleted': report.get('total_hybrid_deleted'),
          }
          print(json.dumps(summary, indent=2))
          if report.get('execution_failure_count') or report.get('provider_failure_count'):
              raise SystemExit('Gold benchmark reported failures')
          if requested <= 0 or ratio < 0.80:
              raise SystemExit('Hybrid availability below Gold floor')
          if len(list(Path('cutsell-gold-previews').glob('*.mp4'))) != int(report.get('completed_count') or 0):
              raise SystemExit('Preview count does not match completed Gold videos')
          PY

      - name: Upload Gold report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-gold-cycle-report-${{ github.sha }}
          path: cutsell-gold-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Gold previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-gold-cycle-previews-${{ github.sha }}
          path: cutsell-gold-previews/*.mp4
          if-no-files-found: warn
          retention-days: 14

      - name: Always terminate and verify exact staging worker absent
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${POD_ID:-}" ]; then
            echo 'No staging Pod was created by this job; cleanup is a no-op.'
            exit 0
          fi
          test -n "${RUNPOD_API_KEY:-}" || { echo 'RUNPOD_API_KEY missing during cleanup'; exit 3; }
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output cleanup-pods.json
          name=$(jq -r --arg id "$POD_ID" '[.[] | select(.id == $id)][0].name // empty' cleanup-pods.json)
          if [ -z "$name" ]; then
            echo "Staging Pod already absent: $POD_ID"
            exit 0
          fi
          test "$name" = "cutsell-staging-worker" || { echo 'Exact Pod ID is not cutsell-staging-worker; refusing cleanup'; exit 4; }
          code=$(curl --silent --show-error --write-out '%{http_code}' --request DELETE --url "https://rest.runpod.io/v1/pods/$POD_ID" --header "Authorization: Bearer $RUNPOD_API_KEY" --output cleanup-delete-response.txt)
          test "$code" = "204" || { echo "RunPod cleanup DELETE status: $code"; exit 5; }
          sleep 2
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output cleanup-after.json
          remaining=$(jq --arg id "$POD_ID" '[.[] | select(.id == $id)] | length' cleanup-after.json)
          test "$remaining" = "0" || { echo 'Staging Pod still present after cleanup'; exit 6; }
          echo "Staging Pod deleted and verified absent: $POD_ID"
