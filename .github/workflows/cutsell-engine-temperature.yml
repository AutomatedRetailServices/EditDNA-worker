name: CutSell engine temperature measure (experiment)

# Measures, without deploying anything, whether temperature 0 makes the simple engine's cut repeatable
# while keeping its Human Gold agreement. Temporary Modal run; stops by itself.

on:
  push:
    branches: [exp/engine-temperature]
    paths:
      - 'experiments/engine_temperature/**'
      - '.github/workflows/cutsell-engine-temperature.yml'

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install modal
      - name: Measure
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set +e
          modal run experiments/engine_temperature/measure.py 2>&1 | tee out.txt
          status=${PIPESTATUS[0]}
          line="$(grep -E '^RESUMEN' out.txt | tail -1 | cut -c1-3800)"
          if [ -z "$line" ]; then line="sin resumen: $(tail -n 15 out.txt | tr '\n' ' ' | cut -c1-3500)"; fi
          echo "::notice title=resumen::$line"
          exit $status
