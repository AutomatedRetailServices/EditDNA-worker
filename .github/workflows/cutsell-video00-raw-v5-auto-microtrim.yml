name: CutSell Video00 Raw V5 Auto Microtrim

# Universal raw Video00 benchmark. Keep Hybrid Brain active and test the exact branch head.
on:
  push:
    branches: [cutsell/mobile-v1-clean]
    paths:
      - .github/workflows/cutsell-video00-raw-v5-auto-microtrim.yml
      - cutsell_worker/brain_runtime.py
      - cutsell_worker/serverless_handler.py
      - cutsell_worker/speech_visual_microtrim.py
      - cutsell_worker/universal_clean_cut.py
      - cutsell_worker/universal_clean_cut_validation.py
      - cutsell_worker/final_boundary_authority.py
      - cutsell_worker/hybrid_session_cleanup.py
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/automatedretailservices/cutsell-serverless
  ENDPOINT_ID: xxu7autt8mv2rn
  SOURCE_KEY: Editdna longform validation/VIDEO-2026-07-30-09-18-03.mp4
  BENCHMARK_ID: video00-raw-v5-auto-${{ github.run_id }}

jobs:
  video00-raw:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Checkout exact test head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify raw-auto path
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'auto_speech_visual_microtrim' cutsell_worker/serverless_handler.py
          grep -q 'detect_speech_safe_visual_microtrims' cutsell_worker/serverless_handler.py
          grep -q 'run_single_universal_clean_cut_validation' cutsell_worker/serverless_handler.py
          grep -q 'refusing silent local fallback' cutsell_worker/brain_runtime.py
          grep -q 'preserve_polished_interior_gap' cutsell_worker/final_boundary_authority.py
          grep -q 'semantic_failed_plus_later_overlapping_complete_retake' cutsell_worker/hybrid_session_cleanup.py

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable raw V5 image
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE_REPO:video00-raw-v5-auto-$GITHUB_SHA"
          docker build -t "$image" -f Dockerfile.cutsell.serverless .
          docker push "$image"
          docker buildx imagetools inspect "$image" > /tmp/image.txt
          digest=$(awk '/^Digest:/ {print $2; exit}' /tmp/image.txt)
          test -n "$digest"
          echo "LOCKED_IMAGE=$IMAGE_REPO@$digest" >> "$GITHUB_ENV"

      - name: Load base RunPod template
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/templates" --header "Authorization: Bearer $RUNPOD_API_KEY" --output /tmp/templates.json
          jq -c '[.[] | select(.name == "EditDNA-Worker-2")][0]' /tmp/templates.json > /tmp/base-template.json
          test "$(cat /tmp/base-template.json)" != "null"

      - name: Create raw V5 auto template
        shell: bash
        run: |
          set -euo pipefail
          name="cutsell-video00-raw-v5-auto-$GITHUB_RUN_ID"
          jq --arg image "$LOCKED_IMAGE" --arg name "$name" '
            . as $base |
            {
              imageName:$image,
              name:$name,
              category:"NVIDIA",
              containerDiskInGb:40,
              isPublic:false,
              isServerless:true,
              env:(($base.env // {}) + {
                CUTSELL_BRAIN_BACKEND:"runpod_local",
                CUTSELL_EDITORIAL_MODE:"clean_cut",
                CUTSELL_ASR_MODEL:"medium",
                CUTSELL_HYBRID_LLM_ENABLED:"1",
                CUTSELL_HYBRID_PROVIDER:"google"
              }),
              ports:[], volumeInGb:0, volumeMountPath:"/workspace"
            }' /tmp/base-template.json > /tmp/template-create.json
          test -n "$(jq -r '.env.GEMINI_API_KEY // empty' /tmp/template-create.json)" || { echo 'GEMINI_API_KEY missing from RunPod template; refusing brain-off benchmark'; exit 1; }
          code=$(curl --silent --show-error --write-out '%{http_code}' --request POST --url 'https://rest.runpod.io/v1/templates' --header "Authorization: Bearer $RUNPOD_API_KEY" --header 'Content-Type: application/json' --data @/tmp/template-create.json --output /tmp/template.json)
          test "$code" = "200" || test "$code" = "201"
          TEMPLATE_ID=$(jq -r '.id // empty' /tmp/template.json)
          test -n "$TEMPLATE_ID"
          echo "TEMPLATE_ID=$TEMPLATE_ID" >> "$GITHUB_ENV"

      - name: Roll endpoint to raw V5 auto
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg template "$TEMPLATE_ID" '{templateId:$template,workersMin:0,workersMax:1,scalerType:"QUEUE_DELAY",scalerValue:2,idleTimeout:5,executionTimeoutMs:1800000}' > /tmp/endpoint-patch.json
          code=$(curl --silent --show-error --write-out '%{http_code}' --request PATCH --url "https://rest.runpod.io/v1/endpoints/$ENDPOINT_ID" --header "Authorization: Bearer $RUNPOD_API_KEY" --header 'Content-Type: application/json' --data @/tmp/endpoint-patch.json --output /tmp/endpoint.json)
          test "$code" = "200"

      - name: CUDA health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --request POST --url "https://api.runpod.ai/v2/$ENDPOINT_ID/run" --header "Authorization: Bearer $RUNPOD_API_KEY" --header 'Content-Type: application/json' --data '{"input":{"op":"health"}}' --output /tmp/submit-health.json
          id=$(jq -r '.id // empty' /tmp/submit-health.json); test -n "$id"
          deadline=$((SECONDS+900))
          while [ "$SECONDS" -lt "$deadline" ]; do
            curl --fail --silent --show-error --url "https://api.runpod.ai/v2/$ENDPOINT_ID/status/$id" --header "Authorization: Bearer $RUNPOD_API_KEY" --output /tmp/health.json
            status=$(jq -r '.status // empty' /tmp/health.json)
            case "$status" in
              COMPLETED) jq -e '.output.ok == true and .output.cuda_available == true' /tmp/health.json >/dev/null; exit 0 ;;
              FAILED|TIMED_OUT|CANCELLED) cat /tmp/health.json; exit 1 ;;
            esac
            sleep 5
          done
          exit 1

      - name: Submit original six-minute Video00
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg source "$SOURCE_KEY" --arg benchmark "$BENCHMARK_ID" '{input:{op:"focused",source_key:$source,benchmark_id:$benchmark,auto_speech_visual_microtrim:true}}' > /tmp/payload.json
          curl --fail --silent --show-error --request POST --url "https://api.runpod.ai/v2/$ENDPOINT_ID/run" --header "Authorization: Bearer $RUNPOD_API_KEY" --header 'Content-Type: application/json' --data @/tmp/payload.json --output /tmp/submit.json
          JOB_ID=$(jq -r '.id // empty' /tmp/submit.json); test -n "$JOB_ID"
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"

      - name: Wait for raw V5 auto result
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS+2700))
          while [ "$SECONDS" -lt "$deadline" ]; do
            curl --fail --silent --show-error --url "https://api.runpod.ai/v2/$ENDPOINT_ID/status/$JOB_ID" --header "Authorization: Bearer $RUNPOD_API_KEY" --output /tmp/status.json
            status=$(jq -r '.status // empty' /tmp/status.json)
            echo "raw_video00_status=$status"
            case "$status" in
              COMPLETED)
                jq -e '.output.ok == true and .output.speech_lock_ok == true and .output.external_brain_calls_enabled == true' /tmp/status.json >/dev/null
                PREVIEW_URI=$(jq -r '.output.preview_uri // empty' /tmp/status.json)
                RESULT_URI=$(jq -r '.output.result_uri // empty' /tmp/status.json)
                test -n "$PREVIEW_URI" && test -n "$RESULT_URI"
                echo "PREVIEW_URI=$PREVIEW_URI" >> "$GITHUB_ENV"
                echo "RESULT_URI=$RESULT_URI" >> "$GITHUB_ENV"
                exit 0 ;;
              FAILED|TIMED_OUT|CANCELLED) cat /tmp/status.json; exit 1 ;;
            esac
            sleep 10
          done
          exit 1

      - name: Download raw test artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          BASE_TEMPLATE=$(cat /tmp/base-template.json)
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_BUCKET; do
            value=$(printf '%s' "$BASE_TEMPLATE" | jq -r --arg key "$key" '.env[$key] // empty')
            test -n "$value"
            echo "::add-mask::$value"
            export "$key=$value"
          done
          aws s3 cp "$PREVIEW_URI" artifact/video00-raw-v5-auto-microtrim.mp4
          aws s3 cp "$RESULT_URI" artifact/video00-raw-v5-auto-microtrim.json
          test -s artifact/video00-raw-v5-auto-microtrim.mp4
          test -s artifact/video00-raw-v5-auto-microtrim.json

      - name: Verify original raw and final rule
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.source_duration_sec > 350 and .auto_speech_visual_microtrim_enabled == true and .speech_lock_ok == true and .external_brain_calls_enabled == true and .selected_count > 0 and .hybrid_requested_group_count > 0' artifact/video00-raw-v5-auto-microtrim.json >/dev/null
          jq '{source_duration_sec,selected_count,selected_duration_sec,output_duration_sec,external_brain_calls_enabled,hybrid_provider,hybrid_primary_model,hybrid_requested_group_count,hybrid_available_group_count,hybrid_deleted_count,auto_microtrim_count,auto_microtrim_duration_sec,speech_lock_ok}' artifact/video00-raw-v5-auto-microtrim.json

      - name: Upload raw V5 auto human review artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-video00-raw-v5-auto-microtrim-human-review
          path: artifact/
          retention-days: 14
