name: CutSell Video00 Raw V5 Auto Microtrim

# Universal raw Video00 benchmark. Keep Hybrid Brain active and test the exact branch head.
# Trigger marker: critical-fact Best Take integrity validated by CI; run exact-head Video00.
on:
  push:
    branches: [cutsell/mobile-v1-clean]
    paths:
      - .github/workflows/cutsell-video00-raw-v5-auto-microtrim.yml
      - cutsell_worker/__init__.py
      - cutsell_worker/brain_runtime.py
      - cutsell_worker/serverless_handler.py
      - cutsell_worker/speech_visual_microtrim.py
      - cutsell_worker/editorial_guardrails_v2.py
      - cutsell_worker/universal_clean_cut.py
      - cutsell_worker/universal_clean_cut_validation.py
      - cutsell_worker/final_boundary_authority.py
      - cutsell_worker/hybrid_session_cleanup.py
      - cutsell_worker/hybrid_retry_completion_integrity.py
      - cutsell_worker/session_boundaries.py
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/automatedretailservices/cutsell-serverless
  ENDPOINT_ID: xxu7autt8mv2rn
  SOURCE_KEY: Editdna longform validation/VIDEO-2026-07-30-09-18-03.mp4
  BENCHMARK_ID: video00-raw-v5-auto-${{ github.run_id }}

jobs:
  video00-raw:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Checkout exact test head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify raw-auto path
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'auto_speech_visual_microtrim' cutsell_worker/serverless_handler.py
          grep -q 'detect_speech_safe_visual_microtrims' cutsell_worker/serverless_handler.py
          grep -q 'run_single_universal_clean_cut_validation' cutsell_worker/serverless_handler.py
          grep -q 'refusing silent local fallback' cutsell_worker/brain_runtime.py
          grep -q 'preserve_polished_interior_gap' cutsell_worker/final_boundary_authority.py
          grep -q 'semantic_failed_plus_later_overlapping_complete_retake' cutsell_worker/hybrid_session_cleanup.py
          grep -q '_repair_session_group_coverage' cutsell_worker/session_boundaries.py
          grep -q 'install_editorial_guardrails_v2' cutsell_worker/__init__.py
          grep -q 'v2_long_visual_slack' cutsell_worker/editorial_guardrails_v2.py
          grep -q 'complete_idea' cutsell_worker/editorial_guardrails_v2.py

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable raw V5 image
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE_REPO:video00-raw-v5-auto-$GITHUB_SHA"
          docker build -t "$image" -f Dockerfile.cutsell.serverless .
          docker push "$image"
          docker buildx imagetools inspect "$image" > /tmp/image.txt
          digest=$(awk '/^Digest:/ {print $2; exit}' /tmp/image.txt)
          test -n "$digest"
          echo "LOCKED_IMAGE=$IMAGE_REPO@$digest" >> "$GITHUB_ENV"

      - name: Load base RunPod template
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            "https://rest.runpod.io/v1/templates/8vex7s94zn" > /tmp/base-template.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/base-template.json'))
          assert p.get('id')
          print(p.get('id'))
          PY

      - name: Create raw V5 auto template
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          base=json.load(open('/tmp/base-template.json'))
          body={
            'name': 'cutsell-video00-raw-v5-auto-'+os.environ['GITHUB_RUN_ID'],
            'imageName': os.environ['LOCKED_IMAGE'],
            'dockerArgs': base.get('dockerArgs',''),
            'containerDiskInGb': base.get('containerDiskInGb',20),
            'volumeInGb': base.get('volumeInGb',0),
            'volumeMountPath': base.get('volumeMountPath','/workspace'),
            'env': base.get('env',{}),
            'ports': base.get('ports',[]),
          }
          json.dump(body, open('/tmp/new-template.json','w'))
          PY
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -H 'Content-Type: application/json' \
            --data @/tmp/new-template.json \
            https://rest.runpod.io/v1/templates > /tmp/new-template-response.json
          template_id=$(python - <<'PY'
          import json
          p=json.load(open('/tmp/new-template-response.json'))
          print(p['id'])
          PY
          )
          echo "RAW_TEMPLATE_ID=$template_id" >> "$GITHUB_ENV"

      - name: Roll endpoint to raw V5 auto
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "{\"templateId\":\"$RAW_TEMPLATE_ID\"}" \
            "https://rest.runpod.io/v1/endpoints/$ENDPOINT_ID" > /tmp/endpoint.json

      - name: CUDA health
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"input":{"action":"health"}}' \
            "https://api.runpod.ai/v2/$ENDPOINT_ID/runsync")
          echo "$response" > /tmp/health.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/health.json'))
          out=p.get('output') or {}
          assert out.get('cuda_available') is True, out
          PY

      - name: Submit original six-minute Video00
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/request.json <<EOF
          {"input":{"action":"run_validation","benchmark_id":"$BENCHMARK_ID","source_key":"$SOURCE_KEY","auto_speech_visual_microtrim":true}}
          EOF
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -H 'Content-Type: application/json' \
            --data @/tmp/request.json \
            "https://api.runpod.ai/v2/$ENDPOINT_ID/run")
          echo "$response" > /tmp/submission.json
          job_id=$(python - <<'PY'
          import json
          p=json.load(open('/tmp/submission.json'))
          print(p['id'])
          PY
          )
          echo "RUNPOD_JOB_ID=$job_id" >> "$GITHUB_ENV"

      - name: Wait for raw V5 auto result
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            response=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $RUNPOD_API_KEY" \
              "https://api.runpod.ai/v2/$ENDPOINT_ID/status/$RUNPOD_JOB_ID")
            echo "$response" > /tmp/status.json
            status=$(python - <<'PY'
          import json
          p=json.load(open('/tmp/status.json'))
          print(p.get('status',''))
          PY
          )
            if [ "$status" = "COMPLETED" ]; then
              cp /tmp/status.json /tmp/result.json
              exit 0
            fi
            if [ "$status" = "FAILED" ]; then
              cat /tmp/status.json
              exit 1
            fi
            sleep 10
          done
          echo 'Timed out waiting for RunPod job'
          exit 1

      - name: Download raw test artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          p=json.load(open('/tmp/result.json'))
          out=p.get('output') or {}
          for key,target in [('artifact_json_url','/tmp/video00-raw-v5-auto-microtrim.json'),('artifact_video_url','/tmp/video00-raw-v5-auto-microtrim.mp4')]:
              url=out.get(key)
              if not url:
                  raise SystemExit(f'missing {key}: {out}')
              urllib.request.urlretrieve(url,target)
          PY

      - name: Verify original raw and final rule
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('/tmp/video00-raw-v5-auto-microtrim.json'))
          source=float(p.get('source_duration_sec',0))
          output=float(p.get('output_duration_sec',0))
          assert source > 360, source
          assert output > 0, output
          assert p.get('speech_lock_ok') is True, p.get('speech_lock_ok')
          PY

      - name: Upload raw V5 auto human review artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-video00-raw-v5-auto-microtrim-human-review
          path: |
            /tmp/video00-raw-v5-auto-microtrim.json
            /tmp/video00-raw-v5-auto-microtrim.mp4
          if-no-files-found: error
          retention-days: 14
