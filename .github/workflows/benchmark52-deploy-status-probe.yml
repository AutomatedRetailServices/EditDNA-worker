name: Focused Deploy Status Probe
on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/benchmark52-deploy-status-probe.yml
permissions:
  contents: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Capture focused deploy and benchmark status via API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          branch="cutsell/mobile-v1-clean"
          curl --fail --silent --show-error --url "https://api.github.com/repos/$repo/actions/workflows/benchmark52-controlled-deploy-dispatch.yml/runs?event=push&branch=cutsell%2Fmobile-v1-clean&per_page=10" --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --output deploy-runs.json
          curl --fail --silent --show-error --url "https://api.github.com/repos/$repo/actions/workflows/cutsell-focused-clean-cut-benchmark.yml/runs?event=workflow_dispatch&branch=cutsell%2Fmobile-v1-clean&per_page=10" --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --output benchmark-runs.json
          jq -n --slurpfile d deploy-runs.json --slurpfile b benchmark-runs.json '{deploy: (($d[0].workflow_runs[0] // {}) | {id,run_number,status,conclusion,head_sha,created_at,updated_at}), benchmark: (($b[0].workflow_runs[0] // {}) | {id,run_number,status,conclusion,head_sha,created_at,updated_at})}' > status.json
          current=$(curl --fail --silent --show-error --url "https://api.github.com/repos/$repo/contents/ops/benchmark52-deploy-status.json?ref=cutsell%2Fmobile-v1-clean" --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json")
          sha=$(printf '%s' "$current" | jq -r '.sha')
          encoded=$(base64 -w0 status.json)
          jq -n --arg message "Record focused deploy status" --arg content "$encoded" --arg sha "$sha" --arg branch "$branch" '{message:$message,content:$content,sha:$sha,branch:$branch}' > update.json
          curl --fail --silent --show-error --request PUT --url "https://api.github.com/repos/$repo/contents/ops/benchmark52-deploy-status.json" --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "Content-Type: application/json" --data @update.json >/dev/null
          cat status.json
