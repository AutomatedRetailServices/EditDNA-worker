name: CutSell RunPod Resource Audit

on:
  push:
    branches: [cutsell/mobile-v1-clean]
    paths:
      - .github/workflows/cutsell-runpod-resource-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-runpod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Query RunPod resources read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit

          fetch_json() {
            local url="$1"
            local out="$2"
            local code
            code=$(curl --silent --show-error --write-out '%{http_code}' \
              --url "$url" \
              --header "Authorization: Bearer $RUNPOD_API_KEY" \
              --output "$out" || true)
            echo "$code" > "${out}.status"
          }

          fetch_json 'https://rest.runpod.io/v1/endpoints' audit/endpoints.json
          fetch_json 'https://rest.runpod.io/v1/templates' audit/templates.json
          fetch_json 'https://rest.runpod.io/v1/pods' audit/pods.json

          python - <<'PY'
          import json
          from pathlib import Path

          def load(name):
              path = Path('audit') / f'{name}.json'
              status_path = Path(str(path) + '.status')
              status = status_path.read_text().strip() if status_path.exists() else 'unknown'
              try:
                  data = json.loads(path.read_text()) if path.exists() and path.stat().st_size else None
              except Exception:
                  data = None
              return status, data

          report = {'schema_version':'cutsell.runpod_resource_audit.v1'}

          status, endpoints = load('endpoints')
          report['endpoints_http_status'] = status
          endpoint_rows = []
          if isinstance(endpoints, list):
              for e in endpoints:
                  if not isinstance(e, dict):
                      continue
                  endpoint_rows.append({
                      'id': e.get('id'),
                      'name': e.get('name'),
                      'templateId': e.get('templateId'),
                      'workersMin': e.get('workersMin'),
                      'workersMax': e.get('workersMax'),
                      'idleTimeout': e.get('idleTimeout'),
                      'executionTimeoutMs': e.get('executionTimeoutMs'),
                      'scalerType': e.get('scalerType'),
                      'scalerValue': e.get('scalerValue'),
                  })
          report['endpoints'] = endpoint_rows
          report['endpoint_count'] = len(endpoint_rows)
          report['endpoints_with_min_workers'] = [r for r in endpoint_rows if (r.get('workersMin') or 0) > 0]
          report['endpoints_with_max_workers'] = [r for r in endpoint_rows if (r.get('workersMax') or 0) > 0]

          status, templates = load('templates')
          report['templates_http_status'] = status
          template_rows = []
          if isinstance(templates, list):
              for t in templates:
                  if not isinstance(t, dict):
                      continue
                  name = str(t.get('name') or '')
                  if name.startswith('cutsell-video00-') or name == 'EditDNA-Worker-2' or 'cutsell' in name.lower():
                      template_rows.append({'id':t.get('id'),'name':name,'imageName':t.get('imageName')})
          report['cutsell_templates'] = template_rows
          report['cutsell_template_count'] = len(template_rows)
          report['temporary_video00_templates'] = [r for r in template_rows if str(r.get('name') or '').startswith('cutsell-video00-')]

          status, pods = load('pods')
          report['pods_http_status'] = status
          pod_rows = []
          raw_pods = pods
          if isinstance(pods, dict):
              raw_pods = pods.get('pods') or pods.get('items') or pods.get('data') or []
          if isinstance(raw_pods, list):
              for p in raw_pods:
                  if not isinstance(p, dict):
                      continue
                  pod_rows.append({
                      'id': p.get('id'),
                      'name': p.get('name'),
                      'desiredStatus': p.get('desiredStatus'),
                      'runtime': p.get('runtime'),
                      'gpuCount': p.get('gpuCount'),
                      'machineId': p.get('machineId'),
                  })
          report['pods'] = pod_rows
          report['pod_count'] = len(pod_rows)
          report['possibly_active_pods'] = [r for r in pod_rows if str(r.get('desiredStatus') or '').upper() not in {'EXITED','TERMINATED','STOPPED'}]

          Path('audit/runpod-resource-audit.json').write_text(json.dumps(report, indent=2, ensure_ascii=False))
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY

      - name: Upload RunPod audit
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-runpod-resource-audit
          path: audit/runpod-resource-audit.json
          retention-days: 7
