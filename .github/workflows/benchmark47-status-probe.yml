name: Benchmark 47 Status Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/benchmark47-status-probe.yml

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Show Benchmark 47 build runs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --url "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/benchmark47-controlled-build.yml/runs?branch=cutsell%2Fmobile-v1-clean&per_page=5" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            | jq -c '.workflow_runs[] | {id,run_number,status,conclusion,head_sha,created_at,updated_at}'
      - name: Show current staging workers safely
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RUNPOD_API_KEY:-}" ] || exit 0
          curl --fail --silent --show-error \
            --url "https://rest.runpod.io/v1/pods" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            | jq -c '.[] | select(.name == "cutsell-staging-worker") | {id,name,desiredStatus,imageName}'
