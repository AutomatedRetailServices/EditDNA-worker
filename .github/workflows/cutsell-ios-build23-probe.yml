name: CutSell iOS build 23 probe

# Build 23: time from Create to the cut open in the editor, 1-min and 3-min 1080p videos, outgoing HTTPS
# limited to ~1 MB/s (dummynet), "before" (audio first off = build 22 flow) and "after" (audio first).
# Synthetic videos made here, never committed. Only PNG frames and text logs go to design-screenshots
# (b23/). Manual: push to probe/build23.

on:
  workflow_dispatch: {}
  push:
    branches: [probe/build23]

concurrency:
  group: cutsell-ios-build23-probe
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$latest"

      - name: Add the UI test target (probe only) and build for testing
        working-directory: mobile/ios
        run: |
          brew install xcodegen ffmpeg >/dev/null
          cat >> project.yml <<'YML'
            CutSellUITests:
              type: bundle.ui-testing
              platform: iOS
              sources:
                - CutSellUITests
              dependencies:
                - target: CutSell
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: ai.cutsell.app.uitests
                  GENERATE_INFOPLIST_FILE: YES
                  TEST_TARGET_NAME: CutSell
          schemes:
            CutSellUITests:
              build:
                targets:
                  CutSell: all
                  CutSellUITests: [test]
              test:
                config: Debug
                targets:
                  - CutSellUITests
          YML
          xcodegen generate
          udid="$(xcrun simctl list devices available --json | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=sorted((r,x["name"],x["udid"]) for r,v in d.items() if "iOS" in r for x in v if x["name"].startswith("iPhone"))
          print(c[-1][2])')"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          set +e
          xcodebuild build-for-testing -project CutSell.xcodeproj -scheme CutSellUITests -sdk iphonesimulator \
            -destination "id=$udid" -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule > "$RUNNER_TEMP/build.log" 2>&1
          status=$?
          grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -8 | while IFS= read -r l; do echo "::error title=build::$(echo "$l" | sed 's#.*/mobile/ios/##' | cut -c1-300)"; done
          exit $status

      - name: Make the test videos (1080p H.264, 1 min and 3 min)
        run: |
          cd "$RUNNER_TEMP"
          text="Hi everyone. Today I want to show you my favorite water bottle. It keeps drinks cold for twenty four hours. And right now it is on sale in my shop. Grab yours today."
          say -v Samantha -o s.aiff "$text $text $text $text $text $text $text $text $text $text $text $text $text $text $text"
          ffmpeg -loglevel error -y -i s.aiff -ar 48000 -ac 1 speech.wav
          for d in 60 180; do
            if [ "$d" = 60 ]; then ct="2026-10-18T10:00:00Z"; else ct="2026-10-18T11:00:00Z"; fi
            ffmpeg -loglevel error -y -f lavfi -i "testsrc2=s=1080x1920:r=30:d=$d" -i speech.wav \
              -vf "noise=alls=20:allf=t" -af "apad" -map 0:v -map 1:a -t $d -metadata creation_time=$ct \
              -c:v libx264 -preset ultrafast -b:v 10M -maxrate 10M -bufsize 20M -pix_fmt yuv420p -c:a aac -b:a 128k v$d.mp4
            echo "::notice title=video::v$d.mp4 $(du -m v$d.mp4 | cut -f1) MB"
          done

      - name: Session for the probe user
        run: |
          python3 - <<'PYX'
          import json, os, urllib.request
          r = urllib.request.Request("https://cutsell-api.onrender.com/v1/auth/session", method="POST", data=None,
                                     headers={"content-type": "application/json"})
          s = json.load(urllib.request.urlopen(r, timeout=120))
          print("::add-mask::" + s["access_token"])
          with open(os.environ["GITHUB_ENV"], "a") as f: f.write(f"PROBE_TOKEN={s['access_token']}\nPROBE_USER={s['user_id']}\n")
          PYX

      - name: Time to editor, before and after, at ~1 MB/s (XCUITest)
        working-directory: mobile/ios
        run: |
          mkdir -p "$RUNNER_TEMP/b23"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl ui "$SIM_UDID" appearance dark || true
          xcrun simctl privacy "$SIM_UDID" grant photos ai.cutsell.app || true
          sudo dnctl pipe 1 config bw 8Mbit/s
          echo "dummynet out proto tcp from any to any port 443 pipe 1" | sudo pfctl -f - 2>&1 | tail -2 || true
          sudo pfctl -E 2>&1 | tail -1 || true
          status=0
          for run in "1min before 60 0" "1min after 60 150" "3min before 180 0" "3min after 180 300"; do
            set -- $run
            if [ "$2" = before ]; then xcrun simctl addmedia "$SIM_UDID" "$RUNNER_TEMP/v$3.mp4"; sleep 3; fi
            start=$(date -u +%Y-%m-%dT%H:%M:%S)
            set +e
            TEST_RUNNER_CUTSELL_PROBE_TOKEN="$PROBE_TOKEN" TEST_RUNNER_CUTSELL_PROBE_USER="$PROBE_USER" \
            TEST_RUNNER_CUTSELL_PROBE_API="https://cutsell-api.onrender.com" TEST_RUNNER_B23_OUT="$RUNNER_TEMP/b23" \
            TEST_RUNNER_B23_MODE="$2" TEST_RUNNER_B23_LABEL="$1" TEST_RUNNER_B23_WAIT="$4" \
              xcodebuild test-without-building -project CutSell.xcodeproj -scheme CutSellUITests -sdk iphonesimulator \
                -destination "id=$SIM_UDID" -derivedDataPath build -only-testing:CutSellUITests/Build23UITests \
                CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/test_$1_$2.log" 2>&1
            [ $? -ne 0 ] && status=1
            set -e
            xcrun simctl spawn "$SIM_UDID" log show --start "$start" --style compact \
              --predicate 'subsystem == "ai.cutsell.app"' 2>/dev/null | grep -oE '(prepare_|project_created|upload_|job_|processing_|asset_|audio_|stage_timing|server_step|editor_opened|video_|icloud_|clip_|combine_|server_capab).*' \
              | cut -c1-300 > "$RUNNER_TEMP/b23/app_events_$1_$2.txt" || true
          done
          sudo pfctl -f /etc/pf.conf 2>/dev/null; sudo dnctl -q flush 2>/dev/null || true
          while IFS= read -r line; do echo "::notice title=b23::$line"; done < <(sed 's/^B23UI *//' "$RUNNER_TEMP/b23/b23_ui_log.txt" 2>/dev/null | grep -E "TIMING|PASS|FAIL|background video|keeping" | cut -c1-900)
          for f in "$RUNNER_TEMP"/b23/app_events_*.txt; do
            echo "::notice title=$(basename $f .txt)::$(grep -E 'audio_extracted|audio_uploaded|stage_timing|server_step|editor_opened|video_background_done|video_background_failed|upload_complete_done|upload_parts' "$f" | tr '\n' ';' | cut -c1-1500)"
          done
          echo "TEST_STATUS=$status" >> "$GITHUB_ENV"

      - name: Frames and logs to design-screenshots (b23/), never a video
        if: always()
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/out"
          git clone --quiet --branch design-screenshots "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$dir"
          cd "$dir"
          rm -rf b23 && mkdir -p b23
          cp "$RUNNER_TEMP"/b23/*.png b23/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/b23/*.txt b23/ 2>/dev/null || true
          find b23 -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.m4a' -o -iname '*.caf' -o -iname '*.wav' -o -iname '*.aiff' \) -delete
          sed -i '' -E 's/(Bearer|token)[^ ]*/\1 <hidden>/g' b23/*.txt 2>/dev/null || true
          echo "source commit: ${{ github.sha }} test status: ${TEST_STATUS:-?}" > b23/SOURCE.txt
          git add -A b23
          git -c user.name="cutsell-ci" -c user.email="ci@cutsell.invalid" commit --quiet -m "build 22 probe for ${{ github.sha }}" || true
          git push --quiet origin design-screenshots
