name: CutSell Focused Clean Cut Benchmark

on:
  workflow_dispatch:
    inputs:
      approval_token:
        description: 'Internal focused benchmark guard token'
        required: true
        type: string
      pod_id:
        description: 'Exact cutsell-staging-worker Pod ID to clean up after this benchmark'
        required: true
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REDIS_URL: ${{ secrets.REDIS_URL }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      CUTSELL_VALIDATION_PREFIX: Editdna longform validation/
      STAGING_POD_ID: ${{ inputs.pod_id }}
      BENCHMARK_ID: focused-${{ github.run_id }}-${{ github.sha }}
      SOURCE_00: Editdna longform validation/VIDEO-2026-07-30-09-18-03.mp4
      SOURCE_02: Editdna longform validation/VIDEO-2026-07-30-09-24-13.mp4
      SOURCE_03: Editdna longform validation/VIDEO-2026-07-30-10-22-46.mp4
    steps:
      - name: Require focused benchmark guard token
        shell: bash
        env:
          APPROVAL_TOKEN: ${{ inputs.approval_token }}
        run: |
          set -euo pipefail
          test "$APPROVAL_TOKEN" = "FOCUSED3" || { echo 'Focused benchmark guard token rejected'; exit 2; }
          test -n "$STAGING_POD_ID" || { echo 'Exact staging Pod ID required'; exit 2; }

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install orchestration client only
        run: pip install 'redis>=5.0' 'rq>=2.6' 'boto3>=1.34'

      - name: Load missing S3 credentials from RunPod template vault
        shell: bash
        run: |
          set -euo pipefail
          test -n "${REDIS_URL:-}" || { echo 'REDIS_URL missing'; exit 3; }
          missing=0
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_BUCKET; do
            [ -n "${!key:-}" ] || missing=1
          done
          [ "$missing" = "1" ] || exit 0
          test -n "${RUNPOD_API_KEY:-}" || { echo 'S3 runtime credentials unavailable'; exit 3; }
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/templates" --header "Authorization: Bearer $RUNPOD_API_KEY" --output templates.json
          TEMPLATE=$(jq -c '[.[] | select(.name == "EditDNA-Worker-2")][0]' templates.json)
          test "$TEMPLATE" != "null" || { echo 'EditDNA-Worker-2 template not found'; exit 4; }
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_BUCKET; do
            if [ -z "${!key:-}" ]; then
              value=$(printf '%s' "$TEMPLATE" | jq -r --arg key "$key" '.env[$key] // empty')
              test -n "$value" || { echo "$key missing"; exit 5; }
              echo "::add-mask::$value"
              printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
            fi
          done

      - name: Enqueue focused Hybrid benchmark on approved RunPod GPU worker
        id: enqueue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from redis import Redis
          from rq import Queue, Worker
          connection = Redis.from_url(os.environ['REDIS_URL'])
          workers = Worker.all(connection=connection)
          if not workers:
              raise SystemExit('No RQ worker is registered on Redis; refusing to enqueue focused benchmark')
          payload = {
              'benchmark_id': os.environ['BENCHMARK_ID'],
              'source_prefix': os.environ['CUTSELL_VALIDATION_PREFIX'],
              'source_keys': [os.environ['SOURCE_00'], os.environ['SOURCE_02'], os.environ['SOURCE_03']],
              'expected_external_brain_calls_enabled': True,
          }
          queue = Queue('cutsell', connection=connection)
          job = queue.enqueue(
              'cutsell_worker.focused_validation_job.run_focused_clean_cut_benchmark',
              payload,
              job_timeout=5400,
              result_ttl=86400,
              failure_ttl=86400,
              meta={
                  'benchmark_id': payload['benchmark_id'],
                  'dataset_role': 'clean_cut_gold_raw_focused',
                  'source_prefix': payload['source_prefix'],
                  'source_keys': payload['source_keys'],
                  'brain_backend': 'runpod_local',
                  'external_brain_calls_enabled': True,
                  'hybrid_provider': 'google',
                  'hybrid_primary_model': 'gemini-3.5-flash-lite',
              },
          )
          print(json.dumps({'job_id': job.id, 'queue': queue.name, **payload}, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'job_id={job.id}\n')
          PY

      - name: Wait for focused RunPod Hybrid benchmark
        env:
          JOB_ID: ${{ steps.enqueue.outputs.job_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from redis import Redis
          from rq.job import Job
          connection = Redis.from_url(os.environ['REDIS_URL'])
          job = Job.fetch(os.environ['JOB_ID'], connection=connection)
          deadline = time.monotonic() + 5100
          while time.monotonic() < deadline:
              status = job.get_status(refresh=True)
              value = getattr(status, 'value', str(status))
              meta = dict(job.meta or {})
              print(json.dumps({'status': value, 'stage': meta.get('stage'), 'progress_percent': meta.get('progress_percent'), 'current_source': meta.get('current_source')}, ensure_ascii=False))
              if value == 'finished':
                  result = job.result
                  if not isinstance(result, dict): raise SystemExit('Focused benchmark returned invalid result')
                  if result.get('dataset_role') != 'clean_cut_gold_raw_focused': raise SystemExit('Wrong dataset role')
                  expected=[os.environ['SOURCE_00'], os.environ['SOURCE_02'], os.environ['SOURCE_03']]
                  if result.get('source_keys') != expected: raise SystemExit('Focused benchmark used unexpected source keys')
                  if result.get('brain_backend') != 'runpod_local': raise SystemExit('Focused benchmark escaped local perception brain')
                  if result.get('external_brain_calls_enabled') is not True: raise SystemExit('Hybrid semantics not active')
                  if result.get('hybrid_provider') != 'google' or result.get('hybrid_primary_model') != 'gemini-3.5-flash-lite': raise SystemExit('Unexpected Hybrid provider/model')
                  with open('runpod-focused-result.json','w',encoding='utf-8') as handle: json.dump(result,handle,ensure_ascii=False,indent=2,sort_keys=True)
                  break
              if value in {'failed','stopped','canceled'}:
                  print(job.exc_info or 'Focused benchmark failed')
                  raise SystemExit(f'Focused benchmark job {value}')
              time.sleep(15)
          else:
              raise SystemExit('Timed out waiting for focused benchmark')
          PY

      - name: Download focused benchmark artifacts from S3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cutsell-focused-previews
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlparse
          import boto3
          result=json.load(open('runpod-focused-result.json',encoding='utf-8'))
          s3=boto3.client('s3',region_name=os.environ.get('AWS_REGION') or 'us-east-1')
          def parts(uri):
              p=urlparse(uri)
              if p.scheme!='s3' or not p.netloc or not p.path.lstrip('/'): raise ValueError(f'invalid S3 URI: {uri}')
              return p.netloc,p.path.lstrip('/')
          bucket,key=parts(result['report_uri'])
          s3.download_file(bucket,key,'cutsell-focused-clean-cut-benchmark.json')
          report=json.load(open('cutsell-focused-clean-cut-benchmark.json',encoding='utf-8'))
          expected=[os.environ['SOURCE_00'], os.environ['SOURCE_02'], os.environ['SOURCE_03']]
          if report.get('source_keys') != expected: raise SystemExit('report source keys mismatch')
          for uri in result.get('preview_uris') or []:
              bucket,key=parts(uri)
              s3.download_file(bucket,key,str(Path('cutsell-focused-previews')/Path(key).name))
          if report.get('execution_failure_count') or report.get('provider_failure_count'): raise SystemExit('Focused benchmark reported failures')
          PY

      - name: Upload focused JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-focused-clean-cut-report-${{ github.sha }}
          path: cutsell-focused-clean-cut-benchmark.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload focused preview videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-focused-clean-cut-previews-${{ github.sha }}
          path: cutsell-focused-previews/*.mp4
          if-no-files-found: warn
          retention-days: 14

      - name: Always terminate exact staging GPU worker
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}" || { echo 'RUNPOD_API_KEY missing during cleanup'; exit 3; }
          test -n "${STAGING_POD_ID:-}" || { echo 'STAGING_POD_ID missing during cleanup'; exit 3; }
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output cleanup-pods.json
          name=$(jq -r --arg id "$STAGING_POD_ID" '[.[] | select(.id == $id)][0].name // empty' cleanup-pods.json)
          if [ -z "$name" ]; then echo "RunPod staging Pod already absent: $STAGING_POD_ID"; exit 0; fi
          test "$name" = "cutsell-staging-worker" || { echo 'Exact Pod ID mismatch; refusing cleanup'; exit 4; }
          code=$(curl --silent --show-error --write-out '%{http_code}' --request DELETE --url "https://rest.runpod.io/v1/pods/$STAGING_POD_ID" --header "Authorization: Bearer $RUNPOD_API_KEY" --output cleanup-delete-response.txt)
          echo "RunPod cleanup DELETE status: $code"
          test "$code" = "204"
          sleep 2
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output cleanup-after.json
          remaining=$(jq --arg id "$STAGING_POD_ID" '[.[] | select(.id == $id)] | length' cleanup-after.json)
          test "$remaining" = "0" || { echo 'Staging Pod still present after cleanup'; exit 5; }
          echo "RunPod staging Pod deleted and verified absent: $STAGING_POD_ID"
