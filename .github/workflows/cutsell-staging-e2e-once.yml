name: CutSell Staging E2E Once

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - ".cutsell/staging-e2e-once.txt"

permissions:
  contents: read

jobs:
  staging-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      API_BASE: https://cutsell-api.onrender.com
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      RUNPOD_TEMPLATE_NAME: EditDNA-Worker-2
      SOURCE_KEY: Editdna bloopers videos/Bloppers15.mp4
      IMAGE: ghcr.io/automatedretailservices/cutsell-worker:f1bc3adc4f2f8df0ae005fa551116dc4d08b30e6
    steps:
      - uses: actions/checkout@v4
      - name: Require one-shot E2E marker
        run: |
          set -euo pipefail
          grep -qx 'run=staging-e2e' .cutsell/staging-e2e-once.txt
          test -n "${RUNPOD_API_KEY:-}"
          test -n "${REDIS_URL:-}"

      - name: Install E2E tools and load runtime credentials
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y ffmpeg >/dev/null
          python -m pip install --quiet requests boto3 redis rq
          curl --fail --silent --show-error --url 'https://rest.runpod.io/v1/templates' --header "Authorization: Bearer $RUNPOD_API_KEY" --output templates.json
          TEMPLATE=$(jq -c --arg name "$RUNPOD_TEMPLATE_NAME" '[.[] | select(.name == $name)][0]' templates.json)
          test "$TEMPLATE" != "null"
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_BUCKET OPENAI_API_KEY; do
            value=$(printf '%s' "$TEMPLATE" | jq -r --arg key "$key" '.env[$key] // empty')
            test -n "$value" || { echo "$key missing from template vault"; exit 3; }
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done

      - name: Refuse duplicate staging worker and snapshot RQ workers
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --url 'https://rest.runpod.io/v1/pods' --header "Authorization: Bearer $RUNPOD_API_KEY" --output pods-before.json
          count=$(jq '[.[] | select(.name == "cutsell-staging-worker")] | length' pods-before.json)
          test "$count" = "0" || { echo 'cutsell-staging-worker already exists; refusing duplicate'; exit 4; }
          python - <<'PY' > rq-before.txt
          import os
          from redis import Redis
          from rq import Worker
          r=Redis.from_url(os.environ['REDIS_URL'])
          for w in Worker.all(connection=r): print(w.name)
          PY

      - name: Create temporary RunPod worker
        id: pod
        shell: bash
        run: |
          set -euo pipefail
          START_CMD='python -m rq.cli worker -u "$REDIS_URL" --worker-ttl 1200 cutsell'
          jq -n --arg image "$IMAGE" --arg cmd "$START_CMD" --arg redis "$REDIS_URL" \
            --arg aws_access "$AWS_ACCESS_KEY_ID" --arg aws_secret "$AWS_SECRET_ACCESS_KEY" --arg aws_region "$AWS_REGION" \
            --arg bucket "$S3_BUCKET" --arg openai "$OPENAI_API_KEY" \
            '{name:"cutsell-staging-worker",imageName:$image,cloudType:"SECURE",computeType:"GPU",gpuCount:1,
              gpuTypeIds:["NVIDIA L4","NVIDIA RTX A4000","NVIDIA RTX A5000","NVIDIA A40","NVIDIA GeForce RTX 3090","NVIDIA GeForce RTX 4090"],
              gpuTypePriority:"availability",interruptible:false,containerDiskInGb:30,volumeInGb:20,volumeMountPath:"/workspace",
              dockerEntrypoint:["bash","-lc"],dockerStartCmd:[$cmd],env:{REDIS_URL:$redis,AWS_ACCESS_KEY_ID:$aws_access,AWS_SECRET_ACCESS_KEY:$aws_secret,AWS_REGION:$aws_region,S3_BUCKET:$bucket,OPENAI_API_KEY:$openai,CUTSELL_ASR_MODEL:"medium",CUTSELL_CLEAN_CUT_JUDGE:"0",CUTSELL_SEMANTIC_MODEL:"gpt-4o-mini",CUTSELL_VISUAL_MODEL:"gpt-4o-mini",CUTSELL_TAKE_JUDGE_MODEL:"gpt-4o-mini"}}' > create-pod.json
          code=$(curl --silent --show-error --write-out '%{http_code}' --request POST --url 'https://rest.runpod.io/v1/pods' \
            --header "Authorization: Bearer $RUNPOD_API_KEY" --header 'Content-Type: application/json' --data @create-pod.json --output pod.json)
          rm -f create-pod.json
          echo "RunPod create HTTP status: $code"
          test "$code" = "201" || { jq '{error,errors,message}' pod.json || true; exit 7; }
          POD_ID=$(jq -r '.id // empty' pod.json)
          test -n "$POD_ID"
          echo "pod_id=$POD_ID" >> "$GITHUB_OUTPUT"
          echo "Created temporary E2E Pod: $POD_ID"

      - name: Wait for temporary worker registration
        shell: bash
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
        run: |
          set -euo pipefail
          cleanup_on_fail() {
            echo 'Worker failed readiness; deleting temporary Pod.'
            curl --silent --show-error --request DELETE --url "https://rest.runpod.io/v1/pods/$POD_ID" --header "Authorization: Bearer $RUNPOD_API_KEY" --output /dev/null || true
          }
          trap cleanup_on_fail ERR
          python - <<'PY'
          import os,time
          from pathlib import Path
          from redis import Redis
          from rq import Worker
          before=set(Path('rq-before.txt').read_text().splitlines())
          r=Redis.from_url(os.environ['REDIS_URL'])
          deadline=time.time()+420
          while time.time()<deadline:
              workers=Worker.all(connection=r)
              new=[w for w in workers if w.name not in before and any(q.name=='cutsell' for q in w.queues)]
              if new:
                  print('RQ E2E worker registered:',new[0].name)
                  raise SystemExit(0)
              time.sleep(10)
          raise SystemExit('RunPod worker did not register in Redis')
          PY
          trap - ERR

      - name: Prepare bounded real-video source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,boto3
          s3=boto3.client('s3',region_name=os.environ.get('AWS_REGION') or 'us-east-1')
          key=os.environ['SOURCE_KEY']
          try:
              s3.download_file(os.environ['S3_BUCKET'],key,'source.mp4')
          except Exception:
              found=None; token=None
              for _ in range(10):
                  kw={'Bucket':os.environ['S3_BUCKET'],'Prefix':'Editdna bloopers videos/','MaxKeys':1000}
                  if token: kw['ContinuationToken']=token
                  page=s3.list_objects_v2(**kw)
                  for obj in page.get('Contents') or []:
                      if 'bloppers15' in obj['Key'].lower() and obj['Key'].lower().endswith(('.mp4','.mov','.m4v')):
                          found=obj['Key']; break
                  if found or not page.get('IsTruncated'): break
                  token=page.get('NextContinuationToken')
              if not found: raise
              print('Recovered E2E source key:',found)
              s3.download_file(os.environ['S3_BUCKET'],found,'source.mp4')
          PY
          ffmpeg -hide_banner -loglevel error -y -i source.mp4 -t 25 -c:v libx264 -preset veryfast -crf 24 -c:a aac -movflags +faststart e2e.mp4
          test -s e2e.mp4
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 e2e.mp4 > duration.txt
          echo "Prepared E2E clip: $(stat -c%s e2e.mp4) bytes, $(cat duration.txt)s"

      - name: Run public API to GPU worker to export E2E
        shell: bash
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
        run: |
          set -euo pipefail
          cleanup() {
            echo "Deleting temporary E2E Pod $POD_ID"
            code=$(curl --silent --show-error --write-out '%{http_code}' --request DELETE --url "https://rest.runpod.io/v1/pods/$POD_ID" --header "Authorization: Bearer $RUNPOD_API_KEY" --output /tmp/runpod-delete.txt || true)
            echo "RunPod cleanup HTTP status: $code"
          }
          trap cleanup EXIT
          python - <<'PY'
          import json, os, time, uuid, requests, boto3
          from urllib.parse import urlparse

          base=os.environ['API_BASE'].rstrip('/')
          project='staging-e2e-'+uuid.uuid4().hex[:12]
          video_path='e2e.mp4'
          size=os.path.getsize(video_path)
          duration=float(open('duration.txt').read().strip())

          def expect(resp, codes=(200,)):
              if resp.status_code not in codes:
                  raise RuntimeError(f'{resp.request.method} {resp.url} -> {resp.status_code}: {resp.text[:1000]}')
              return resp

          health=expect(requests.get(base+'/v1/healthz',timeout=20)).json()
          assert health['ok'] and health['queue_ready'] and health['storage_ready'] and health['semantic_ready'], health
          print('HEALTH',json.dumps(health,sort_keys=True))

          session=expect(requests.post(base+'/v1/auth/session',timeout=20)).json()
          user=session['user_id']; token=session['access_token']
          headers={'Authorization':'Bearer '+token}
          print('AUTH user',user,'project',project)

          presign=expect(requests.post(base+'/v1/uploads/presign',headers=headers,json={
              'project_id':project,'user_id':user,'original_name':'staging-e2e.mp4','content_type':'video/mp4','size_bytes':size
          },timeout=30)).json()
          with open(video_path,'rb') as fh:
              up=requests.post(presign['upload_url'],data=presign['fields'],files={'file':('staging-e2e.mp4',fh,'video/mp4')},timeout=180)
          if up.status_code not in (200,201,204):
              raise RuntimeError(f'S3 upload -> {up.status_code}: {up.text[:1000]}')
          source_uri=presign['source_uri']; print('UPLOAD',source_uri)

          flow=expect(requests.post(base+'/v1/flow-b/jobs',headers=headers,json={
              'project_id':project,'user_id':user,'sources':[{'original_name':'staging-e2e.mp4','uri':source_uri,'source_order':0,'duration_sec':duration}],
              'language_hint':'en','audio_overlap':False
          },timeout=30),(202,)).json()
          job_id=flow['job_id']; print('FLOW_JOB',job_id)

          def wait_job(jid,limit):
              deadline=time.time()+limit; last=None
              while time.time()<deadline:
                  snap=expect(requests.get(base+f'/v1/jobs/{jid}',headers=headers,timeout=20)).json()
                  marker=(snap.get('state'),snap.get('progress'))
                  if marker!=last: print('JOB_STATUS',jid,marker); last=marker
                  if snap.get('state')=='finished': return snap
                  if snap.get('state') in ('failed','canceled'): raise RuntimeError('Job ended '+json.dumps(snap))
                  time.sleep(8)
              raise RuntimeError('Job timeout '+jid)

          wait_job(job_id,900)
          recovered=expect(requests.get(base+f'/v1/projects/{project}/draft',headers=headers,params={'user_id':user},timeout=30)).json()
          draft=recovered['draft']; assert draft.get('selected'), 'AI draft has no selected clips'
          print('DRAFT revision',recovered['revision'],'selected',len(draft['selected']),'alternates',len(draft.get('alternates') or []),'discarded',len(draft.get('discarded') or []))

          clip_id=draft['selected'][0]['clip_id']
          edited=expect(requests.post(base+'/v1/draft-edits/audio',headers=headers,json={'draft':draft,'clip_id':clip_id,'volume':0.9},timeout=30)).json()
          saved=expect(requests.put(base+f'/v1/projects/{project}/draft',headers=headers,json={'user_id':user,'expected_revision':recovered['revision'],'draft':edited},timeout=30)).json()
          assert saved['revision']==recovered['revision']+1
          edited_clip=next(c for c in saved['draft']['selected'] if c['clip_id']==clip_id)
          assert abs(float(edited_clip.get('audio_volume',1.0))-0.9)<1e-6
          print('EDIT_AUTOSAVE revision',saved['revision'],'audio_volume',edited_clip.get('audio_volume'))

          sources=[{'source_asset_id':s['source_asset_id'],'original_name':s['original_name'],'uri':s['uri']} for s in saved['sources']]
          export=expect(requests.post(base+'/v1/exports/jobs',headers=headers,json={'project_id':project,'user_id':user,'draft':saved['draft'],'sources':sources},timeout=30),(202,)).json()
          export_id=export['job_id']; print('EXPORT_JOB',export_id)
          done=wait_job(export_id,900); result=done.get('result') or {}
          assert result.get('state')=='finished' and int(result.get('size_bytes') or 0)>0 and str(result.get('export_uri') or '').startswith('s3://'),result
          dl=requests.get(result['download_url'],timeout=120)
          assert dl.status_code==200 and len(dl.content)==int(result['size_bytes']), (dl.status_code,len(dl.content),result['size_bytes'])
          open('e2e-export.mp4','wb').write(dl.content)
          evidence={'project_id':project,'flow_job_id':job_id,'export_job_id':export_id,'selected_count':len(draft['selected']),'export_size_bytes':result['size_bytes'],'revision':saved['revision'],'render_version_id':result.get('render_version_id')}
          open('cutsell-staging-e2e-result.json','w').write(json.dumps(evidence,indent=2))
          print('E2E_PASS',json.dumps(evidence,sort_keys=True))

          s3=boto3.client('s3',region_name=os.environ.get('AWS_REGION') or 'us-east-1')
          for uri in (source_uri,result['export_uri']):
              p=urlparse(uri); s3.delete_object(Bucket=p.netloc,Key=p.path.lstrip('/'))
          PY

      - name: Validate exported MP4 locally
        run: |
          set -euo pipefail
          test -s e2e-export.mp4
          ffprobe -v error -show_entries format=duration,size -of json e2e-export.mp4

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-staging-e2e-${{ github.sha }}
          path: |
            cutsell-staging-e2e-result.json
            e2e-export.mp4
          if-no-files-found: ignore
          retention-days: 14
