name: Run35 Dispatch Exact Pod Delete

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/run35-dispatch-delete.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch-delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      POD_ID: bzesdtg5kuk06y
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutsell/mobile-v1-clean
      - name: Delete exact Run35 Pod only if still present
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}" || { echo 'RUNPOD_API_KEY missing'; exit 3; }
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output pods-before.json
          name=$(jq -r --arg id "$POD_ID" '[.[] | select(.id == $id)][0].name // empty' pods-before.json)
          if [ -z "$name" ]; then
            jq -n --arg pod_id "$POD_ID" '{pod_id:$pod_id,conclusion:"success",verified_absent:true,already_absent:true}' > run35-delete-status.json
            exit 0
          fi
          test "$name" = "cutsell-staging-worker" || { echo 'Exact Pod ID belongs to unexpected Pod name'; exit 4; }
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          code=$(curl --silent --show-error --write-out '%{http_code}' \
            --request POST \
            --url "$api/actions/workflows/cutsell-runpod-staging-worker-delete.yml/dispatches" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "Content-Type: application/json" \
            --data '{"ref":"cutsell/mobile-v1-clean","inputs":{"approval":"APPROVE_DELETE_STAGING_WORKER","pod_id":"bzesdtg5kuk06y"}}' \
            --output dispatch-response.txt)
          test "$code" = "204" || { echo "delete dispatch failed HTTP $code"; cat dispatch-response.txt; exit 5; }
          run_id=""
          for i in $(seq 1 50); do
            runs=$(curl --fail --silent --show-error --header "Authorization: Bearer $GH_TOKEN" "$api/actions/workflows/cutsell-runpod-staging-worker-delete.yml/runs?branch=cutsell/mobile-v1-clean&event=workflow_dispatch&per_page=20")
            run_id=$(printf '%s' "$runs" | jq -r --arg started "$started" '[.workflow_runs[] | select(.created_at >= $started)][0].id // empty')
            status=$(printf '%s' "$runs" | jq -r --arg started "$started" '[.workflow_runs[] | select(.created_at >= $started)][0].status // empty')
            conclusion=$(printf '%s' "$runs" | jq -r --arg started "$started" '[.workflow_runs[] | select(.created_at >= $started)][0].conclusion // empty')
            if [ -n "$run_id" ] && [ "$status" = "completed" ]; then
              test "$conclusion" = "success" || { echo "Run35 delete failed: $conclusion"; exit 6; }
              break
            fi
            sleep 6
          done
          test -n "$run_id" || { echo 'Run35 delete run not found'; exit 7; }
          for i in $(seq 1 20); do
            curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output pods-after.json
            count=$(jq --arg id "$POD_ID" '[.[] | select(.id == $id)] | length' pods-after.json)
            if [ "$count" = "0" ]; then
              jq -n --argjson run_id "$run_id" --arg pod_id "$POD_ID" '{run_id:$run_id,pod_id:$pod_id,conclusion:"success",verified_absent:true,already_absent:false}' > run35-delete-status.json
              exit 0
            fi
            sleep 3
          done
          echo 'Run35 Pod still present after successful delete workflow'; exit 8
      - name: Persist delete status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p ops
          mv run35-delete-status.json ops/run35-delete-status.json
          git add ops/run35-delete-status.json
          git commit -m 'Record Run35 retry staging Pod deletion'
          git pull --rebase origin cutsell/mobile-v1-clean
          git push origin HEAD:cutsell/mobile-v1-clean

# Delete exact retry Pod after successful Gold benchmark.
