name: Benchmark 48 Controlled Worker Build
run-name: Benchmark 48 exact-source immutable worker build

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/benchmark48-controlled-build.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: 82aacb7ce714bc90e3bef2885a971f99ca48ca3c
      IMAGE: ghcr.io/automatedretailservices/cutsell-worker:82aacb7ce714bc90e3bef2885a971f99ca48ca3c
    steps:
      - name: Validate exact approved source
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "82aacb7ce714bc90e3bef2885a971f99ca48ca3c"
          test "$IMAGE" = "ghcr.io/automatedretailservices/cutsell-worker:82aacb7ce714bc90e3bef2885a971f99ca48ca3c"
          echo "BENCHMARK48_SOURCE_SHA=$SOURCE_SHA"
      - name: Checkout exact source under validation
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Prove checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build exact CutSell worker image
        run: docker build -t "$IMAGE" -f Dockerfile.cutsell.worker .
      - name: Prove OpenAI SDK is absent
        run: |
          docker run --rm --entrypoint python "$IMAGE" - <<'PY'
          import importlib.util
          if importlib.util.find_spec('openai') is not None:
              raise SystemExit('OpenAI SDK unexpectedly present in RunPod worker image')
          print('openai_sdk_absent=true')
          PY
      - name: Push exact source-tagged image
        run: docker push "$IMAGE"
      - name: Resolve immutable digest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" | tee image-inspect.txt
          digest=$(awk '/^Digest:/ {print $2; exit}' image-inspect.txt)
          test -n "$digest" || { echo 'Unable to resolve pushed image digest'; exit 9; }
          echo "BENCHMARK48_IMAGE_DIGEST=$digest"
          echo "BENCHMARK48_IMMUTABLE_IMAGE=$IMAGE@$digest"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "image_digest=$digest" >> "$GITHUB_STEP_SUMMARY"
