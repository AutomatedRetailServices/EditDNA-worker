name: CutSell RunPod Template Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cutsell-runpod-template-preflight.yml"
      - ".cutsell/runpod-template-preflight-trigger.txt"

permissions:
  contents: read

jobs:
  inspect-template:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_TEMPLATE_ID: ${{ secrets.RUNPOD_TEMPLATE_ID }}
    steps:
      - name: Fetch template without printing secrets
        shell: bash
        run: |
          test -n "$RUNPOD_API_KEY" || (echo 'RUNPOD_API_KEY missing' && exit 2)
          test -n "$RUNPOD_TEMPLATE_ID" || (echo 'RUNPOD_TEMPLATE_ID missing' && exit 2)
          curl --fail --silent --show-error \
            --url "https://rest.runpod.io/v1/templates/$RUNPOD_TEMPLATE_ID" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --header "Content-Type: application/json" \
            --output template.json
      - name: Print sanitized template metadata only
        shell: bash
        run: |
          jq '{
            id,
            name,
            imageName,
            containerDiskInGb,
            volumeInGb,
            volumeMountPath,
            ports,
            hasRegistryAuth: ((.containerRegistryAuthId // "") | length > 0),
            env_keys: ((.env // {}) | keys | sort)
          }' template.json
