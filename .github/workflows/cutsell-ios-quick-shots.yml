name: CutSell iOS quick screenshots (on request)

# Debug build on the Simulator, then one screenshot per screen in SHOTS (DesignScreenshots names), as a
# workflow artifact (sample content only: no user data). Runs only on a push to ios-shots/request.
on:
  push:
    branches: [ios-shots/request]

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SHOTS: "shop_boards shop_your_board plan"
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$latest"
      - name: Generate the Xcode project
        working-directory: mobile/ios
        run: brew install xcodegen >/dev/null && xcodegen generate
      - name: Build for the Simulator
        working-directory: mobile/ios
        run: |
          set +e
          xcodebuild -project CutSell.xcodeproj -scheme CutSell -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1
          status=$?
          grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -10 | while IFS= read -r l; do echo "::error title=build::$(echo "$l" | sed 's#.*/mobile/ios/##' | cut -c1-300)"; done
          exit $status
      - name: Screenshots
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          APP="build/Build/Products/Debug-iphonesimulator/CutSell.app"
          BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          udid="$(xcrun simctl list devices available --json | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=sorted((r,x["name"],x["udid"]) for r,v in d.items() if "iOS" in r for x in v if x["name"].startswith("iPhone"))
          n=[x for x in c if x[0]==c[-1][0]]
          pick=[x for x in n if x[1].endswith("Pro")] or n
          print(pick[0][2])')"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" appearance light || true
          xcrun simctl install "$udid" "$APP"
          mkdir -p "$RUNNER_TEMP/shots"
          for s in $SHOTS; do
            xcrun simctl terminate "$udid" "$BUNDLE" >/dev/null 2>&1 || true
            xcrun simctl launch "$udid" "$BUNDLE" -CutSellScreen "$s" -CutSellCatalogMock -CutSellPlanMock >/dev/null
            sleep 5
            xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/shots/$s.png" >/dev/null 2>&1 || true
          done
          ls -la "$RUNNER_TEMP/shots"
      - name: Push the screenshots to the ios-shots/result branch
        run: |
          cd "$RUNNER_TEMP/shots"
          git init -q && git checkout -q -b ios-shots/result
          git add -A
          git -c user.name="cutsell-ci" -c user.email="ci@cutsell.invalid" commit -q -m "quick shots for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ios-shots/result
