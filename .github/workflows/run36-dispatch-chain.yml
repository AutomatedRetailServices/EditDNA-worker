name: Run36 Dispatch Recovery

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/run36-dispatch-chain.yml

permissions:
  actions: write
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutsell/mobile-v1-clean
      - name: Recover actual Run36 chain without duplicate deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: AutomatedRetailServices/EditDNA-worker
          CUTOFF: '2026-08-18T11:17:00Z'
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")

          deploy_run=$(curl --fail --silent --show-error "${auth[@]}" "$api/actions/workflows/cutsell-feature-runpod-one-shot-deploy.yml/runs?branch=cutsell/mobile-v1-clean&per_page=20" | jq -r --arg cutoff "$CUTOFF" '[.workflow_runs[] | select(.event == "workflow_dispatch" and .created_at >= $cutoff)][0].id // empty')
          test -n "$deploy_run" || { echo 'No Run36 deploy run found after cutoff; refusing duplicate deploy'; exit 4; }

          deploy_conclusion=""
          for i in $(seq 1 240); do
            run=$(curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs/$deploy_run")
            status=$(printf '%s' "$run" | jq -r '.status')
            deploy_conclusion=$(printf '%s' "$run" | jq -r '.conclusion // empty')
            [ "$status" = "completed" ] && break
            sleep 5
          done
          test "$deploy_conclusion" = "success" || { echo "Run36 deploy did not succeed: $deploy_conclusion"; exit 5; }

          jobs=$(curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs/$deploy_run/jobs")
          deploy_job=$(printf '%s' "$jobs" | jq -r '.jobs[0].id // empty')
          test -n "$deploy_job" || { echo 'Run36 deploy job missing'; exit 6; }
          logs=$(mktemp)
          curl -L --fail --silent --show-error "${auth[@]}" "$api/actions/jobs/$deploy_job/logs" > "$logs"
          pod_id=$(grep -Eo '"id"[[:space:]]*:[[:space:]]*"[a-z0-9]+"' "$logs" | tail -1 | sed -E 's/.*"([a-z0-9]+)"/\1/' || true)
          test -n "$pod_id" || { echo 'Unable to resolve actual Run36 Pod ID'; exit 7; }
          echo "Recovered actual Run36 Pod: $pod_id"

          benchmark_run=$(curl --fail --silent --show-error "${auth[@]}" "$api/actions/workflows/cutsell-unseen-clean-cut-benchmark.yml/runs?branch=cutsell/mobile-v1-clean&per_page=20" | jq -r --arg cutoff "$CUTOFF" '[.workflow_runs[] | select(.event == "workflow_dispatch" and .created_at >= $cutoff)][0].id // empty')

          if [ -z "$benchmark_run" ]; then
            echo 'No Run36 benchmark found; dispatching exactly one benchmark with actual Pod ID'
            payload=$(jq -n --arg pod "$pod_id" '{ref:"cutsell/mobile-v1-clean",inputs:{approval_token:"RUN36",pod_id:$pod}}')
            curl --fail --silent --show-error -X POST "${auth[@]}" "$api/actions/workflows/cutsell-unseen-clean-cut-benchmark.yml/dispatches" -d "$payload"
            for i in $(seq 1 60); do
              benchmark_run=$(curl --fail --silent --show-error "${auth[@]}" "$api/actions/workflows/cutsell-unseen-clean-cut-benchmark.yml/runs?branch=cutsell/mobile-v1-clean&per_page=10" | jq -r --arg cutoff "$CUTOFF" '[.workflow_runs[] | select(.event == "workflow_dispatch" and .created_at >= $cutoff)][0].id // empty')
              [ -n "$benchmark_run" ] && break
              sleep 5
            done
            test -n "$benchmark_run" || { echo 'Run36 benchmark run not found after dispatch'; exit 8; }
          else
            echo "Using already-dispatched Run36 benchmark: $benchmark_run"
          fi

          benchmark_conclusion=""
          for i in $(seq 1 720); do
            run=$(curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs/$benchmark_run")
            status=$(printf '%s' "$run" | jq -r '.status')
            benchmark_conclusion=$(printf '%s' "$run" | jq -r '.conclusion // empty')
            [ "$status" = "completed" ] && break
            sleep 5
          done
          test -n "$benchmark_conclusion" || { echo 'Run36 benchmark did not complete inside recovery window'; exit 9; }

          pod_deleted=false
          test -n "${RUNPOD_API_KEY:-}" || { echo 'RUNPOD_API_KEY missing during Run36 recovery cleanup'; exit 10; }
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output pods.json
          name=$(jq -r --arg id "$pod_id" '[.[] | select(.id == $id)][0].name // empty' pods.json)
          if [ -z "$name" ]; then
            pod_deleted=true
            echo "Actual Run36 Pod already absent: $pod_id"
          else
            test "$name" = "cutsell-staging-worker" || { echo 'Recovered Pod ID is not cutsell-staging-worker; refusing delete'; exit 11; }
            code=$(curl --silent --show-error --write-out '%{http_code}' --request DELETE --url "https://rest.runpod.io/v1/pods/$pod_id" --header "Authorization: Bearer $RUNPOD_API_KEY" --output delete-response.txt)
            test "$code" = "204" || { echo "RunPod delete returned $code"; exit 12; }
            sleep 2
            curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output after.json
            remaining=$(jq --arg id "$pod_id" '[.[] | select(.id == $id)] | length' after.json)
            test "$remaining" = "0" || { echo 'Actual Run36 Pod still present after delete'; exit 13; }
            pod_deleted=true
            echo "Actual Run36 Pod deleted and verified absent: $pod_id"
          fi

          mkdir -p ops
          jq -n --argjson deploy_run "$deploy_run" --arg pod "$pod_id" --argjson benchmark_run "$benchmark_run" --arg conclusion "$benchmark_conclusion" --argjson deleted "$pod_deleted" \
            '{deploy_run_id:$deploy_run,pod_id:$pod,benchmark_run_id:$benchmark_run,benchmark_conclusion:$conclusion,pod_verified_absent:$deleted,status:"recovered"}' > ops/run36-recovery-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/run36-recovery-status.json
          git commit -m "Record recovered Run36 chain" || true
          git push origin HEAD:cutsell/mobile-v1-clean
