name: Run36 Dispatch Recovery

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/run36-dispatch-chain.yml

permissions:
  actions: write
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutsell/mobile-v1-clean
      - name: Recover active Run36 benchmark and exact live Pod
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: AutomatedRetailServices/EditDNA-worker
          CUTOFF: '2026-08-18T11:17:00Z'
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          test -n "${RUNPOD_API_KEY:-}" || { echo 'RUNPOD_API_KEY missing'; exit 3; }

          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output pods.json
          pod_count=$(jq '[.[] | select(.name == "cutsell-staging-worker")] | length' pods.json)
          test "$pod_count" = "1" || { echo "Expected exactly one active cutsell-staging-worker, found $pod_count"; exit 4; }
          pod_id=$(jq -r '[.[] | select(.name == "cutsell-staging-worker")][0].id' pods.json)
          pod_image=$(jq -r '[.[] | select(.name == "cutsell-staging-worker")][0].imageName // empty' pods.json)
          test -n "$pod_id" || { echo 'Unable to resolve active staging Pod ID'; exit 4; }
          echo "Recovered active Run36 staging Pod: $pod_id"
          echo "Active image: $pod_image"

          benchmark_run=$(curl --fail --silent --show-error "${auth[@]}" "$api/actions/workflows/cutsell-unseen-clean-cut-benchmark.yml/runs?branch=cutsell/mobile-v1-clean&per_page=20" | jq -r --arg cutoff "$CUTOFF" '[.workflow_runs[] | select(.event == "workflow_dispatch" and .created_at >= $cutoff)][0].id // empty')
          if [ -z "$benchmark_run" ]; then
            echo 'No Run36 benchmark exists after cutoff; dispatching exactly one against active Pod'
            payload=$(jq -n --arg pod "$pod_id" '{ref:"cutsell/mobile-v1-clean",inputs:{approval_token:"RUN36",pod_id:$pod}}')
            curl --fail --silent --show-error -X POST "${auth[@]}" "$api/actions/workflows/cutsell-unseen-clean-cut-benchmark.yml/dispatches" -d "$payload"
            for i in $(seq 1 60); do
              benchmark_run=$(curl --fail --silent --show-error "${auth[@]}" "$api/actions/workflows/cutsell-unseen-clean-cut-benchmark.yml/runs?branch=cutsell/mobile-v1-clean&per_page=20" | jq -r --arg cutoff "$CUTOFF" '[.workflow_runs[] | select(.event == "workflow_dispatch" and .created_at >= $cutoff)][0].id // empty')
              [ -n "$benchmark_run" ] && break
              sleep 5
            done
            test -n "$benchmark_run" || { echo 'Benchmark dispatch not discoverable'; exit 5; }
          else
            echo "Using existing Run36 benchmark: $benchmark_run"
          fi

          benchmark_conclusion=""
          for i in $(seq 1 840); do
            run=$(curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs/$benchmark_run")
            status=$(printf '%s' "$run" | jq -r '.status')
            benchmark_conclusion=$(printf '%s' "$run" | jq -r '.conclusion // empty')
            [ "$status" = "completed" ] && break
            sleep 5
          done
          test -n "$benchmark_conclusion" || { echo 'Run36 benchmark did not complete inside recovery window'; exit 6; }
          echo "Run36 benchmark conclusion: $benchmark_conclusion"

          pod_verified_absent=false
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output pods-after-benchmark.json
          live_name=$(jq -r --arg id "$pod_id" '[.[] | select(.id == $id)][0].name // empty' pods-after-benchmark.json)
          if [ -z "$live_name" ]; then
            pod_verified_absent=true
            echo "Run36 Pod already absent: $pod_id"
          else
            test "$live_name" = "cutsell-staging-worker" || { echo 'Recovered Pod identity changed; refusing delete'; exit 7; }
            code=$(curl --silent --show-error --write-out '%{http_code}' --request DELETE --url "https://rest.runpod.io/v1/pods/$pod_id" --header "Authorization: Bearer $RUNPOD_API_KEY" --output delete-response.txt)
            test "$code" = "204" || { echo "RunPod delete returned $code"; cat delete-response.txt || true; exit 8; }
            sleep 2
            curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output pods-final.json
            remaining=$(jq --arg id "$pod_id" '[.[] | select(.id == $id)] | length' pods-final.json)
            test "$remaining" = "0" || { echo 'Run36 Pod still present after delete'; exit 9; }
            pod_verified_absent=true
            echo "Run36 Pod deleted and verified absent: $pod_id"
          fi

          mkdir -p ops
          jq -n --arg pod "$pod_id" --arg image "$pod_image" --argjson benchmark_run "$benchmark_run" --arg conclusion "$benchmark_conclusion" --argjson absent "$pod_verified_absent" '{pod_id:$pod,pod_image:$image,benchmark_run_id:$benchmark_run,benchmark_conclusion:$conclusion,pod_verified_absent:$absent,status:"recovered"}' > ops/run36-recovery-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/run36-recovery-status.json
          git commit -m "Record recovered Run36 chain" || true
          git push origin HEAD:cutsell/mobile-v1-clean
