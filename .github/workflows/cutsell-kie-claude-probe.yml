name: CutSell kie.ai Claude probe (paid, tiny, on request only)

# PO 16 Nov 2026: does Claude Sonnet 5.5 work through kie.ai? 3 short calls (~US$0.01) on Modal (key stays there).
on:
  push:
    branches: [kie-claude/request]

permissions:
  contents: read

jobs:
  probe:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check --quiet modal==1.6.3
      - env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run modal_kie_claude_probe.py
