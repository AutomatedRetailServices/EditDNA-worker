name: Run39 Worker Build PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run39-worker-build-pr.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/automatedretailservices/cutsell-worker:${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Run39 long-form worker
        run: docker build -t "$IMAGE" -f Dockerfile.cutsell.worker .
      - name: Prove long-form RQ TTL and OpenAI absence
        run: |
          set -euo pipefail
          grep -q -- '--worker-ttl 14400' Dockerfile.cutsell.worker
          docker run --rm --entrypoint python "$IMAGE" - <<'PY'
          import importlib.util
          if importlib.util.find_spec('openai') is not None:
              raise SystemExit('OpenAI SDK unexpectedly present')
          print('openai_sdk_absent=true')
          PY
      - name: Push immutable worker tag
        run: docker push "$IMAGE"
      - name: Resolve digest
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" | tee image-inspect.txt
          digest=$(awk '/^Digest:/ {print $2; exit}' image-inspect.txt)
          test -n "$digest"
          echo "RUN39_IMAGE=$IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
          echo "RUN39_DIGEST=$digest" >> "$GITHUB_STEP_SUMMARY"
