name: CutSell Gold Cycle Monitor

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/cutsell-gold-cycle-monitor.yml

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 235
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 472aca0af1d49333b6531b25d067ffdad601f7b2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutsell/mobile-v1-clean
          fetch-depth: 0

      - name: Wait for exact one-shot Gold workflow run
        shell: bash
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 13800 ))
          run_id=""
          while [ $(date +%s) -lt "$deadline" ]; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100")
            run_id=$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.name == "CutSell Gold Cycle One-Shot" and .event == "push" and .head_sha == env.TARGET_SHA)][0].id // empty')
            if [ -n "$run_id" ]; then
              status=$(printf '%s' "$runs" | jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status')
              echo "Gold one-shot run $run_id status=$status"
              if [ "$status" = "completed" ]; then
                echo "RUN_ID=$run_id" >> "$GITHUB_ENV"
                exit 0
              fi
            else
              echo 'Exact Gold one-shot run not visible yet'
            fi
            sleep 30
          done
          echo 'Timed out waiting for exact one-shot workflow'
          exit 1

      - name: Persist exact run, job, and artifact status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100")
          run_id="${RUN_ID:-}"
          if [ -z "$run_id" ]; then
            run_id=$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.name == "CutSell Gold Cycle One-Shot" and .event == "push" and .head_sha == env.TARGET_SHA)][0].id // empty')
          fi
          test -n "$run_id" || { echo 'No exact Gold one-shot run found'; exit 2; }
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")
          jq -n --argjson run "$run" --argjson jobs "$jobs" --argjson artifacts "$artifacts" '{run:{id:$run.id,name:$run.name,status:$run.status,conclusion:$run.conclusion,head_sha:$run.head_sha,created_at:$run.created_at,updated_at:$run.updated_at,html_url:$run.html_url},jobs:[$jobs.jobs[]|{id,name,status,conclusion,started_at,completed_at,steps:[.steps[]?|{number,name,status,conclusion}]}],artifacts:[$artifacts.artifacts[]|{id,name,size_in_bytes,expired,created_at,expires_at}]}' > ops/gold-cycle-latest.json
          cat ops/gold-cycle-latest.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ops/gold-cycle-latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record one-shot Gold cycle status $run_id"
          git push origin HEAD:cutsell/mobile-v1-clean
