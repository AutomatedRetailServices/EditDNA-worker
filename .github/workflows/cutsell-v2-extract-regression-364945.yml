name: Extract V2 Regression 365395 Focused Delivery
on:
  push:
    branches: [feat/editorial-engine-v2-whole-video-rebuild]
    paths:
      - .github/workflows/cutsell-v2-extract-regression-364945.yml
permissions:
  actions: read
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and compact existing regression evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw compact
          gh run download 36539576297 --repo "$GITHUB_REPOSITORY" \
            --name cutsell-editorial-v2-09-verification-36539576297 \
            --dir raw
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("raw")
          def read(path):
              return json.loads(path.read_text(encoding="utf-8"))

          report_path = root / "report.json"
          report = read(report_path) if report_path.exists() else {}
          comparison_path = root / "gold_comparison.json"
          gold = read(comparison_path) if comparison_path.exists() else []
          compact = {
              "source_count": report.get("source_count"),
              "completed_count": report.get("completed_count"),
              "execution_failure_count": report.get("execution_failure_count"),
              "gold_comparison": gold,
              "sources": [],
              "failures": report.get("failures", []),
              "boundary_failure_evidence": [],
          }
          for path in sorted((root / "results").glob("*boundary-failure.json")):
              compact["boundary_failure_evidence"].append({
                  "file": path.name,
                  "evidence": read(path),
              })
          for path in sorted((root / "results").glob("*.json")):
              result = read(path)
              if "source_key" not in result:
                  continue
              diag = result.get("diagnostics") or {}
              reasoner = diag.get("unified_selection_reasoner") or {}
              intervals = {
                  str(row.get("clip_id")): {
                      "source_order": row.get("source_order"),
                      "start": row.get("start"), "end": row.get("end"),
                  }
                  for row in (diag.get("candidate_intervals") or reasoner.get("candidate_intervals") or ())
                  if row.get("clip_id")
              }
              texts = {str(item.get("clip_id")): item.get("text")
                       for bucket in ("selected", "alternates", "discarded")
                       for item in result.get(bucket, ())}
              decisions = []
              for row in reasoner.get("decisions") or ():
                  decisions.append({
                      **intervals.get(str(row.get("clip_id")), {}),
                      "clip_id": row.get("clip_id"),
                      "text": texts.get(str(row.get("clip_id"))),
                      "model_action": row.get("model_action"),
                      "effective_action": row.get("effective_action"),
                      "relation": row.get("relation"),
                      "reason_code": row.get("reason_code"),
                      "safety_override": row.get("safety_override"),
                  })
              retry_claim_conflicts = [
                  {field: row.get(field) for field in (
                      "clip_id", "source_asset_id", "status", "missing_quantity",
                      "missing_condition", "unique_cta", "missing_negation", "protected_topic")}
                  for row in (diag.get("v2_retry_claim_conflicts") or ())
              ]
              competitions = []
              for row in (diag.get("v2_take_competitions") or ()):
                  competitions.append({
                      "winners": [dict(clip_id=cid, **intervals.get(str(cid), {}))
                                  for cid in row.get("winners", ())],
                      "covered": [dict(clip_id=cid, **intervals.get(str(cid), {}))
                                  for cid in row.get("covered", ())],
                      "material_unique": [dict(clip_id=cid, **intervals.get(str(cid), {}))
                                          for cid in row.get("material_unique", ())],
                      "relation": row.get("relation"),
                      "confidence": row.get("confidence"),
                      "decision": row.get("decision"),
                      "reason_code": row.get("reason_code"),
                      "reason": row.get("reason"),
                  })
              av_regions = []
              for source in (diag.get("whole_video_context") or {}).get("sources") or ():
                  try:
                      evidence = json.loads(str(source.get("audiovisual_evidence") or "{}"))
                  except (TypeError, ValueError, json.JSONDecodeError):
                      continue
                  for region in evidence.get("regions") or ():
                      av_regions.append({
                          "source_asset_id": source.get("source_asset_id"),
                          "start": region.get("start"), "end": region.get("end"),
                          "role": region.get("role"), "confidence": region.get("confidence"),
                          "visual_observation": region.get("visual_observation"),
                          "audio_observation": region.get("audio_observation"),
                          "reason": region.get("reason"),
                      })
                  for region in evidence.get("focused_delivery_regions") or ():
                      av_regions.append({
                          "source_asset_id": source.get("source_asset_id"),
                          "start": region.get("start"), "end": region.get("end"),
                          "role": region.get("role"), "confidence": region.get("confidence"),
                          "visual_observation": region.get("visual_observation"),
                          "audio_observation": region.get("audio_observation"),
                          "reason": region.get("reason"), "focused": True,
                      })
              compact["sources"].append({
                  "source_key": result["source_key"],
                  "source_duration_sec": result.get("source_duration_sec"),
                  "selection_status": reasoner.get("status"),
                  "competition_review": diag.get("competition_review"),
                  "selected_intervals": [
                      {"clip_id": row.get("clip_id"), "start": row.get("start"), "end": row.get("end")}
                      for row in result.get("selected", ())
                  ],
                  "candidate_intervals": intervals,
                  "decisions": decisions,
                  "take_competitions": competitions,
                  "retry_claim_conflicts": retry_claim_conflicts,
                  "audiovisual_regions": av_regions,
                  "av_probe_audit": [
                      item for item in ((diag.get("whole_video_context") or {}).get("input_audit") or {}).get("native_av", ())
                      if isinstance(item, dict) and 'focused_delivery' in str(item.get("contract_version"))
                  ],
                  "focused_word_evidence": [
                      {"start": segment.get("start"), "end": segment.get("end"),
                       "text": segment.get("text"), "words": segment.get("words")}
                      for segment in (result.get("timed_asr_replay_evidence") or {}).get("raw_segments") or ()
                      if (result["source_key"] == "Yaskira/09.mp4" and
                          any(float(segment.get("start", -1)) < high and
                              float(segment.get("end", -1)) > low
                              for low, high in ((8, 30), (86, 122)))) or
                         (result["source_key"] == "Yaskira/10.MOV" and
                          any(float(segment.get("start", -1)) < high and
                              float(segment.get("end", -1)) > low
                              for low, high in ((8, 26), (46, 67))))
                  ],
                  "render_qc": (result.get("live_render_qc") or {}).get("status"),
              })
          out = Path("compact/regression-365395-interval-decisions.json")
          out.write_text(json.dumps(compact, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps({
              "source_count": compact["source_count"],
              "completed_count": compact["completed_count"],
              "sources": [{
                  "source_key": row["source_key"],
                  "selected_count": len(row["selected_intervals"]),
                  "candidate_count": len(row["candidate_intervals"]),
                  "decision_count": len(row["decisions"]),
              } for row in compact["sources"]],
              "failures": compact["failures"],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v2-regression-365395-interval-decisions
          path: compact/regression-365395-interval-decisions.json
