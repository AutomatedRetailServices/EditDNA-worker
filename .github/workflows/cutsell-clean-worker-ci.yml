name: CutSell Clean Worker CI

on:
  pull_request:
    branches: [main]
    paths:
      - "cutsell_worker/**"
      - "cutsell_app/**"
      - "tests/test_cutsell_*.py"
      - "tests/data/cutsell_golden_expectations.json"
      - "Dockerfile.cutsell"
      - "Dockerfile.cutsell.worker"
      - "requirements.cutsell.api.txt"
      - "render.cutsell.yaml"
      - ".github/workflows/cutsell-clean-worker-ci.yml"

permissions:
  contents: read

jobs:
  test-clean-worker:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile clean worker and app
        run: python -m compileall cutsell_worker cutsell_app
      - name: Install test runner and app dependencies
        run: pip install pytest fastapi httpx pydantic redis rq boto3 openai
      - name: Run CutSell tests
        run: pytest -q tests/test_cutsell_*.py
      - name: Build staging API container
        run: docker build -f Dockerfile.cutsell -t cutsell-api-ci:${{ github.sha }} .
      - name: Boot API container and verify health endpoint
        shell: bash
        run: |
          set -euo pipefail
          cid=$(docker run -d -e PORT=8000 -p 18000:8000 cutsell-api-ci:${{ github.sha }})
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/v1/healthz > health.json; then
              cat health.json
              python - <<'PY'
          import json
          data=json.load(open('health.json'))
          assert data['ok'] is True
          assert data['service'] == 'cutsell-api'
          PY
              exit 0
            fi
            sleep 1
          done
          echo 'CutSell API container did not become healthy'
          exit 1
