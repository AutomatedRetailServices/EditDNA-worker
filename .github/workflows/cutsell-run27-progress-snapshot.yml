name: CutSell Run27 Progress Snapshot

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/cutsell-run27-progress-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      REDIS_URL: ${{ secrets.REDIS_URL }}
      TARGET_BENCHMARK_ID: unseen-31974424883-b29e59b7b8fdccb95bbc14d0d46c585bdef607f2
    steps:
      - name: Read Run27 RQ progress
        run: |
          set -euo pipefail
          python -m pip install -q 'redis>=5.0' 'rq>=2.6'
          python - <<'PY'
          import json, os
          from redis import Redis
          from rq import Queue
          from rq.job import Job
          connection = Redis.from_url(os.environ['REDIS_URL'])
          target = os.environ['TARGET_BENCHMARK_ID']
          queue = Queue('cutsell', connection=connection)
          ids = list(queue.job_ids)
          registries = [queue.started_job_registry, queue.finished_job_registry, queue.failed_job_registry]
          for registry in registries:
              try: ids += list(registry.get_job_ids())
              except Exception: pass
          seen=[]
          for job_id in dict.fromkeys(ids):
              try: job=Job.fetch(job_id, connection=connection)
              except Exception: continue
              meta=dict(job.meta or {})
              if meta.get('benchmark_id') == target:
                  print(json.dumps({'job_id':job.id,'status':getattr(job.get_status(refresh=True),'value',str(job.get_status())),'meta':meta}, ensure_ascii=False, indent=2, default=str))
                  seen.append(job.id)
          if not seen:
              raise SystemExit('Run27 benchmark job not found')
          PY
