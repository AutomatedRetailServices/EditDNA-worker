name: Benchmark 41 State Inspection

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/benchmark41-controlled-deploy.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: cutsell-benchmark41-state-inspection
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      TARGET_BRANCH: cutsell/mobile-v1-clean
      EXPECTED_IMAGE: ghcr.io/automatedretailservices/cutsell-worker:88e42364d01c58013d5927fc1430413e162a7ef5@sha256:3b8f53e9376fba5173e6a6e09c4ad72aa526bc8f6a78f61f598ce219ddb9beec
    steps:
      - name: Guard exact PR and branch
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$PR_NUMBER" = "25" || exit 2
          test "$PR_HEAD" = "$TARGET_BRANCH" || exit 2

      - name: Inspect existing CutSell staging workers
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}" || { echo 'RUNPOD_API_KEY missing'; exit 3; }
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output pods.json
          echo 'CUTSELL_STAGING_PODS_BEGIN'
          jq -c '[.[] | select(.name == "cutsell-staging-worker") | {id,name,imageName,desiredStatus,costPerHr,adjustedCostPerHr,gpuCount,machineId,lastStatusChange}]' pods.json
          echo 'CUTSELL_STAGING_PODS_END'
          count=$(jq '[.[] | select(.name == "cutsell-staging-worker")] | length' pods.json)
          echo "cutsell_staging_worker_count=$count"
          if [ "$count" = "1" ]; then
            actual=$(jq -r '[.[] | select(.name == "cutsell-staging-worker")][0].imageName // empty' pods.json)
            echo "existing_worker_matches_expected_image=$([ "$actual" = "$EXPECTED_IMAGE" ] && echo true || echo false)"
          fi

      - name: Inspect recent Clean Cut benchmark runs
        shell: bash
        run: |
          set -euo pipefail
          echo 'RECENT_BENCHMARK_RUNS_BEGIN'
          gh run list --repo "$GITHUB_REPOSITORY" --workflow cutsell-unseen-clean-cut-benchmark.yml --event workflow_dispatch --branch "$TARGET_BRANCH" --limit 8 --json databaseId,number,status,conclusion,headSha,createdAt,updatedAt,url,event,displayTitle
          echo 'RECENT_BENCHMARK_RUNS_END'
