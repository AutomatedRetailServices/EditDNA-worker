name: Benchmark 41 Worker Build

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/benchmark41-worker-build.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/automatedretailservices/cutsell-worker:${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build benchmark 41 worker
        run: docker build -t "$IMAGE" -f Dockerfile.cutsell.worker .
      - name: Verify worker contract
        run: |
          set -euo pipefail
          grep -q -- '--worker-ttl 14400' Dockerfile.cutsell.worker
          docker run --rm --entrypoint python "$IMAGE" - <<'PY'
          import importlib.util
          if importlib.util.find_spec('openai') is not None:
              raise SystemExit('OpenAI SDK unexpectedly present')
          print('openai_sdk_absent=true')
          PY
      - name: Push immutable worker image
        run: docker push "$IMAGE"
      - name: Resolve digest
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" | tee image-inspect.txt
          digest=$(awk '/^Digest:/ {print $2; exit}' image-inspect.txt)
          test -n "$digest"
          echo "BENCHMARK41_IMAGE=$IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
          echo "BENCHMARK41_DIGEST=$digest" >> "$GITHUB_STEP_SUMMARY"
