name: Video 00 Round 19 Datacenter-Pinned GPU
run-name: Video 00 round-19 datacenter-pinned 00-02-03 benchmark

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/benchmark52-round7-controlled.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: cutsell-round19-datacenter-pinned
  cancel-in-progress: true

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RUNPOD_TEMPLATE_NAME: EditDNA-Worker-2
      SOURCE_SHA: f4ea2f9d5676d260205d6fe8364b99b35e4eed39
      IMAGE_DIGEST: sha256:57ce35db2eee1348576d6745608a71faeb6f8167d8ef4e2c0177d0033d1f91d4
      IMMUTABLE_IMAGE: ghcr.io/automatedretailservices/cutsell-worker:f4ea2f9d5676d260205d6fe8364b99b35e4eed39@sha256:57ce35db2eee1348576d6745608a71faeb6f8167d8ef4e2c0177d0033d1f91d4

    steps:
      - name: Publish exact Round 19 run id
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          content=$(printf '{"run_id":%s,"head_sha":"%s","source_sha":"%s","status":"in_progress"}' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$SOURCE_SHA" | base64 -w0)
          current=$(curl --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ops/round19-live.json?ref=cutsell/mobile-v1-clean")
          sha=$(printf '%s' "$current" | jq -r '.sha // empty')
          payload=$(jq -n --arg msg "ops: publish Round19 run $GITHUB_RUN_ID" --arg content "$content" --arg branch "cutsell/mobile-v1-clean" --arg sha "$sha" '{message:$msg,content:$content,branch:$branch} + (if $sha=="" then {} else {sha:$sha} end)')
          curl --fail --silent --show-error --request PUT --url "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ops/round19-live.json" --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "Content-Type: application/json" --data "$payload" >/dev/null
          echo "round19_run_id=$GITHUB_RUN_ID"

      - name: Checkout exact Round 19 operational commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install orchestration dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'requests>=2.32' 'redis>=5.0' 'rq>=2.6' 'boto3>=1.34'

      - name: Execute Round 19 datacenter-pinned benchmark
        shell: bash
        run: |
          set -euo pipefail
          python ops/round19_datacenter_pinned.py

      - name: Upload Round 19 capacity attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-round19-capacity-attempts
          path: capacity-attempts.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Round 19 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-focused-round19-report-${{ env.SOURCE_SHA }}
          path: |
            cutsell-focused-clean-cut-benchmark.json
            focused-result.json
            gold-selected.json
            round14-status.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Round 19 previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-focused-round19-previews-${{ env.SOURCE_SHA }}
          path: focused-previews/*.mp4
          retention-days: 14
          if-no-files-found: warn

      - name: Ensure no staging RunPod remains
        if: always()
        shell: bash
        run: |
          set +e
          curl --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output /tmp/pods-before-clean.json
          jq -r '.[] | select((.name // "") | startswith("cutsell-staging-worker")) | .id' /tmp/pods-before-clean.json | while read -r POD_ID; do
            [ -z "$POD_ID" ] && continue
            code=$(curl --silent --show-error --write-out '%{http_code}' --request DELETE --url "https://rest.runpod.io/v1/pods/$POD_ID" --header "Authorization: Bearer $RUNPOD_API_KEY" --output /tmp/delete.txt)
            echo "final_cleanup pod=$POD_ID http=$code"
          done
          sleep 4
          curl --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output /tmp/pods-after-clean.json
          remaining=$(jq '[.[] | select((.name // "") | startswith("cutsell-staging-worker"))] | length' /tmp/pods-after-clean.json)
          echo "remaining_staging_pods=$remaining"
          test "$remaining" = "0"
