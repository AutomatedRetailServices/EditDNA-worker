name: Video 00 Round 18 CPU Fallback
run-name: Video 00 round-18 direct-cpu 00-02-03 benchmark

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/benchmark52-round7-controlled.yml

permissions:
  contents: write
  actions: write

# Intentionally shares Round17's group so this run cancels the active RunPod attempt.
concurrency:
  group: cutsell-round17-public-bootstrap
  cancel-in-progress: true

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RUNPOD_TEMPLATE_NAME: EditDNA-Worker-2
      SOURCE_SHA: f4ea2f9d5676d260205d6fe8364b99b35e4eed39
      IMAGE_DIGEST: github-actions-cpu
      IMMUTABLE_IMAGE: github-actions-cpu

    steps:
      - name: Publish exact Round 18 run id
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          content=$(printf '{"run_id":%s,"head_sha":"%s","source_sha":"%s","status":"in_progress"}' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$SOURCE_SHA" | base64 -w0)
          current=$(curl --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ops/round18-live.json?ref=cutsell/mobile-v1-clean")
          sha=$(printf '%s' "$current" | jq -r '.sha // empty')
          payload=$(jq -n --arg msg "ops: publish Round18 run $GITHUB_RUN_ID" --arg content "$content" --arg branch "cutsell/mobile-v1-clean" --arg sha "$sha" '{message:$msg,content:$content,branch:$branch} + (if $sha=="" then {} else {sha:$sha} end)')
          curl --fail --silent --show-error --request PUT --url "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ops/round18-live.json" --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "Content-Type: application/json" --data "$payload" >/dev/null
          echo "round18_run_id=$GITHUB_RUN_ID"

      - name: Checkout exact operational commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare exact editorial source tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_SHA" --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          mkdir -p exact-source
          git archive "$SOURCE_SHA" cutsell_worker requirements.cutsell.worker.txt | tar -x -C exact-source
          test -f exact-source/requirements.cutsell.worker.txt
          test -d exact-source/cutsell_worker
          echo "exact_source_sha=$SOURCE_SHA"

      - name: Install CPU media runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3-dev ffmpeg git curl pkg-config libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev libavfilter-dev libswscale-dev libswresample-dev libgl1 libglib2.0-0
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r exact-source/requirements.cutsell.worker.txt
          python -m pip uninstall -y openai >/dev/null 2>&1 || true
          python - <<'PY'
          import cv2, mediapipe, faster_whisper
          print('cpu_runtime_imports=true')
          PY

      - name: Execute exact Round 18 CPU benchmark
        shell: bash
        run: |
          set -euo pipefail
          python ops/round18_cpu_fallback.py

      - name: Upload Round 18 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-focused-round18-report-${{ env.SOURCE_SHA }}
          path: |
            cutsell-focused-clean-cut-benchmark.json
            focused-result.json
            gold-selected.json
            round18-status.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Round 18 previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-focused-round18-previews-${{ env.SOURCE_SHA }}
          path: focused-previews/*.mp4
          retention-days: 14
          if-no-files-found: warn

      - name: Ensure no staging RunPod remains
        if: always()
        shell: bash
        run: |
          set +e
          curl --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output /tmp/pods.json
          jq -r '.[] | select((.name // "") | startswith("cutsell-staging-worker")) | .id' /tmp/pods.json | while read -r POD_ID; do
            [ -z "$POD_ID" ] && continue
            code=$(curl --silent --show-error --write-out '%{http_code}' --request DELETE --url "https://rest.runpod.io/v1/pods/$POD_ID" --header "Authorization: Bearer $RUNPOD_API_KEY" --output /tmp/delete.txt)
            echo "final_cleanup pod=$POD_ID http=$code"
          done
