name: CutSell Deepgram Five Full Trials

# Five explicitly authorized full RAW calls; no automatic paid reruns.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cutsell-video00-modal-raw-${{ github.ref }}
  cancel-in-progress: false

jobs:
  five-trials:
    if: >-
      github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'benchmark: authorized five Deepgram Video00 trials')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      CUTSELL_VALIDATION_ASR_PROVIDER: deepgram-nova-3-multi
      CUTSELL_STABILITY_PROVIDER: deepgram-nova-3-multi
    steps:
      - name: Checkout exact test head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install transport and CPU QA dependencies
        run: |
          pip install --disable-pip-version-check --quiet modal boto3 'numpy>=1.26,<3' 'requests>=2.32.3'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Freeze one configuration and preflight credentials and source
        id: prepare
        run: python benchmarks/run_video00_gpt_whisperx_stability.py prepare

      - name: Full engine trial 1 of 5
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: python benchmarks/run_video00_gpt_whisperx_stability.py trial 1

      - name: Package trial 1
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: python benchmarks/package_stability_trial.py 1
      - name: Preserve trial 1 reports
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: deepgram-five-1-reports
          path: stability-transfer/trial-1/reports/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0
      - name: Preserve trial 1 A
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: deepgram-five-1-A
          path: stability-transfer/trial-1/A/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0
      - name: Preserve trial 1 B
