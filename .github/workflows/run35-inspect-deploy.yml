name: Run35 Inspect Deploy

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/run35-inspect-deploy.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      TARGET_BENCHMARK_PREFIX: gold-32097024487-
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutsell/mobile-v1-clean
      - name: Inspect Run35 Pod and active RQ Gold job
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}" || exit 3
          test -n "${REDIS_URL:-}" || exit 3
          python -m pip install -q 'redis>=5.0' 'rq>=2.6'
          pods=$(curl --fail --silent --show-error --header "Authorization: Bearer $RUNPOD_API_KEY" https://rest.runpod.io/v1/pods)
          printf '%s' "$pods" > pods.json
          python - <<'PY'
          import json, os
          from redis import Redis
          from rq import Worker
          from rq.job import Job
          connection=Redis.from_url(os.environ['REDIS_URL'])
          target=os.environ['TARGET_BENCHMARK_PREFIX']
          workers=[]
          matched=None
          for w in Worker.all(connection=connection):
              current_id=getattr(w,'get_current_job_id',lambda:None)()
              item={
                  'name':w.name,
                  'state':w.get_state(),
                  'current_job_id':current_id,
                  'last_heartbeat':str(w.last_heartbeat) if w.last_heartbeat else None,
              }
              workers.append(item)
              if current_id:
                  try:
                      job=Job.fetch(current_id,connection=connection)
                      meta=dict(job.meta or {})
                      bid=str(meta.get('benchmark_id') or '')
                      if bid.startswith(target):
                          matched={
                              'job_id':current_id,
                              'status':getattr(job.get_status(refresh=True),'value',str(job.get_status(refresh=True))),
                              'meta':meta,
                              'result_type':type(job.result).__name__ if job.result is not None else None,
                          }
                  except Exception as exc:
                      item['job_error']=str(exc)
          pods=json.load(open('pods.json'))
          pod=next((p for p in pods if p.get('name')=='cutsell-staging-worker'),{})
          out={
              'pod':{k:pod.get(k) for k in ('id','name','desiredStatus','imageName','costPerHr')},
              'workers':workers,
              'matched_gold_job':matched,
          }
          os.makedirs('ops',exist_ok=True)
          json.dump(out,open('ops/run35-live-benchmark-inspect.json','w'),ensure_ascii=False,indent=2,default=str)
          print(json.dumps(out,ensure_ascii=False,indent=2,default=str))
          PY
      - name: Persist live inspection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/run35-live-benchmark-inspect.json
          git commit -m 'Record live Run35 Gold benchmark inspection'
          git pull --rebase origin cutsell/mobile-v1-clean
          git push origin HEAD:cutsell/mobile-v1-clean

# refresh inspection after benchmark start
