name: CutSell Five Trial Artifact Collection (CPU only)
on:
  push:
    branches: [feat/gpt-whisperx-video00]
    paths: [.github/workflows/cutsell-gpt-whisperx-collect.yml]
  workflow_dispatch:
    inputs:
      source_run_id:
        type: string
        required: true
        default: "36054192894"
permissions:
  contents: read
  actions: read
jobs:
  collect:
    if: >-
      github.run_attempt == 1 &&
      (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'collect(asr): retrieve five authorized trial artifacts without GPU')
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '36054192894' }}
    steps:
      - name: Checkout collector
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Retrieve trial 1 (read-only, no GPU)
        continue-on-error: true
        run: python benchmarks/collect_gpt_whisperx_artifacts.py 1
      - name: Preserve trial 1 JSON and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video00-gptwx-small-1
          path: collected/trial-1/reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve trial 1 video part A
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video00-gptwx-video-1-A
          path: collected/trial-1/parts/A
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - name: Preserve trial 1 video part B
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video00-gptwx-video-1-B
          path: collected/trial-1/parts/B
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - name: Preserve trial 1 video part C
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video00-gptwx-video-1-C
          path: collected/trial-1/parts/C
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - name: Retrieve trial 2 (read-only, no GPU)
