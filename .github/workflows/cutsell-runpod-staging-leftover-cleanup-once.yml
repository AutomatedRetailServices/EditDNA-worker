name: CutSell RunPod Staging Leftover Cleanup Once

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - ".cutsell/runpod-staging-leftover-cleanup-once.txt"

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      EXPECTED_IMAGE: ghcr.io/automatedretailservices/cutsell-worker:f1bc3adc4f2f8df0ae005fa551116dc4d08b30e6
    steps:
      - uses: actions/checkout@v4
      - name: Require exact cleanup marker
        run: grep -qx 'cleanup=cutsell-staging-leftover' .cutsell/runpod-staging-leftover-cleanup-once.txt
      - name: Identify and delete only exact CutSell staging worker leftovers
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}"
          curl --fail --silent --show-error --url 'https://rest.runpod.io/v1/pods' --header "Authorization: Bearer $RUNPOD_API_KEY" --output pods.json
          jq '[.[] | select(.name == "cutsell-staging-worker") | {id,name,desiredStatus,imageName}]' pods.json
          count=$(jq '[.[] | select(.name == "cutsell-staging-worker")] | length' pods.json)
          test "$count" -le 1 || { echo 'More than one CutSell staging worker exists; refusing bulk delete'; exit 4; }
          if [ "$count" = "0" ]; then echo 'No CutSell staging worker found'; exit 0; fi
          POD_ID=$(jq -r '[.[] | select(.name == "cutsell-staging-worker")][0].id' pods.json)
          IMAGE=$(jq -r '[.[] | select(.name == "cutsell-staging-worker")][0].imageName // empty' pods.json)
          test "$IMAGE" = "$EXPECTED_IMAGE" || { echo "Image mismatch: $IMAGE"; exit 5; }
          code=$(curl --silent --show-error --write-out '%{http_code}' --request DELETE --url "https://rest.runpod.io/v1/pods/$POD_ID" --header "Authorization: Bearer $RUNPOD_API_KEY" --output /tmp/delete.txt)
          echo "Deleted CutSell staging Pod $POD_ID; HTTP $code"
          test "$code" = "204"
          sleep 2
          curl --fail --silent --show-error --url 'https://rest.runpod.io/v1/pods' --header "Authorization: Bearer $RUNPOD_API_KEY" --output pods-after.json
          remaining=$(jq '[.[] | select(.name == "cutsell-staging-worker")] | length' pods-after.json)
          echo "remaining cutsell-staging-worker pods: $remaining"
          test "$remaining" = "0"
