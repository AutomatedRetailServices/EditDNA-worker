name: CutSell Gold Cycle Probe

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/cutsell-gold-cycle-probe.yml

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_SHA: 472aca0af1d49333b6531b25d067ffdad601f7b2
      RECOVERY_SHA: ee8ea08c0ea0de0216d11610964651930a04ed38
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutsell/mobile-v1-clean
          fetch-depth: 0
      - name: Capture exact Gold workflow runs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          original=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$ORIGINAL_SHA&per_page=100")
          recovery=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RECOVERY_SHA&per_page=100")
          original_run=$(printf '%s' "$original" | jq -c '[.workflow_runs[] | select(.name == "CutSell Gold Cycle One-Shot" and .event == "push")][0] // null')
          recovery_run=$(printf '%s' "$recovery" | jq -c '[.workflow_runs[] | select(.name == "CutSell Gold Cycle Recovery" and .event == "push")][0] // null')
          original_jobs='null'
          recovery_jobs='null'
          original_id=$(printf '%s' "$original_run" | jq -r '.id // empty')
          recovery_id=$(printf '%s' "$recovery_run" | jq -r '.id // empty')
          if [ -n "$original_id" ]; then original_jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$original_id/jobs?per_page=100"); fi
          if [ -n "$recovery_id" ]; then recovery_jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$recovery_id/jobs?per_page=100"); fi
          jq -n --argjson original "$original_run" --argjson recovery "$recovery_run" --argjson original_jobs "$original_jobs" --argjson recovery_jobs "$recovery_jobs" '{captured_at:(now|todate),original:(if $original==null then null else {id:$original.id,name:$original.name,status:$original.status,conclusion:$original.conclusion,head_sha:$original.head_sha,created_at:$original.created_at,updated_at:$original.updated_at} end),original_jobs:(if $original_jobs==null then [] else [$original_jobs.jobs[]|{id,name,status,conclusion,steps:[.steps[]?|{number,name,status,conclusion}]}] end),recovery:(if $recovery==null then null else {id:$recovery.id,name:$recovery.name,status:$recovery.status,conclusion:$recovery.conclusion,head_sha:$recovery.head_sha,created_at:$recovery.created_at,updated_at:$recovery.updated_at} end),recovery_jobs:(if $recovery_jobs==null then [] else [$recovery_jobs.jobs[]|{id,name,status,conclusion,steps:[.steps[]?|{number,name,status,conclusion}]}] end)}' > ops/gold-cycle-probe.json
          cat ops/gold-cycle-probe.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ops/gold-cycle-probe.json
          git commit -m "Record active Gold cycle probe" || exit 0
          git push origin HEAD:cutsell/mobile-v1-clean
