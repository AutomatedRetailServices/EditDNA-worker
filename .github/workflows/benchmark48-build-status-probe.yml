name: Benchmark 48 Build Status Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/benchmark48-build-status-probe.yml

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Show Benchmark 48 controlled build runs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --url "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/benchmark48-controlled-build.yml/runs?branch=cutsell%2Fmobile-v1-clean&per_page=5" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            | jq -c '.workflow_runs[] | {id,run_number,status,conclusion,head_sha,created_at,updated_at}'
