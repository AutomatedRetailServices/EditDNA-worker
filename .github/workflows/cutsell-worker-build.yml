name: Build CutSell GPU Worker Image

on:
  workflow_dispatch:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - ".cutsell/cutsell-worker-build-trigger.txt"

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/automatedretailservices/cutsell-worker:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build isolated CutSell worker image
        run: docker build -t "$IMAGE" -f Dockerfile.cutsell.worker .
      - name: Push immutable CutSell worker image
        run: docker push "$IMAGE"
      - name: Print image reference
        run: echo "$IMAGE"
