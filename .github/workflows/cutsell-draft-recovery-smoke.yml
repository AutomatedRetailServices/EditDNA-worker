name: CutSell Draft Recovery Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - cutsell/mobile-v1-asap-scope
    paths:
      - ".cutsell/draft-recovery-smoke-trigger.txt"

permissions:
  contents: read

jobs:
  validate-draft-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load masked Redis URL from RunPod template vault
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --url "https://rest.runpod.io/v1/templates" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output templates.json
          TEMPLATE=$(jq -c '[.[] | select(.name == "EditDNA-Worker-2")][0]' templates.json)
          test "$TEMPLATE" != "null" || (echo 'EditDNA-Worker-2 template not found' && exit 3)
          value=$(printf '%s' "$TEMPLATE" | jq -r '.env.REDIS_URL // empty')
          test -n "$value" || (echo 'REDIS_URL missing from RunPod template vault' && exit 4)
          echo "::add-mask::$value"
          printf 'REDIS_URL=%s\n' "$value" >> "$GITHUB_ENV"

      - name: Install Redis client
        run: pip install redis

      - name: Validate create autosave conflict recover cleanup
        shell: bash
        run: |
          python - <<'PY'
          import json
          from redis import Redis
          from cutsell_worker.draft_store import (
              DraftConflictError,
              create_initial_draft,
              draft_key,
              get_draft_snapshot,
              save_draft_snapshot,
          )

          user_id = 'cutsell-draft-smoke-user'
          project_id = 'cutsell-draft-smoke-project'
          draft = {
              'schema_version': 'cutsell.v1',
              'project_id': project_id,
              'strategy': 'mixed',
              'selected': [{
                  'clip_id': 'clip-1',
                  'source_asset_id': 'src-1',
                  'source_order': 0,
                  'start': 0.0,
                  'end': 1.0,
                  'text': 'AI draft',
                  'caption_text': 'AI draft',
                  'semantic_role': 'OTHER',
                  'selected': True,
              }],
              'alternates': [],
              'discarded': [],
              'diagnostics': {},
          }
          client = Redis.from_url(__import__('os').environ['REDIS_URL'])
          key = draft_key(user_id=user_id, project_id=project_id)
          client.delete(key)
          try:
              first, created = create_initial_draft(
                  user_id=user_id,
                  project_id=project_id,
                  draft=draft,
                  sources=[{'source_asset_id': 'src-1', 'uri': 's3://masked/source.mov'}],
                  client=client,
              )
              assert created and first['revision'] == 1
              edited = json.loads(json.dumps(draft))
              edited['selected'][0]['caption_text'] = 'Human edit'
              second = save_draft_snapshot(
                  user_id=user_id,
                  project_id=project_id,
                  draft=edited,
                  expected_revision=1,
                  client=client,
              )
              assert second['revision'] == 2
              try:
                  save_draft_snapshot(
                      user_id=user_id,
                      project_id=project_id,
                      draft=draft,
                      expected_revision=1,
                      client=client,
                  )
              except DraftConflictError:
                  stale_conflict = True
              else:
                  stale_conflict = False
              assert stale_conflict
              recovered = get_draft_snapshot(user_id=user_id, project_id=project_id, client=client)
              assert recovered['revision'] == 2
              assert recovered['draft']['selected'][0]['caption_text'] == 'Human edit'
              assert recovered['sources'][0]['source_asset_id'] == 'src-1'
              print(json.dumps({
                  'created_revision': first['revision'],
                  'autosaved_revision': second['revision'],
                  'stale_conflict': stale_conflict,
                  'recovered_revision': recovered['revision'],
              }, indent=2))
          finally:
              client.delete(key)
          PY
