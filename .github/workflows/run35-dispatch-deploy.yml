name: Run35 Dispatch Deploy

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/run35-dispatch-deploy.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch-and-observe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutsell/mobile-v1-clean
      - name: Dispatch exact Run35 deploy and wait for readiness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          code=$(curl --silent --show-error --write-out '%{http_code}' \
            --request POST \
            --url "$api/actions/workflows/cutsell-feature-runpod-one-shot-deploy.yml/dispatches" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "Content-Type: application/json" \
            --data '{"ref":"cutsell/mobile-v1-clean","inputs":{"approval_token":"RUN35"}}' \
            --output dispatch-response.txt)
          test "$code" = "204" || { echo "deploy dispatch failed HTTP $code"; cat dispatch-response.txt; exit 2; }
          run_id=""
          for i in $(seq 1 100); do
            runs=$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              "$api/actions/workflows/cutsell-feature-runpod-one-shot-deploy.yml/runs?branch=cutsell/mobile-v1-clean&event=workflow_dispatch&per_page=20")
            run_id=$(printf '%s' "$runs" | jq -r --arg started "$started" '[.workflow_runs[] | select(.created_at >= $started)][0].id // empty')
            status=$(printf '%s' "$runs" | jq -r --arg started "$started" '[.workflow_runs[] | select(.created_at >= $started)][0].status // empty')
            conclusion=$(printf '%s' "$runs" | jq -r --arg started "$started" '[.workflow_runs[] | select(.created_at >= $started)][0].conclusion // empty')
            if [ -n "$run_id" ] && [ "$status" = "completed" ]; then
              test "$conclusion" = "success" || { echo "Run35 deploy failed: $conclusion"; exit 3; }
              break
            fi
            sleep 10
          done
          test -n "$run_id" || { echo 'Run35 deploy run not found'; exit 4; }
          jobs=$(curl --fail --silent --show-error --header "Authorization: Bearer $GH_TOKEN" "$api/actions/runs/$run_id/jobs?per_page=20")
          job_id=$(printf '%s' "$jobs" | jq -r '[.jobs[] | select(.name == "deploy")][0].id // empty')
          test -n "$job_id" || { echo 'Run35 deploy job not found'; exit 5; }
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" "$api/actions/jobs/$job_id/logs" -o deploy35.log
          pod_id=$(grep -A8 '"name": "cutsell-staging-worker"' deploy35.log | grep '"id":' | tail -1 | sed -E 's/.*"id": "([^"]+)".*/\1/')
          test -n "$pod_id" || { echo 'Run35 Pod ID not found in deploy logs'; exit 6; }
          jq -n --argjson run_id "$run_id" --argjson job_id "$job_id" --arg pod_id "$pod_id" \
            '{run_id:$run_id,job_id:$job_id,conclusion:"success",pod_id:$pod_id,image_digest:"sha256:b4203baad91acb7c3e646590bc175ce8bc681be74c295d178e74c65382046c95"}' > run35-deploy-status.json
      - name: Persist Run35 deploy status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p ops
          mv run35-deploy-status.json ops/run35-deploy-status.json
          git add ops/run35-deploy-status.json
          git commit -m 'Record Run35 staging deploy'
          git push origin HEAD:cutsell/mobile-v1-clean
