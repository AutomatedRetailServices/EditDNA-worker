name: Benchmark 44 Progress Probe

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Read-only Benchmark 44 state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '--- staging pods ---'
          if [ -n "${RUNPOD_API_KEY:-}" ]; then
            curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output pods.json
            jq '[.[] | select(.name == "cutsell-staging-worker") | {id,name,desiredStatus,imageName,costPerHr,adjustedCostPerHr}]' pods.json
          else
            echo 'RUNPOD_API_KEY unavailable'
          fi
          echo '--- recent unseen benchmark runs ---'
          curl --fail --silent --show-error \
            --url "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/cutsell-unseen-clean-cut-benchmark.yml/runs?event=workflow_dispatch&branch=cutsell%2Fmobile-v1-clean&per_page=10" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output runs.json
          jq '[.workflow_runs[] | {id,run_number,status,conclusion,created_at,updated_at,head_sha,head_branch,event}]' runs.json
