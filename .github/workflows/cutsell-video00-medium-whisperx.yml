name: CutSell Video00 Watch Listen Medium WhisperX
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cutsell-video00-modal-raw-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    if: >-
      github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'benchmark: authorized Video00 Medium WhisperX Watch Listen')
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      UPLOAD_SINGLE_PROVIDER: medium-whisperx
      UPLOAD_EXPECTED_SHA: b37059b1790cf3eb0447bb54595cc99f6668aadc5f65dafa9cdf6181621ef9f5
      UPLOAD_EXPECTED_BYTES: "38700219"
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install CPU transport and media tools
        run: |
          pip install -q modal boto3 requests cryptography
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Prepare existing source configuration
        run: python benchmarks/run_uploaded_asr_comparison.py prepare-existing 'Editdna longform validation/VIDEO-2026-07-30-09-18-03.mp4'
      - name: Verify exact uploaded video before GPU
        id: source
        run: python benchmarks/run_uploaded_asr_comparison.py await-upload
      - name: Full engine with medium-whisperx
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        continue-on-error: true
        run: python benchmarks/run_uploaded_asr_comparison.py run medium-whisperx
      - name: Preserve medium-whisperx reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-medium-whisperx-reports
          path: uploaded-comparison-artifacts/medium-whisperx/reports/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve medium-whisperx A
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-medium-whisperx-A
          path: uploaded-comparison-artifacts/medium-whisperx/A/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve medium-whisperx B
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-medium-whisperx-B
          path: uploaded-comparison-artifacts/medium-whisperx/B/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve medium-whisperx C
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-medium-whisperx-C
          path: uploaded-comparison-artifacts/medium-whisperx/C/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve medium-whisperx D
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-medium-whisperx-D
          path: uploaded-comparison-artifacts/medium-whisperx/D/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve medium-whisperx E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-medium-whisperx-E
          path: uploaded-comparison-artifacts/medium-whisperx/E/
          retention-days: 14
