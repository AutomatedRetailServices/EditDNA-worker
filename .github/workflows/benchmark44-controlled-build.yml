name: Benchmark 44 Controlled Worker Build

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/benchmark44-controlled-build.yml

permissions:
  contents: read
  packages: write

jobs:
  docker:
    if: github.event.pull_request.number == 25 && github.event.pull_request.head.ref == 'cutsell/mobile-v1-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: 9ef1b71aca1b6fa15d70a8a3a20a781c3a54f68c
      IMAGE: ghcr.io/automatedretailservices/cutsell-worker:9ef1b71aca1b6fa15d70a8a3a20a781c3a54f68c
    steps:
      - name: Guard exact PR source
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.number }}" = "25"
          test "${{ github.event.pull_request.head.ref }}" = "cutsell/mobile-v1-clean"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify validated source is current ancestor
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD || { echo 'Validated source is not an ancestor of PR head'; exit 2; }

      - name: Checkout exact validated source
        run: git checkout --detach "$SOURCE_SHA"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build exactly one Benchmark 44 worker image
        run: docker build -t "$IMAGE" -f Dockerfile.cutsell.worker .

      - name: Prove OpenAI SDK is absent from worker image
        run: |
          docker run --rm --entrypoint python "$IMAGE" - <<'PY'
          import importlib.util
          if importlib.util.find_spec('openai') is not None:
              raise SystemExit('OpenAI SDK unexpectedly present in RunPod worker image')
          print('openai_sdk_absent=true')
          PY

      - name: Push exact Benchmark 44 worker image
        run: docker push "$IMAGE"

      - name: Resolve immutable image digest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" | tee image-inspect.txt
          digest=$(awk '/^Digest:/ {print $2; exit}' image-inspect.txt)
          test -n "$digest" || { echo 'Unable to resolve pushed image digest'; exit 9; }
          case "$digest" in sha256:[0-9a-f][0-9a-f]*) ;; *) echo 'Invalid worker digest'; exit 9;; esac
          echo "BENCHMARK44_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "BENCHMARK44_IMAGE=$IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
          echo "Benchmark 44 immutable image: $IMAGE@$digest"

# controlled trigger: exactly one paid Benchmark 44 image build
