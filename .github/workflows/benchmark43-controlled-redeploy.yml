name: Benchmark 43 Controlled Redeploy

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/benchmark43-controlled-redeploy.yml

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  deploy-and-dispatch:
    if: github.event.pull_request.number == 25 && github.event.pull_request.head.ref == 'cutsell/mobile-v1-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RUNPOD_TEMPLATE_NAME: EditDNA-Worker-2
      SOURCE_SHA: 7d35486b23aa0546107f1a35b7fd71ec4f96ab36
      IMAGE: ghcr.io/automatedretailservices/cutsell-worker@sha256:ef45aeb96d09c48d65a2428e22d341536e78a8758387df1e75f24b90d0225972
      BENCHMARK_WORKFLOW: cutsell-unseen-clean-cut-benchmark.yml
      BENCHMARK_BRANCH: cutsell/mobile-v1-clean
      BENCHMARK_DISPATCHED: "0"
    steps:
      - name: Checkout and guard exact PR source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify approved immutable source and image
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.number }}" = "25"
          test "${{ github.event.pull_request.head.ref }}" = "cutsell/mobile-v1-clean"
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD || { echo 'Approved Benchmark 43 source is not an ancestor of PR head'; exit 2; }
          case "$IMAGE" in *@sha256:*) ;; *) echo 'Benchmark 43 image must be immutable'; exit 2;; esac

      - name: Validate paid runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}" || { echo 'RUNPOD_API_KEY missing'; exit 3; }
          test -n "${REDIS_URL:-}" || { echo 'REDIS_URL missing'; exit 3; }
          test -n "${GEMINI_API_KEY:-}" || { echo 'GEMINI_API_KEY missing'; exit 3; }
          echo "::add-mask::$GEMINI_API_KEY"

      - name: Refuse duplicate staging worker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output pods-before.json
          count=$(jq '[.[] | select(.name == "cutsell-staging-worker")] | length' pods-before.json)
          test "$count" = "0" || { echo 'cutsell-staging-worker already exists; refusing duplicate paid worker'; exit 4; }

      - name: Install RQ orchestration client and snapshot workers
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'redis>=5.0' 'rq>=2.6'
          python - <<'PY'
          import json, os
          from redis import Redis
          from rq import Worker
          connection = Redis.from_url(os.environ['REDIS_URL'])
          names = sorted(worker.name for worker in Worker.all(connection=connection))
          json.dump(names, open('preexisting-workers.json', 'w', encoding='utf-8'))
          print('Preexisting RQ workers:', names)
          PY

      - name: Build safe runtime baseline from EditDNA-Worker-2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/templates" --header "Authorization: Bearer $RUNPOD_API_KEY" --output templates.json
          TEMPLATE=$(jq -c --arg name "$RUNPOD_TEMPLATE_NAME" '[.[] | select(.name == $name)][0]' templates.json)
          test "$TEMPLATE" != "null" || { echo 'RunPod baseline template not found'; exit 5; }
          printf '%s' "$TEMPLATE" | jq -c '{ASR_DEVICE:.env.ASR_DEVICE,ASR_ENABLED:.env.ASR_ENABLED,BAD_TAKES_ENABLED:.env.BAD_TAKES_ENABLED,BOUNDARY_REFINER_ENABLED:.env.BOUNDARY_REFINER_ENABLED,BOUNDARY_REFINER_HEAD_STEP_SEC:.env.BOUNDARY_REFINER_HEAD_STEP_SEC,BOUNDARY_REFINER_MIN_DURATION_SEC:.env.BOUNDARY_REFINER_MIN_DURATION_SEC,BOUNDARY_REFINER_TAIL_STEP_SEC:.env.BOUNDARY_REFINER_TAIL_STEP_SEC,FFMPEG_BIN:.env.FFMPEG_BIN,FFPROBE_BIN:.env.FFPROBE_BIN,HEAD_TRIM_SEC:.env.HEAD_TRIM_SEC,PRESIGN_EXPIRES:.env.PRESIGN_EXPIRES,PYTHONPATH:.env.PYTHONPATH,S3_ACL:.env.S3_ACL,S3_BUCKET:.env.S3_BUCKET,S3_PREFIX:.env.S3_PREFIX,TAIL_TRIM_SEC:.env.TAIL_TRIM_SEC,VISION_ENABLED:.env.VISION_ENABLED,VISION_INTERVAL_SEC:.env.VISION_INTERVAL_SEC,VISION_MAX_SAMPLES:.env.VISION_MAX_SAMPLES,VISUAL_BAD_THRESHOLD:.env.VISUAL_BAD_THRESHOLD,WHISPER_DEVICE:.env.WHISPER_DEVICE,WHISPER_MODEL:.env.WHISPER_MODEL,W_FACE:.env.W_FACE,W_VISION:.env.W_VISION,W_VISUAL:.env.W_VISUAL,AWS_ACCESS_KEY_ID:.env.AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY:.env.AWS_SECRET_ACCESS_KEY,AWS_REGION:.env.AWS_REGION} | with_entries(select(.value != null and .value != ""))' > safe-template-env.json
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_BUCKET; do
            value=$(jq -r --arg key "$key" '.[$key] // empty' safe-template-env.json)
            test -n "$value" || { echo "$key missing from EditDNA-Worker-2"; exit 6; }
            echo "::add-mask::$value"
          done
          CONTAINER_DISK=30
          VOLUME_GB=20
          VOLUME_MOUNT=$(printf '%s' "$TEMPLATE" | jq -r '.volumeMountPath // "/workspace"')
          printf 'CONTAINER_DISK=%s\nVOLUME_GB=%s\nVOLUME_MOUNT=%s\n' "$CONTAINER_DISK" "$VOLUME_GB" "$VOLUME_MOUNT" >> "$GITHUB_ENV"

      - name: Create exactly one Benchmark 43 staging GPU worker
        shell: bash
        run: |
          set -euo pipefail
          jq --arg name "cutsell-staging-worker" --arg image "$IMAGE" --arg redis "$REDIS_URL" --arg gemini "$GEMINI_API_KEY" --arg mount "$VOLUME_MOUNT" --argjson disk "$CONTAINER_DISK" --argjson volume "$VOLUME_GB" '. + {REDIS_URL:$redis,GEMINI_API_KEY:$gemini,CUTSELL_BRAIN_BACKEND:"runpod_local",CUTSELL_EDITORIAL_MODE:"clean_cut",CUTSELL_ASR_MODEL:"medium",CUTSELL_CLEAN_CUT_JUDGE:"0",CUTSELL_HYBRID_PROVIDER:"google",CUTSELL_HYBRID_LLM_ENABLED:"1",CUTSELL_HYBRID_PRIMARY_MODEL:"gemini-3.5-flash-lite",CUTSELL_HYBRID_ESCALATION_MODEL:"gemini-3.6-flash",CUTSELL_HYBRID_MAX_SESSION_USD:"0.0075",CUTSELL_HYBRID_TEST_BUDGET_USD:"0.50"} | {name:$name,imageName:$image,cloudType:"COMMUNITY",computeType:"GPU",gpuCount:1,gpuTypeIds:["NVIDIA RTX A5000","NVIDIA RTX A4000","NVIDIA L4","NVIDIA A40","NVIDIA RTX A6000","NVIDIA GeForce RTX 3090","NVIDIA GeForce RTX 4090"],gpuTypePriority:"custom",interruptible:false,containerDiskInGb:$disk,volumeInGb:$volume,volumeMountPath:$mount,env:.}' safe-template-env.json > create-pod.json
          forbidden=$(jq -r '.env | keys[]' create-pod.json | grep -E '^(OPENAI_API_KEY|EDITDNA_USE_LLM|EDITDNA_LLM_MODEL|TAKE_JUDGE_PROVIDER|TAKE_JUDGE_MODEL)$' || true)
          test -z "$forbidden" || { echo "Refusing deployment: forbidden OpenAI/legacy provider key present: $forbidden"; exit 7; }
          code=$(curl --silent --show-error --write-out '%{http_code}' --request POST --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --header "Content-Type: application/json" --data @create-pod.json --output pod.json)
          rm -f create-pod.json safe-template-env.json
          test "$code" = "201" || { echo "RunPod create HTTP status: $code"; jq '{error,errors,message}' pod.json || true; exit 8; }
          POD_ID=$(jq -r '.id // empty' pod.json)
          test -n "$POD_ID" || { echo 'RunPod returned no Pod id'; exit 8; }
          echo "POD_ID=$POD_ID" >> "$GITHUB_ENV"
          echo "BENCHMARK43_POD_ID=$POD_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "BENCHMARK43_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "BENCHMARK43_IMAGE=$IMAGE" >> "$GITHUB_STEP_SUMMARY"
          jq '{id,name,desiredStatus,imageName,costPerHr,adjustedCostPerHr}' pod.json || true

      - name: Confirm exact staging Pod and immutable image
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods/$POD_ID" --header "Authorization: Bearer $RUNPOD_API_KEY" --output exact-pod.json
          test "$(jq -r '.name' exact-pod.json)" = "cutsell-staging-worker"
          actual_image=$(jq -r '.imageName // empty' exact-pod.json)
          test "$actual_image" = "$IMAGE" || { echo "Unexpected Pod image: $actual_image"; exit 9; }
          jq '{id,name,desiredStatus,imageName,costPerHr,adjustedCostPerHr}' exact-pod.json

      - name: Wait for a fresh RQ worker from immutable image CMD
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from datetime import datetime, timezone
          from redis import Redis
          from rq import Worker
          connection = Redis.from_url(os.environ['REDIS_URL'])
          baseline = set(json.load(open('preexisting-workers.json', encoding='utf-8')))
          deadline = time.time() + 900
          while time.time() < deadline:
              workers = Worker.all(connection=connection)
              now = datetime.now(timezone.utc)
              for worker in workers:
                  if worker.name in baseline:
                      continue
                  heartbeat = worker.last_heartbeat
                  if heartbeat is None:
                      continue
                  if heartbeat.tzinfo is None:
                      heartbeat = heartbeat.replace(tzinfo=timezone.utc)
                  age = (now - heartbeat).total_seconds()
                  if age <= 30 and worker.get_state() in {'idle','busy'}:
                      print('Fresh Benchmark 43 RQ worker:', worker.name, 'heartbeat_age_sec=', round(age, 2))
                      raise SystemExit(0)
              time.sleep(10)
          raise SystemExit('Exact RunPod Pod exists but immutable image CMD did not register a fresh RQ worker within 15 minutes')
          PY

      - name: Dispatch exactly one Benchmark 43 run and capture its run ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${{ github.repository }}"
          RUNS_URL="$API/actions/workflows/$BENCHMARK_WORKFLOW/runs?event=workflow_dispatch&branch=$BENCHMARK_BRANCH&per_page=50"
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$RUNS_URL" | jq '[.workflow_runs[].id]' > benchmark-before-ids.json
          body=$(jq -nc --arg ref "$BENCHMARK_BRANCH" --arg pod "$POD_ID" '{ref:$ref,inputs:{approval_token:"RUN39",pod_id:$pod}}')
          code=$(curl --silent --show-error --write-out '%{http_code}' --request POST --url "$API/actions/workflows/$BENCHMARK_WORKFLOW/dispatches" -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' --data "$body" --output dispatch-response.txt)
          test "$code" = "204" || { echo "Benchmark dispatch HTTP status: $code"; cat dispatch-response.txt; exit 10; }
          echo 'BENCHMARK_DISPATCHED=1' >> "$GITHUB_ENV"
          run_id=''
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$RUNS_URL" > benchmark-after.json
            run_id=$(jq -r --slurpfile before benchmark-before-ids.json '[.workflow_runs[] | select((.id as $id | ($before[0] | index($id))) == null)] | sort_by(.created_at) | last | .id // empty' benchmark-after.json)
            if [ -n "$run_id" ]; then break; fi
            sleep 2
          done
          test -n "$run_id" || { echo 'Benchmark was dispatched but its new run ID could not be resolved'; exit 11; }
          echo "BENCHMARK43_RUN_ID=$run_id" >> "$GITHUB_STEP_SUMMARY"
          echo "Benchmark 43 dispatched: run_id=$run_id pod_id=$POD_ID source_sha=$SOURCE_SHA image=$IMAGE"

      - name: Cleanup exact Pod only if benchmark was not dispatched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${BENCHMARK_DISPATCHED:-0}" = "1" ]; then
            echo 'Benchmark dispatched; exact Pod ownership transferred to benchmark cleanup.'
            exit 0
          fi
          [ -n "${POD_ID:-}" ] || { echo 'No Pod was created; nothing to clean up.'; exit 0; }
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output cleanup-pods.json
          name=$(jq -r --arg id "$POD_ID" '[.[] | select(.id == $id)][0].name // empty' cleanup-pods.json)
          [ -n "$name" ] || { echo "Exact Pod already absent: $POD_ID"; exit 0; }
          test "$name" = "cutsell-staging-worker" || { echo 'Exact Pod ID is not cutsell-staging-worker; refusing unsafe cleanup'; exit 12; }
          code=$(curl --silent --show-error --write-out '%{http_code}' --request DELETE --url "https://rest.runpod.io/v1/pods/$POD_ID" --header "Authorization: Bearer $RUNPOD_API_KEY" --output cleanup-delete.txt)
          test "$code" = "204"
          sleep 2
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output cleanup-after.json
          remaining=$(jq --arg id "$POD_ID" '[.[] | select(.id == $id)] | length' cleanup-after.json)
          test "$remaining" = "0" || { echo 'Exact Pod still present after cleanup'; exit 13; }
          echo "Exact Pod deleted and verified absent: $POD_ID"
