name: Benchmark 47 Controlled Deploy and Dispatch
run-name: Benchmark 47 exact deploy and single dispatch

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/benchmark47-controlled-deploy-dispatch.yml

permissions:
  contents: read
  actions: write

jobs:
  deploy-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RUNPOD_TEMPLATE_NAME: EditDNA-Worker-2
      SOURCE_SHA: aaf059f078c0c75277242ca94706ec3bf99a960d
      IMAGE: ghcr.io/automatedretailservices/cutsell-worker@sha256:ea85782ac5d6783337ba7e5ae4b6e96d0f804697efd049e08377328448d7e1fd
      BENCHMARK_WORKFLOW: cutsell-unseen-clean-cut-benchmark.yml
    steps:
      - name: Validate exact approved runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}" || { echo 'RUNPOD_API_KEY missing'; exit 3; }
          test -n "${REDIS_URL:-}" || { echo 'REDIS_URL missing'; exit 3; }
          test -n "${GEMINI_API_KEY:-}" || { echo 'GEMINI_API_KEY missing'; exit 3; }
          test "$SOURCE_SHA" = "aaf059f078c0c75277242ca94706ec3bf99a960d"
          test "$IMAGE" = "ghcr.io/automatedretailservices/cutsell-worker@sha256:ea85782ac5d6783337ba7e5ae4b6e96d0f804697efd049e08377328448d7e1fd"
          echo "::add-mask::$GEMINI_API_KEY"
          echo "BENCHMARK47_SOURCE_SHA=$SOURCE_SHA"
          echo "BENCHMARK47_IMAGE=$IMAGE"

      - name: Refuse duplicate staging worker and snapshot existing RQ workers
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output pods-before.json
          count=$(jq '[.[] | select(.name == "cutsell-staging-worker")] | length' pods-before.json)
          test "$count" = "0" || { echo 'cutsell-staging-worker already exists; refusing duplicate paid worker'; exit 4; }
          python -m pip install -q 'redis>=5.0' 'rq>=2.6'
          python - <<'PY'
          import json, os
          from redis import Redis
          from rq import Worker
          connection = Redis.from_url(os.environ['REDIS_URL'])
          names = sorted(worker.name for worker in Worker.all(connection=connection))
          with open('workers-before.json', 'w', encoding='utf-8') as handle:
              json.dump(names, handle)
          print('Pre-existing RQ workers:', names)
          PY

      - name: Build safe runtime baseline from EditDNA-Worker-2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/templates" --header "Authorization: Bearer $RUNPOD_API_KEY" --output templates.json
          TEMPLATE=$(jq -c --arg name "$RUNPOD_TEMPLATE_NAME" '[.[] | select(.name == $name)][0]' templates.json)
          test "$TEMPLATE" != "null" || { echo 'RunPod baseline template not found'; exit 5; }
          printf '%s' "$TEMPLATE" | jq -c '{ASR_DEVICE:.env.ASR_DEVICE,ASR_ENABLED:.env.ASR_ENABLED,BAD_TAKES_ENABLED:.env.BAD_TAKES_ENABLED,BOUNDARY_REFINER_ENABLED:.env.BOUNDARY_REFINER_ENABLED,BOUNDARY_REFINER_HEAD_STEP_SEC:.env.BOUNDARY_REFINER_HEAD_STEP_SEC,BOUNDARY_REFINER_MIN_DURATION_SEC:.env.BOUNDARY_REFINER_MIN_DURATION_SEC,BOUNDARY_REFINER_TAIL_STEP_SEC:.env.BOUNDARY_REFINER_TAIL_STEP_SEC,FFMPEG_BIN:.env.FFMPEG_BIN,FFPROBE_BIN:.env.FFPROBE_BIN,HEAD_TRIM_SEC:.env.HEAD_TRIM_SEC,PRESIGN_EXPIRES:.env.PRESIGN_EXPIRES,PYTHONPATH:.env.PYTHONPATH,S3_ACL:.env.S3_ACL,S3_BUCKET:.env.S3_BUCKET,S3_PREFIX:.env.S3_PREFIX,TAIL_TRIM_SEC:.env.TAIL_TRIM_SEC,VISION_ENABLED:.env.VISION_ENABLED,VISION_INTERVAL_SEC:.env.VISION_INTERVAL_SEC,VISION_MAX_SAMPLES:.env.VISION_MAX_SAMPLES,VISUAL_BAD_THRESHOLD:.env.VISUAL_BAD_THRESHOLD,WHISPER_DEVICE:.env.WHISPER_DEVICE,WHISPER_MODEL:.env.WHISPER_MODEL,W_FACE:.env.W_FACE,W_VISION:.env.W_VISION,W_VISUAL:.env.W_VISUAL,AWS_ACCESS_KEY_ID:.env.AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY:.env.AWS_SECRET_ACCESS_KEY,AWS_REGION:.env.AWS_REGION} | with_entries(select(.value != null and .value != ""))' > safe-template-env.json
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_BUCKET; do
            value=$(jq -r --arg key "$key" '.[$key] // empty' safe-template-env.json)
            test -n "$value" || { echo "$key missing from EditDNA-Worker-2"; exit 6; }
            echo "::add-mask::$value"
          done
          CONTAINER_DISK=30
          VOLUME_GB=20
          VOLUME_MOUNT=$(printf '%s' "$TEMPLATE" | jq -r '.volumeMountPath // "/workspace"')
          printf 'CONTAINER_DISK=%s\nVOLUME_GB=%s\nVOLUME_MOUNT=%s\n' "$CONTAINER_DISK" "$VOLUME_GB" "$VOLUME_MOUNT" >> "$GITHUB_ENV"

      - name: Create exactly one Benchmark 47 staging worker using baked image CMD
        id: create
        shell: bash
        run: |
          set -euo pipefail
          jq --arg name "cutsell-staging-worker" --arg image "$IMAGE" --arg redis "$REDIS_URL" --arg gemini "$GEMINI_API_KEY" --arg mount "$VOLUME_MOUNT" --argjson disk "$CONTAINER_DISK" --argjson volume "$VOLUME_GB" '. + {REDIS_URL:$redis,GEMINI_API_KEY:$gemini,CUTSELL_BRAIN_BACKEND:"runpod_local",CUTSELL_EDITORIAL_MODE:"clean_cut",CUTSELL_ASR_MODEL:"medium",CUTSELL_CLEAN_CUT_JUDGE:"0",CUTSELL_HYBRID_PROVIDER:"google",CUTSELL_HYBRID_LLM_ENABLED:"1",CUTSELL_HYBRID_PRIMARY_MODEL:"gemini-3.5-flash-lite",CUTSELL_HYBRID_ESCALATION_MODEL:"gemini-3.6-flash",CUTSELL_HYBRID_MAX_SESSION_USD:"0.0075",CUTSELL_HYBRID_TEST_BUDGET_USD:"0.50"} | {name:$name,imageName:$image,cloudType:"COMMUNITY",computeType:"GPU",gpuCount:1,gpuTypeIds:["NVIDIA RTX A5000","NVIDIA RTX A4000","NVIDIA L4","NVIDIA A40","NVIDIA RTX A6000","NVIDIA GeForce RTX 3090","NVIDIA GeForce RTX 4090"],gpuTypePriority:"custom",interruptible:false,containerDiskInGb:$disk,volumeInGb:$volume,volumeMountPath:$mount,env:.}' safe-template-env.json > create-pod.json
          if jq -e '.env | has("OPENAI_API_KEY") or has("EDITDNA_USE_LLM") or has("EDITDNA_LLM_MODEL")' create-pod.json >/dev/null; then
            echo 'Refusing deployment: forbidden OpenAI/legacy provider key present'; exit 7
          fi
          if jq -e 'has("dockerEntrypoint") or has("dockerStartCmd")' create-pod.json >/dev/null; then
            echo 'Refusing deployment: baked Docker CMD must remain authoritative'; exit 7
          fi
          code=$(curl --silent --show-error --write-out '%{http_code}' --request POST --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --header "Content-Type: application/json" --data @create-pod.json --output pod.json)
          rm -f create-pod.json safe-template-env.json
          test "$code" = "201" || { echo "RunPod create HTTP status: $code"; jq '{error,errors,message}' pod.json || true; exit 8; }
          POD_ID=$(jq -r '.id // empty' pod.json)
          test -n "$POD_ID" || { echo 'RunPod returned no Pod id'; exit 8; }
          echo "pod_id=$POD_ID" >> "$GITHUB_OUTPUT"
          echo "POD_ID=$POD_ID" >> "$GITHUB_ENV"
          echo "BENCHMARK47_POD_ID=$POD_ID"
          jq '{id,name,desiredStatus,imageName,costPerHr,adjustedCostPerHr}' pod.json || true

      - name: Confirm exact Pod image and wait for a fresh RQ worker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods/$POD_ID" --header "Authorization: Bearer $RUNPOD_API_KEY" --output exact-pod.json
          test "$(jq -r '.id' exact-pod.json)" = "$POD_ID"
          test "$(jq -r '.name' exact-pod.json)" = "cutsell-staging-worker"
          test "$(jq -r '.imageName' exact-pod.json)" = "$IMAGE"
          jq '{id,name,desiredStatus,imageName,costPerHr,adjustedCostPerHr}' exact-pod.json
          python - <<'PY'
          import json, os, time
          from datetime import datetime, timezone
          from redis import Redis
          from rq import Worker
          connection = Redis.from_url(os.environ['REDIS_URL'])
          before = set(json.load(open('workers-before.json', encoding='utf-8')))
          deadline = time.time() + 600
          while time.time() < deadline:
              now = datetime.now(timezone.utc)
              fresh = []
              for worker in Worker.all(connection=connection):
                  heartbeat = worker.last_heartbeat
                  if heartbeat is None:
                      continue
                  if heartbeat.tzinfo is None:
                      heartbeat = heartbeat.replace(tzinfo=timezone.utc)
                  age = (now - heartbeat).total_seconds()
                  if age <= 30 and worker.get_state() in {'idle','busy'} and worker.name not in before:
                      fresh.append((worker.name, round(age, 1), worker.get_state()))
              if fresh:
                  print('Fresh Benchmark 47 RQ worker:', fresh)
                  raise SystemExit(0)
              time.sleep(10)
          raise SystemExit('Benchmark 47 Pod exists but no newly registered fresh RQ worker appeared within 10 minutes')
          PY

      - name: Dispatch exactly one unseen Clean Cut benchmark
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          before=$(curl --fail --silent --show-error --url "$api/actions/workflows/$BENCHMARK_WORKFLOW/runs?branch=cutsell%2Fmobile-v1-clean&event=workflow_dispatch&per_page=20" --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28")
          printf '%s' "$before" | jq '[.workflow_runs[].id]' > benchmark-before-ids.json
          dispatch_epoch=$(date -u +%s)
          code=$(curl --silent --show-error --write-out '%{http_code}' --request POST --url "$api/actions/workflows/$BENCHMARK_WORKFLOW/dispatches" --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" --header "Content-Type: application/json" --data "$(jq -nc --arg ref 'cutsell/mobile-v1-clean' --arg pod "$POD_ID" '{ref:$ref,inputs:{approval_token:"RUN39",pod_id:$pod}}')" --output dispatch-response.txt)
          test "$code" = "204" || { echo "Benchmark dispatch HTTP status: $code"; cat dispatch-response.txt; exit 9; }
          echo "dispatched=1" >> "$GITHUB_OUTPUT"
          found=""
          for attempt in $(seq 1 30); do
            runs=$(curl --fail --silent --show-error --url "$api/actions/workflows/$BENCHMARK_WORKFLOW/runs?branch=cutsell%2Fmobile-v1-clean&event=workflow_dispatch&per_page=20" --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28")
            found=$(jq -r --slurpfile old benchmark-before-ids.json --argjson epoch "$dispatch_epoch" '[.workflow_runs[] | select((.id as $id | ($old[0] | index($id)) == null)) | select((.created_at | fromdateiso8601) >= ($epoch - 5))] | sort_by(.created_at) | .[0].id // empty' <<<"$runs")
            if [ -n "$found" ]; then break; fi
            sleep 2
          done
          test -n "$found" || { echo 'Benchmark dispatch succeeded but exact new run ID could not be resolved'; exit 10; }
          echo "benchmark_run_id=$found" >> "$GITHUB_OUTPUT"
          echo "BENCHMARK47_RUN_ID=$found"
          echo "BENCHMARK47_POD_ID=$POD_ID"

      - name: Verify dispatched benchmark owns exact Pod input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BENCHMARK_RUN_ID: ${{ steps.dispatch.outputs.benchmark_run_id }}
        run: |
          set -euo pipefail
          test -n "$BENCHMARK_RUN_ID"
          curl --fail --silent --show-error --url "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$BENCHMARK_RUN_ID" --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" | jq -c '{id,name,event,status,conclusion,head_branch,head_sha,created_at}'
          echo "Benchmark 47 dispatched exactly once: run=$BENCHMARK_RUN_ID pod=$POD_ID"

      - name: Delete exact Pod if dispatch did not complete
        if: failure() && steps.create.outputs.pod_id != '' && steps.dispatch.outputs.dispatched != '1'
        shell: bash
        run: |
          set -euo pipefail
          id="${{ steps.create.outputs.pod_id }}"
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output cleanup-before.json
          name=$(jq -r --arg id "$id" '[.[] | select(.id == $id)][0].name // empty' cleanup-before.json)
          if [ -z "$name" ]; then echo "RunPod Pod already absent: $id"; exit 0; fi
          test "$name" = "cutsell-staging-worker" || { echo 'Refusing cleanup: exact Pod name mismatch'; exit 11; }
          code=$(curl --silent --show-error --write-out '%{http_code}' --request DELETE --url "https://rest.runpod.io/v1/pods/$id" --header "Authorization: Bearer $RUNPOD_API_KEY" --output cleanup-delete.txt)
          echo "RunPod cleanup DELETE status: $code"
          test "$code" = "204"
          sleep 2
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output cleanup-after.json
          remaining=$(jq --arg id "$id" '[.[] | select(.id == $id)] | length' cleanup-after.json)
          test "$remaining" = "0" || { echo 'Staging Pod still present after cleanup'; exit 12; }
          echo "RunPod staging Pod deleted and verified absent: $id"
