name: CutSell shop idea demo (paid, on request only)

# PO 18 Nov 2026 ("ok"): one real "My idea" read (~US$0.02, one Sonnet look). Runs ONLY on a push
# to shop-idea/request; one attempt. Pictures and the result stay in the private bucket; the log has counts only.
on:
  push:
    branches: [shop-idea/request]

permissions:
  contents: read

concurrency:
  group: cutsell-shop-idea-demo
  cancel-in-progress: false

jobs:
  demo:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check --quiet modal==1.6.3 boto3 requests
      - env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: modal run modal_shop_idea_demo.py
