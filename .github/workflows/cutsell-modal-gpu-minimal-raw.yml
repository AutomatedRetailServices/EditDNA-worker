name: CutSell Modal GPU MINIMAL VALIDATION (D-043 first live test)

# D-043: CutSell Modal GPU execution -- first live validation. Adds Modal
# as an ADDITIONAL GPU execution backend for CutSell QA, alongside RunPod
# Serverless and RunPod Pod (both untouched, both stay fully available).
#
# This workflow runs ONLY the minimal Modal L4 smoke test
# (modal_gpu_minimal_test.py) -- it does NOT run Video00 and does NOT
# touch any CutSell editorial code. See that file's own module docstring
# for the image/runtime-reuse audit (same base image as
# Dockerfile.cutsell.serverless, no silently divergent torch/CUDA/ffmpeg
# versions) and why this test invokes Modal via its own `modal run` CLI
# rather than an in-process SDK call.
#
# Cost safety: exactly one approved GPU type (L4, enforced by
# modal_gpu_config.require_modal_gpu_type at import time -- the workflow
# itself never overrides it), a bounded function timeout, and no
# persistent resource -- Modal's serverless GPU functions scale to zero
# automatically once this ephemeral `modal run` invocation completes.
#
# Independent from every RunPod QA workflow (cutsell-video00-pod-raw.yml,
# cutsell-video00-pod-direct-raw.yml, cutsell-pod-minimal-isolation-raw.yml)
# and from RunPod Serverless -- does not touch any of them.
#
# Bootstrap note: GitHub's workflow_dispatch REST API 404s for a workflow
# that has never completed a run via any trigger. A narrow, self-scoped
# `push:` trigger (limited to this file's own path) registers the
# workflow on its first push; the actual Modal-invoking steps are
# explicitly gated to `workflow_dispatch` so that bootstrap run stays
# genuinely inert (MODAL_TOKEN_ID/SECRET come from repo secrets
# regardless of trigger type, so without this gate a push-triggered run
# would still deploy and run the real Modal function). Removed once
# workflow_dispatch is confirmed working, same as every other workflow
# this session bootstrapped this way.

on:
  push:
    branches:
      - feature/runpod-pod-on-demand
    paths:
      - '.github/workflows/cutsell-modal-gpu-minimal-raw.yml'
  workflow_dispatch: {}

concurrency:
  group: cutsell-modal-gpu-minimal
  cancel-in-progress: false

permissions:
  contents: read

env:
  MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
  MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

jobs:
  modal-gpu-minimal-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact test head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify required Modal auth secrets are present
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "
          import os
          from modal_gpu_config import require_modal_token_env
          require_modal_token_env(os.environ)
          print('Modal auth env present: MODAL_TOKEN_ID, MODAL_TOKEN_SECRET')
          "

      - name: Install Modal client
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: pip install --no-cache-dir modal

      - name: Run Modal L4 minimal GPU smoke test
        if: github.event_name == 'workflow_dispatch'
        id: modal_test
        shell: bash
        run: |
          # GitHub's own `bash` shell wrapper already runs this script
          # under `-e -o pipefail` regardless of what `set` commands
          # appear here -- `set +e` is required (not just omitting `-e`)
          # to actually disable it. Without this, a failing `modal run`
          # aborted the script before the exit_code capture below ever
          # ran, which in turn skipped the next step's summary entirely
          # (confirmed live: run 33601072592 hit exactly this).
          set +e
          set -uo pipefail
          modal run modal_gpu_minimal_test.py 2>&1 | tee modal-gpu-minimal-output.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload Modal smoke-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-modal-gpu-minimal-output
          path: modal-gpu-minimal-output.log
          retention-days: 14
          if-no-files-found: warn

      - name: Print result summary
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set +e
          echo "--- modal run exit code: ${{ steps.modal_test.outputs.exit_code }} ---"
          if [ -s modal-gpu-minimal-output.log ]; then
            echo "--- full modal run output ---"
            cat modal-gpu-minimal-output.log
          else
            echo "No output captured -- modal run did not produce a log file."
          fi
          if [ "${{ steps.modal_test.outputs.exit_code }}" != "0" ]; then
            echo "FAIL: modal run exited non-zero. Report the exact error above; do not blindly retry."
            exit 1
          fi
          echo "PASS: modal run completed successfully. Modal's own serverless GPU scale-to-zero applies automatically -- no persistent Pod/container for this workflow to stop or delete."

      - name: Bootstrap push confirmation (no Modal call made)
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          echo "Bootstrap push run: registered this workflow with Actions."
          echo "No Modal auth check, install, or function call was made (all gated to workflow_dispatch)."
