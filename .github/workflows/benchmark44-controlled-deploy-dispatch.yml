name: Benchmark 44 Controlled Deploy and Dispatch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/benchmark44-controlled-deploy-dispatch.yml

permissions:
  contents: read
  actions: write

jobs:
  deploy-dispatch:
    if: github.event.pull_request.number == 25 && github.event.pull_request.head.ref == 'cutsell/mobile-v1-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: 9ef1b71aca1b6fa15d70a8a3a20a781c3a54f68c
      IMAGE: ghcr.io/automatedretailservices/cutsell-worker@sha256:fffe065f1b8f9a5532177be256b35b171d67d970657b9bee21b8b1c811aa9d44
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RUNPOD_TEMPLATE_NAME: EditDNA-Worker-2
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      POD_ID: ''
      DISPATCHED: '0'
    steps:
      - name: Guard exact PR and validated source
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.number }}" = "25"
          test "${{ github.event.pull_request.head.ref }}" = "cutsell/mobile-v1-clean"
          test "$SOURCE_SHA" = "9ef1b71aca1b6fa15d70a8a3a20a781c3a54f68c"
          test "$IMAGE" = "ghcr.io/automatedretailservices/cutsell-worker@sha256:fffe065f1b8f9a5532177be256b35b171d67d970657b9bee21b8b1c811aa9d44"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify validated source is an ancestor of current PR head
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" "$HEAD_SHA" || { echo 'Validated Benchmark 44 source is not an ancestor of PR head'; exit 2; }

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}" || { echo 'RUNPOD_API_KEY missing'; exit 3; }
          test -n "${REDIS_URL:-}" || { echo 'REDIS_URL missing'; exit 3; }
          test -n "${GEMINI_API_KEY:-}" || { echo 'GEMINI_API_KEY missing'; exit 3; }
          echo "::add-mask::$GEMINI_API_KEY"

      - name: Refuse any duplicate cutsell staging worker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output pods-before.json
          count=$(jq '[.[] | select(.name == "cutsell-staging-worker")] | length' pods-before.json)
          test "$count" = "0" || { echo 'cutsell-staging-worker already exists; refusing duplicate paid worker'; jq '[.[] | select(.name == "cutsell-staging-worker") | {id,name,desiredStatus,imageName}]' pods-before.json; exit 4; }

      - name: Snapshot existing RQ workers before Pod creation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'redis>=5.0' 'rq>=2.6'
          python - <<'PY'
          import os
          from redis import Redis
          from rq import Worker
          connection = Redis.from_url(os.environ['REDIS_URL'])
          names = sorted({worker.name for worker in Worker.all(connection=connection)})
          with open('baseline-workers.txt', 'w', encoding='utf-8') as handle:
              handle.write('\n'.join(names))
          print('Baseline RQ workers:', names)
          PY

      - name: Build safe runtime baseline from EditDNA-Worker-2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/templates" --header "Authorization: Bearer $RUNPOD_API_KEY" --output templates.json
          TEMPLATE=$(jq -c --arg name "$RUNPOD_TEMPLATE_NAME" '[.[] | select(.name == $name)][0]' templates.json)
          test "$TEMPLATE" != "null" || { echo 'RunPod baseline template not found'; exit 5; }
          printf '%s' "$TEMPLATE" | jq -c '{ASR_DEVICE:.env.ASR_DEVICE,ASR_ENABLED:.env.ASR_ENABLED,BAD_TAKES_ENABLED:.env.BAD_TAKES_ENABLED,BOUNDARY_REFINER_ENABLED:.env.BOUNDARY_REFINER_ENABLED,BOUNDARY_REFINER_HEAD_STEP_SEC:.env.BOUNDARY_REFINER_HEAD_STEP_SEC,BOUNDARY_REFINER_MIN_DURATION_SEC:.env.BOUNDARY_REFINER_MIN_DURATION_SEC,BOUNDARY_REFINER_TAIL_STEP_SEC:.env.BOUNDARY_REFINER_TAIL_STEP_SEC,FFMPEG_BIN:.env.FFMPEG_BIN,FFPROBE_BIN:.env.FFPROBE_BIN,HEAD_TRIM_SEC:.env.HEAD_TRIM_SEC,PRESIGN_EXPIRES:.env.PRESIGN_EXPIRES,PYTHONPATH:.env.PYTHONPATH,S3_ACL:.env.S3_ACL,S3_BUCKET:.env.S3_BUCKET,S3_PREFIX:.env.S3_PREFIX,TAIL_TRIM_SEC:.env.TAIL_TRIM_SEC,VISION_ENABLED:.env.VISION_ENABLED,VISION_INTERVAL_SEC:.env.VISION_INTERVAL_SEC,VISION_MAX_SAMPLES:.env.VISION_MAX_SAMPLES,VISUAL_BAD_THRESHOLD:.env.VISUAL_BAD_THRESHOLD,WHISPER_DEVICE:.env.WHISPER_DEVICE,WHISPER_MODEL:.env.WHISPER_MODEL,W_FACE:.env.W_FACE,W_VISION:.env.W_VISION,W_VISUAL:.env.W_VISUAL,AWS_ACCESS_KEY_ID:.env.AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY:.env.AWS_SECRET_ACCESS_KEY,AWS_REGION:.env.AWS_REGION} | with_entries(select(.value != null and .value != ""))' > safe-template-env.json
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_BUCKET; do
            value=$(jq -r --arg key "$key" '.[$key] // empty' safe-template-env.json)
            test -n "$value" || { echo "$key missing from EditDNA-Worker-2"; exit 6; }
            echo "::add-mask::$value"
          done
          CONTAINER_DISK=$(printf '%s' "$TEMPLATE" | jq -r '.containerDiskInGb // 30')
          VOLUME_GB=$(printf '%s' "$TEMPLATE" | jq -r '.volumeInGb // 20')
          VOLUME_MOUNT=$(printf '%s' "$TEMPLATE" | jq -r '.volumeMountPath // "/workspace"')
          printf 'CONTAINER_DISK=%s\nVOLUME_GB=%s\nVOLUME_MOUNT=%s\n' "$CONTAINER_DISK" "$VOLUME_GB" "$VOLUME_MOUNT" >> "$GITHUB_ENV"

      - name: Create exactly one Benchmark 44 staging GPU worker using baked image CMD
        shell: bash
        run: |
          set -euo pipefail
          jq --arg name "cutsell-staging-worker" --arg image "$IMAGE" --arg redis "$REDIS_URL" --arg gemini "$GEMINI_API_KEY" --arg mount "$VOLUME_MOUNT" --argjson disk "$CONTAINER_DISK" --argjson volume "$VOLUME_GB" '. + {REDIS_URL:$redis,GEMINI_API_KEY:$gemini,CUTSELL_BRAIN_BACKEND:"runpod_local",CUTSELL_EDITORIAL_MODE:"clean_cut",CUTSELL_ASR_MODEL:"medium",CUTSELL_CLEAN_CUT_JUDGE:"0",CUTSELL_HYBRID_PROVIDER:"google",CUTSELL_HYBRID_LLM_ENABLED:"1",CUTSELL_HYBRID_PRIMARY_MODEL:"gemini-3.5-flash-lite",CUTSELL_HYBRID_ESCALATION_MODEL:"gemini-3.6-flash",CUTSELL_HYBRID_MAX_SESSION_USD:"0.0075",CUTSELL_HYBRID_TEST_BUDGET_USD:"0.50"} | {name:$name,imageName:$image,cloudType:"COMMUNITY",computeType:"GPU",gpuCount:1,gpuTypeIds:["NVIDIA RTX A5000","NVIDIA RTX A4000","NVIDIA L4","NVIDIA A40","NVIDIA RTX A6000","NVIDIA GeForce RTX 3090","NVIDIA GeForce RTX 4090"],gpuTypePriority:"custom",interruptible:false,containerDiskInGb:$disk,volumeInGb:$volume,volumeMountPath:$mount,env:.}' safe-template-env.json > create-pod.json
          if jq -e '.env | has("OPENAI_API_KEY") or has("EDITDNA_USE_LLM") or has("EDITDNA_LLM_MODEL")' create-pod.json >/dev/null; then
            echo 'Refusing deployment: forbidden OpenAI/legacy provider key present'; exit 7
          fi
          if jq -e 'has("dockerEntrypoint") or has("dockerStartCmd")' create-pod.json >/dev/null; then
            echo 'Refusing deployment: Benchmark 44 must use baked Docker CMD'; exit 7
          fi
          code=$(curl --silent --show-error --write-out '%{http_code}' --request POST --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --header "Content-Type: application/json" --data @create-pod.json --output pod.json)
          rm -f create-pod.json safe-template-env.json
          test "$code" = "201" || { echo "RunPod create HTTP status: $code"; jq '{error,errors,message}' pod.json || true; exit 8; }
          POD_ID=$(jq -r '.id // empty' pod.json)
          test -n "$POD_ID" || { echo 'RunPod returned no Pod id'; exit 8; }
          echo "POD_ID=$POD_ID" >> "$GITHUB_ENV"
          echo "BENCHMARK44_POD_ID=$POD_ID" >> "$GITHUB_STEP_SUMMARY"
          jq '{id,name,desiredStatus,imageName,costPerHr,adjustedCostPerHr}' pod.json

      - name: Confirm exact Pod identity and immutable image
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods/$POD_ID" --header "Authorization: Bearer $RUNPOD_API_KEY" --output exact-pod.json
          test "$(jq -r '.id' exact-pod.json)" = "$POD_ID"
          test "$(jq -r '.name' exact-pod.json)" = "cutsell-staging-worker"
          test "$(jq -r '.imageName' exact-pod.json)" = "$IMAGE"
          jq '{id,name,desiredStatus,imageName,costPerHr,adjustedCostPerHr}' exact-pod.json

      - name: Wait for a genuinely new fresh RQ worker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, time
          from datetime import datetime, timezone
          from redis import Redis
          from rq import Worker
          connection = Redis.from_url(os.environ['REDIS_URL'])
          baseline = set(open('baseline-workers.txt', encoding='utf-8').read().splitlines())
          deadline = time.time() + 600
          while time.time() < deadline:
              now = datetime.now(timezone.utc)
              for worker in Worker.all(connection=connection):
                  if worker.name in baseline:
                      continue
                  heartbeat = worker.last_heartbeat
                  if heartbeat is None:
                      continue
                  if heartbeat.tzinfo is None:
                      heartbeat = heartbeat.replace(tzinfo=timezone.utc)
                  age = (now - heartbeat).total_seconds()
                  if age <= 30 and worker.get_state() in {'idle','busy'}:
                      print('Fresh Benchmark 44 RQ worker:', worker.name, 'state=', worker.get_state(), 'heartbeat_age=', age)
                      with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
                          handle.write(f'RQ_WORKER_NAME={worker.name}\n')
                      raise SystemExit(0)
              time.sleep(10)
          raise SystemExit('Benchmark 44 Pod exists but no genuinely new fresh RQ worker registered within 10 minutes')
          PY

      - name: Confirm exact Pod immediately before dispatch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods/$POD_ID" --header "Authorization: Bearer $RUNPOD_API_KEY" --output exact-pod-before-dispatch.json
          test "$(jq -r '.id' exact-pod-before-dispatch.json)" = "$POD_ID"
          test "$(jq -r '.name' exact-pod-before-dispatch.json)" = "cutsell-staging-worker"
          test "$(jq -r '.imageName' exact-pod-before-dispatch.json)" = "$IMAGE"
          test -n "${RQ_WORKER_NAME:-}"
          jq '{id,name,desiredStatus,imageName,costPerHr,adjustedCostPerHr}' exact-pod-before-dispatch.json

      - name: Dispatch exactly one CutSell Unseen Clean Cut Benchmark 44
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/cutsell-unseen-clean-cut-benchmark.yml"
          curl --fail --silent --show-error --url "$api/runs?branch=cutsell%2Fmobile-v1-clean&event=workflow_dispatch&per_page=30" --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" --output benchmark-runs-before.json
          jq '[.workflow_runs[].id]' benchmark-runs-before.json > benchmark-run-ids-before.json
          payload=$(jq -nc --arg ref 'cutsell/mobile-v1-clean' --arg pod "$POD_ID" '{ref:$ref,inputs:{approval_token:"RUN39",pod_id:$pod}}')
          code=$(curl --silent --show-error --write-out '%{http_code}' --request POST --url "$api/dispatches" --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" --header "Content-Type: application/json" --data "$payload" --output dispatch-response.txt)
          test "$code" = "204" || { echo "Benchmark dispatch HTTP status: $code"; cat dispatch-response.txt || true; exit 9; }
          echo 'DISPATCHED=1' >> "$GITHUB_ENV"
          echo "Benchmark 44 dispatch accepted once for Pod $POD_ID"

      - name: Capture exact Benchmark 44 workflow run ID
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/cutsell-unseen-clean-cut-benchmark.yml"
          before=$(cat benchmark-run-ids-before.json)
          found=''
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error --url "$api/runs?branch=cutsell%2Fmobile-v1-clean&event=workflow_dispatch&per_page=30" --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" --output benchmark-runs-after.json
            found=$(jq -r --argjson before "$before" --arg head "$HEAD_SHA" '[.workflow_runs[] | select(.head_sha == $head) | select((.id as $id | ($before | index($id))) == null)][0].id // empty' benchmark-runs-after.json)
            if [ -n "$found" ]; then break; fi
            sleep 5
          done
          test -n "$found" || { echo 'Dispatch succeeded but exact Benchmark 44 run ID was not observed'; exit 10; }
          echo "BENCHMARK_RUN_ID=$found" >> "$GITHUB_ENV"
          echo "BENCHMARK44_RUN_ID=$found" >> "$GITHUB_STEP_SUMMARY"
          jq --argjson id "$found" '.workflow_runs[] | select(.id == $id) | {id,name,status,conclusion,event,head_branch,head_sha,created_at,html_url}' benchmark-runs-after.json

      - name: Cleanup exact Pod only if deployment failed before benchmark dispatch
        if: failure() && env.POD_ID != '' && env.DISPATCHED != '1'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output failure-pods.json
          name=$(jq -r --arg id "$POD_ID" '[.[] | select(.id == $id)][0].name // empty' failure-pods.json)
          if [ -z "$name" ]; then
            echo "Failed-deploy Pod already absent: $POD_ID"
            exit 0
          fi
          test "$name" = "cutsell-staging-worker" || { echo 'Exact failed-deploy Pod ID is not cutsell-staging-worker; refusing deletion'; exit 11; }
          code=$(curl --silent --show-error --write-out '%{http_code}' --request DELETE --url "https://rest.runpod.io/v1/pods/$POD_ID" --header "Authorization: Bearer $RUNPOD_API_KEY" --output failure-delete-response.txt)
          echo "Failed-deploy Pod cleanup DELETE status: $code"
          test "$code" = "204"
          sleep 2
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --output failure-pods-after.json
          remaining=$(jq --arg id "$POD_ID" '[.[] | select(.id == $id)] | length' failure-pods-after.json)
          test "$remaining" = "0" || { echo 'Failed-deploy Pod still present after cleanup'; exit 12; }
          echo "Failed-deploy Pod deleted and explicitly verified absent: $POD_ID"
