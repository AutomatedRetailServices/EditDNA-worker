name: Round 13 Recovery Status Probe
on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/benchmark52-round13-recovery-probe.yml
permissions:
  contents: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutsell/mobile-v1-clean
          fetch-depth: 0
      - name: Snapshot latest recovery run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ops
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/benchmark52-round13-recovery.yml/runs?branch=cutsell%2Fmobile-v1-clean&per_page=5" > /tmp/runs.json
          jq '{id:.workflow_runs[0].id,run_number:.workflow_runs[0].run_number,status:.workflow_runs[0].status,conclusion:.workflow_runs[0].conclusion,head_sha:.workflow_runs[0].head_sha,created_at:.workflow_runs[0].created_at,updated_at:.workflow_runs[0].updated_at}' /tmp/runs.json > ops/benchmark52-round13-recovery-status.json
          cat ops/benchmark52-round13-recovery-status.json
      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/benchmark52-round13-recovery-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ops: snapshot Round 13 recovery status"
          git push origin HEAD:cutsell/mobile-v1-clean
