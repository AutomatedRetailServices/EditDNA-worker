name: CutSell RunPod Staging Worker Authorized Once

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - ".cutsell/staging-worker-authorized-once.txt"

permissions:
  contents: read

jobs:
  deploy-staging-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      RUNPOD_TEMPLATE_NAME: EditDNA-Worker-2
      IMAGE: ghcr.io/automatedretailservices/cutsell-worker:f1bc3adc4f2f8df0ae005fa551116dc4d08b30e6
      CLOUD_TYPE: SECURE
    steps:
      - name: Verify authorized marker and runtime
        uses: actions/checkout@v4
      - name: Require this exact one-shot authorization
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'approval=APPROVE_PAID_STAGING_WORKER' .cutsell/staging-worker-authorized-once.txt
          test -n "${RUNPOD_API_KEY:-}"
          test -n "${REDIS_URL:-}"

      - name: Refuse duplicate staging worker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --url "https://rest.runpod.io/v1/pods" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output pods.json
          count=$(jq '[.[] | select(.name == "cutsell-staging-worker")] | length' pods.json)
          test "$count" = "0" || { echo 'cutsell-staging-worker already exists; refusing duplicate'; exit 4; }

      - name: Snapshot existing RQ workers
        shell: bash
        run: |
          python -m pip install --quiet redis rq
          python - <<'PY' > before-workers.txt
          import os
          from redis import Redis
          from rq import Worker
          r=Redis.from_url(os.environ['REDIS_URL'])
          for w in Worker.all(connection=r): print(w.name)
          PY
          cat before-workers.txt

      - name: Load AWS S3 OpenAI credentials from RunPod template vault
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --url "https://rest.runpod.io/v1/templates" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output templates.json
          TEMPLATE=$(jq -c --arg name "$RUNPOD_TEMPLATE_NAME" '[.[] | select(.name == $name)][0]' templates.json)
          test "$TEMPLATE" != "null"
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_BUCKET OPENAI_API_KEY; do
            value=$(printf '%s' "$TEMPLATE" | jq -r --arg key "$key" '.env[$key] // empty')
            test -n "$value" || { echo "$key missing from template vault"; exit 6; }
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done

      - name: Create persistent staging GPU worker
        id: create
        shell: bash
        run: |
          set -euo pipefail
          START_CMD='python -m rq.cli worker -u "$REDIS_URL" --worker-ttl 1200 cutsell'
          jq -n \
            --arg name "cutsell-staging-worker" \
            --arg image "$IMAGE" \
            --arg cloud "$CLOUD_TYPE" \
            --arg cmd "$START_CMD" \
            --arg redis "$REDIS_URL" \
            --arg aws_access "$AWS_ACCESS_KEY_ID" \
            --arg aws_secret "$AWS_SECRET_ACCESS_KEY" \
            --arg aws_region "$AWS_REGION" \
            --arg bucket "$S3_BUCKET" \
            --arg openai "$OPENAI_API_KEY" \
            '{name:$name,imageName:$image,cloudType:$cloud,computeType:"GPU",gpuCount:1,gpuTypeIds:["NVIDIA L4","NVIDIA RTX A4000","NVIDIA RTX A5000","NVIDIA A40","NVIDIA GeForce RTX 3090","NVIDIA GeForce RTX 4090"],gpuTypePriority:"availability",interruptible:false,containerDiskInGb:30,volumeInGb:20,volumeMountPath:"/workspace",dockerEntrypoint:["bash","-lc"],dockerStartCmd:[$cmd],env:{REDIS_URL:$redis,AWS_ACCESS_KEY_ID:$aws_access,AWS_SECRET_ACCESS_KEY:$aws_secret,AWS_REGION:$aws_region,S3_BUCKET:$bucket,OPENAI_API_KEY:$openai,CUTSELL_ASR_MODEL:"medium",CUTSELL_CLEAN_CUT_JUDGE:"0",CUTSELL_SEMANTIC_MODEL:"gpt-4o-mini",CUTSELL_VISUAL_MODEL:"gpt-4o-mini",CUTSELL_TAKE_JUDGE_MODEL:"gpt-4o-mini"}}' > create-pod.json
          code=$(curl --silent --show-error --write-out '%{http_code}' --request POST --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" --header "Content-Type: application/json" --data @create-pod.json --output pod.json)
          rm -f create-pod.json
          if [ "$code" != "201" ]; then echo "RunPod create HTTP status: $code"; jq '{error,errors,message}' pod.json || true; exit 7; fi
          POD_ID=$(jq -r '.id // empty' pod.json)
          test -n "$POD_ID"
          echo "pod_id=$POD_ID" >> "$GITHUB_OUTPUT"
          echo "Created staging worker Pod: $POD_ID"

      - name: Wait for RQ registration or delete failed Pod
        shell: bash
        env:
          POD_ID: ${{ steps.create.outputs.pod_id }}
        run: |
          set -euo pipefail
          cleanup() {
            echo 'Worker failed readiness; deleting paid Pod.'
            curl --silent --show-error --request DELETE --url "https://rest.runpod.io/v1/pods/$POD_ID" --header "Authorization: Bearer $RUNPOD_API_KEY" --output /dev/null || true
          }
          trap cleanup ERR
          python - <<'PY'
          import os,time
          from pathlib import Path
          from redis import Redis
          from rq import Worker
          before=set(Path('before-workers.txt').read_text().splitlines())
          r=Redis.from_url(os.environ['REDIS_URL'])
          deadline=time.time()+360
          while time.time()<deadline:
              workers=Worker.all(connection=r)
              new=[w for w in workers if w.name not in before and any(q.name=='cutsell' for q in w.queues)]
              if new:
                  print('RQ staging worker registered:', new[0].name)
                  raise SystemExit(0)
              time.sleep(10)
          raise SystemExit('No new cutsell RQ worker registered within 6 minutes')
          PY
          trap - ERR

      - name: Confirm paid staging worker retained
        shell: bash
        env:
          POD_ID: ${{ steps.create.outputs.pod_id }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/pods" --header "Authorization: Bearer $RUNPOD_API_KEY" \
            | jq --arg id "$POD_ID" '[.[] | select(.id == $id) | {id,name,desiredStatus,imageName}]'
