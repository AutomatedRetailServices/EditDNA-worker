          elif whole_run_assessment == "TOO_BROAD":
              real_media_grouping_result = "LOCAL_GROUPING_STILL_TOO_BROAD"
          elif whole_run_assessment == "OVER_FRAGMENTED":
              real_media_grouping_result = "LOCAL_GROUPING_BOUNDED_BUT_OVER_FRAGMENTED"
          elif fragmentation_classification == "EVIDENCE_LIMITED_FRAGMENTATION":
              real_media_grouping_result = "LOCAL_GROUPING_BOUNDED_BUT_EVIDENCE_LIMITED"
          else:
              real_media_grouping_result = "LOCAL_GROUPING_REAL_MEDIA_PROVEN"
          summary["real_media_grouping_result"] = real_media_grouping_result

          # --- P1 target-shape observed flags. ---
          summary["p1_target_shape_observed"] = {
              "RETRY_SERIES_OBSERVED": kind_counts.get("RETRY_SERIES", 0) > 0,
              "BLOOPER_SERIES_OBSERVED": kind_counts.get("BLOOPER_SERIES", 0) > 0,
              "CLEAN_DELIVERY_SEQUENCE_OBSERVED": kind_counts.get("CLEAN_DELIVERY_SEQUENCE", 0) > 0,
              "PREASSEMBLED_FINAL_SEQUENCE_OBSERVED": kind_counts.get("PREASSEMBLED_FINAL_SEQUENCE", 0) > 0,
              "MIXED_SEQUENCE_OBSERVED": kind_counts.get("MIXED", 0) > 0,
              "NO_MULTI_MOMENT_SEQUENCE_OBSERVED": len(sequences) == 0,
          }

          os.makedirs("artifact", exist_ok=True)
          out_path = "artifact/d198_local_group_formation_qualification_summary.json"
          with open(out_path, "w") as f:
              json.dump(summary, f, indent=2, sort_keys=True)

          size = os.path.getsize(out_path)
          print("--- D-198 P1 local group formation real-media qualification (a pure re-audit of already-computed/already-serialized moments/local_groups/sequences fields -- recomputes NO relation, NO moment role, NO sequence kind, NO group membership; all classifications below are reporting-only, never fed back into cutsell_worker) ---")
          print(f"summary file: {out_path} ({size} bytes)")
          print(json.dumps(summary, indent=2, sort_keys=True))
