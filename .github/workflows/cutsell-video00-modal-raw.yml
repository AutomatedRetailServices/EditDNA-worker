      - name: Print compact D-178B D-177 Boundary partial-edge trim real-media qualification summary (tail-safe)
        # D-178B: reporting-only plumbing, same D-119/D-152/D-164/D-173/D-175
        # pattern -- reads `artifact/video00-modal.json` (already on disk,
        # already contains the FULL diagnostics tree `boundary_engine_pass`
        # unconditionally writes on every run, since `apply_post_freeze_
        # boundary_pass` runs on the ordinary Clean Cut V1 path with no
        # feature flag) and projects ONLY fields D-177's own (unchanged in
        # this task) `tighten_selected_visual_edges`/`_partial_edge_trim_
        # summary` already computed. Recomputes NO eligibility decision, no
        # trim, no BestTake/family/selection state. Generic (no Video00-
        # specific text/id is embedded in this step) -- the gynecologist
        # region is re-identified afterward, by direct inspection of this
        # summary's real clip_id/timing/text fields against the persisted
        # D-170/D-173/D-175/D-176 evidence, never assumed stable run to run.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python - <<'PY'
          import json, os

          def load(path):
              if not os.path.exists(path) or os.path.getsize(path) == 0:
                  return None
              with open(path) as f:
                  try:
                      return json.load(f)
                  except Exception as e:
                      print(f"WARNING: failed to parse {path}: {e}")
                      return None

          engine = load("artifact/video00-modal.json")

          summary = {"schema_version": "cutsell.video00.d178b_boundary_partial_edge_trim_summary.v1"}
          summary["source_status"] = "engine_json_present" if isinstance(engine, dict) else "engine_json_missing_or_unparseable"

          bep = {}
          visual_edge_rows = []
          partial_edge_trim_rows = []
          clip_text = {}
          clip_span = {}
          if isinstance(engine, dict):
              diag = engine.get("diagnostics")
              if isinstance(diag, dict):
                  raw_bep = diag.get("boundary_engine_pass")
                  bep = raw_bep if isinstance(raw_bep, dict) else {}
                  raw_visual = bep.get("visual_edge_rows")
                  if not isinstance(raw_visual, list):
                      raw_visual = diag.get("boundary_visual_edge_trim")
                  if isinstance(raw_visual, list):
                      visual_edge_rows = [r for r in raw_visual if isinstance(r, dict)]
                  raw_partial = bep.get("partial_edge_trim_rows")
                  if not isinstance(raw_partial, list):
                      raw_partial = diag.get("boundary_partial_edge_trim")
                  if isinstance(raw_partial, list):
                      partial_edge_trim_rows = [r for r in raw_partial if isinstance(r, dict)]
              for bucket in ("selected", "alternates", "discarded"):
                  for clip in engine.get(bucket) or []:
                      if isinstance(clip, dict) and clip.get("clip_id"):
                          clip_text[clip["clip_id"]] = str(clip.get("text") or "")
                          clip_span[clip["clip_id"]] = {
                              "source_asset_id": clip.get("source_asset_id"),
                              "start": clip.get("start"),
                              "end": clip.get("end"),
                          }

          summary["run_level"] = {
              "partial_edge_trim_evaluated_count": bep.get("partial_edge_trim_evaluated_count"),
              "partial_edge_trim_applied_count": bep.get("partial_edge_trim_applied_count"),
              "entry_partial_edge_trim_count": bep.get("entry_partial_edge_trim_count"),
              "exit_partial_edge_trim_count": bep.get("exit_partial_edge_trim_count"),
          } if bep else {"status": "boundary_engine_pass_diagnostics_absent"}

          # Per-clip compact summary rows (D-177's own `_partial_edge_trim_
          # summary` output), enriched (reporting only) with the clip's real
          # text/source span for post-hoc region identification.
          enriched_partial_rows = []
          for row in partial_edge_trim_rows:
              cid = row.get("clip_id")
              enriched_partial_rows.append({
                  **row,
                  "text_snippet": (clip_text.get(cid) or "")[:160],
                  "source_span": clip_span.get(cid),
              })
          summary["partial_edge_trim_rows"] = enriched_partial_rows

          # Straddle-eligibility rows: every visual_edge_rows entry D-177's
          # loops actually evaluated for partial-edge eligibility (both
          # applied and correctly-preserved), identified by the one real
          # field D-177 added (`inside_delivery_overlap_sec is not None`) --
          # never re-derived, a pure filter of the existing per-event audit.
          straddle_rows = [r for r in visual_edge_rows if r.get("inside_delivery_overlap_sec") is not None]
          for row in straddle_rows:
              row["text_snippet"] = (clip_text.get(row.get("clip_id")) or "")[:160]
          summary["straddle_eligibility_rows"] = straddle_rows

          # Negative-control buckets, classified ONLY by D-177/D-116's own
          # existing, unchanged reason strings -- never a new heuristic.
          def _bucket(reason, has_overlap):
              if reason == "visual_event_overlaps_delivery_no_trim" and not has_overlap:
                  return "fully_inside_delivery_no_trim"
              if reason == "visual_event_overlaps_delivery_no_trim" and has_overlap:
                  return "material_straddle_preserved"
              if reason == "visual_ambiguous_straddle_no_trim":
                  return "ambiguous_both_edge_straddle_no_trim"
              if reason in ("visual_entry_edge_trim", "visual_exit_edge_trim") and not has_overlap:
                  return "fully_outside_ordinary_edge_trim"
              if reason == "visual_event_not_at_edge":
                  return "not_at_edge_no_trim"
              if reason in ("visual_entry_partial_edge_trim", "visual_exit_partial_edge_trim"):
                  return "partial_edge_trim_applied"
              if reason == "visual_trim_blocked_by_delivery_floor":
                  return "blocked_by_delivery_floor"
              if reason == "visual_trim_unavailable":
                  return "delivery_span_unavailable"
              return "other:" + str(reason)

          buckets = {}
          for row in visual_edge_rows:
              key = _bucket(row.get("reason"), row.get("inside_delivery_overlap_sec") is not None)
              buckets.setdefault(key, []).append({
                  "clip_id": row.get("clip_id"),
                  "event_kind": row.get("event_kind"),
                  "event_start": row.get("event_start"),
                  "event_end": row.get("event_end"),
                  "trim_side": row.get("trim_side"),
                  "trim_applied": row.get("trim_applied"),
                  "inside_delivery_overlap_sec": row.get("inside_delivery_overlap_sec"),
              })
          summary["reason_buckets"] = {k: {"count": len(v), "rows": v} for k, v in sorted(buckets.items())}

          os.makedirs("artifact", exist_ok=True)
          out_path = "artifact/video00-modal-d178b-boundary-partial-edge-trim-summary.json"
          with open(out_path, "w") as f:
              json.dump(summary, f, indent=2, sort_keys=True)

          size = os.path.getsize(out_path)
          print("--- D-178B D-177 Boundary partial-edge trim real-media qualification summary (a pure projection of existing D-177 diagnostics -- recomputes no eligibility decision, no trim, no BestTake/family/selection state) ---")
          print(f"summary file: {out_path} ({size} bytes)")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Print compact D-181 D-180 Case-B materiality stabilization real-media qualification summary (tail-safe)
        # D-181: reporting-only plumbing (docs/CUTSELL_DECISIONS.md D-181),
        # same D-119/D-125/D-152/D-164/D-173/D-175/D-178B pattern applied to
        # D-180's own new condition-4 fields (`case_b_count_difference_
        # present`, `case_b_materiality_evidence_available`, `case_b_
        # materiality_state`, `case_b_materiality_source`, `case_b_
        # condition4_actionable`, `case_b_condition4_reason`), which
        # `pipeline.py`'s D-180 wiring already spreads onto each `take_
        # judge_groups` row (same row the D-123/D-125 step above already
        # reads). A SEPARATE, LATE-STAGE, BOUNDED summary reading `artifact/
        # video00-modal.json` (already on disk, never a live pipe) --
        # recomputes NO family formation, semantic label, gate decision,
        # DeliveryScorer score, materiality verdict, or BestTake winner;
        # every field here is copied verbatim or trivially derived (set-
        # membership, equality, counting, a per-event boolean count already
        # present in `case_b_evidence[*].delivery_events[*].d097_would_be_
        # counted`) from values `pipeline.py`'s own D-180 gate call already
        # produced. Gynecologist/pimples region identification below is a
        # QA-only re-identification by source span/normalized text -- never
        # a hardcoded Video00 clip id, and never fed back into production
        # Selection/BestTake/grouping/render logic.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python - <<'PY'
          import json, os, sys
          from collections import Counter

          def load(path):
              if not os.path.exists(path) or os.path.getsize(path) == 0:
                  return None
              with open(path) as f:
                  try:
                      return json.load(f)
                  except Exception as e:
                      print(f"WARNING: failed to parse {path}: {e}", file=sys.stderr)
                      return None

          engine = load("artifact/video00-modal.json")
          regression_fixture = load("benchmarks/video00_regression_qa.json")

          summary = {"schema_version": "cutsell.video00.d181_case_b_materiality_summary.v1"}
          summary["source_status"] = "engine_json_present" if isinstance(engine, dict) else "engine_json_missing_or_unparseable"

          rows = []
          clip_meta = {}  # clip_id -> {text, start, end, source_asset_id}
          if isinstance(engine, dict):
              diag = engine.get("diagnostics")
              if isinstance(diag, dict):
                  raw_groups = diag.get("take_judge_groups")
                  if isinstance(raw_groups, list):
                      rows = [r for r in raw_groups if isinstance(r, dict)]
              for bucket in ("selected", "alternates", "discarded"):
                  for clip in engine.get(bucket) or []:
                      if isinstance(clip, dict) and clip.get("clip_id"):
                          clip_meta[clip["clip_id"]] = {
                              "text": str(clip.get("text") or ""),
                              "start": clip.get("start"),
                              "end": clip.get("end"),
                              "source_asset_id": clip.get("source_asset_id"),
                          }

          def _norm(s):
              return " ".join(str(s or "").lower().split())

          def _material_events(events):
              if not isinstance(events, list):
                  return None
              return sum(1 for e in events if isinstance(e, dict) and e.get("d097_would_be_counted") is True)

          def _per_candidate_evidence(case_b_evidence):
              out = {}
              for clip_id, row in (case_b_evidence or {}).items():
                  if not isinstance(row, dict):
                      continue
                  events = row.get("delivery_events")
                  out[clip_id] = {
                      "candidate_id": row.get("candidate_id", clip_id),
                      "source_asset_id": clip_meta.get(clip_id, {}).get("source_asset_id"),
                      "start": clip_meta.get(clip_id, {}).get("start"),
                      "end": clip_meta.get(clip_id, {}).get("end"),
                      "delivery_event_count": row.get("delivery_event_count"),
                      "material_delivery_event_count": _material_events(events),
                      "count_by_kind": row.get("count_by_kind"),
                      "duration_by_kind": row.get("duration_by_kind"),
                  }
              return out

          counts = {
              "case_b_condition4_evaluated_count": 0,
              "case_b_count_difference_count": 0,
              "case_b_materiality_available_count": 0,
              "case_b_not_material_count": 0,
              "case_b_material_count": 0,
              "case_b_condition4_actionable_count": 0,
              "case_b_condition4_suppressed_count": 0,
          }
          materiality_state_counts = Counter()
          reason_counts = Counter()
          family_rows = []

          for row in rows:
              materiality_state = row.get("case_b_materiality_state")
              reason = row.get("case_b_condition4_reason")
              materiality_state_counts[str(materiality_state or "")] += 1
              reason_counts[str(reason or "")] += 1

              if materiality_state not in (None, "NOT_EVALUATED"):
                  counts["case_b_condition4_evaluated_count"] += 1
              if row.get("case_b_count_difference_present") is True:
                  counts["case_b_count_difference_count"] += 1
              if row.get("case_b_materiality_evidence_available") is True:
                  counts["case_b_materiality_available_count"] += 1
              if materiality_state == "NOT_MATERIAL":
                  counts["case_b_not_material_count"] += 1
                  counts["case_b_condition4_suppressed_count"] += 1
              if materiality_state == "MATERIAL":
                  counts["case_b_material_count"] += 1
              if row.get("case_b_condition4_actionable") is True:
                  counts["case_b_condition4_actionable_count"] += 1

              semantic_candidates = row.get("semantic_candidates") or []
              member_ids = sorted({
                  c.get("clip_id") for c in semantic_candidates
                  if isinstance(c, dict) and c.get("clip_id")
              })
              if not member_ids:
                  member_ids = sorted((row.get("case_b_evidence") or {}).keys())

              family_rows.append({
                  "group_id": row.get("group_id"),
                  "member_ids": member_ids,
                  "member_spans": {
                      cid: {"start": clip_meta.get(cid, {}).get("start"), "end": clip_meta.get(cid, {}).get("end"),
                            "source_asset_id": clip_meta.get(cid, {}).get("source_asset_id")}
                      for cid in member_ids
                  },
                  "semantic_fast_path_candidate": row.get("semantic_fast_path_candidate"),
                  "deliveryscore_top_candidate": row.get("deliveryscore_top_candidate"),
                  "meaning_sufficient_candidates": row.get("meaning_sufficient_candidates"),
                  "semantic_authority_gate_status": row.get("semantic_authority_gate_status"),
                  "complete_context_conflict": row.get("complete_context_conflict"),
                  "complete_window_agreement_status": row.get("complete_window_agreement_status"),
                  "case_b_conflict_present": row.get("case_b_conflict_present"),
                  "case_b_conflict_basis": row.get("case_b_conflict_basis"),
                  "case_b_count_difference_present": row.get("case_b_count_difference_present"),
                  "case_b_materiality_evidence_available": row.get("case_b_materiality_evidence_available"),
                  "case_b_materiality_state": materiality_state,
                  "case_b_materiality_source": row.get("case_b_materiality_source"),
                  "case_b_condition4_actionable": row.get("case_b_condition4_actionable"),
                  "case_b_condition4_reason": reason,
                  "semantic_fast_path_bypassed": row.get("semantic_fast_path_bypassed"),
                  "bypass_reason": row.get("bypass_reason"),
                  "winner_path": row.get("winner_path"),
                  "winner_path_before": row.get("winner_path_before"),
                  "winner_path_after": row.get("winner_path_after"),
                  "semantic_best_take_reason": row.get("semantic_best_take_reason"),
                  "final_selected_clip_id": row.get("final_winner", row.get("selected_clip_id")),
                  "case_b_evidence": _per_candidate_evidence(row.get("case_b_evidence")),
              })

          summary["global_counts"] = counts
          summary["materiality_state_distribution"] = dict(materiality_state_counts)
          summary["condition4_reason_distribution"] = dict(reason_counts)
          summary["families"] = family_rows

          # --- Gynecologist re-identification (QA-only): by RAW source span
          # (~96.47-102.47s) and by normalized text substring, never by a
          # previous run's clip id. Reuses the SAME checked-in benchmarks/
          # video00_regression_qa.json fixture text-matching approach the
          # existing D-123/D-125 step already applies to pimples.
          GYNECOLOGIST_SPAN = (90.0, 109.0)  # generous window around 96.47-102.47s

          def _span_overlaps(meta, lo, hi):
              start, end = meta.get("start"), meta.get("end")
              if not isinstance(start, (int, float)) or not isinstance(end, (int, float)):
                  return False
              return start < hi and end > lo

          def _region_texts(prefix):
              out = []
              if isinstance(regression_fixture, dict):
                  for check in regression_fixture.get("checks") or []:
                      if not isinstance(check, dict) or not str(check.get("id", "")).startswith(prefix):
                          continue
                      if check.get("kind") == "required_order":
                          continue
                      text = check.get("text")
                      if text:
                          out.append(_norm(text))
              return [t for t in out if t]

          def _identify_region(prefix, span=None):
              refs = _region_texts(prefix)
              span_clip_ids = set()
              if span:
                  lo, hi = span
                  span_clip_ids = {cid for cid, meta in clip_meta.items() if _span_overlaps(meta, lo, hi)}
              text_clip_ids = {
                  cid for cid, meta in clip_meta.items()
                  if refs and any(ref in _norm(meta.get("text")) for ref in refs)
              }
              region_clip_ids = sorted(span_clip_ids | text_clip_ids)
              if not region_clip_ids:
                  return {
                      "status": "no_region_clips_identified",
                      "span_clip_ids": sorted(span_clip_ids),
                      "text_clip_ids": sorted(text_clip_ids),
                  }
              matching = [
                  row for row in family_rows
                  if set(row["member_ids"]) & set(region_clip_ids)
              ]
              if not matching:
                  return {
                      "status": "region_clips_present_but_no_family_row",
                      "region_clip_ids": region_clip_ids,
                  }
              status = "family_formed" if len(matching) == 1 else "fragmented_across_multiple_families"
              return {
                  "status": status,
                  "region_clip_ids": region_clip_ids,
                  "span_clip_ids": sorted(span_clip_ids),
                  "text_clip_ids": sorted(text_clip_ids),
                  "families": matching,
              }

          summary["gynecologist"] = _identify_region("gynecologist", GYNECOLOGIST_SPAN)
          summary["pimples"] = _identify_region("pimples")

          os.makedirs("artifact", exist_ok=True)
          out_path = "artifact/video00-modal-d181-case-b-materiality-summary.json"
          with open(out_path, "w") as f:
              json.dump(summary, f, indent=2, sort_keys=True)

          size = os.path.getsize(out_path)
          print("--- D-181 D-180 Case-B materiality stabilization real-media qualification summary (a pure projection of existing D-180 diagnostics -- recomputes no materiality verdict, gate decision, or BestTake winner) ---")
          print(f"summary file: {out_path} ({size} bytes)")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Print compact D-170 Watch+Listen Zone-Usability V2 diagnostic qualification summary (tail-safe)
        # D-170: reconstructs cutsell_worker.watch_listen_zone_usability_v2
        # (D-167, DIAGNOSTIC-ONLY, still not wired to any authority) from
        # this workflow's own already-present, UNCONDITIONAL `case_b_
        # evidence` (D-122) per-clip DELIVERY-zone event records in
        # artifact/video00-modal.json -- zero cutsell_worker editorial
        # change, no new pipeline env var, no RunPod template edit. Uses
        # the real, unmodified `watch_listen_zone_usability_v2.py`/
        # `positioned_performance_evidence.py`/`raw_understanding_map.py`
        # classes as a pure, read-only analysis library only -- recomputes
        # no perception, mutates no selected_clip_id, grants no authority.
        # DELIVERY zone is a faithful reconstruction (real event kind/
        # start/end/confidence/duration, real delivery span). ENTRY/EXIT
        # zone_duration is derived from each clip's own real start/end
        # (from the selected/alternates/discarded buckets) vs. its measured
        # delivery span -- genuine, not fabricated -- but ENTRY/EXIT EVENT
        # data was never serialized (D-122's own explicit DELIVERY-zone-
        # only scope), so ENTRY/EXIT event_count is honestly 0 here: this
        # reflects a data-availability limit of this offline reconstruction,
        # never a confirmed absence of an entry/exit defect. Span-level
        # conflict_flags (D-157) are likewise unavailable here, so
        # zone_conflict is honestly reported as unavailable-hence-False,
        # never a fabricated confirmation of no conflict. Input-gated
        # (default OFF): the underlying case_b_evidence this step reads is
        # itself unconditional, so this flag governs only whether the
        # extra, optional D-170 analysis step runs at all this dispatch --
        # never a change to what the pipeline itself computes.
        if: ${{ always() && github.event.inputs.zone_usability_v2_diagnostics_enabled == '1' }}
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          python - <<'PY'
          import json, os, sys

          def load(path):
              if not os.path.exists(path) or os.path.getsize(path) == 0:
                  return None
              with open(path) as f:
                  try:
                      return json.load(f)
                  except Exception as e:
                      print(f"WARNING: failed to parse {path}: {e}", file=sys.stderr)
                      return None

          summary = {"schema_version": "cutsell.video00.d170_zone_usability_v2_summary.v1"}
          summary["entry_exit_event_data_available"] = False
          summary["conflict_flag_data_available"] = False

          try:
              from cutsell_worker.positioned_performance_evidence import (
                  DeliverySpan, PositionedEvent, PositionAwarePerformanceEvidence,
                  ZONE_DELIVERY,
              )
              from cutsell_worker.raw_understanding_map import RawUnderstandingSpan
              from cutsell_worker.watch_listen_zone_usability_v2 import (
                  build_zone_usability_v2, zone_usability_v2_dominates,
                  candidate_zone_usability_v2_row, zone_usability_v2_diagnostics,
                  CASE_A_BOUNDARY_ONLY, CASE_B_DELIVERY_OWNED, CASE_C_AMBIGUOUS, CASE_CLEAN,
              )
              import_ok = True
              import_error = None
          except Exception as e:
              import_ok = False
              import_error = f"{type(e).__name__}: {e}"

          summary["import_status"] = "ok" if import_ok else "failed"
          if not import_ok:
              summary["import_error"] = import_error
              os.makedirs("artifact", exist_ok=True)
              out_path = "artifact/video00-modal-d170-zone-usability-v2-summary.json"
              with open(out_path, "w") as f:
                  json.dump(summary, f, indent=2, sort_keys=True)
              print("--- D-170 Zone-Usability V2 diagnostic summary: IMPORT FAILED, no reconstruction attempted ---")
              print(json.dumps(summary, indent=2, sort_keys=True))
              raise SystemExit(0)

          engine = load("artifact/video00-modal.json")
          summary["source_status"] = "engine_json_present" if isinstance(engine, dict) else "engine_json_missing_or_unparseable"

          clip_meta = {}
          groups = []
          if isinstance(engine, dict):
              for bucket in ("selected", "alternates", "discarded"):
                  for clip in engine.get(bucket) or []:
                      if isinstance(clip, dict) and clip.get("clip_id"):
                          clip_meta[clip["clip_id"]] = {
                              "start": clip.get("start"), "end": clip.get("end"),
                              "text": str(clip.get("text") or ""),
                          }
              diag = engine.get("diagnostics")
              if isinstance(diag, dict):
                  raw_groups = diag.get("take_judge_groups")
                  if isinstance(raw_groups, list):
                      groups = [r for r in raw_groups if isinstance(r, dict)]

          def build_span(clip_id, ev, clip_start, clip_end):
              d_avail = bool(ev.get("delivery_available"))
              d_start = ev.get("delivery_start")
              d_end = ev.get("delivery_end")
              delivery = DeliverySpan(
                  start=d_start, end=d_end, available=d_avail,
                  source="d170_reconstruction_from_case_b_evidence",
              )
              events = []
              for e in ev.get("delivery_events") or []:
                  events.append(PositionedEvent(
                      kind=e.get("kind"), start=e.get("start"), end=e.get("end"),
                      confidence=e.get("confidence"), zone=ZONE_DELIVERY,
                      overlaps_delivery=None, starts_before_delivery=None,
                      ends_after_delivery=None,
                      evidence_source=e.get("evidence_source") or "unknown",
                  ))
              positioned = PositionAwarePerformanceEvidence(
                  candidate_id=clip_id, source_asset_id=ev.get("source_asset_id") or "",
                  source_start=clip_start if clip_start is not None else (d_start or 0.0),
                  source_end=clip_end if clip_end is not None else (d_end or 0.0),
                  delivery_span=delivery, positioned_events=tuple(events),
              )
              # source_start/source_end on the SPAN itself (used by D-167's
              # own ENTRY/EXIT duration derivation, d_start - source_start /
              # source_end - d_end) come from the real clip start/end when
              # available -- never fabricated; fall back to the delivery
              # span's own bounds (zero-width entry/exit) when the clip's
              # own start/end is missing from this run's JSON.
              return RawUnderstandingSpan(
                  span_id=clip_id, source_asset_id=ev.get("source_asset_id") or "",
                  source_start=clip_start if clip_start is not None else (d_start if d_start is not None else 0.0),
                  source_end=clip_end if clip_end is not None else (d_end if d_end is not None else 0.0),
                  transcript="", word_timings=(), positioned_evidence=positioned,
                  behavior_hypotheses=(), conflict_flags=(), evidence_provenance={},
              )

          zone_v2_by_candidate = {}
          for row in groups:
              case_b = row.get("case_b_evidence")
              if not isinstance(case_b, dict) or not case_b:
                  continue
              for clip_id, ev in case_b.items():
                  if not isinstance(ev, dict):
                      continue
                  meta = clip_meta.get(clip_id) or {}
                  try:
                      span = build_span(clip_id, ev, meta.get("start"), meta.get("end"))
                      result = build_zone_usability_v2(clip_id, span)
                  except Exception as e:
                      print(f"WARNING: V2 reconstruction failed for {clip_id}: {e}", file=sys.stderr)
                      continue
                  if result is not None:
                      zone_v2_by_candidate[clip_id] = result

          per_candidate_rows = []
          for clip_id, result in sorted(zone_v2_by_candidate.items()):
              row = {"candidate_id": clip_id, "case_classification": result.case_classification}
              row.update(candidate_zone_usability_v2_row(result))
              per_candidate_rows.append(row)

          global_summary = zone_usability_v2_diagnostics(list(zone_v2_by_candidate.values()))
          global_summary["families_with_v2_evidence"] = sum(
              1 for row in groups
              if isinstance(row.get("case_b_evidence"), dict)
              and any(cid in zone_v2_by_candidate for cid in row["case_b_evidence"])
          )

          # V1-vs-V2 saturation replay: families where >=2 members' D-163 V1
          # candidate_usability_summary already reports UNUSABLE (real,
          # already-computed field -- watch_listen_besttake_evidence_
          # enabled must also be "1" for this to be non-empty).
          saturation_families = []
          for row in groups:
              v1_summary = row.get("candidate_usability_summary")
              if not isinstance(v1_summary, dict):
                  continue
              unusable_v1_ids = [cid for cid, u in v1_summary.items() if u == "UNUSABLE"]
              if len(unusable_v1_ids) < 2:
                  continue
              v2_states = {cid: zone_v2_by_candidate[cid].overall_usability for cid in unusable_v1_ids if cid in zone_v2_by_candidate}
              distinguishable = len(set(v2_states.values())) > 1
              # Also check ordinal dominance between the saturated pair(s).
              dominance_pairs = []
              ids_with_v2 = [cid for cid in unusable_v1_ids if cid in zone_v2_by_candidate]
              for i in range(len(ids_with_v2)):
                  for j in range(len(ids_with_v2)):
                      if i == j:
                          continue
                      a, b = ids_with_v2[i], ids_with_v2[j]
                      try:
                          if zone_usability_v2_dominates(zone_v2_by_candidate[a], zone_v2_by_candidate[b]):
                              dominance_pairs.append({"alternative": a, "winner": b})
                      except Exception:
                          pass
              saturation_families.append({
                  "group_id": row.get("group_id"),
                  "v1_unusable_ids": unusable_v1_ids,
                  "v1_indistinguishable": True,
                  "v2_states": v2_states,
                  "v2_distinguishable": distinguishable,
                  "v2_dominance_pairs": dominance_pairs,
                  "v1_dominant_candidate": row.get("watch_listen_besttake_dominant_candidate"),
                  "winner_before": row.get("watch_listen_besttake_winner_before") or row.get("selected_clip_id"),
                  "winner_after": row.get("watch_listen_besttake_winner_after") or row.get("selected_clip_id"),
              })

          summary["global_v2_summary"] = global_summary
          summary["per_candidate_v2_trace"] = per_candidate_rows
          summary["v1_saturation_family_count"] = len(saturation_families)
          summary["v2_separation_count"] = sum(1 for f in saturation_families if f["v2_distinguishable"])
          summary["saturation_families"] = saturation_families
          summary["winner_immutability_check"] = "OK" if all(
              f["winner_before"] == f["winner_after"] for f in saturation_families
          ) else "REGRESSION_WINNER_CHANGED"

          os.makedirs("artifact", exist_ok=True)
          out_path = "artifact/video00-modal-d170-zone-usability-v2-summary.json"
          with open(out_path, "w") as f:
