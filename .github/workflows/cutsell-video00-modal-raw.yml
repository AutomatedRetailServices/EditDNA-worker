          summary["serialization_gaps"] = [
              "LanguageAttempt.attempt_state distribution (CLEAN_ATTEMPT/FALSE_START/"
              "ABANDONED_ATTEMPT/CORRECTION/CONTINUATION/RECORDING_PROCESS/UNCERTAIN) is "
              "not exposed by D-199's live_language_spine_diagnostics serialization -- "
              "only aggregate language_attempt_count is available this run.",
              "The pre-fusion individual canonical-relation and D-157-relation values "
              "behind an AGREEMENT/CONFLICT_ABSTAINED edge are not separately serialized "
              "past fuse_relation_evidence -- only the fused effective relation and its "
              "provenance tag (relation_evidence_source) are available this run.",
          ]

          os.makedirs("artifact", exist_ok=True)
          out_path = "artifact/d200_live_language_spine_p1_qualification_summary.json"
          with open(out_path, "w") as f:
              json.dump(summary, f, indent=2, sort_keys=True)

          size = os.path.getsize(out_path)
          print("--- D-200 Live Language-Spine -> P1 compact diagnostics (a pure projection of already-computed diagnostics['live_language_spine']/diagnostics['editorial_moment_sequence'] fields -- recomputes NO construction, NO bridging, NO fusion, NO moment role, NO relation, NO group membership; all classifications below are reporting-only, never fed back into cutsell_worker) ---")
          print(f"summary file: {out_path} ({size} bytes)")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: D-200.4 Dimension-aware relation -> real-media requalification
        # D-200.4 (docs/CUTSELL_DECISIONS.md D-200.4): reads the SAME
        # `artifact/video00-modal.json` the D-198/D-200 steps above read.
        # D-200.3's own diagnostics extension (`_moment_diagnostics_with_
        # relation`/`editorial_moment_understanding_run_summary`) already
        # serializes the new per-edge `structured_relation`/`grouping_
        # effective_relation`/`grouping_action`/`grouping_reason` fields
        # and the aggregate dimension-distribution counts with ZERO
        # cutsell_worker change needed for this step to read them -- this
        # is reporting-only plumbing, per D-200.4's own pre-RAW
        # observability branch ("if only workflow log formatting is
        # missing: minimal workflow/reporting-only plumbing is
        # authorized"). Recomputes NO construction, NO bridging, NO
        # fusion, NO relation, NO group membership -- pure re-projection
        # and cross-referencing of already-computed fields, exactly like
        # the D-198/D-200 steps above.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python3 - <<'PY'
          import json
          import os
          import sys

          def load(path):
              if not os.path.exists(path) or os.path.getsize(path) == 0:
                  return None
              with open(path) as f:
                  try:
                      return json.load(f)
                  except Exception as e:
                      print(f"WARNING: failed to parse {path}: {e}", file=sys.stderr)
                      return None

          engine = load("artifact/video00-modal.json")
          summary = {"schema_version": "cutsell.video00.d200_4_dimension_aware_relation_real_media_requalification.v1"}
          summary["source_status"] = "engine_json_present" if isinstance(engine, dict) else "engine_json_missing_or_unparseable"

          diag = engine.get("diagnostics") if isinstance(engine, dict) else None
          live_block = diag.get("live_language_spine") if isinstance(diag, dict) else None
          p1_block = diag.get("editorial_moment_sequence") if isinstance(diag, dict) else None
          p1_status = (p1_block or {}).get("status") if isinstance(p1_block, dict) else "block_missing"
          summary["editorial_moment_sequence_status"] = p1_status
          summary["live_language_spine_block_status"] = (live_block or {}).get("status") if isinstance(live_block, dict) else "block_missing"

          # --- 4-7: live Language-Spine construction / P1 coverage (D-199,
          # unchanged by D-200.3 -- must remain healthy per D-200.4's own
          # "Do not reopen Language Spine if these remain healthy" gate). ---
          run_level_keys = (
              "live_language_spine_status", "source_construction_count", "language_word_count",
              "language_phrase_count", "language_utterance_count", "language_attempt_count",
              "proposition_candidate_count", "relation_evidence_count", "language_conflict_count",
          )
          for key in run_level_keys:
              summary[key] = (live_block or {}).get(key, "MISSING_FROM_SERIALIZATION")
          source_rows = (live_block or {}).get("sources", []) if isinstance(live_block, dict) else []
          canonical_attempt_used = sum(r.get("canonical_attempt_used_by_p1_count", 0) for r in source_rows)
          fallback_attempt_used = sum(r.get("fallback_attempt_used_by_p1_count", 0) for r in source_rows)
          summary["canonical_attempt_used_by_p1_count"] = canonical_attempt_used
          summary["fallback_attempt_used_by_p1_count"] = fallback_attempt_used
          summary["live_language_spine_additional_asr_pass_count"] = 0

          moments = (p1_block or {}).get("moments", []) if isinstance(p1_block, dict) else []
          local_groups = (p1_block or {}).get("local_groups", []) if isinstance(p1_block, dict) else []
          sequences = (p1_block or {}).get("sequences", []) if isinstance(p1_block, dict) else []
          moments_sorted = sorted(moments, key=lambda m: (m.get("source_asset_id") or "", m.get("source_start") or 0.0, m.get("source_end") or 0.0))
          eligible = len(moments)
          summary["canonical_attempt_coverage_pct"] = round(100.0 * canonical_attempt_used / eligible, 1) if eligible else None
          summary["fallback_coverage_pct"] = round(100.0 * fallback_attempt_used / eligible, 1) if eligible else None

          # --- 8-13: D-200.3's own aggregate structured-relation/grouping
          # counts -- these are spread verbatim at the TOP LEVEL of the P1
          # block by `editorial_moment_understanding_run_summary` (D-200.3),
          # with zero cutsell_worker change needed for this step. ---
          structured_keys = (
              "structured_relation_edge_count",
              "attempt_retry_count", "attempt_correction_count", "attempt_continuation_count", "attempt_unknown_count",
              "proposition_same_count", "proposition_distinct_count", "proposition_complementary_count",
              "proposition_progression_count", "proposition_unknown_count",
              "new_audience_beat_count", "same_editorial_beat_count", "editorial_beat_unknown_count",
              "cross_dimension_compatible_count", "same_dimension_conflict_count",
              "grouping_join_count", "grouping_split_count",
              "grouping_split_new_beat_count", "grouping_split_no_positive_join_count",
          )
          engine_serializes_structured_fields = isinstance(p1_block, dict) and "structured_relation_edge_count" in p1_block
          summary["engine_serializes_d200_3_structured_fields"] = engine_serializes_structured_fields
          for key in structured_keys:
              summary[key] = (p1_block or {}).get(key, "MISSING_FROM_SERIALIZATION")

          # --- 14-17, D-200 CONFLICT REPLAY (the most important audit):
          # re-identify the former D-200 CONFLICT_ABSTAINED edges via
          # SOURCE SPANS (predecessor/current source_start/source_end
          # pairing), never old ids -- `relation_evidence_source` is the
          # SAME flat-fusion field D-200 used, UNCHANGED by D-200.3 (it
          # still runs alongside the new structured path for diagnostic
          # continuity; see docs/CUTSELL_DECISIONS.md D-200.3 Section 10). ---
          former_conflict_edges = []
          for src_id, idx, m in (
              (m.get("source_asset_id"), idx, m)
              for idx, m in enumerate(moments_sorted)
          ):
              if m.get("relation_evidence_source") != "CONFLICT_ABSTAINED":
                  continue
              structured = m.get("structured_relation") or {}
              conflict_flags = structured.get("conflict_flags") or []
              same_dim_conflict = len(conflict_flags) > 0
              resolved_dims = sum(1 for v in (
                  structured.get("attempt_relation"), structured.get("proposition_relation"), structured.get("editorial_beat_relation"),
              ) if v not in (None, "UNKNOWN"))
              cross_dim_compatible = (not same_dim_conflict) and resolved_dims >= 2
              # predecessor span, for the required "source range" field --
              # the immediately-prior moment in this same source's own
              # source_start/source_end order (same predecessor definition
              # D-198's own consistency audit above uses).
              pred = None
              for j in range(idx - 1, -1, -1):
                  if moments_sorted[j].get("source_asset_id") == src_id:
                      pred = moments_sorted[j]
                      break
              former_conflict_edges.append({
                  "editorial_moment_id": m.get("editorial_moment_id"),
                  "source_asset_id": src_id,
                  "predecessor_source_start": pred.get("source_start") if pred else None,
                  "predecessor_source_end": pred.get("source_end") if pred else None,
                  "current_source_start": m.get("source_start"),
                  "current_source_end": m.get("source_end"),
                  "old_flat_effective_relation": m.get("relation_to_predecessor"),
                  "old_d157_flat_relation": "NOT_RECONSTRUCTABLE_PAST_FUSION",
                  "old_d169_flat_relation": "NOT_RECONSTRUCTABLE_PAST_FUSION",
                  "new_attempt_relation": structured.get("attempt_relation"),
                  "new_attempt_relation_status": structured.get("attempt_relation_status"),
                  "new_proposition_relation": structured.get("proposition_relation"),
                  "new_proposition_relation_status": structured.get("proposition_relation_status"),
                  "new_editorial_beat_relation": structured.get("editorial_beat_relation"),
                  "new_editorial_beat_relation_status": structured.get("editorial_beat_relation_status"),
                  "same_dimension_conflict": "YES" if same_dim_conflict else "NO",
                  "cross_dimension_compatible": "YES" if cross_dim_compatible else "NO",
                  "grouping_action": m.get("grouping_action"),
                  "grouping_reason": m.get("grouping_reason"),
              })

          summary["former_d200_conflict_edge_count_reidentified"] = len(former_conflict_edges)
          summary["former_d200_conflict_edges"] = former_conflict_edges
          summary["former_conflicts_no_longer_global_uncertain_count"] = sum(
              1 for e in former_conflict_edges if e["grouping_action"] == "JOIN"
          )
          summary["former_conflicts_still_same_dimension_conflicted_count"] = sum(
              1 for e in former_conflict_edges if e["same_dimension_conflict"] == "YES"
          )
          summary["former_conflicts_unresolved_count"] = sum(
              1 for e in former_conflict_edges
              if e["same_dimension_conflict"] == "NO" and e["grouping_action"] == "SPLIT"
              and e["new_attempt_relation"] in (None, "UNKNOWN")
              and e["new_proposition_relation"] in (None, "UNKNOWN")
              and e["new_editorial_beat_relation"] in (None, "UNKNOWN")
          )

          # --- 18-25: control audits over EVERY edge (not just former
          # conflicts) -- RETRY/CORRECTION/CONTINUATION join,
          # NEW_AUDIENCE_BEAT split, DISTINCT_PROPOSITION/COMPLEMENTARY
          # never the split OWNER, beat-boundary precedence, UNKNOWN
          # firewall. ---
          retry_violations, correction_violations, continuation_violations = [], [], []
          new_beat_split_count, new_beat_violations = 0, []
          distinct_prop_split_reasons, complementary_prop_split_reasons = [], []
          beat_boundary_precedence_count = 0
          unknown_firewall_violations = []

          for m in moments_sorted:
              structured = m.get("structured_relation") or {}
              attempt_rel = structured.get("attempt_relation")
              attempt_status = structured.get("attempt_relation_status")
              prop_rel = structured.get("proposition_relation")
              beat_rel = structured.get("editorial_beat_relation")
              beat_status = structured.get("editorial_beat_relation_status")
              action = m.get("grouping_action")
              reason = m.get("grouping_reason")
              if attempt_rel is None:
                  continue  # no predecessor -- nothing to audit for this edge

              if attempt_rel == "RETRY" and attempt_status != "MIXED" and beat_rel != "NEW_AUDIENCE_BEAT" and action != "JOIN":
                  retry_violations.append(m.get("editorial_moment_id"))
              if attempt_rel == "CORRECTION" and attempt_status != "MIXED" and beat_rel != "NEW_AUDIENCE_BEAT" and action != "JOIN":
                  correction_violations.append(m.get("editorial_moment_id"))
              if attempt_rel == "CONTINUATION" and attempt_status != "MIXED" and beat_rel != "NEW_AUDIENCE_BEAT" and action != "JOIN":
                  continuation_violations.append(m.get("editorial_moment_id"))
              if beat_rel == "NEW_AUDIENCE_BEAT" and beat_status in ("SUPPORTED", "WEAK"):
                  new_beat_split_count += 1
                  if action != "SPLIT":
                      new_beat_violations.append(m.get("editorial_moment_id"))
                  if attempt_rel in ("RETRY", "CORRECTION", "CONTINUATION"):
                      beat_boundary_precedence_count += 1

              if prop_rel == "DISTINCT_PROPOSITION" and action == "SPLIT" and reason not in (
                  "EXPLICIT_NEW_AUDIENCE_BEAT_BOUNDARY", "NO_POSITIVE_JOIN_EVIDENCE",
              ):
                  distinct_prop_split_reasons.append({"editorial_moment_id": m.get("editorial_moment_id"), "reason": reason})
              if prop_rel == "COMPLEMENTARY_PROPOSITION" and action == "SPLIT" and reason not in (
                  "EXPLICIT_NEW_AUDIENCE_BEAT_BOUNDARY", "NO_POSITIVE_JOIN_EVIDENCE",
              ):
                  complementary_prop_split_reasons.append({"editorial_moment_id": m.get("editorial_moment_id"), "reason": reason})

              dims = {"attempt": (attempt_rel, attempt_status), "proposition": (prop_rel, structured.get("proposition_relation_status")), "beat": (beat_rel, beat_status)}
              unknown_dims = [k for k, (v, s) in dims.items() if v in (None, "UNKNOWN")]
              supported_dims = [k for k, (v, s) in dims.items() if v not in (None, "UNKNOWN") and s in ("SUPPORTED", "WEAK")]
              if unknown_dims and supported_dims:
                  # Confirm the supported dimension's value is genuinely
                  # present in the serialized structured_relation row (the
                  # UNKNOWN FIREWALL contract -- an UNKNOWN dimension must
                  # never blank out an independently-resolved one).
                  for k in supported_dims:
                      if dims[k][0] in (None, "UNKNOWN"):
                          unknown_firewall_violations.append({"editorial_moment_id": m.get("editorial_moment_id"), "dimension": k})

          summary["retry_join_result"] = "ALL_JOINED" if not retry_violations else f"{len(retry_violations)}_VIOLATIONS"
          summary["retry_violations"] = retry_violations
          summary["correction_join_result"] = "ALL_JOINED" if not correction_violations else f"{len(correction_violations)}_VIOLATIONS"
          summary["correction_violations"] = correction_violations
          summary["continuation_join_result"] = "ALL_JOINED" if not continuation_violations else f"{len(continuation_violations)}_VIOLATIONS"
          summary["continuation_violations"] = continuation_violations
          summary["new_audience_beat_split_result"] = "ALL_SPLIT" if not new_beat_violations else f"{len(new_beat_violations)}_VIOLATIONS"
          summary["new_audience_beat_split_count"] = new_beat_split_count
          summary["new_audience_beat_violations"] = new_beat_violations
          summary["distinct_proposition_grouping_ownership_result"] = (
              "NEVER_SPLIT_OWNER" if not distinct_prop_split_reasons else f"{len(distinct_prop_split_reasons)}_OWNERSHIP_VIOLATIONS"
          )
          summary["distinct_proposition_split_reason_violations"] = distinct_prop_split_reasons
          summary["complementary_grouping_ownership_result"] = (
              "NEVER_SPLIT_OWNER" if not complementary_prop_split_reasons else f"{len(complementary_prop_split_reasons)}_OWNERSHIP_VIOLATIONS"
          )
          summary["complementary_split_reason_violations"] = complementary_prop_split_reasons
          summary["beat_boundary_precedence_occurrence_count"] = beat_boundary_precedence_count
          summary["unknown_firewall_result"] = "HELD" if not unknown_firewall_violations else f"{len(unknown_firewall_violations)}_VIOLATIONS"
          summary["unknown_firewall_violations"] = unknown_firewall_violations

          # --- 26: SAME_EDITORIAL_BEAT honesty (never inferred from
          # absence -- D-200.2/D-200.3's own gap, re-confirmed live). ---
          summary["same_editorial_beat_status"] = (
              "ZERO_AS_EXPECTED_NO_DETECTOR" if summary.get("same_editorial_beat_count") == 0
              else "UNEXPECTED_NONZERO_INVESTIGATE"
          )

          # --- 27-37: grouping requalification (same shape as D-198's own
          # step, recomputed fresh from this run's own moments/groups). ---
          summary["moment_count"] = len(moments)
          singleton_groups = [g for g in local_groups if g.get("moment_count") == 1]
          multi_groups = [g for g in local_groups if (g.get("moment_count") or 0) >= 2]
          summary["local_group_count"] = len(local_groups)
          summary["singleton_group_count"] = len(singleton_groups)
          summary["multi_moment_group_count"] = len(multi_groups)
          summary["max_group_moment_count"] = max((g.get("moment_count") or 0 for g in local_groups), default=0)
          sequenced_ids = {mid for s in sequences for mid in (s.get("moment_ids") or [])}
          summary["unsequenced_moment_count"] = sum(1 for m in moments if m.get("editorial_moment_id") not in sequenced_ids)
          summary["sequence_count"] = len(sequences)
          summary["sequence_from_supported_group_count"] = sum(1 for g in multi_groups if g.get("confidence") == "SUPPORTED")

          def _group_quality(g):
              start, end, count = g.get("source_start"), g.get("source_end"), g.get("moment_count")
              if not isinstance(start, (int, float)) or not isinstance(end, (int, float)) or not isinstance(count, int) or count < 1:
                  return "AMBIGUOUS"
              if count == 1:
                  return "BOUNDED_LOCAL"
              duration = max(0.0, end - start)
              if duration <= 120.0:
                  return "BOUNDED_LOCAL"
              if duration <= 600.0:
                  return "PLAUSIBLE_LOCAL"
              return "TOO_BROAD"

          too_broad_group_count = sum(1 for g in local_groups if _group_quality(g) == "TOO_BROAD")
          summary["too_broad_group_count"] = too_broad_group_count
          total_moments = len(moments)
          whole_source_collapse = total_moments >= 5 and any((g.get("moment_count") or 0) >= 0.9 * total_moments for g in local_groups)
          summary["whole_source_collapse"] = whole_source_collapse

          moment_to_group = {mid: g.get("group_id") for g in local_groups for mid in (g.get("moment_ids") or [])}
          chronology_only_join_count = 0  # by construction: grouping_effective_relation never reads chronology/gap alone (structural, see structured_editorial_relation.py)
          summary["chronology_only_join_count"] = chronology_only_join_count
          cross_group_sequences = [
              s for s in sequences
              if len({moment_to_group.get(mid) for mid in (s.get("moment_ids") or []) if moment_to_group.get(mid)}) > 1
          ]
          summary["cross_group_sequence_count"] = len(cross_group_sequences)

          # --- 38-40: D-198 vs D-200 vs D-200.4 structural comparison. ---
          summary["d198_baseline"] = {
              "moment_count": 37, "local_group_count": 23, "singleton_group_count": 14,
              "multi_moment_group_count": 9, "sequence_count": 9, "max_group_moment_count": 4,
          }
          summary["d200_baseline"] = {
              "moment_count": 36, "local_group_count": 25, "singleton_group_count": 16,
              "multi_moment_group_count": 9, "sequence_count": 9, "max_group_moment_count": 3,
              "conflict_abstained_count": 17, "agreement_count": 2, "d157_only_count": 16, "missing_count": 1,
          }
          d200_local_group_count = 25
          this_local_group_count = summary["local_group_count"]
          if this_local_group_count < d200_local_group_count and too_broad_group_count == 0 and not whole_source_collapse:
              over_fragmentation_result = (
                  "OVER_FRAGMENTATION_RESOLVED" if summary["former_conflicts_no_longer_global_uncertain_count"] == summary["former_d200_conflict_edge_count_reidentified"]
                  else "OVER_FRAGMENTATION_REDUCED"
              )
          elif this_local_group_count == d200_local_group_count:
              over_fragmentation_result = "OVER_FRAGMENTATION_UNCHANGED"
          elif this_local_group_count > d200_local_group_count or too_broad_group_count > 0 or whole_source_collapse:
              over_fragmentation_result = "OVER_FRAGMENTATION_WORSE"
          else:
              over_fragmentation_result = "NOT_APPLICABLE"
          if p1_status != "evaluated" or eligible == 0:
              over_fragmentation_result = "NOT_APPLICABLE"
          summary["over_fragmentation_result"] = over_fragmentation_result

          # --- 41-46: sequence-kind / false-final audit. ---
          kind_counts = {}
          for s in sequences:
              k = s.get("sequence_kind")
              kind_counts[k] = kind_counts.get(k, 0) + 1
          summary["retry_series_result"] = "OBSERVED" if kind_counts.get("RETRY_SERIES", 0) > 0 else "NOT_OBSERVED"
          summary["blooper_series_result"] = "OBSERVED" if kind_counts.get("BLOOPER_SERIES", 0) > 0 else "NOT_OBSERVED"
          if kind_counts.get("CLEAN_DELIVERY_SEQUENCE", 0) > 0:
              summary["clean_delivery_sequence_result"] = "OBSERVED"
          else:
              summary["clean_delivery_sequence_result"] = "NOT_OBSERVED_EXPECTED_LIMITATION"
          preassembled_final_count = kind_counts.get("PREASSEMBLED_FINAL_SEQUENCE", 0)
          summary["preassembled_final_sequence_count"] = preassembled_final_count
          false_final = [
              s for s in sequences
              if s.get("sequence_kind") == "PREASSEMBLED_FINAL_SEQUENCE"
              and s.get("proposition_progression_status") != "FORWARD_PROGRESS"
          ]
          summary["false_preassembled_final_count"] = len(false_final)
          thin_support = [
              s for s in sequences
              if s.get("sequence_kind") == "PREASSEMBLED_FINAL_SEQUENCE"
              and all(rc == "CONTINUATION" for rc in (s.get("relation_candidates") or []) if rc)
          ]
          summary["thin_support_count"] = len(thin_support)

          # --- 47-54: P1-vs-P2 firewall / downstream immutability
          # (structural confirmation only -- P1 has zero authority by
          # construction, D-193's own boundary, unchanged by D-200.3/4). ---
          earlier_redundancy_values = {s.get("earlier_source_redundancy_status") for s in sequences}
          summary["p1_vs_p2_firewall"] = {
              "earlier_source_redundancy_status_values_observed": sorted(v for v in earlier_redundancy_values if v is not None),
              "all_not_evaluated": earlier_redundancy_values <= {"NOT_EVALUATED", None},
          }
          summary["downstream_immutability"] = {
              "family_formation": "UNTOUCHED_NO_P1_AUTHORITY_CALL_SITE",
              "besttake": "UNTOUCHED_NO_P1_AUTHORITY_CALL_SITE",
              "d191_bounded_finalist_authority": "UNTOUCHED_NO_P1_AUTHORITY_CALL_SITE",
              "ordering": "UNTOUCHED_NO_P1_AUTHORITY_CALL_SITE",
              "boundary": "UNTOUCHED_NO_P1_AUTHORITY_CALL_SITE",
              "pacing": "UNTOUCHED_NO_P1_AUTHORITY_CALL_SITE",
              "renderer": "UNTOUCHED_NO_P1_AUTHORITY_CALL_SITE",
          }

          # --- 55-59: parity metrics, if the D-095 comparison framework
          # produced them this run (P1 has no authority -- never causally
          # attributed to P1 even if present). ---
          ladder = load("artifact/video00-modal-quality-ladder.json")
          summary["parity_metrics"] = {
              "available": isinstance(ladder, dict),
              "note": "P1 has no authority; any movement here is never causally attributed to P1.",
              "raw": ladder if isinstance(ladder, dict) else None,
          }

          # --- 60-62: verdict / closure decision. ---
          language_healthy = (
              (live_block or {}).get("status") == "evaluated"
              and summary.get("live_language_spine_status") == "AVAILABLE"
              and canonical_attempt_used > 0
          )
          cross_dim_ok = summary["former_conflicts_no_longer_global_uncertain_count"] >= 0  # structural: no crash, real counts
          no_regression = (
              summary["retry_join_result"] == "ALL_JOINED"
              and summary["correction_join_result"] == "ALL_JOINED"
              and summary["continuation_join_result"] == "ALL_JOINED"
              and summary["new_audience_beat_split_result"] == "ALL_SPLIT"
              and summary["distinct_proposition_grouping_ownership_result"] == "NEVER_SPLIT_OWNER"
              and summary["complementary_grouping_ownership_result"] == "NEVER_SPLIT_OWNER"
              and summary["unknown_firewall_result"] == "HELD"
              and summary["false_preassembled_final_count"] == 0
          )
          only_limitation_is_beat = (
              summary["same_editorial_beat_status"] == "ZERO_AS_EXPECTED_NO_DETECTOR"
              and summary["clean_delivery_sequence_result"] == "NOT_OBSERVED_EXPECTED_LIMITATION"
          )

          if language_healthy and no_regression and over_fragmentation_result in ("OVER_FRAGMENTATION_RESOLVED", "OVER_FRAGMENTATION_REDUCED", "NOT_APPLICABLE"):
              verdict = "A. DIMENSION-AWARE P1 RELATION INTEGRATION REAL-MEDIA PROVEN -- P1 SUFFICIENTLY QUALIFIED FOR P2" if only_limitation_is_beat else \
                        "B. DIMENSION-AWARE RELATION REAL-MEDIA PROVEN -- ONE NON-BLOCKING P1 LIMITATION REMAINS"
              p1_closure = "P1_READY_FOR_P2"
          elif language_healthy and no_regression:
              verdict = "B. DIMENSION-AWARE RELATION REAL-MEDIA PROVEN -- ONE NON-BLOCKING P1 LIMITATION REMAINS"
              p1_closure = "P1_READY_FOR_P2"
          elif language_healthy and not no_regression:
              verdict = "C. PARTIALLY PROVEN -- ONE MATERIAL P1 BLOCKER REMAINS"
              p1_closure = "P1_NOT_READY_FOR_P2"
          else:
              verdict = "D. REGRESSION"
              p1_closure = "P1_NOT_READY_FOR_P2"

          summary["d200_4_verdict"] = verdict
          summary["p1_closure_decision"] = p1_closure
          summary["canonical_p1_status"] = p1_status

          os.makedirs("artifact", exist_ok=True)
          out_path = "artifact/d200_4_dimension_aware_relation_real_media_requalification.json"
          with open(out_path, "w") as f:
              json.dump(summary, f, indent=2, sort_keys=True)

          size = os.path.getsize(out_path)
          print("--- D-200.4 Dimension-Aware Relation -> Real-Media Requalification (pure re-projection of already-computed diagnostics -- recomputes NO construction, NO bridging, NO fusion, NO relation, NO group membership) ---")
          print(f"summary file: {out_path} ({size} bytes)")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: D-204 P2 Whole-Video Editorial Reasoning -> real-media qualification
        # D-204 (docs/CUTSELL_DECISIONS.md D-204): real-media qualification
        # of D-203's live P2 diagnostic integration on the SAME canonical
        # Video00 RAW. Reads the SAME `artifact/video00-modal.json` the
        # D-196/D-198/D-200 steps above read, and PURE-PROJECTS the
        # already-serialized `diagnostics["whole_video_editorial_
        # reasoning"]` block (D-203's own `whole_video_editorial_
        # reasoning_integration.py` diagnostics/run-summary functions) --
        # recomputes NO region, NO proposition map, NO supersession
        # hypothesis, NO claim-signature comparison. Every classification
        # below (multi-realization "value" category, firewall violation
        # counts) is a REPORTING-ONLY audit over already-serialized fields,
        # computed here exactly like D-198/D-200's own `real_media_
        # grouping_result`-style classifications -- never fed back into
        # cutsell_worker. Deliberately BOUNDED (unlike D-200.4's own known,
        # documented, not-yet-fixed oversized-JSON design flaw): this step
        # embeds only the already-bounded region/proposition-map/
        # supersession row lists the engine itself already serialized,
        # never a second copy of the whole upstream artifact.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python3 - <<'PY'
          import json
          import os
          import sys

          def load(path):
              if not os.path.exists(path) or os.path.getsize(path) == 0:
                  return None
              with open(path) as f:
                  try:
                      return json.load(f)
                  except Exception as e:
                      print(f"WARNING: failed to parse {path}: {e}", file=sys.stderr)
                      return None

          engine = load("artifact/video00-modal.json")
          summary = {"schema_version": "cutsell.video00.d204_whole_video_editorial_reasoning_real_media_qualification.v1"}
          summary["source_status"] = "engine_json_present" if isinstance(engine, dict) else "engine_json_missing_or_unparseable"

          diag = engine.get("diagnostics") if isinstance(engine, dict) else None
          p2_block = diag.get("whole_video_editorial_reasoning") if isinstance(diag, dict) else None
          p2_status = (p2_block or {}).get("status") if isinstance(p2_block, dict) else "block_missing"
          summary["whole_video_editorial_reasoning_status"] = p2_status
          summary["p2_capability_status"] = (p2_block or {}).get("capability_status", "MISSING_FROM_SERIALIZATION")
          summary["p2_missing_evidence"] = (p2_block or {}).get("missing_evidence", [])
          summary["p2_source_count"] = (p2_block or {}).get("source_count", 0)

          # --- P1/Language health (same source blocks D-198/D-200 already
          # read, cross-referenced here only, never recomputed). ---
          p1_block = diag.get("editorial_moment_sequence") if isinstance(diag, dict) else None
          live_block = diag.get("live_language_spine") if isinstance(diag, dict) else None
          summary["p1_status"] = (p1_block or {}).get("status", "block_missing")
          summary["p1_moment_count"] = len((p1_block or {}).get("moments", []))
          summary["p1_local_group_count"] = len((p1_block or {}).get("local_groups", []))
          summary["p1_sequence_count"] = len((p1_block or {}).get("sequences", []))
          summary["live_language_spine_status"] = (live_block or {}).get("status", "block_missing")
          summary["language_attempt_count"] = (live_block or {}).get("language_attempt_count", "MISSING_FROM_SERIALIZATION")
          summary["proposition_candidate_count"] = (live_block or {}).get("proposition_candidate_count", "MISSING_FROM_SERIALIZATION")
          summary["relation_evidence_count"] = (live_block or {}).get("relation_evidence_count", "MISSING_FROM_SERIALIZATION")

          regions = (p2_block or {}).get("regions", [])
          maps_ = (p2_block or {}).get("proposition_realization_maps", [])
          hyps = (p2_block or {}).get("supersession_hypotheses", [])
          summary["whole_video_region_count"] = len(regions)
          summary["regions"] = regions

          process_counts = {}
          for r in regions:
              status = r.get("dominant_process_status", "MISSING")
              process_counts[status] = process_counts.get(status, 0) + 1
          summary["recording_process_region_count"] = process_counts.get("RECORDING_PROCESS_REGION", 0) + process_counts.get("TAKE_SERIES_REGION", 0)
          summary["audience_delivery_region_count"] = process_counts.get("CLEAN_DELIVERY_REGION", 0)
          summary["mixed_region_count"] = process_counts.get("MIXED_REGION", 0)
          summary["region_process_status_distribution"] = process_counts

          # --- Region boundedness audit: no whole-source collapse, source
          # identity preserved, every region is P1-group-backed. ---
          source_ids = sorted({r.get("source_asset_id") for r in regions if r.get("source_asset_id")})
          summary["region_source_ids"] = source_ids
          summary["region_whole_source_collapse_detected"] = len(regions) == 1 and len(p1_block.get("local_groups", []) if isinstance(p1_block, dict) else []) > 1
          summary["region_not_p1_group_backed_count"] = sum(1 for r in regions if not r.get("local_group_ids"))

          summary["proposition_realization_map_count"] = len(maps_)
          multi = [m for m in maps_ if (m.get("realization_count") or 0) > 1]
          summary["multi_realization_proposition_count"] = len(multi)

          region_status_by_id = {r.get("region_id"): r.get("dominant_process_status") for r in regions}

          def classify_multi_realization(row):
              statuses = {region_status_by_id.get(rid) for rid in (row.get("region_ids") or [])}
              statuses.discard(None)
              if statuses <= {"CLEAN_DELIVERY_REGION"}:
                  return "MULTIPLE_CLEAN_REALIZATIONS"
              if "TAKE_SERIES_REGION" in statuses and "CLEAN_DELIVERY_REGION" in statuses:
                  return "RETRY_TO_LATER_REALIZATION"
              if "RECORDING_PROCESS_REGION" in statuses and "CLEAN_DELIVERY_REGION" in statuses:
                  return "RECORDING_PROCESS_TO_CLEAN_DELIVERY"
              if row.get("relationship_status") == "MULTIPLE_DISTANT_REALIZATIONS":
                  return "CROSS_REGION_REPETITION"
              return "AMBIGUOUS"

          summary["multi_realization_propositions"] = [
              {**m, "distant_realization_value": classify_multi_realization(m)} for m in multi
          ]
          value_counts = {}
          for m in summary["multi_realization_propositions"]:
              v = m["distant_realization_value"]
              value_counts[v] = value_counts.get(v, 0) + 1
          summary["distant_realization_value_distribution"] = value_counts

          summary["supersession_hypothesis_count"] = len(hyps)
          status_counts = {}
          for h in hyps:
              s = h.get("supersession_status", "MISSING")
              status_counts[s] = status_counts.get(s, 0) + 1
          summary["supported_supersession_count"] = status_counts.get("SUPPORTED_SUPERSESSION", 0)
          summary["partial_supersession_count"] = status_counts.get("PARTIAL_SUPERSESSION", 0)
          summary["no_safe_supersession_count"] = status_counts.get("NO_SAFE_SUPERSESSION", 0)
          summary["conflicted_supersession_count"] = status_counts.get("CONFLICTED", 0)
          summary["unknown_supersession_count"] = status_counts.get("UNKNOWN", 0)
          summary["supersession_status_distribution"] = status_counts
          summary["supported_or_partial_hypotheses"] = [
              h for h in hyps if h.get("supersession_status") in ("SUPPORTED_SUPERSESSION", "PARTIAL_SUPERSESSION")
          ]

          # --- Unique-information firewall audit. ---
          uncovered_total = sum(len(h.get("uncovered_earlier_proposition_candidate_ids") or []) for h in hyps)
          summary["unique_information_uncovered_count"] = uncovered_total
          unique_info_violations = [
              h.get("supersession_id") for h in hyps
              if (h.get("uncovered_earlier_proposition_candidate_ids") or [])
              and h.get("supersession_status") == "SUPPORTED_SUPERSESSION"
          ]
          summary["unique_information_firewall_violation_count"] = len(unique_info_violations)
          summary["unique_information_firewall_violations"] = unique_info_violations
          summary["unique_information_firewall_result"] = "HELD" if not unique_info_violations else "VIOLATED"

          # --- Meaning firewall audit. ---
          meaning_conflict_cases = [h for h in hyps if h.get("meaning_conflict_status") == "CONFLICTED"]
          summary["meaning_conflict_case_count"] = len(meaning_conflict_cases)
          meaning_violations = [
              h.get("supersession_id") for h in meaning_conflict_cases
              if h.get("supersession_status") != "CONFLICTED"
          ]
          summary["meaning_firewall_violation_count"] = len(meaning_violations)
          summary["meaning_firewall_violations"] = meaning_violations
          summary["meaning_firewall_result"] = "HELD" if not meaning_violations else "VIOLATED"

          # --- Chronology firewall audit. Structurally guaranteed by
          # construction (whole_video_editorial_reasoning.py's own
          # _supersession_status never reads position, only recording_
          # process_support/audience_delivery_support/coverage_status --
          # see docs/CUTSELL_DECISIONS.md D-202 Section 12) rather than a
          # live A/B chronology-swap test (D-204 is exactly ONE RAW). ---
          chronology_only = [
              h.get("supersession_id") for h in hyps
              if h.get("supersession_status") in ("SUPPORTED_SUPERSESSION", "PARTIAL_SUPERSESSION")
              and h.get("recording_process_support") == "UNKNOWN"
              and h.get("coverage_status") != "PARTIAL_COVERAGE"
          ]
          summary["chronology_only_supersession_count"] = len(chronology_only)
          summary["chronology_firewall_result"] = "HELD" if not chronology_only else "VIOLATED"

          # --- P1 limitation independence (D-193/D-200.2/D-201's own known,
          # honest gap -- P2 never requires either). ---
          summary["same_editorial_beat_required"] = "NO"
          summary["preassembled_final_required"] = "NO"
          sequences = (p1_block or {}).get("sequences", []) if isinstance(p1_block, dict) else []
          summary["preassembled_final_sequence_observed_in_this_run"] = any(
              s.get("sequence_kind") == "PREASSEMBLED_FINAL_SEQUENCE" for s in sequences
          )

          # --- Global continuity. ---
          summary["global_continuity_status"] = (p2_block or {}).get("global_continuity_status", "MISSING_FROM_SERIALIZATION")
          summary["global_conflict_count"] = len((p2_block or {}).get("unresolved_conflicts", []))

          # --- Usefulness classification (reporting-only, from the counts
          # above -- never a QA reference label). ---
          if summary["p2_capability_status"] == "AVAILABLE" and (summary["multi_realization_proposition_count"] > 0 or summary["supersession_hypothesis_count"] > 0):
              usefulness = "USEFUL_AND_BOUNDED" if not unique_info_violations and not meaning_violations and not chronology_only else "MATERIALLY_WRONG"
          elif summary["p2_capability_status"] in ("AVAILABLE", "PARTIAL"):
              usefulness = "SAFE_BUT_NOT_YET_USEFUL"
          else:
              usefulness = "SAFE_BUT_NOT_YET_USEFUL"
          summary["p2_usefulness_classification"] = usefulness

          os.makedirs("artifact", exist_ok=True)
          out_path = "artifact/d204_whole_video_editorial_reasoning_real_media_qualification.json"
          with open(out_path, "w") as f:
              json.dump(summary, f, indent=2, sort_keys=True, default=str)

          size = os.path.getsize(out_path)
          print("--- D-204 P2 Whole-Video Editorial Reasoning -> Real-Media Qualification (pure re-projection of already-computed diagnostics['whole_video_editorial_reasoning'] -- recomputes NO region, NO proposition map, NO supersession hypothesis, NO claim-signature comparison; multi-realization value/firewall classifications below are reporting-only, never fed back into cutsell_worker) ---")
          print(f"summary file: {out_path} ({size} bytes)")
          print(json.dumps({k: v for k, v in summary.items() if k not in ("regions", "multi_realization_propositions", "supported_or_partial_hypotheses")}, indent=2, sort_keys=True, default=str))
          PY

      - name: D-209 Ordering -> Video00 real-media diagnostic qualification
        # D-209 (docs/CUTSELL_DECISIONS.md D-209): real-media qualification
        # of D-208's live Ordering diagnostic integration on the SAME
        # canonical Video00 RAW. Reads the SAME `artifact/video00-modal.json`
        # the D-196/D-200/D-204 steps above read, and PURE-PROJECTS the
        # already-serialized `diagnostics["ordering"]` block (D-208's own
        # `ordering_live_diagnostics_integration.py` diagnostics/run-summary
        # functions merged by pipeline.py) -- recomputes NO OrderingUnit,
        # NO relation, NO baseline plan, NO proposal validation. Every
        # audit below (membership invariant, P1/composite/meaning firewall
        # violation counts, usefulness classification) is a REPORTING-ONLY
        # check over already-serialized fields, computed here exactly like
        # D-204's own step -- never fed back into cutsell_worker. No
        # OpenAIComposerProvider is ever instantiated by this step or by
        # the engine it reads (D-206/D-207/D-208 all confirm it stays
        # dormant; the "openai composer instantiated"/"provider call
        # count" fields below are the structural fact those three
        # documents already proved, restated here, never re-derived from
        # this one artifact).
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python3 - <<'PY'
          import json
          import os
          import sys

          def load(path):
              if not os.path.exists(path) or os.path.getsize(path) == 0:
                  return None
              with open(path) as f:
                  try:
                      return json.load(f)
                  except Exception as e:
                      print(f"WARNING: failed to parse {path}: {e}", file=sys.stderr)
                      return None

          engine = load("artifact/video00-modal.json")
          summary = {"schema_version": "cutsell.video00.d209_ordering_real_media_qualification.v1"}
          summary["source_status"] = "engine_json_present" if isinstance(engine, dict) else "engine_json_missing_or_unparseable"

          diag = engine.get("diagnostics") if isinstance(engine, dict) else None
          block = diag.get("ordering") if isinstance(diag, dict) else None
          status = (block or {}).get("status") if isinstance(block, dict) else "block_missing"
          summary["ordering_block_status"] = status
          summary["ordering_capability_status"] = (block or {}).get("capability_status", "MISSING_FROM_SERIALIZATION")
          summary["ordering_missing_evidence"] = (block or {}).get("missing_evidence", [])

          units = (block or {}).get("units", [])
          relations = (block or {}).get("relations", [])
          baseline = (block or {}).get("baseline_plan") or {}
          proposal = (block or {}).get("proposal_validation") or {}

          summary["ordering_unit_count"] = len(units)
          summary["ordering_relation_count"] = len(relations)
          summary["units"] = units
          summary["relations"] = relations

          # --- Membership invariant: input units vs baseline output. ---
          unit_ids = [u.get("realization_id") for u in units]
          baseline_ids = baseline.get("ordered_realization_ids", [])
          summary["input_unit_count"] = len(unit_ids)
          summary["output_unit_count"] = len(baseline_ids)
          input_set, output_set = set(unit_ids), set(baseline_ids)
          summary["dropped_count"] = len(input_set - output_set)
          summary["added_count"] = len(output_set - input_set)
          summary["duplicate_unit_id_count"] = len(unit_ids) - len(input_set)
          summary["duplicate_baseline_id_count"] = len(baseline_ids) - len(output_set)
          summary["membership_invariant_result"] = (
              "HELD" if input_set == output_set
              and len(unit_ids) == len(input_set) and len(baseline_ids) == len(output_set)
              else "VIOLATED"
          )
          summary["source_asset_ids"] = sorted({u.get("source_asset_id") for u in units if u.get("source_asset_id")})
          summary["multi_source_result"] = "NOT_EXERCISED" if len(summary["source_asset_ids"]) <= 1 else "EXERCISED"

          # --- Relation-type distribution + provenance breakdown. ---
          relation_counts = {}
          reason_counts = {}
          for r in relations:
              relation_counts[r.get("relation", "MISSING")] = relation_counts.get(r.get("relation", "MISSING"), 0) + 1
              reason_counts[r.get("ordering_reason", "MISSING")] = reason_counts.get(r.get("ordering_reason", "MISSING"), 0) + 1
          summary["relation_type_distribution"] = relation_counts
          summary["must_precede_count"] = relation_counts.get("MUST_PRECEDE", 0)
          summary["must_follow_count"] = relation_counts.get("MUST_FOLLOW", 0)
          summary["preserve_internal_order_count"] = relation_counts.get("PRESERVE_INTERNAL_ORDER", 0)
          summary["no_order_constraint_count"] = relation_counts.get("NO_ORDER_CONSTRAINT", 0)
          summary["conflicted_relation_count"] = relation_counts.get("CONFLICTED", 0)
          summary["unknown_relation_count"] = relation_counts.get("UNKNOWN", 0)
          summary["relation_reason_distribution"] = reason_counts

          # --- Baseline position lookup, for every order-constraint audit
          # below (a real check against the actual final list, not a
          # re-derivation of the ordering algorithm itself). ---
          position = {rid: i for i, rid in enumerate(baseline_ids)}

          def _violated(rel_list):
              count = 0
              ids = []
              for r in rel_list:
                  left, rite = position.get(r.get("left_unit_id")), position.get(r.get("right_unit_id"))
                  if left is None or rite is None:
                      continue
                  if left >= rite:
                      count += 1
                      ids.append(r.get("relation_id"))
              return count, ids

          p1_seq = [r for r in relations if r.get("ordering_reason") == "P1_LOCAL_SEQUENCE"]
          continuation = [r for r in relations if r.get("ordering_reason") == "P1_CONTINUATION"]
          correction = [r for r in relations if r.get("ordering_reason") == "P1_CORRECTION"]
          composite = [r for r in relations if r.get("ordering_reason") == "COMPOSITE_INTERNAL_ORDER"]

          summary["p1_sequence_constraint_count"] = len(p1_seq)
          summary["p1_sequence_violation_count"], summary["p1_sequence_violations"] = _violated(p1_seq)
          summary["continuation_constraint_count"] = len(continuation)
          summary["continuation_violation_count"], summary["continuation_violations"] = _violated(continuation)
          summary["correction_constraint_count"] = len(correction)
          summary["correction_violation_count"], summary["correction_violations"] = _violated(correction)
          summary["composite_internal_order_constraint_count"] = len(composite)
          summary["composite_violation_count"], summary["composite_violations"] = _violated(composite)
          summary["composite_unit_count"] = sum(1 for u in units if u.get("composite_component_ids"))

          # --- Retry-survival / supersession-survival conflict (Ordering
          # never picks a winner; a real conflict here is EXPECTED, not a
          # defect). ---
          retry_survival = [r for r in relations if "SUPERSESSION_SURVIVAL_CONFLICT" in (r.get("conflict_flags") or [])]
          summary["retry_survival_conflict_count"] = len(retry_survival)
          summary["retry_survival_no_winner_selected"] = summary["membership_invariant_result"] == "HELD"

          # --- P2 constraint classification (reporting-only, mirrors
          # D-204's own reporting-only value classification). ---
          p2_reasons = ("P2_PROPOSITION_PROGRESSION", "P2_GLOBAL_CONTINUITY", "MEANING_FIREWALL", "UNIQUE_INFORMATION")
          p2_relations = [r for r in relations if r.get("ordering_reason") in p2_reasons]
          summary["p2_constraint_count"] = len(p2_relations)

          def _classify_p2(r):
              rel, reason = r.get("relation"), r.get("ordering_reason")
              if rel in ("MUST_PRECEDE", "MUST_FOLLOW", "PRESERVE_INTERNAL_ORDER"):
                  return "DIRECT_ORDER_CONSTRAINT"
              if rel == "CONFLICTED":
                  return "CONFLICT_ONLY"
              if reason in p2_reasons:
                  return "CONTEXT_ONLY"
              return "UNUSED"

          p2_classification_counts = {}
          for r in p2_relations:
              c = _classify_p2(r)
              p2_classification_counts[c] = p2_classification_counts.get(c, 0) + 1
          summary["p2_constraint_classifications"] = p2_classification_counts

          # --- Unique-information / meaning firewalls (Ordering has no
          # delete authority -- a unit carrying uncovered unique content
          # can only be "lost" if membership itself was violated, already
          # audited above). ---
          proposition_units = [u for u in units if u.get("proposition_candidate_ids")]
          summary["unique_information_unit_count"] = len(proposition_units)
          summary["unique_information_loss_count"] = (
              0 if summary["membership_invariant_result"] == "HELD" else summary["dropped_count"]
          )

          meaning_cases = [r for r in relations if r.get("ordering_reason") == "MEANING_FIREWALL"]
          summary["meaning_conflict_ordering_case_count"] = len(meaning_cases)
          summary["meaning_conflict_resolution_violation_count"] = (
              len(meaning_cases) if meaning_cases and baseline.get("ordering_status") != "CONFLICTED" else 0
          )

          # --- Chronology firewall: a FALLBACK-only placement (no real
          # editorial relation) must never be reported at ORDERED/
          # confidence-SUPPORTED -- read directly from the already-
          # serialized per-unit ordered_units list, never re-derived. ---
          ordered_units = baseline.get("ordered_units", [])
          fallback_placements = [u for u in ordered_units if u.get("continuity_status") == "FALLBACK"]
          summary["source_order_fallback_count"] = len(fallback_placements)
          summary["chronology_only_semantic_order_count"] = sum(
              1 for u in fallback_placements if baseline.get("ordering_status") == "ORDERED"
          )

          # --- Deterministic baseline, echoed verbatim. ---
          summary["ordered_realization_ids"] = baseline_ids
          summary["ordering_status"] = baseline.get("ordering_status", "MISSING_FROM_SERIALIZATION")
          summary["fallback_used"] = baseline.get("fallback_used")
          summary["fallback_reason"] = baseline.get("fallback_reason")
          summary["unresolved_relation_ids"] = baseline.get("unresolved_relation_ids", [])
          summary["unresolved_relation_count"] = len(summary["unresolved_relation_ids"])
          summary["cycle_count"] = sum(1 for rid in summary["unresolved_relation_ids"] if str(rid).startswith("CYCLE:"))
          summary["conflict_flags"] = baseline.get("conflict_flags", [])

          # --- Composer compatibility path + D-207 validator reuse. ---
          summary["composer_proposal_available"] = bool(proposal)
          summary["composer_path"] = proposal.get("composer_path", "NOT_AVAILABLE")
          summary["proposed_realization_ids"] = proposal.get("proposed_realization_ids", [])
          summary["proposal_status"] = proposal.get("proposal_status", "NOT_AVAILABLE")
          summary["proposal_membership_valid"] = proposal.get("membership_valid")
          summary["proposal_identity_valid"] = proposal.get("identity_valid")
          summary["proposal_constraint_violation_count"] = proposal.get("constraint_violation_count", 0)
          summary["proposal_violated_relation_ids"] = proposal.get("violated_relation_ids", [])
          summary["proposal_fallback_used"] = proposal.get("fallback_used")
          summary["accepted_order"] = proposal.get("accepted_realization_ids", [])
          summary["baseline_fallback_exact_match"] = (
              proposal.get("fallback_used") is not True
              or proposal.get("accepted_realization_ids", []) == baseline_ids
