        # D-184 wiring already attached to each `take_judge_groups` row --
        # recomputes NO confidence classification, NO arbiter verdict, NO
        # BestTake decision, NO score. The two run-level summaries are
        # produced by calling D-183's/D-184's own already-tested pure
        # aggregator functions (`terminal_besttake_confidence_run_summary`,
        # `bounded_finalist_arbiter_run_summary`) over those same rows --
        # the SAME functions the D-185 report already named, imported
        # exactly like the existing "Verify active-path identity" step
        # already imports `cutsell_worker.active_path_identity`. Region
        # source-mapping reuses the SAME QA-only span/text re-identification
        # approach as the D-123/D-181 steps, but prints ONLY candidate_id/
        # source_start/source_end/a short text hash -- never a transcript,
        # never the regression fixture's own text. Zero `cutsell_worker`
        # editorial change; zero D-183/D-184 logic change; zero new runtime
        # env var into the pipeline itself.
        if: always()
