                      "candidate_id": cid,
                      "source_start": clip_meta[cid].get("start"),
                      "source_end": clip_meta[cid].get("end"),
                      "text_hash": clip_meta[cid].get("text_hash"),
                  }
                  for cid in sorted(matched)
              ]

