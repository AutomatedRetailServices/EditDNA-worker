          for row in sorted(rows, key=lambda r: str(r.get("group_id") or "")):
              family_rows.append({
                  "family_id": row.get("group_id"),
                  "meaning_sufficient_candidates": row.get("meaning_sufficient_candidates"),
                  "semantic_authority_status": row.get("semantic_authority_gate_status"),
                  "complete_window_agreement_status": row.get("complete_window_agreement_status"),
                  "semantic_fast_path_candidate": row.get("semantic_fast_path_candidate"),
