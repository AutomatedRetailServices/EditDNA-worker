              {
                  "source_start": m.get("source_start"),
                  "source_end": m.get("source_end"),
                  "moment_role": m.get("moment_role"),
                  "confidence": m.get("confidence"),
                  "relation_to_predecessor": m.get("relation_to_predecessor"),
                  "local_group_id": moment_to_group.get(m.get("editorial_moment_id")),
                  "sequence_kind": moment_to_sequence_kind.get(m.get("editorial_moment_id")),
              }
              for m in moments_sorted
          ]

          # --- Compact region source-mapping (QA-only; SAME approach as
          # D-190/D-192/D-196's own steps -- never a runtime grouping
          # input). Applied here to LOCAL GROUP spans, to detect whether
          # any group still crosses clearly unrelated known regions. ---
          GYNECOLOGIST_SPAN = (90.0, 109.0)

          def _span_overlaps(meta, lo, hi):
              start, end = meta.get("start"), meta.get("end")
              if not isinstance(start, (int, float)) or not isinstance(end, (int, float)):
                  return False
              return start < hi and end > lo

          def _region_norm_refs(prefix):
              out = []
              if isinstance(regression_fixture, dict):
                  for check in regression_fixture.get("checks") or []:
                      if not isinstance(check, dict) or not str(check.get("id", "")).startswith(prefix):
                          continue
                      if check.get("kind") == "required_order":
                          continue
                      text = check.get("text")
                      if text:
                          out.append(" ".join(str(text).lower().split()))
              return [t for t in out if t]

          def _region_candidates(prefix, span=None):
              refs = _region_norm_refs(prefix)
              matched = set()
              if span:
                  lo, hi = span
                  matched |= {cid for cid, meta in clip_meta.items() if _span_overlaps(meta, lo, hi)}
              matched |= {
                  cid for cid, meta in clip_meta.items()
                  if refs and any(ref in meta.get("_norm_text", "") for ref in refs)
              }
              return matched

          pimples_ids = _region_candidates("pimples")
          gynecologist_ids = _region_candidates("gynecologist", GYNECOLOGIST_SPAN)
          cross_region_groups = []
          for g in groups_sorted:
              lo, hi = g.get("source_start"), g.get("source_end")
              if not isinstance(lo, (int, float)) or not isinstance(hi, (int, float)):
                  continue
              overlaps_pimples = any(_span_overlaps(clip_meta.get(cid, {}), lo, hi) for cid in pimples_ids)
              overlaps_gyn = any(_span_overlaps(clip_meta.get(cid, {}), lo, hi) for cid in gynecologist_ids)
              if overlaps_pimples and overlaps_gyn:
                  cross_region_groups.append({"group_id": g.get("group_id"), "source_start": lo, "source_end": hi})
          summary["region_source_mapping"] = {
              "pimples_candidate_count": len(pimples_ids),
              "gynecologist_candidate_count": len(gynecologist_ids),
              "cross_region_group_count": len(cross_region_groups),
              "cross_region_groups": cross_region_groups,
          }

          # --- D-196 -> D-198 comparison (D-196's own real, already-
          # documented numbers -- docs/CUTSELL_DECISIONS.md D-196 -- as
          # fixed historical comparison literals, never a runtime input). ---
          d196_baseline = {
              "moment_count": 36, "sequence_count": 1, "max_sequence_span_sec": 353.14,
              "classification": "LOCAL_GROUPING_TOO_BROAD",
          }
          max_group_span = max(
              (max(0.0, (g.get("source_end") or 0) - (g.get("source_start") or 0)) for g in groups_sorted),
              default=0.0,
          )
          summary["d196_vs_d198_comparison"] = {
              "d196_baseline": d196_baseline,
              "d198_moment_count": total_moments,
              "d198_local_group_count": len(local_groups),
              "d198_singleton_group_count": run_summary.get("singleton_group_count"),
              "d198_multi_moment_group_count": run_summary.get("multi_moment_group_count"),
              "d198_sequence_count": len(sequences),
              "d198_max_group_moment_count": run_summary.get("max_group_moment_count"),
              "d198_max_group_source_span_sec": max_group_span,
              "d198_whole_run_grouping_assessment": whole_run_assessment,
          }

          # --- Real-media grouping result verdict. ---
          if p1_status != "evaluated" or total_moments == 0:
