name: CutSell Video00 Modal RAW

# D-043 "BUILD MODAL FULL VIDEO00 EXECUTION AND RUN ONE FULL BENCHMARK":
# resumes the exact full Video00 benchmark cutsell-video00-raw-v5-auto-
# microtrim.yml (RunPod Serverless) was supposed to execute, on Modal as
# an ADDITIONAL execution backend. RunPod Serverless and RunPod Pod stay
# fully available and untouched -- this workflow is new, alongside them,
# never a replacement.
#
# workflow_dispatch only, same as every other paid-GPU QA workflow this
# repo has added (Modal minimal test, RunPod Pod RAW/direct-exec/minimal-
# isolation) -- never on a push trigger, so a controlled Video00-scale
# Modal spend is always an explicit, one-off decision. (A temporary
# bootstrap push trigger registered this workflow with GitHub's dispatch
# API -- run 33626736759 -- and has been removed here now that it's
# confirmed working, same precedent as every other new workflow_dispatch-
# only workflow this repo has added.)
#
# No Docker build/push/digest-pin step here (unlike the RunPod Serverless
# RAW workflow): Modal's own `.add_local_python_source("cutsell_worker")`
# mounts the cutsell_worker package from this exact checked-out commit
# directly into the remote container at `modal run` invocation time -- the
# "exact test head" guarantee for this backend. The checked-out commit SHA
# is still printed for the record.
on:
  workflow_dispatch:
    inputs:
      hybrid_max_edit_usd:
        # D-094.F2: per-edit hybrid dollar ceiling override
        # (CUTSELL_HYBRID_MAX_EDIT_USD). Empty (default) = code default
        # $0.0075, i.e. exactly the behaviour of every run to date. Setting
        # it is an economics decision the Product Owner takes explicitly per
        # run (see docs/CUTSELL_DECISIONS.md D-094.1); the value is printed
        # in the run log so the evidence names the ceiling it ran under.
        description: "Optional CUTSELL_HYBRID_MAX_EDIT_USD override (e.g. 0.02). Empty = code default 0.0075."
        required: false
        default: ""
        type: string
      bridge_complete_pairwise_singleton:
        # D-094.2: "1" overlays CUTSELL_BRIDGE_COMPLETE_PAIRWISE_SINGLETON=1
        # (grouping: accept a singleton-attaches-to-component bridge on
        # complete pairwise confirmation without the D-085 component probe).
        # Empty (default) = code default OFF, byte-identical to every run to
        # date. A D-085 grouping-safety contract change -> Product Owner
        # decision per run (docs/CUTSELL_DECISIONS.md D-094.2).
        description: "Optional: '1' enables CUTSELL_BRIDGE_COMPLETE_PAIRWISE_SINGLETON (D-094.2). Empty = OFF."
        required: false
        default: ""
        type: string
      watch_listen_family_evidence_enabled:
        # D-159: "1" overlays CUTSELL_WATCH_LISTEN_FAMILY_EVIDENCE_ENABLED=1
        # (D-158's Attempt Relationship structured authority -- lets real
        # Watch+Listen Understanding V1 evidence withhold a Family Formation
        # merge Proposition Identity evidence alone would otherwise make;
        # can never create a merge from Watch+Listen evidence alone). Empty
        # (default) = code default OFF, byte-identical to every run before
        # D-159. Same input-gated overlay mechanism as
        # bridge_complete_pairwise_singleton above -- explicitly authorized
        # per run, never a silent default flip (docs/CUTSELL_DECISIONS.md
        # D-159). No cutsell_worker editorial module is touched by this
        # overlay; it only lets an existing, already-tested runtime flag be
        # set for this one dispatch.
        description: "Optional: '1' enables CUTSELL_WATCH_LISTEN_FAMILY_EVIDENCE_ENABLED (D-159). Empty = OFF."
        required: false
        default: ""
        type: string
      watch_listen_relation_discovery_enabled:
        # D-162: "1" overlays CUTSELL_WATCH_LISTEN_RELATION_DISCOVERY_ENABLED=1
        # (D-161's Watch+Listen Relation Discovery Gate -- lets real Watch+
        # Listen Understanding V1 evidence PROPOSE a candidate relation the
        # existing semantic pair-generation/batch-cap path never reached;
        # every candidate is still handed to the SAME structured authority
        # D-158 already uses, and only a final RETRY relation with
        # independently-sufficient proposition evidence ever merges --
        # discovery alone can never force a merge). Empty (default) = code
        # default OFF, byte-identical to every run before D-162. Deliberately
        # a SEPARATE flag from watch_listen_family_evidence_enabled above
        # (merge-veto and relation-discovery are different authorities, per
        # D-161's own instruction) -- same input-gated overlay mechanism as
        # that input and bridge_complete_pairwise_singleton, explicitly
        # authorized per run, never a silent default flip
        # (docs/CUTSELL_DECISIONS.md D-162). No cutsell_worker editorial
        # module is touched by this overlay; it only lets an existing,
        # already-tested runtime flag be set for this one dispatch.
        description: "Optional: '1' enables CUTSELL_WATCH_LISTEN_RELATION_DISCOVERY_ENABLED (D-162/D-161). Empty = OFF."
        required: false
        default: ""
        type: string
      watch_listen_besttake_evidence_enabled:
        # D-164: "1" overlays CUTSELL_WATCH_LISTEN_BESTTAKE_EVIDENCE_ENABLED=1
        # (D-163's Watch+Listen PERFORMANCE/USABILITY BestTake evidence guard
        # -- DIAGNOSTIC-ONLY: it evaluates whether the existing BestTake
        # winner for a family has materially worse DELIVERY usability than a
        # meaning-sufficient alternative and reports the judgment on each
        # take_judge_groups row; it NEVER mutates selected_clip_id, ranked,
        # membership, Family Formation, Boundary, or Pacing -- see D-163's
        # own module docstring, cutsell_worker/watch_listen_besttake_
        # evidence.py). Empty (default) = code default OFF, byte-identical
        # to every run before D-164. A THIRD, separate flag from
        # watch_listen_family_evidence_enabled (D-159, merge-veto) and
        # watch_listen_relation_discovery_enabled (D-162/D-161, relation-
        # discovery) above -- three different authorities, per D-163's own
        # instruction. Same input-gated overlay mechanism as those two
        # inputs, explicitly authorized per run, never a silent default flip
        # (docs/CUTSELL_DECISIONS.md D-164). No cutsell_worker editorial
        # module is touched by this overlay; it only lets an existing,
        # already-tested runtime flag be set for this one dispatch.
        description: "Optional: '1' enables CUTSELL_WATCH_LISTEN_BESTTAKE_EVIDENCE_ENABLED (D-164/D-163). Empty = OFF."
        required: false
        default: ""
        type: string
      zone_usability_v2_diagnostics_enabled:
        # D-170: "1" enables a SEPARATE, LATE-STAGE, tail-safe summary step
        # that reconstructs D-167's Watch+Listen Zone-Usability V2
        # (cutsell_worker/watch_listen_zone_usability_v2.py, DIAGNOSTIC-ONLY,
        # unwired) from evidence THIS workflow's existing, unconditional
        # `case_b_evidence` (D-122) per-clip DELIVERY-zone event records
        # already carries in artifact/video00-modal.json -- zero
        # cutsell_worker editorial change, no new runtime env var into the
        # pipeline itself, no RunPod shared template edit. Reads real
        # per-event kind/start/end/confidence/duration already computed
        # this run; recomputes no perception, no BestTake decision, no
        # selected_clip_id. ENTRY/EXIT zone EVENT data is not serialized
        # anywhere today (D-122's own explicit DELIVERY-zone-only scope),
        # so this step honestly reports ENTRY/EXIT zone durations (derived
        # from each clip's own real start/end vs. its measured delivery
        # span -- never fabricated) with zero reconstructable event
        # evidence, not a confirmed absence of defects -- see the summary's
        # own `entry_exit_event_data_available: false` field. Recommended
        # alongside watch_listen_besttake_evidence_enabled=1 above so the
        # D-163 guard's own fields are present for the same-run comparison
        # this qualification requires. Empty (default) = OFF, byte-
        # identical to every run before D-170.
        description: "Optional: '1' enables the D-170 Zone-Usability V2 diagnostic summary (reconstructed from existing D-122 case_b_evidence). Empty = OFF."
        required: false
        default: ""
        type: string
      zone_usability_v2_besttake_enabled:
        # D-173: "1" overlays CUTSELL_WATCH_LISTEN_ZONE_USABILITY_V2_
        # BESTTAKE_ENABLED=1 (D-172's own bounded adapter, cutsell_worker/
        # watch_listen_besttake_v2_evidence.py) -- a SEPARATE, LIVE-PIPELINE
        # runtime flag from `zone_usability_v2_diagnostics_enabled` above,
        # which only controls D-170's own WORKFLOW-SIDE reconstruction step
        # and never touches the real pipeline.py code path. This flag lets
        # D-163's own diagnostic guard (evaluate_watch_listen_besttake_
        # guard, unchanged) additionally consult D-167's refined Zone-
        # Usability V2 evidence via evaluate_watch_listen_besttake_guard_v2
        # -- DIAGNOSTIC-ONLY, per D-172's own module docstring: it never
        # mutates selected_clip_id/ranked/membership/Family Formation/
        # Boundary/Pacing, and only ever refines the ONE V1 outcome
        # (BYPASS_POOR_USABILITY_WINNER) D-164 proved under-resolved. Only
        # takes effect when watch_listen_besttake_evidence_enabled=1 is ALSO
        # set (D-172's own pipeline.py wiring nests the V2 block inside
        # D-163's own base evidence-collection block). Empty (default) =
        # code default OFF, byte-identical to every run before D-172/D-173.
        description: "Optional: '1' enables CUTSELL_WATCH_LISTEN_ZONE_USABILITY_V2_BESTTAKE_ENABLED (D-173/D-172). Requires watch_listen_besttake_evidence_enabled=1 too. Empty = OFF."
        required: false
        default: ""
        type: string
      guard_authority_enabled:
        # D-175: "1" overlays CUTSELL_WATCH_LISTEN_BESTTAKE_GUARD_AUTHORITY_
        # ENABLED=1 (D-174's own bounded BestTake guard authority,
        # cutsell_worker/watch_listen_besttake_guard_authority.py) -- a
        # SEPARATE, LIVE-PIPELINE runtime flag from watch_listen_besttake_
        # evidence_enabled and zone_usability_v2_besttake_enabled above.
        # Unlike those two (DIAGNOSTIC-ONLY), this authority CAN mutate a
        # family's selected_clip_id -- but ONLY when D-174's own bounded
        # 11-condition eligibility test finds a real, meaning-sufficient,
        # MATERIAL/SEVERE-dominated current winner, and even then ONLY the
        # EXISTING deterministic BestTake ladder (deterministic_best_take_
        # authority.clear_retry_family_winner, reused verbatim, D-123's own
        # unchanged >=0.30 gap contract) ever chooses the replacement -- see
        # D-174's own module docstring for the full "WATCH+LISTEN MAY VETO
        # A BAD WINNER; IT DOES NOT BECOME THE WINNER SELECTOR" contract.
        # Only takes effect when watch_listen_besttake_evidence_enabled=1
        # AND zone_usability_v2_besttake_enabled=1 are ALSO set (D-174's own
        # pipeline.py wiring nests Phase 1 inside D-172's own V2 block, and
        # Phase 2's materiality floor requires a real V2 severity value).
        # Empty (default) = code default OFF, byte-identical to every run
        # before D-174/D-175.
        description: "Optional: '1' enables CUTSELL_WATCH_LISTEN_BESTTAKE_GUARD_AUTHORITY_ENABLED (D-175/D-174). Requires watch_listen_besttake_evidence_enabled=1 AND zone_usability_v2_besttake_enabled=1 too. Empty = OFF."
        required: false
        default: ""
        type: string

concurrency:
  group: cutsell-video00-modal-raw-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCE_KEY: Editdna longform validation/VIDEO-2026-07-30-09-18-03.mp4
  # QA-only authoritative Human Gold reference -- never read by production
  # Selection/Boundary code, never part of the run_op() payload.
  HUMAN_GOLD_KEY: Editdna longform validation/5E01F214-A364-4F4B-8F25-D39B1E2B21D2.MP4
  # D-095 QA-only Cut.ai commercial-baseline reference (docs/video00-reference-oracles.md)
  # -- same rule as Human Gold: never read by production code, never in the payload.
  CUTAI_REFERENCE_KEY: Editdna longform validation/D40F1D43-7391-44D5-8D83-09CB62FBF397.MP4
  BENCHMARK_ID: video00-modal-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  video00-modal-raw:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout exact test head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Print exact test head + D-040 ancestry
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD: $(git rev-parse HEAD) ($(git log -1 --oneline))"
          # D-043 Section 2: never silently benchmark an older semantic
          # head merely because the Modal infra lives on a feature branch.
          for commit in 19f6612 e561b8b 3f7122b 796b0dc; do
            if git merge-base --is-ancestor "$commit" HEAD 2>/dev/null; then
              echo "commit $commit IS an ancestor of HEAD"
            else
              echo "WARNING: commit $commit is NOT an ancestor of HEAD -- semantic head may be stale" >&2
            fi
          done
          test -s benchmarks/video00_regression_qa.json
          test -s benchmarks/video00_selection_lock.json

      - name: Prepare artifact directory
        shell: bash
        run: mkdir -p artifact

      - name: Verify Modal auth env
        shell: bash
        run: |
          python3 -c "
          import os
          from modal_gpu_config import require_modal_token_env
          require_modal_token_env(os.environ)
          print('Modal auth env present.')
          "

      - name: Install Modal client
        shell: bash
        run: |
          # boto3 is D-056.1's addition (never a live-modal-run
          # dependency before this): the local `modal run` wrapper now
          # checks/persists a durable S3 result marker itself -- see
          # "Run Modal full Video00 benchmark" below.
          # numpy: D-095 quality-ladder audio alignment on the runner (CPU, QA-only).
          pip install --disable-pip-version-check --quiet modal boto3 'numpy>=1.26,<3' 'requests>=2.32.3'

      - name: Load base RunPod template (env source of truth only)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --url "https://rest.runpod.io/v1/templates" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output /tmp/templates.json
          jq -c '[.[] | select(.name == "EditDNA-Worker-2")][0]' /tmp/templates.json > /tmp/base-template.json
          test "$(cat /tmp/base-template.json)" != "null"

      - name: Build masked Modal env-secret file
        shell: bash
        run: |
          set -euo pipefail
          # D-043 Section 4: never a second, hand-typed env-var list -- the
          # FULL live RunPod template env dict is the single existing
          # source of truth for the canonical Video00 path's runtime
          # configuration. Every value is masked in the CI log before this
          # step ever prints anything derived from it.
          #
          # D-044 fix: the canonical RunPod Serverless RAW workflow
          # (cutsell-video00-raw-v5-auto-microtrim.yml, "Create unified
          # Selection template" step) never dispatches on the base
          # template's env verbatim -- it explicitly overlays
          # CUTSELL_HYBRID_LLM_ENABLED:"1" and CUTSELL_HYBRID_PROVIDER:
          # "google" on top of it before every live run. This workflow
          # omitted that overlay, which left the base template's own
          # (evidently non-truthy) default in place -- confirmed live (run
          # 33636255124): diagnostics.semantic_idea_equivalence.status was
          # "not_requested" for the entire benchmark because
          # brain_runtime.build_brain_runtime only constructs the bounded
          # semantic-equivalence arbiter when CUTSELL_HYBRID_LLM_ENABLED is
          # truthy -- the arbiter was never even instantiated, so
          # IdeaClusterer's semantic tier never ran at all. Applying the
          # SAME two-variable overlay the RunPod workflow already uses
          # (source of truth; nothing else invented) restores parity.
          # This is a runtime-config change only -- no cutsell_worker
          # editorial module is touched by this overlay.
          #
          # D-050C2 MODAL CANARY: explicitly authorized ONE-run overlay of
          # CUTSELL_UNIFIED_REALIZATION_RESOLVER="AUTHORITATIVE" -- same
          # mechanism, same reasoning as the D-044 overlay above (the base
          # RunPod template has no opinion on this flag at all, so without
          # an explicit overlay here the Unified Realization Resolver would
          # silently run in its LEGACY default and this canary would test
          # nothing new). A runtime-config value only, read by
          # cutsell_worker/resolver_mode.py; no cutsell_worker editorial
          # module is touched by this overlay either.
          # D-052 STABILITY BATTERY: explicitly authorized overlay of
          # CUTSELL_ASR_CANONICAL_NORMALIZATION="1" and
          # CUTSELL_SEMANTIC_COMPUTE_PLANNER="1" for the controlled 3-run
          # battery -- both flags default OFF in code (see D-052) and the
          # base RunPod template has no opinion on either, so without this
          # overlay the battery would test nothing new. Same mechanism,
          # same reasoning as the D-044/D-050C2 overlays above. Runtime-
          # config values only, read by take_segmentation.py and
          # hybrid_session_cleanup.py respectively; no cutsell_worker
          # editorial module is touched by this overlay.
          # D-095 addendum: the exact commit travels INTO the worker so the
          # result's active_path_identity names it (CODE EXISTS != VIDEO USED IT).
          jq -c --arg sha "${{ github.sha }}" '(.env // {}) + {CUTSELL_HYBRID_LLM_ENABLED:"1", CUTSELL_HYBRID_PROVIDER:"google", CUTSELL_UNIFIED_REALIZATION_RESOLVER:"AUTHORITATIVE", CUTSELL_ASR_CANONICAL_NORMALIZATION:"1", CUTSELL_SEMANTIC_COMPUTE_PLANNER:"1", CUTSELL_BUILD_GIT_SHA:$sha}' \
            /tmp/base-template.json > /tmp/cutsell-env.json
          # D-094.F2: optional per-run hybrid dollar-ceiling override. Only
          # applied when the dispatch input is non-empty and numeric; the
          # code default ($0.0075) stays in force otherwise.
          HYBRID_MAX_EDIT_USD_INPUT="${{ github.event.inputs.hybrid_max_edit_usd }}"
          if [ -n "$HYBRID_MAX_EDIT_USD_INPUT" ]; then
            python3 -c "import sys; float(sys.argv[1])" "$HYBRID_MAX_EDIT_USD_INPUT"
            jq -c --arg v "$HYBRID_MAX_EDIT_USD_INPUT" '. + {CUTSELL_HYBRID_MAX_EDIT_USD:$v}' /tmp/cutsell-env.json > /tmp/cutsell-env.tmp.json
            mv /tmp/cutsell-env.tmp.json /tmp/cutsell-env.json
          fi
          echo "D-094.F2 hybrid per-edit ceiling for this run: CUTSELL_HYBRID_MAX_EDIT_USD=$(jq -r '.CUTSELL_HYBRID_MAX_EDIT_USD // "unset (code default 0.0075)"' /tmp/cutsell-env.json)"
          # D-094.2: optional grouping-policy overlay, applied only when the
          # dispatch input is exactly "1"; code default (OFF) otherwise.
          if [ "${{ github.event.inputs.bridge_complete_pairwise_singleton }}" = "1" ]; then
            jq -c '. + {CUTSELL_BRIDGE_COMPLETE_PAIRWISE_SINGLETON:"1"}' /tmp/cutsell-env.json > /tmp/cutsell-env.tmp.json
            mv /tmp/cutsell-env.tmp.json /tmp/cutsell-env.json
          fi
          echo "D-094.2 singleton clique bridge for this run: CUTSELL_BRIDGE_COMPLETE_PAIRWISE_SINGLETON=$(jq -r '.CUTSELL_BRIDGE_COMPLETE_PAIRWISE_SINGLETON // "unset (code default OFF)"' /tmp/cutsell-env.json)"
          # D-159: optional Watch+Listen family-evidence overlay, applied
          # only when the dispatch input is exactly "1"; code default (OFF)
          # otherwise -- same input-gated mechanism as D-094.2 above.
          if [ "${{ github.event.inputs.watch_listen_family_evidence_enabled }}" = "1" ]; then
            jq -c '. + {CUTSELL_WATCH_LISTEN_FAMILY_EVIDENCE_ENABLED:"1"}' /tmp/cutsell-env.json > /tmp/cutsell-env.tmp.json
            mv /tmp/cutsell-env.tmp.json /tmp/cutsell-env.json
          fi
          echo "D-159 Watch+Listen family evidence for this run: CUTSELL_WATCH_LISTEN_FAMILY_EVIDENCE_ENABLED=$(jq -r '.CUTSELL_WATCH_LISTEN_FAMILY_EVIDENCE_ENABLED // "unset (code default OFF)"' /tmp/cutsell-env.json)"
          # D-162: optional Watch+Listen relation-discovery overlay, applied
          # only when the dispatch input is exactly "1"; code default (OFF)
          # otherwise -- same input-gated mechanism as D-159 above, but a
          # SEPARATE flag (D-161's own instruction: merge-veto and relation-
          # discovery are different authorities).
          if [ "${{ github.event.inputs.watch_listen_relation_discovery_enabled }}" = "1" ]; then
            jq -c '. + {CUTSELL_WATCH_LISTEN_RELATION_DISCOVERY_ENABLED:"1"}' /tmp/cutsell-env.json > /tmp/cutsell-env.tmp.json
            mv /tmp/cutsell-env.tmp.json /tmp/cutsell-env.json
          fi
          echo "D-162 Watch+Listen relation discovery for this run: CUTSELL_WATCH_LISTEN_RELATION_DISCOVERY_ENABLED=$(jq -r '.CUTSELL_WATCH_LISTEN_RELATION_DISCOVERY_ENABLED // "unset (code default OFF)"' /tmp/cutsell-env.json)"
          # D-164: optional Watch+Listen BestTake-evidence overlay, applied
          # only when the dispatch input is exactly "1"; code default (OFF)
          # otherwise -- same input-gated mechanism as D-159/D-162 above, but
          # a THIRD, separate flag (D-163's own instruction: merge-veto,
          # relation-discovery, and BestTake-evidence are different
          # authorities). This guard is DIAGNOSTIC-ONLY: it never mutates
          # selected_clip_id/ranked/membership.
          if [ "${{ github.event.inputs.watch_listen_besttake_evidence_enabled }}" = "1" ]; then
            jq -c '. + {CUTSELL_WATCH_LISTEN_BESTTAKE_EVIDENCE_ENABLED:"1"}' /tmp/cutsell-env.json > /tmp/cutsell-env.tmp.json
            mv /tmp/cutsell-env.tmp.json /tmp/cutsell-env.json
          fi
          echo "D-164 Watch+Listen BestTake evidence (diagnostic-only) for this run: CUTSELL_WATCH_LISTEN_BESTTAKE_EVIDENCE_ENABLED=$(jq -r '.CUTSELL_WATCH_LISTEN_BESTTAKE_EVIDENCE_ENABLED // "unset (code default OFF)"' /tmp/cutsell-env.json)"
          # D-173: optional Zone-Usability V2 BestTake diagnostic-consumption
          # overlay (D-172's own live pipeline.py wiring), applied only when
          # the dispatch input is exactly "1"; code default (OFF) otherwise
          # -- same input-gated mechanism as D-159/D-162/D-164 above, but a
          # FOURTH, separate flag (D-172's own instruction: independent
          # rollback from watch_listen_besttake_evidence_enabled). This
          # guard is ALSO DIAGNOSTIC-ONLY: it never mutates selected_clip_id/
          # ranked/membership -- see D-172's own module docstring.
          if [ "${{ github.event.inputs.zone_usability_v2_besttake_enabled }}" = "1" ]; then
            jq -c '. + {CUTSELL_WATCH_LISTEN_ZONE_USABILITY_V2_BESTTAKE_ENABLED:"1"}' /tmp/cutsell-env.json > /tmp/cutsell-env.tmp.json
            mv /tmp/cutsell-env.tmp.json /tmp/cutsell-env.json
          fi
          echo "D-173 Watch+Listen Zone-Usability V2 BestTake diagnostic consumption for this run: CUTSELL_WATCH_LISTEN_ZONE_USABILITY_V2_BESTTAKE_ENABLED=$(jq -r '.CUTSELL_WATCH_LISTEN_ZONE_USABILITY_V2_BESTTAKE_ENABLED // "unset (code default OFF)"' /tmp/cutsell-env.json)"
          # D-175: optional bounded BestTake Guard Authority overlay
          # (D-174's own live pipeline.py/universal_clean_cut.py wiring),
          # applied only when the dispatch input is exactly "1"; code
          # default (OFF) otherwise -- same input-gated mechanism as
          # D-159/D-162/D-164/D-173 above, but a FIFTH, separate flag
          # (D-174's own instruction: independent rollback from the two
          # diagnostic-only flags). Unlike those, this authority CAN
          # mutate selected_clip_id -- but only via D-174's own bounded
          # 11-condition eligibility test plus the EXISTING deterministic
          # ladder; see D-174's own module docstring.
          if [ "${{ github.event.inputs.guard_authority_enabled }}" = "1" ]; then
            jq -c '. + {CUTSELL_WATCH_LISTEN_BESTTAKE_GUARD_AUTHORITY_ENABLED:"1"}' /tmp/cutsell-env.json > /tmp/cutsell-env.tmp.json
            mv /tmp/cutsell-env.tmp.json /tmp/cutsell-env.json
          fi
          echo "D-175 Watch+Listen BestTake Guard Authority for this run: CUTSELL_WATCH_LISTEN_BESTTAKE_GUARD_AUTHORITY_ENABLED=$(jq -r '.CUTSELL_WATCH_LISTEN_BESTTAKE_GUARD_AUTHORITY_ENABLED // "unset (code default OFF)"' /tmp/cutsell-env.json)"
          test "$(jq 'length' /tmp/cutsell-env.json)" != "0"
          test "$(jq -r '.CUTSELL_HYBRID_LLM_ENABLED' /tmp/cutsell-env.json)" = "1"
          test "$(jq -r '.CUTSELL_HYBRID_PROVIDER' /tmp/cutsell-env.json)" = "google"
          test "$(jq -r '.CUTSELL_UNIFIED_REALIZATION_RESOLVER' /tmp/cutsell-env.json)" = "AUTHORITATIVE"
          test "$(jq -r '.CUTSELL_ASR_CANONICAL_NORMALIZATION' /tmp/cutsell-env.json)" = "1"
          test "$(jq -r '.CUTSELL_SEMANTIC_COMPUTE_PLANNER' /tmp/cutsell-env.json)" = "1"
          echo "Resolver mode for this run: $(jq -r '.CUTSELL_UNIFIED_REALIZATION_RESOLVER' /tmp/cutsell-env.json)"
          echo "D-052 flags for this run: CUTSELL_ASR_CANONICAL_NORMALIZATION=$(jq -r '.CUTSELL_ASR_CANONICAL_NORMALIZATION' /tmp/cutsell-env.json) CUTSELL_SEMANTIC_COMPUTE_PLANNER=$(jq -r '.CUTSELL_SEMANTIC_COMPUTE_PLANNER' /tmp/cutsell-env.json)"
          python3 -c "
          import json
          with open('/tmp/cutsell-env.json') as f:
              env = json.load(f)
          for key, value in env.items():
              # The canonical-parity overlay values are not secrets --
              # never mask them, so the parity audit below (and future
              # printed diagnostics) can show they are actually set.
              #
              # D-056.1 item 3 fix (same precedent as D-053's fix to
              # cutsell-asr-only-modal.yml): only mask values at least 12
              # characters long. Without this threshold, EVERY other
              # RunPod-template env value -- however short, however
              # ordinary -- got masked unconditionally, and GitHub then
              # redacts that literal substring everywhere it recurs in
              # ANY later log line for the rest of the run. Short numeric
              # diagnostics (hash fragments, counts, costs) recur
              # constantly in the 'Print full canonical diagnostics' step
              # below, so this corrupted them there -- confirmed live
              # during D-056's Run A/B analysis (docs/CUTSELL_DECISIONS.md
              # D-056 Section 1). A real secret (API key, token, bucket
              # name) is essentially always >= 12 characters, so this
              # threshold costs no actual masking coverage.
              if value and key not in ('CUTSELL_HYBRID_LLM_ENABLED', 'CUTSELL_HYBRID_PROVIDER', 'CUTSELL_UNIFIED_REALIZATION_RESOLVER', 'CUTSELL_ASR_CANONICAL_NORMALIZATION', 'CUTSELL_SEMANTIC_COMPUTE_PLANNER', 'CUTSELL_HYBRID_MAX_EDIT_USD', 'CUTSELL_BRIDGE_COMPLETE_PAIRWISE_SINGLETON', 'CUTSELL_WATCH_LISTEN_FAMILY_EVIDENCE_ENABLED', 'CUTSELL_WATCH_LISTEN_RELATION_DISCOVERY_ENABLED', 'CUTSELL_WATCH_LISTEN_BESTTAKE_EVIDENCE_ENABLED', 'CUTSELL_WATCH_LISTEN_ZONE_USABILITY_V2_BESTTAKE_ENABLED', 'CUTSELL_WATCH_LISTEN_BESTTAKE_GUARD_AUTHORITY_ENABLED', 'CUTSELL_BUILD_GIT_SHA') and len(str(value)) >= 12:
                  print(f'::add-mask::{value}')
          print(f'Loaded {len(env)} env vars from the live RunPod template plus the D-044 hybrid-semantic overlay, the D-050C2 resolver-mode overlay, and the D-052 stability-battery overlay (secret values masked).')
          "
          echo "CUTSELL_ENV_JSON_PATH=/tmp/cutsell-env.json" >> "$GITHUB_ENV"

      - name: Verify canonical Video00 path present
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'auto_speech_visual_microtrim' cutsell_worker/serverless_handler.py
          grep -q 'detect_speech_safe_visual_microtrims' cutsell_worker/serverless_handler.py
          grep -q 'run_single_universal_clean_cut_validation' cutsell_worker/serverless_handler.py
          grep -q 'def run_op' cutsell_worker/serverless_handler.py

      - name: Submit canonical Video00 payload
        shell: bash
        run: |
          set -euo pipefail
          # -c (compact, single-line) is required here: GitHub's own
          # $GITHUB_ENV file command rejects a multi-line value written as
          # a plain KEY=value line (confirmed live, run 33626736759:
          # "Unable to process file command 'env' successfully" /
          # "Invalid format" once jq's default pretty-printed, multi-line
          # JSON was echoed straight into it).
          jq -nc --arg source "$SOURCE_KEY" --arg benchmark "$BENCHMARK_ID" \
            '{op:"focused",source_key:$source,benchmark_id:$benchmark,auto_speech_visual_microtrim:true}' \
            > /tmp/payload.json
          echo "CUTSELL_BENCHMARK_PAYLOAD_JSON=$(cat /tmp/payload.json)" >> "$GITHUB_ENV"
          echo "--- payload ---"
          jq . /tmp/payload.json

      - name: Run Modal full Video00 benchmark (ONE authorized L4 run)
        id: modal_video00
        shell: bash
        run: |
          set +e
          set -uo pipefail
          # D-056.1 items 1/5(d): give the LOCAL `modal run` wrapper
          # (modal_video00_full_benchmark.py's main(), which runs as part
          # of this exact `modal run` CLI invocation, not inside the
          # remote Modal container) the same AWS credentials the remote
          # side already has via cutsell_env_secret -- same 4-key
          # extraction this workflow already uses in "Download Video00
          # Modal artifacts" below, so main() can (a) skip a duplicate
          # paid dispatch when BENCHMARK_ID already has a persisted
          # result, and (b) persist a deterministic diagnostic result on
          # its own exception path (e.g. a Modal timeout).
          BASE_TEMPLATE=$(cat /tmp/base-template.json)
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_BUCKET; do
            value=$(printf '%s' "$BASE_TEMPLATE" | jq -r --arg key "$key" '.env[$key] // empty')
            test -n "$value"
            echo "::add-mask::$value"
            export "$key=$value"
          done
          modal run modal_video00_full_benchmark.py 2>&1 | tee modal-video00-output.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload raw Modal run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-video00-modal-run-log
          path: modal-video00-output.log
          retention-days: 14
          if-no-files-found: warn

      - name: Print Modal run summary
        if: always()
        shell: bash
        run: |
          # D-056.1 items 1/2: never trust the local file (or this step's
          # own exit_code input) alone. D-056's Run C dispatch saga
          # (docs/CUTSELL_DECISIONS.md D-056 Section 8) confirmed on 4 of 4
          # cancelled attempts that a SIGTERM to the local `modal run`
          # process at any point before its own clean return permanently
          # prevented modal-video00-result.json from ever being written --
          # even when the remote Modal computation had already fully
          # succeeded. modal_video00_full_benchmark.py's remote function
          # now ALSO persists its compact result to a durable, benchmark-
          # id-keyed S3 marker from inside the remote call itself, before
          # it ever returns (see _persist_benchmark_result). When the
          # local file is missing, recover from that marker instead of
          # declaring failure outright -- this is what makes an
          # apparently "stale"/hung GitHub step status recoverable: the
          # marker's existence depends only on the remote computation
          # actually finishing, never on this job step's own reported
          # status or on the local process surviving.
          if [ ! -s modal-video00-result.json ]; then
            echo "modal-video00-result.json is missing/empty (exit_code=${{ steps.modal_video00.outputs.exit_code }}) -- checking the durable S3 result marker before declaring failure."
            BASE_TEMPLATE=$(cat /tmp/base-template.json)
            for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_BUCKET; do
              value=$(printf '%s' "$BASE_TEMPLATE" | jq -r --arg key "$key" '.env[$key] // empty')
              test -n "$value"
              echo "::add-mask::$value"
              export "$key=$value"
            done
            RESULT_KEY=$(python3 -c "from modal_gpu_config import benchmark_result_s3_key; print(benchmark_result_s3_key('$BENCHMARK_ID'))")
            RECOVERED=0
            for attempt in 1 2 3 4 5 6; do
              if aws s3 cp "s3://$S3_BUCKET/$RESULT_KEY" modal-video00-result.json >/dev/null 2>&1 && [ -s modal-video00-result.json ]; then
                echo "Recovered a durably-persisted result from s3://$S3_BUCKET/$RESULT_KEY (attempt $attempt) -- the local wrapper never got to write its own copy, but the remote computation's own S3 persistence survived."
                RECOVERED=1
                break
              fi
              sleep 10
            done
            if [ "$RECOVERED" != "1" ]; then
              echo "MODAL FULL VIDEO00 RUN FAILED (exit ${{ steps.modal_video00.outputs.exit_code }}) -- no local result and no persisted S3 result found at s3://$S3_BUCKET/$RESULT_KEY. See modal-video00-output.log."
              exit 1
            fi
          elif [ "${{ steps.modal_video00.outputs.exit_code }}" != "0" ]; then
            echo "MODAL FULL VIDEO00 RUN FAILED (exit ${{ steps.modal_video00.outputs.exit_code }}) -- see modal-video00-output.log."
            exit 1
          fi
          echo "--- modal-video00-result.json (compact run_op() summary) ---"
          cat modal-video00-result.json
          cp modal-video00-result.json artifact/video00-modal-summary.json
          RUN_OK=$(jq -r '.ok // false' modal-video00-result.json)
          if [ "$RUN_OK" != "true" ]; then
            echo "run_op() reported ok=false -- see artifact/video00-modal-summary.json for the error."
            exit 1
          fi
          RESULT_URI=$(jq -r '.result_uri // empty' modal-video00-result.json)
          PREVIEW_URI=$(jq -r '.preview_uri // empty' modal-video00-result.json)
          DIAGNOSTIC_PREVIEW_URI=$(jq -r '.diagnostic_preview_uri // empty' modal-video00-result.json)
          echo "RESULT_URI=$RESULT_URI" >> "$GITHUB_ENV"
          echo "PREVIEW_URI=$PREVIEW_URI" >> "$GITHUB_ENV"
          echo "DIAGNOSTIC_PREVIEW_URI=$DIAGNOSTIC_PREVIEW_URI" >> "$GITHUB_ENV"

      - name: Download Video00 Modal artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          if [ -z "${RESULT_URI:-}" ]; then
            echo "No result_uri present; nothing to download from S3."
            exit 0
          fi
          BASE_TEMPLATE=$(cat /tmp/base-template.json)
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_BUCKET; do
            value=$(printf '%s' "$BASE_TEMPLATE" | jq -r --arg key "$key" '.env[$key] // empty')
            test -n "$value"
            echo "::add-mask::$value"
            export "$key=$value"
          done
          aws s3 cp "$RESULT_URI" artifact/video00-modal.json
          test -s artifact/video00-modal.json

          # D-036 item 6 parity: a QC-invalidated candidate is never
          # uploaded under the deliverable filename.
          if [ -n "${PREVIEW_URI:-}" ]; then
            aws s3 cp "$PREVIEW_URI" artifact/video00-modal.mp4
            test -s artifact/video00-modal.mp4
            echo "Deliverable candidate downloaded: artifact/video00-modal.mp4"
          elif [ -n "${DIAGNOSTIC_PREVIEW_URI:-}" ]; then
            aws s3 cp "$DIAGNOSTIC_PREVIEW_URI" artifact/video00-modal-DIAGNOSTIC-INVALIDATED.mp4
            test -s artifact/video00-modal-DIAGNOSTIC-INVALIDATED.mp4
            echo "NOT DELIVERABLE -- QC INVALIDATED. Diagnostic-only render downloaded."
          else
            echo "Neither preview_uri nor diagnostic_preview_uri present; no rendered candidate exists for this run."
          fi

      - name: Download Human Gold reference video
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          if [ ! -s /tmp/base-template.json ]; then
            echo "No base RunPod template available; skipping Human Gold reference download."
            exit 0
          fi
          BASE_TEMPLATE=$(cat /tmp/base-template.json)
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_BUCKET; do
            value=$(printf '%s' "$BASE_TEMPLATE" | jq -r --arg key "$key" '.env[$key] // empty')
            test -n "$value"
            echo "::add-mask::$value"
            export "$key=$value"
          done
          aws s3 cp "s3://$S3_BUCKET/$HUMAN_GOLD_KEY" artifact/human-gold-video00.mp4
          test -s artifact/human-gold-video00.mp4
          # D-095: Cut.ai commercial baseline (QA-only) + the RAW source for the
          # four-way quality ladder below.
          aws s3 cp "s3://$S3_BUCKET/$CUTAI_REFERENCE_KEY" artifact/cutai-video00.mp4
          test -s artifact/cutai-video00.mp4
          aws s3 cp "s3://$S3_BUCKET/$SOURCE_KEY" artifact/raw-video00.mp4
          test -s artifact/raw-video00.mp4

      - name: Verify active-path identity (CODE EXISTS != VIDEO USED IT, D-095 addendum)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s artifact/video00-modal.json ]; then
            echo "No result JSON downloaded; cannot verify active-path identity."
            exit 0
          fi
          python3 - <<'PY'
          import json, subprocess, sys
          from cutsell_worker.active_path_identity import package_fingerprint
          result = json.load(open('artifact/video00-modal.json', encoding='utf-8'))
          ident = result.get('active_path_identity') or {}
          local = package_fingerprint('cutsell_worker')
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          remote_sha = ident.get('build_git_sha')
          remote_fp = (ident.get('package') or {}).get('sha256')
          report = {
              'workflow_head_sha': head,
              'worker_build_git_sha': remote_sha,
              'git_sha_match': (remote_sha == head) if remote_sha else None,
              'workflow_package_sha256': local['sha256'],
              'worker_package_sha256': remote_fp,
              'package_fingerprint_match': (remote_fp == local['sha256']) if remote_fp else None,
              'worker_module_count': (ident.get('package') or {}).get('module_count'),
              'workflow_module_count': local['module_count'],
              'resolver_mode_env': ident.get('resolver_mode_env'),
              'hybrid_max_edit_usd_env': ident.get('hybrid_max_edit_usd_env'),
              'components_present': ident.get('components_present'),
              'components_absent': ident.get('components_absent'),
              'identity_error': ident.get('error'),
          }
          print('--- ACTIVE PATH IDENTITY ---')
          print(json.dumps(report, indent=2))
          for row in ident.get('component_markers') or []:
              print(f"{'PRESENT' if row['present'] else 'ABSENT '}  {row['component']:<45} {row['reference']:<28} {row['evidence']}")
          verdict = 'ACTIVE_CODE_VERIFIED' if (report['package_fingerprint_match'] and report['git_sha_match'] is not False) else 'ACTIVE_CODE_NOT_VERIFIED'
          print(f'ACTIVE_PATH_IDENTITY_VERDICT={verdict}')
          json.dump(report, open('artifact/video00-modal-active-path-identity.json', 'w', encoding='utf-8'), indent=2)
          PY

      - name: Print full canonical diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s artifact/video00-modal.json ]; then
            echo "No result JSON downloaded; no diagnostics to print."
            exit 0
          fi
          echo "--- diagnostics.unified_selection_reasoner (must be inert -- V1 deactivates it) ---"
          jq '.diagnostics.unified_selection_reasoner // {status:"absent"}' artifact/video00-modal.json

          echo "--- D-095.2 audio dead-air evidence + interior-gap trimmer (splits / rejections) ---"
          jq '{audio_silence: (.stage_status.audio_silence // "absent"), interior_gap_splits: (.diagnostics.post_selection_interior_gap_trim // []), interior_gap_audio_rejections: [(.diagnostics.post_selection_interior_gap_trace // [])[] | select(.evidence_mode == "long_audio_silence")]}' artifact/video00-modal.json
          echo "--- D-097: post-Freeze BoundaryEngine pass, polarity rejoins, renderer trailing trims, dead-air reconciliation, story completeness ---"
          # D-117 (docs/CUTSELL_DECISIONS.md): this object grew past the old
          # inline `| head -c 30000` cap once D-116 added a per-event
          # visual_edge_rows array -- RAW 34150026795 confirmed live that the
          # pipe's `head` consumer exits the moment it has read 30000 bytes,
          # SIGPIPEing jq while it is still writing, which aborted this WHOLE
          # step under `set -o pipefail` and silently lost every diagnostics
          # section printed after this one (visual_entry_trim_count,
          # visual_exit_trim_count, perceptual Watch+Listen, take_judge_groups,
          # canonical_edit_plan, the final KEEP sequence, live_render_qc, ...).
          # Fix (workflow-only, no engine change): write the FULL object to an
          # artifact file first -- picked up whole, never truncated, by
          # "Upload Video00 Modal diagnostic artifact" below -- then preview
          # it with `head -c` reading FROM THAT FILE. A file has no live
          # writer for `head` to SIGPIPE, so this exact failure mode cannot
          # recur here, and the explicit derived counts below survive
          # regardless of how large the object or how short the preview is.
          jq '{boundary_engine_pass: (.diagnostics.boundary_engine_pass // "absent" | if type=="object" then del(.ownership_contract) else . end), take_segmentation: (.stage_status.take_segmentation // "absent"), story_completeness: (.stage_status.story_completeness // "absent"), no_usable_realization_family_ids: (.stage_status.no_usable_realization_family_ids // []), last_attempt: ((.live_render_qc.attempts // [])[-1] // "absent" | if type=="object" then {status, renderer_trailing_trims, dead_air_reconciliation} else . end)}' artifact/video00-modal.json > artifact/video00-modal-boundary-engine-pass.json
          echo "full object ($(wc -c < artifact/video00-modal-boundary-engine-pass.json) bytes) preserved whole in the uploaded diagnostic artifact: video00-modal-boundary-engine-pass.json"
          echo "--- boundary_engine_pass derived counts (D-116 visual + pre-existing audio/edge/interior; survive regardless of preview truncation) ---"
          jq '.boundary_engine_pass | if type=="object" then {
              schema_version, stage, selected_count_in, selected_count_out,
              edge_trim_count, interior_split_count, interior_reject_count,
              audio_entry_trim_count, audio_exit_trim_count,
              audio_edge_row_count: (.audio_edge_rows // [] | length),
              visual_entry_trim_count, visual_exit_trim_count,
              visual_edge_row_count: (.visual_edge_rows // [] | length)
            } else {status: "absent"} end' artifact/video00-modal-boundary-engine-pass.json
          echo "--- boundary_engine_pass preview (first 30000 bytes of the full file above; never the source of a step failure) ---"
          head -c 30000 artifact/video00-modal-boundary-engine-pass.json; echo
          echo "--- D-097 §4 perceptual System Watch+Listen (advisory_v1; never auto-PASS) ---"
          # D-117: same file-then-preview fix as boundary_engine_pass above --
          # this object's own findings/capabilities list can also exceed the
          # old inline cap and was equally exposed to the identical SIGPIPE.
          jq '.perceptual_watch_listen // "absent" | if type=="object" then {status, gate_mode, artifact_kind, technical_qc_status, capability_status_counts, routing, capabilities:[.capabilities[]? | {capability, status, method, finding_count:(.findings|length), findings:[.findings[]? | {kind, start, end, severity, routes_to, detail}], note}]} else . end' artifact/video00-modal.json > artifact/video00-modal-perceptual-watch-listen.json
          echo "full object ($(wc -c < artifact/video00-modal-perceptual-watch-listen.json) bytes) preserved whole in the uploaded diagnostic artifact: video00-modal-perceptual-watch-listen.json"
          echo "--- perceptual Watch+Listen summary (survives regardless of preview truncation) ---"
          jq 'if type=="object" then {status, gate_mode, artifact_kind, technical_qc_status, capability_status_counts, routing} else . end' artifact/video00-modal-perceptual-watch-listen.json
          echo "--- perceptual Watch+Listen preview (first 30000 bytes of the full file above; never the source of a step failure) ---"
          head -c 30000 artifact/video00-modal-perceptual-watch-listen.json; echo
          echo "--- D-097 CLEAN RAW gate (result only; the CPU ladder workflow adds the four-way regions) ---"
          python benchmarks/clean_raw_gate.py --engine-json artifact/video00-modal.json || true
          echo "--- diagnostics.take_judge_groups (retry families + DeliveryScorer scores) ---"
          jq '.diagnostics.take_judge_groups // []' artifact/video00-modal.json

          echo "--- diagnostics.deterministic_best_take_authority (BestTakeResolver) ---"
          jq '.diagnostics.deterministic_best_take_authority // {status:"absent"}' artifact/video00-modal.json

          echo "--- diagnostics.semantic_idea_equivalence (IdeaClusterer's bounded SemanticArbiter tier) ---"
          jq '.diagnostics.semantic_idea_equivalence // {status:"absent"}' artifact/video00-modal.json

          echo "--- D-094.F3/F4 grouping-safety evidence reuse (prior confirmations, unchecked weak pairs) ---"
          jq '.diagnostics.distinct_idea_grouping_safety | {prior_confirmations_reused_count, prior_confirmations_reused, unchecked_weak_pair_count, unchecked_weak_pairs}' artifact/video00-modal.json
          echo "--- diagnostics.distinct_idea_grouping_safety (D-058 within-group cohesion + D-083 marker gate + D-085 bridge-aware edge trace -- see D-084's forensic for why this was never printed before) ---"
          jq '.diagnostics.distinct_idea_grouping_safety // {status:"absent"}' artifact/video00-modal.json

          echo "--- diagnostics.final_story_coherence_validation (StoryValidator) ---"
          jq '.diagnostics.final_story_coherence_validation // {status:"absent"}' artifact/video00-modal.json

          echo "--- semantic atom importance classifications ---"
          jq '[.diagnostics.final_story_coherence_validation.lost_semantic_atoms[]? |
            {clip_id, blocking, classification, content_loss_suppressed_by, atom_classifications}]' artifact/video00-modal.json

          echo "--- claim coverage confirmations (D-061 Phase 3, observability only, never blocking) ---"
          jq '.diagnostics.final_story_coherence_validation.claim_coverage_confirmations // []' artifact/video00-modal.json

          echo "--- diagnostics.canonical_edit_plan ---"
          jq '.diagnostics.canonical_edit_plan
            | if . == null then {status:"absent"} else {
                plan_id, plan_version, semantic_hash, validation_state, freeze_blocked,
                plan_semantic_source,
                ideas: [.ideas[]? | {idea_id, coverage_status, is_composite, winning_clip_ids, discarded_clip_ids,
                                     plan_semantic_source, authoritative_resolution_status,
                                     authoritative_composite_realization_ids, structural_validation_passed,
                                     structural_validation_failures}]
              } end' artifact/video00-modal.json
          echo "--- diagnostics.authoritative_plan_source (D-087 single-truth handoff; AUTHORITATIVE mode only) ---"
          jq '.diagnostics.authoritative_plan_source // {status:"absent"}' artifact/video00-modal.json
          echo "--- diagnostics.canonical_effective_importance (D-089 Part A: per-canonical-claim effective importance; downgraded/conflict entries only) ---"
          jq '.diagnostics.canonical_effective_importance // {status:"absent"}' artifact/video00-modal.json
          echo "--- diagnostics.authoritative_story_placement (D-089 Part B: every restoration placement unit) ---"
          jq '.diagnostics.authoritative_story_placement // {status:"absent"}' artifact/video00-modal.json
          echo "--- diagnostics.post_authority_validation (D-090 authority boundary: validation mode, source identity, selection signature before/after, membership added/removed, invariant status) ---"
          jq '.diagnostics.post_authority_validation // {status:"absent"}' artifact/video00-modal.json
          echo "--- StoryValidator post-authority family bookkeeping (D-090: authoritative composites accepted as resolved vs blocking authority-membership findings) ---"
          jq '.diagnostics.final_story_coherence_validation | {validation_mode, authoritative_source_identity, residual_family_count, authoritative_families_accepted_count, authoritative_families_accepted, unresolved_family_count, unresolved_families, authority_membership_findings, selection_mutation_self_check, permitted_incidental_omission_count, permitted_incidental_omissions, freeze_blocked}' artifact/video00-modal.json
          echo "--- lost_semantic_atoms rows with D-093 permit / denial evidence ---"
          jq '[.diagnostics.final_story_coherence_validation.lost_semantic_atoms[]? | {clip_id, blocking, classification, coverage_against_final_keep, missing_critical_atoms, omission_permitted_by, omission_permit_denied_reason, omission_evidence}]' artifact/video00-modal.json

          echo "--- diagnostics.final_edit_reviewer ---"
          jq '.diagnostics.final_edit_reviewer // {status:"absent"}' artifact/video00-modal.json

          # D-050C2 MODAL CANARY: the D-050C1 shadow diagnostics (computed
          # unconditionally in every mode) and the D-050C2 authoritative
          # application diagnostics (populated only in AUTHORITATIVE mode,
          # per the one cutover point in universal_clean_cut.py) -- full
          # per-idea observability: semantic_idea_id, resolver mode,
          # candidate realization ids, authoritative winner/composite,
          # legacy winner, same/different, canonical critical claims,
          # covered claims, discarded realizations + reasons, replacement
          # verification, resolution status, decision reason.
          echo "--- diagnostics.realization_resolver_shadow (D-050C1 shadow, always computed) ---"
          jq '.diagnostics.realization_resolver_shadow // {status:"absent"}' artifact/video00-modal.json

          echo "--- diagnostics.realization_resolver_authority (D-050C2 authoritative application) ---"
          jq '.diagnostics.realization_resolver_authority // {status:"absent"}' artifact/video00-modal.json

          # D-056.1 item 4: explicit realization/orphan COUNTS, derived
          # (never recomputed -- jq `length` over the exact same lists
          # already printed in full above) so a stability battery does
          # not have to hand-count orphan_reviews/unresolved_orphan_
          # realization_ids entries out of the raw dumps every time.
          echo "--- realization/orphan counts (derived from the above) ---"
          jq '{
            shadow_total_ideas: (.diagnostics.realization_resolver_shadow.total_ideas // null),
            shadow_review_required_count: (.diagnostics.realization_resolver_shadow.review_required_count // null),
            shadow_orphan_review_count: (.diagnostics.realization_resolver_shadow.orphan_reviews // [] | length),
            authority_idea_count: (.diagnostics.realization_resolver_authority.ideas // [] | length),
            authority_unresolved_orphan_count: (.diagnostics.realization_resolver_authority.unresolved_orphan_realization_ids // [] | length)
          }' artifact/video00-modal.json

          echo "--- diagnostics.repair_loop ---"
          jq '.diagnostics.repair_loop // {status:"absent"}' artifact/video00-modal.json

          echo "--- diagnostics.selection_boundary_contract (Selection Freeze) ---"
          jq '.diagnostics.selection_boundary_contract // {status:"absent"}' artifact/video00-modal.json

          echo "--- diagnostics.hybrid_editorial_* (CompositeResolver evidence) ---"
          jq '{
            requested_chunk_count: .diagnostics.hybrid_editorial_requested_chunk_count,
            available_chunk_count: .diagnostics.hybrid_editorial_available_chunk_count,
            deleted_count: .diagnostics.hybrid_editorial_deleted_count,
            semantic_decision_count: .diagnostics.hybrid_editorial_semantic_decision_count,
            budget_exhausted_chunk_count: .diagnostics.hybrid_editorial_budget_exhausted_chunk_count,
            budget_exhausted_chunk_indices: .diagnostics.hybrid_editorial_budget_exhausted_chunk_indices,
            budget_exhausted_estimated_shortfall_usd: .diagnostics.hybrid_editorial_budget_exhausted_estimated_shortfall_usd,
            budget_exhausted_member_ids: .diagnostics.hybrid_editorial_budget_exhausted_member_ids,
            chunks: (.diagnostics.hybrid_editorial_chunks // [])
          }' artifact/video00-modal.json

          echo "--- diagnostics.semantic_compute_plan (D-052 Part B, present only when CUTSELL_SEMANTIC_COMPUTE_PLANNER=1) ---"
          jq '.diagnostics.semantic_compute_plan // {status:"absent_flag_off"}' artifact/video00-modal.json

          echo "--- stage_status.canonical_asr_evidence (D-052 Part A, always computed) ---"
          jq '.stage_status.canonical_asr_evidence // {status:"absent"}' artifact/video00-modal.json

          echo "--- D-094.2 grouping forensic summary (take groups with member texts; IdeaClusterer merges / distinct-addition blocks; restore guards) -- printed late so it survives the log tail cap ---"
          # D-162: mechanical allowlist extension only (no new observability
          # mechanism) -- adds D-158's watch_listen_family_evidence and
          # D-161's watch_listen_relation_discovery/watch_listen_discovery_
          # trace fields to this SAME existing late-stage, tail-cap-safe
          # summary, plus a derived family_topology_counts block (family_
          # count/multi_member_family_count/singleton_count) from the
          # take_group_members list already projected below.
          jq '( [ (.selected[]?), (.alternates[]?), (.discarded[]?) ] | map({(.clip_id): (.text // "")[:110]}) | add ) as $t
              | {
                  take_groups: ((.diagnostics.take_group_members // []) | map(map({id: ., text: ($t[.] // "?")}))),
                  family_topology_counts: ((.diagnostics.take_group_members // []) as $groups | {
                    family_count: ($groups | length),
                    multi_member_family_count: ([$groups[] | select(length > 1)] | length),
                    singleton_count: ([$groups[] | select(length == 1)] | length)
                  }),
                  semantic_idea_equivalence: ((.diagnostics.semantic_idea_equivalence // {}) | {status, candidate_pair_count, checked_pair_count, merged_pair_count, merges, restart_evidence_merges, distinct_addition_blocked, arbiter_rejected_pairs}),
                  watch_listen_family_evidence: (.diagnostics.semantic_idea_equivalence.watch_listen_family_evidence // {status: "absent"}),
                  watch_listen_relation_discovery: (.diagnostics.semantic_idea_equivalence.watch_listen_relation_discovery // {status: "absent"}),
                  watch_listen_discovery_trace: (.diagnostics.semantic_idea_equivalence.watch_listen_discovery_trace // []),
                  grouping_safety_splits: (.diagnostics.distinct_idea_grouping_safety.splits // []),
                  grouping_safety_budget: ((.diagnostics.distinct_idea_grouping_safety // {}) | {weak_pair_count, checked_pair_count, unchecked_weak_pair_count, unchecked_weak_pairs, content_divergence_blocked}),
                  grouping_safety_rejected_edges: [ (.diagnostics.distinct_idea_grouping_safety.edge_trace // [])[] | select(.accepted == false) ],
                  family_window_label_sources: [ (.diagnostics.take_judge_groups // [])[]? | select(.semantic_label_source != null) | {group_id, selected_clip_id, semantic_best_take_reason, semantic_label_source} ],
                  accept_complete_pairwise_singleton_bridge: (.diagnostics.distinct_idea_grouping_safety.accept_complete_pairwise_singleton_bridge // null),
                  restore_guards: [ (.diagnostics.hybrid_editorial_chunks // [])[] | select(has("final_delivery_integrity") or has("terminal_delivery_reconciliation")) | {final_delivery_integrity, terminal_delivery_reconciliation} ]
                }' artifact/video00-modal.json

          echo "--- final KEEP sequence (clip_id + text, in order) ---"
          jq '[.selected[]? | {clip_id, text}]' artifact/video00-modal.json

          echo "--- final DISCARD sequence and stage_status ---"
          jq '{discarded_count: (.discarded | length), discarded: [.discarded[]? | {clip_id, text}], stage_status}' artifact/video00-modal.json

          echo "--- live_render_qc (PostRenderWatchListenQC + bounded physical repair) ---"
          jq '.live_render_qc // {status:"absent"}' artifact/video00-modal.json

      - name: Upload Video00 Modal diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-video00-modal-human-review
          path: artifact/
          retention-days: 14
          if-no-files-found: warn

      - name: Verify frozen Selection lock
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s artifact/video00-modal.json ]; then
            echo "No result JSON was downloaded; cannot verify Selection lock." >&2
            exit 1
          fi
          python benchmarks/validate_video00_selection_lock.py \
            artifact/video00-modal.json \
            benchmarks/video00_selection_lock.json \
            | tee artifact/video00-modal-selection-lock-report.json

      - name: Verify Video00 architecture
        # D-050C3 Section 8: a BLOCKED Freeze is itself a valid benchmark
        # result -- it must never cause this validator to be skipped just
        # because the (LEGACY-selection-shaped) "Verify frozen Selection
        # lock" step above failed. CI observability only; does not change
        # engine behavior.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s artifact/video00-modal.json ]; then
            echo "No result JSON was downloaded; cannot verify architecture." >&2
            exit 1
          fi
          jq -e '.source_duration_sec > 350 and .auto_speech_visual_microtrim_enabled == true and .speech_lock_ok == true and .selected_count > 0' artifact/video00-modal.json >/dev/null
          jq '{source_duration_sec,selected_count,selected_duration_sec,output_duration_sec,auto_microtrim_count,auto_microtrim_duration_sec,speech_lock_ok}' artifact/video00-modal.json
          python benchmarks/validate_video00_architecture.py \
            artifact/video00-modal.json \
            | tee artifact/video00-modal-architecture-report.json

      - name: Verify Human Gold regression QA (18-check manifest)
        # D-050C3 Section 8: same reasoning as the architecture validator
        # above -- must still run against result.json even when Freeze
        # was blocked and the selection-lock step above failed.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s artifact/video00-modal.json ]; then
            echo "No result JSON was downloaded; cannot verify Human Gold regression QA." >&2
            exit 1
          fi
          python benchmarks/validate_video00_regression_qa.py \
            artifact/video00-modal.json \
            benchmarks/video00_regression_qa.json \
            | tee artifact/video00-modal-regression-qa-report.json
          echo "--- Human Gold regression QA summary ---"
          jq '{qa_pass, passed_check_count, failed_check_count, selected_count}' artifact/video00-modal-regression-qa-report.json

      - name: Video00 quality ladder (RAW vs Cut.ai vs Human Gold vs CutSell, D-095)
        # QA-only, CPU-only, runs on the runner after the paid computation is
        # already over. continue-on-error so a QA-tooling failure never masks
        # the RAW result itself -- the failure is still printed loudly.
        if: always()
        continue-on-error: true
        shell: bash
        env:
          # D-097.1: the ladder imports cutsell_worker lazily (audio alignment);
          # run 34028202024 died with ModuleNotFoundError because this step,
          # unlike the CPU ladder workflow, never put the checkout on the path.
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ ! -s artifact/video00-modal.json ] || [ ! -s artifact/cutai-video00.mp4 ] || [ ! -s artifact/human-gold-video00.mp4 ] || [ ! -s artifact/raw-video00.mp4 ]; then
            echo "Quality ladder skipped: result.json or a reference video is missing."
            exit 0
          fi
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg >/dev/null
          extra=()
          if [ -s artifact/video00-modal.mp4 ]; then
            extra=(--engine-mp4 artifact/video00-modal.mp4)
          elif [ -s artifact/video00-modal-DIAGNOSTIC-INVALIDATED.mp4 ]; then
            extra=(--engine-mp4 artifact/video00-modal-DIAGNOSTIC-INVALIDATED.mp4)
          fi
          python benchmarks/video00_quality_ladder.py \
            --raw artifact/raw-video00.mp4 \
            --cutai artifact/cutai-video00.mp4 \
            --gold artifact/human-gold-video00.mp4 \
            --engine-json artifact/video00-modal.json \
            "${extra[@]}" \
            --out-json artifact/video00-modal-quality-ladder.json \
            --out-md artifact/video00-modal-quality-ladder.md \
            --out-csv artifact/video00-modal-quality-ladder.csv
          echo "--- quality ladder summary ---"
          jq '.summary' artifact/video00-modal-quality-ladder.json
          echo "--- LEVEL_1 regions with rationale ---"
          echo "--- FINAL MP4 (physical) summary: the Level-1 headline (D-097.10 R14; falls back to the selection summary when no physical view exists) ---"
          jq '{physical_source: (.physical_source // null), summary: (.physical_summary // .summary)}' artifact/video00-modal-quality-ladder.json
          echo "--- FINAL MP4 (physical) LEVEL_1 regions with rationale ---"
          jq -c '(.physical_regions // .regions)[] | select(.level=="LEVEL_1" and .scope=="selection") | {i:.region_index, raw:[.raw_start,.raw_end], dur:.duration_sec, kind, refinement, authority:.attributed_authority, why:.attribution_rationale, cands:[.cutsell_candidates[] | {s:.status, id:.clip_id, t:(.text[:80])}]}' artifact/video00-modal-quality-ladder.json
          echo "--- selection-plan LEVEL_1 regions (pre-render spans; secondary) ---"
          jq -c '.regions[] | select(.level=="LEVEL_1" and .scope=="selection") | {i:.region_index, raw:[.raw_start,.raw_end], dur:.duration_sec, kind, refinement, authority:.attributed_authority, why:.attribution_rationale, cands:[.cutsell_candidates[] | {s:.status, id:.clip_id, t:(.text[:80])}]}' artifact/video00-modal-quality-ladder.json

      - name: Print compact D-116/Watch+Listen qualification summary (D-119, tail-safe)
        # D-119 (docs/CUTSELL_DECISIONS.md): D-118 found that even after D-117
        # fixed the SIGPIPE, the full boundary_engine_pass/perceptual_watch_
        # listen objects print too early in the long "Print full canonical
        # diagnostics" step to survive a CI log-retrieval tool that only
        # exposes roughly the last ~5000 lines of the job. This step is a
        # SEPARATE, LATE-STAGE, BOUNDED summary -- placed after the large
        # diagnostics step AND after the quality-ladder step (both of which
        # can themselves print substantial content) so it stays near the
        # tail regardless of how much earlier output grows. It reads the
        # already-artifact-backed files D-117 wrote
        # (video00-modal-boundary-engine-pass.json, video00-modal-perceptual-
        # watch-listen.json) -- never the live diagnostics step's own pipe --
        # so this cannot reintroduce the D-117 SIGPIPE. It recomputes nothing
        # about engine behavior: every field here is a count/derivation over
        # rows the engine already produced. Individual no-op visual_edge_rows
        # are summarized by count only; only APPLIED trims are printed in
        # full detail, and only EVALUATED_FAIL/ERROR Watch+Listen capabilities
        # get a findings summary -- both to keep this step's own output small
        # enough to stay inside the tail window it exists to survive within.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python - <<'PY'
          import json, os, sys

          def load(path):
              if not os.path.exists(path) or os.path.getsize(path) == 0:
                  return None
              with open(path) as f:
                  try:
                      return json.load(f)
                  except Exception as e:
                      print(f"WARNING: failed to parse {path}: {e}", file=sys.stderr)
                      return None

          boundary_wrapper = load("artifact/video00-modal-boundary-engine-pass.json")
          watchlisten = load("artifact/video00-modal-perceptual-watch-listen.json")

          summary = {"schema_version": "cutsell.video00.d116_qualification_summary.v1"}

          b = None
          if isinstance(boundary_wrapper, dict):
              b = boundary_wrapper.get("boundary_engine_pass")

          if not isinstance(b, dict):
              summary["boundary"] = {
                  "status": "absent_or_not_object",
                  "raw": b if b is not None else "missing_source_file_or_field",
              }
          else:
              rows = b.get("visual_edge_rows") or []
              audio_rows = b.get("audio_edge_rows") or []
              cin = b.get("selected_count_in")
              isplit = b.get("interior_split_count")
              cout = b.get("selected_count_out")
              before_visual = None
              added = removed = None
              if isinstance(cin, int) and isinstance(isplit, int):
                  before_visual = cin + isplit
                  if isinstance(cout, int):
                      added = max(cout - before_visual, 0)
                      removed = max(before_visual - cout, 0)

              def is_applied_entry(r):
                  return r.get("reason") == "visual_entry_edge_trim" and r.get("trim_applied") is True

              def is_applied_exit(r):
                  return r.get("reason") == "visual_exit_edge_trim" and r.get("trim_applied") is True

              entry_trims = [r for r in rows if is_applied_entry(r)]
              exit_trims = [r for r in rows if is_applied_exit(r)]
              total_seconds = 0.0
              for r in entry_trims:
                  try:
                      total_seconds += float(r.get("new_start")) - float(r.get("old_start"))
                  except (TypeError, ValueError):
                      pass
              for r in exit_trims:
                  try:
                      total_seconds += float(r.get("old_end")) - float(r.get("new_end"))
                  except (TypeError, ValueError):
                      pass

              def count_reason(reason):
                  return sum(1 for r in rows if r.get("reason") == reason)

              def is_cross_boundary(r):
                  if r.get("reason") != "visual_event_overlaps_delivery_no_trim":
                      return False
                  ds, de = r.get("delivery_start"), r.get("delivery_end")
                  es, ee = r.get("event_start"), r.get("event_end")
                  try:
                      if ds is not None and es is not None and float(es) < float(ds):
                          return True
                      if de is not None and ee is not None and float(ee) > float(de):
                          return True
                  except (TypeError, ValueError):
                      pass
                  return False

              applied_trims = []
              for r in entry_trims + exit_trims:
                  seconds = None
                  try:
                      if r.get("reason") == "visual_entry_edge_trim":
                          seconds = round(float(r["new_start"]) - float(r["old_start"]), 3)
                      else:
                          seconds = round(float(r["old_end"]) - float(r["new_end"]), 3)
                  except (TypeError, ValueError, KeyError):
                      pass
                  applied_trims.append({
                      "clip_id": r.get("clip_id"),
                      "event_kind": r.get("event_kind"),
                      "zone": r.get("zone"),
                      "event_start": r.get("event_start"),
                      "event_end": r.get("event_end"),
                      "delivery_start": r.get("delivery_start"),
                      "delivery_end": r.get("delivery_end"),
                      "old_start": r.get("old_start"),
                      "new_start": r.get("new_start"),
                      "old_end": r.get("old_end"),
                      "new_end": r.get("new_end"),
                      "seconds_trimmed": seconds,
                      "reason": r.get("reason"),
                  })
              applied_trims.sort(key=lambda x: (x.get("event_start") if x.get("event_start") is not None else 0))

              summary["boundary"] = {
                  "schema_version": b.get("schema_version"),
                  "stage": b.get("stage"),
                  "selected_count_in": cin,
                  "selected_count_out": cout,
                  "edge_trim_count": b.get("edge_trim_count"),
                  "interior_split_count": isplit,
                  "interior_reject_count": b.get("interior_reject_count"),
                  "audio_entry_trim_count": b.get("audio_entry_trim_count"),
                  "audio_exit_trim_count": b.get("audio_exit_trim_count"),
                  "audio_edge_row_count": len(audio_rows),
                  "visual_edge_row_count": len(rows),
                  "visual_entry_trim_count": b.get("visual_entry_trim_count"),
                  "visual_exit_trim_count": b.get("visual_exit_trim_count"),
                  "visual_delivery_overlap_no_trim_count": count_reason("visual_event_overlaps_delivery_no_trim"),
                  "visual_cross_boundary_count": sum(1 for r in rows if is_cross_boundary(r)),
                  "visual_interior_not_edge_count": count_reason("visual_event_not_at_edge"),
                  "visual_blocked_by_delivery_floor_count": count_reason("visual_trim_blocked_by_delivery_floor"),
                  "visual_trim_unavailable_count": count_reason("visual_trim_unavailable"),
                  "total_visual_trim_seconds": round(total_seconds, 3),
                  "selected_count_before_visual_stage": before_visual,
                  "selected_count_after_visual_stage": cout,
                  "visual_stage_added_count": added,
                  "visual_stage_removed_count": removed,
                  "visual_stage_split_count": 0,
                  "visual_stage_count_invariant_note": (
                      "D-116 CASE A never changes membership: tighten_selected_visual_edges "
                      "emits exactly one output clip per input clip (verified by code "
                      "inspection, cutsell_worker/boundary_engine_pass.py -- not a new "
                      "engine change here). No distinct before/after-visual-stage "
                      "checkpoint is recorded upstream in boundary_engine_pass itself, so "
                      "before_visual_stage is derived as selected_count_in + "
                      "interior_split_count (the only prior stage that can change count); "
                      "a nonzero added/removed value would indicate a genuine invariant "
                      "violation worth escalating, not an expected outcome."
                  ),
                  "no_op_visual_row_count": len(rows) - len(applied_trims),
                  "applied_visual_trims": applied_trims,
              }

          if watchlisten is None:
              summary["watch_listen"] = {"status": "absent_or_missing_source_file"}
          elif isinstance(watchlisten, str):
              summary["watch_listen"] = {"status": watchlisten}
          elif isinstance(watchlisten, dict):
              caps = []
              for c in watchlisten.get("capabilities") or []:
                  status = c.get("status")
                  findings = c.get("findings") or []
                  entry = {
                      "name": c.get("capability"),
                      "status": status,
                      "method": c.get("method"),
                      "finding_count": c.get("finding_count", len(findings)),
                      "routing_targets": sorted({f.get("routes_to") for f in findings if f.get("routes_to")}),
                  }
                  if status in ("EVALUATED_FAIL", "ERROR"):
                      entry["findings_summary"] = [
                          {"kind": f.get("kind"), "start": f.get("start"), "end": f.get("end"),
                           "severity": f.get("severity"), "routes_to": f.get("routes_to")}
                          for f in findings
                      ]
                  caps.append(entry)
              summary["watch_listen"] = {
                  "status": watchlisten.get("status"),
                  "gate_mode": watchlisten.get("gate_mode"),
                  "artifact_kind": watchlisten.get("artifact_kind"),
                  "technical_qc_status": watchlisten.get("technical_qc_status"),
                  "capability_status_counts": watchlisten.get("capability_status_counts"),
                  "routing": watchlisten.get("routing"),
                  "capabilities": caps,
              }
          else:
              summary["watch_listen"] = {"status": "unexpected_type", "type": type(watchlisten).__name__}

          os.makedirs("artifact", exist_ok=True)
          out_path = "artifact/video00-modal-d116-qualification-summary.json"
          with open(out_path, "w") as f:
              json.dump(summary, f, indent=2, sort_keys=True)

          size = os.path.getsize(out_path)
          print("--- D-116/Watch+Listen compact qualification summary (D-119; derived from D-117's artifact-backed files; full artifacts remain source of detailed truth) ---")
          print(f"summary file: {out_path} ({size} bytes)")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Print compact D-123 BestTake qualification summary (tail-safe)
        # D-125 (docs/CUTSELL_DECISIONS.md): D-124's real-media qualification
        # of D-123 found one family (tg_140e20c3f9f49b133f) whose semantic-
        # winner-vs-delivery-tie-break shape could NOT be classified as a
        # genuine D-123 CASE B bypass vs. the pre-existing D-101/D-103 safety
        # veto, because `take_judge_groups`' own D-122/D-123 fields print
        # early in the "Print full canonical diagnostics" step and, by job
        # end, scroll outside the same ~5000-line CI log tail cap D-117/
        # D-118/D-119 already documented for boundary_engine_pass/perceptual_
        # watch_listen -- that fix was never extended to take_judge_groups,
        # so D-122/D-123's own newer fields inherited the identical exposure.
        # This step is D-119's exact pattern applied to that gap: a SEPARATE,
        # LATE-STAGE, BOUNDED summary placed after the large diagnostics step
        # AND after the quality-ladder step, reading `artifact/video00-
        # modal.json` (already on disk since "Download Video00 Modal
        # artifacts", never a live pipe -- no D-117 SIGPIPE risk) and
        # projecting ONLY the already-computed D-122/D-123 fields already on
        # each `take_judge_groups` row. It recomputes NO BestTake decision,
        # score, or ranking -- every field here is copied or trivially
        # derived (set-membership, equality, counting) from fields
        # `_semantic_best_take`/`case_b_performance_evidence.py`/
        # `deterministic_best_take_authority.py` already computed. Full raw
        # CASE B event detail (`delivery_events`) is deliberately NEVER
        # printed here -- only the bounded per-candidate aggregates -- so
        # this step cannot itself become a new tail-window problem.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python - <<'PY'
          import json, os, sys

          def load(path):
              if not os.path.exists(path) or os.path.getsize(path) == 0:
                  return None
              with open(path) as f:
                  try:
                      return json.load(f)
                  except Exception as e:
                      print(f"WARNING: failed to parse {path}: {e}", file=sys.stderr)
                      return None

          engine = load("artifact/video00-modal.json")
          regression_fixture = load("benchmarks/video00_regression_qa.json")

          summary = {"schema_version": "cutsell.video00.d123_case_b_qualification_summary.v1"}
          summary["source_status"] = "engine_json_present" if isinstance(engine, dict) else "engine_json_missing_or_unparseable"

          groups = []
          clip_text = {}
          if isinstance(engine, dict):
              diag = engine.get("diagnostics")
              if isinstance(diag, dict):
                  raw_groups = diag.get("take_judge_groups")
                  if isinstance(raw_groups, list):
                      groups = raw_groups
              for bucket in ("selected", "alternates", "discarded"):
                  for clip in engine.get(bucket) or []:
                      if isinstance(clip, dict) and clip.get("clip_id"):
                          clip_text[clip["clip_id"]] = str(clip.get("text") or "")

          _WINNER_PATH_DELIVERYSCORE_PATH = "DELIVERYSCORE_PATH"
          _WINNER_PATH_DETERMINISTIC_OVERRIDE = "DETERMINISTIC_OVERRIDE"

          def _compact_case_b(evidence_dict):
              # Projects ONLY the bounded, factual per-candidate aggregates
              # D-122's own case_b_performance_evidence_diagnostics() already
              # computed -- never the raw `delivery_events` list (that stays
              # in the full artifact, per this task's explicit "no raw-event
              # flood" requirement).
              out = {}
              for clip_id, row in (evidence_dict or {}).items():
                  if not isinstance(row, dict):
                      continue
                  out[clip_id] = {
                      "candidate_id": row.get("candidate_id", clip_id),
                      "delivery_event_count": row.get("delivery_event_count"),
                      "delivery_event_duration_total": row.get("delivery_event_duration_total"),
                      "count_by_kind": row.get("count_by_kind"),
                      "duration_by_kind": row.get("duration_by_kind"),
                      "event_density": row.get("event_density"),
                  }
              return out

          family_rows = []
          counts = {
              "family_count": 0,
              "semantic_fast_path_family_count": 0,
              "deliveryscore_disagreement_count": 0,
              "families_with_case_b_evidence_count": 0,
              "actionable_case_b_conflict_count": 0,
              "semantic_fast_path_bypass_count": 0,
              "deliveryscore_path_count": 0,
              "deterministic_override_count": 0,
              "meaning_insufficient_alternative_block_count": 0,
              "no_case_b_evidence_no_bypass_count": 0,
              # D-128 (docs/CUTSELL_DECISIONS.md D-128): Phase 1 SHADOW-ONLY
              # Class B fallback trigger observability, a pure projection of
              # `multimodal_besttake_fallback.fallback_trigger_diagnostics`
              # fields `pipeline.py` already attached to each
              # `take_judge_groups` row -- recomputes nothing, never
              # consulted by any BestTake/grouping/render decision.
              "fallback_shadow_eligible_count": 0,
          }

          for row in groups:
              if not isinstance(row, dict):
                  continue
              counts["family_count"] += 1

              semantic_candidates = row.get("semantic_candidates") or []
              member_ids = sorted({
                  c.get("clip_id") for c in semantic_candidates
                  if isinstance(c, dict) and c.get("clip_id")
              })
              if not member_ids:
                  # Older/degenerate rows may lack semantic_candidates;
                  # case_b_evidence (D-122, present on every D-122+ row) is
                  # keyed by the same member clip_ids as a fallback source of
                  # truth -- never a guess, just a second existing field.
                  member_ids = sorted((row.get("case_b_evidence") or {}).keys())

              semantic_fast_path_candidate = row.get("semantic_fast_path_candidate")
              semantic_winner_label = None
              semantic_winner_confidence = None
              if semantic_fast_path_candidate:
                  for c in semantic_candidates:
                      if isinstance(c, dict) and c.get("clip_id") == semantic_fast_path_candidate:
                          semantic_winner_label = c.get("label")
                          semantic_winner_confidence = c.get("confidence")
                          break

              deliveryscore_top_candidate = row.get("deliveryscore_top_candidate")
              meaning_sufficient_candidates = row.get("meaning_sufficient_candidates")
              case_b_evidence = row.get("case_b_evidence") or {}
              case_b_conflict_present = row.get("case_b_conflict_present")
              case_b_conflict_basis = row.get("case_b_conflict_basis")
              semantic_fast_path_bypassed = row.get("semantic_fast_path_bypassed")
              bypass_reason = row.get("bypass_reason")
              winner_path = row.get("winner_path")
              winner_path_before = row.get("winner_path_before")
              winner_path_after = row.get("winner_path_after")
              performance_consulted = row.get("performance_consulted_before_winner")
              final_selected_clip_id = row.get("final_winner", row.get("selected_clip_id"))
              final_reason = row.get("semantic_best_take_reason")

              if semantic_fast_path_candidate:
                  counts["semantic_fast_path_family_count"] += 1
                  if deliveryscore_top_candidate and deliveryscore_top_candidate != semantic_fast_path_candidate:
                      counts["deliveryscore_disagreement_count"] += 1
              if case_b_evidence:
                  counts["families_with_case_b_evidence_count"] += 1
              if case_b_conflict_present is True:
                  counts["actionable_case_b_conflict_count"] += 1
              if semantic_fast_path_bypassed is True:
                  counts["semantic_fast_path_bypass_count"] += 1
              if winner_path == _WINNER_PATH_DELIVERYSCORE_PATH:
                  counts["deliveryscore_path_count"] += 1
              if winner_path == _WINNER_PATH_DETERMINISTIC_OVERRIDE:
                  counts["deterministic_override_count"] += 1
              if (
                  semantic_fast_path_candidate
                  and deliveryscore_top_candidate
                  and deliveryscore_top_candidate != semantic_fast_path_candidate
                  and isinstance(meaning_sufficient_candidates, list)
                  and deliveryscore_top_candidate not in meaning_sufficient_candidates
              ):
                  counts["meaning_insufficient_alternative_block_count"] += 1
              if not case_b_evidence and not semantic_fast_path_bypassed:
                  counts["no_case_b_evidence_no_bypass_count"] += 1

              fallback_shadow_eligible = row.get("fallback_shadow_eligible")
              if fallback_shadow_eligible is True:
                  counts["fallback_shadow_eligible_count"] += 1

              compact_row = {
                  "group_id": row.get("group_id"),
                  "member_ids": member_ids,
                  "semantic_fast_path_candidate": semantic_fast_path_candidate,
                  "semantic_winner_label": semantic_winner_label,
                  "semantic_winner_confidence": semantic_winner_confidence,
                  "deliveryscore_top_candidate": deliveryscore_top_candidate,
                  "meaning_sufficient_candidates": meaning_sufficient_candidates,
                  "winner_path": winner_path,
                  "winner_path_before": winner_path_before,
                  "winner_path_after": winner_path_after,
                  "performance_consulted_before_winner": performance_consulted,
                  "case_b_conflict_present": case_b_conflict_present,
                  "semantic_fast_path_bypassed": semantic_fast_path_bypassed,
                  "bypass_reason": bypass_reason,
                  "final_selected_clip_id": final_selected_clip_id,
                  "final_reason": final_reason,
                  "case_b_evidence": _compact_case_b(case_b_evidence),
                  # D-128 Phase 1 shadow-only fields (bounded aggregates
                  # only -- never raw delivery_events).
                  "fallback_shadow_eligible": fallback_shadow_eligible,
                  "fallback_trigger_reason": row.get("fallback_trigger_reason"),
                  "fallback_structured_winner": row.get("fallback_structured_winner"),
                  "fallback_candidate_ids": row.get("fallback_candidate_ids"),
                  "fallback_case_b_dominance": row.get("fallback_case_b_dominance"),
                  "fallback_provider_invoked": row.get("fallback_provider_invoked"),
                  "fallback_winner_changed": row.get("fallback_winner_changed"),
              }
              if case_b_conflict_present:
                  # Conflict families only: name the two candidates' meaning-
                  # sufficiency status explicitly, per this task's "CONFLICT
                  # BASIS" requirement -- non-conflict families never carry
                  # this redundant block.
                  sufficiency = {}
                  if isinstance(case_b_conflict_basis, dict):
                      for key in ("semantic_fast_path_candidate", "deliveryscore_top_candidate"):
                          cid = case_b_conflict_basis.get(key)
                          if cid is not None and isinstance(meaning_sufficient_candidates, list):
                              sufficiency[cid] = cid in meaning_sufficient_candidates
                  compact_row["case_b_conflict_basis"] = case_b_conflict_basis
                  compact_row["case_b_conflict_meaning_sufficiency"] = sufficiency
              else:
                  compact_row["case_b_conflict_basis"] = None

              family_rows.append(compact_row)

          summary["global_counts"] = counts
          summary["families"] = family_rows

          # --- Pimples QA cross-check (QA/reporting only). Reuses the
          # ALREADY checked-in benchmarks/video00_regression_qa.json
          # fixture's own literal substrings -- never a new hardcoded
          # production reference, and this summary is never read by
          # production Selection/BestTake/grouping/render code. Matches by
          # substring containment against the SAME selected/alternates/
          # discarded clip texts the existing "Print full canonical
          # diagnostics" step already reads for its own D-094.2 forensic
          # summary. `required_order` checks are skipped here (their
          # `texts` list is a composite of the other checks' own literal
          # strings -- matching them again would be redundant, not
          # additional evidence).
          pimples_texts = []
          if isinstance(regression_fixture, dict):
              for check in regression_fixture.get("checks") or []:
                  if not isinstance(check, dict) or not str(check.get("id", "")).startswith("pimples_"):
                      continue
                  if check.get("kind") == "required_order":
                      continue
                  text = check.get("text")
                  if text:
                      pimples_texts.append(str(text))

          def _norm(s):
              return " ".join(str(s or "").lower().split())

          normalized_refs = [t for t in (_norm(x) for x in pimples_texts) if t]

          if regression_fixture is None:
              summary["pimples"] = {
                  "status": "reference_fixture_absent",
                  "reference_path": "benchmarks/video00_regression_qa.json",
              }
          elif not normalized_refs:
              summary["pimples"] = {"status": "no_pimples_checks_in_reference_fixture"}
          else:
              pimples_clip_ids = sorted({
                  cid for cid, text in clip_text.items()
                  if any(ref in _norm(text) for ref in normalized_refs)
              })
              if not pimples_clip_ids:
                  summary["pimples"] = {
                      "status": "no_pimples_reference_text_found_in_this_runs_clips",
                  }
              else:
                  matching_families = []
                  for row in family_rows:
                      if set(row["member_ids"]) & set(pimples_clip_ids):
                          matching_families.append({
                              "group_id": row["group_id"],
                              "member_ids": row["member_ids"],
                              "semantic_fast_path_candidate": row["semantic_fast_path_candidate"],
                              "deliveryscore_top_candidate": row["deliveryscore_top_candidate"],
                              "case_b_evidence": row["case_b_evidence"],
                              "case_b_conflict_present": row["case_b_conflict_present"],
                              "semantic_fast_path_bypassed": row["semantic_fast_path_bypassed"],
                              "bypass_reason": row["bypass_reason"],
                              "winner_path_after": row["winner_path_after"],
                              "final_selected_clip_id": row["final_selected_clip_id"],
                          })
                  if not matching_families:
                      # A pimples-referenced clip exists this run but never
                      # appeared in a >=2-member/no-usable-realization row
                      # (D-121/D-124 both proved this can legitimately
                      # happen -- e.g. a singleton, or upstream grouping
                      # split it away from any contest entirely).
                      summary["pimples"] = {
                          "status": "pimples_clips_present_but_no_multi_member_family_or_no_usable_realization_row",
                          "pimples_related_clip_ids": pimples_clip_ids,
                      }
                  elif len(matching_families) == 1:
                      summary["pimples"] = {"status": "family_formed", "families": matching_families}
                  else:
                      # D-124's own confirmed real shape: upstream grouping
                      # can split pimples-adjacent clips across multiple
                      # families in one run -- report ALL of them, never
                      # silently collapse to one.
                      summary["pimples"] = {"status": "fragmented_across_multiple_families", "families": matching_families}

          os.makedirs("artifact", exist_ok=True)
          out_path = "artifact/video00-modal-d123-qualification-summary.json"
          with open(out_path, "w") as f:
              json.dump(summary, f, indent=2, sort_keys=True)

          size = os.path.getsize(out_path)
          print("--- D-123 BestTake CASE B qualification summary (D-125; a pure projection of existing take_judge_groups/case_b_evidence diagnostics -- recomputes no BestTake decision, score, or ranking) ---")
          print(f"summary file: {out_path} ({size} bytes)")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Print compact D-150 Semantic Authority qualification summary (D-152, tail-safe)
        # D-152 (docs/CUTSELL_DECISIONS.md): D-151's real-media qualification of
        # the D-150 semantic authority gate could not recover the gate's own
        # field values (`semantic_authority_gate_status/_reason/_before/_after`,
        # `family_complete_context`, `complete_context_conflict`, `complete_
        # window_agreement_status`) because they print inside the large "Print
        # full canonical diagnostics" step and, by job end, scroll outside the
        # same ~5000-line CI log tail cap D-117/D-118/D-119/D-125 already
        # documented. This step is that same D-119/D-125 pattern applied to the
        # D-150 gate fields specifically: a SEPARATE, LATE-STAGE, BOUNDED
        # summary reading `artifact/video00-modal.json` (already on disk, never
        # a live pipe) and projecting ONLY the D-146/D-149/D-150 fields
        # `pipeline.py` already writes onto each `take_judge_groups` row --
        # never a transcript, raw provider prose, or a per-window/per-frame
        # payload. This logic mirrors (does not import, matching this
        # workflow's existing D-119/D-123 isolation pattern for late tail-safe
        # summary steps) `cutsell_worker.semantic_authority_observability`'s
        # `semantic_authority_ci_row`/`summarize_semantic_authority_gate_
        # counts` -- both pure projections, independently pytest-covered in
        # `tests/test_cutsell_d152_semantic_authority_ci_summary.py`. Recomputes
        # NO family formation, semantic label, gate decision, DeliveryScorer
        # score, or BestTake winner -- every field here is copied verbatim or
        # trivially derived (set-membership, equality, counting) from values
        # `pipeline.py`'s own D-150 gate call already produced.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python - <<'PY'
          import json, os, sys
          from collections import Counter

          def load(path):
              if not os.path.exists(path) or os.path.getsize(path) == 0:
                  return None
              with open(path) as f:
                  try:
                      return json.load(f)
                  except Exception as e:
                      print(f"WARNING: failed to parse {path}: {e}", file=sys.stderr)
                      return None

          engine = load("artifact/video00-modal.json")

          summary = {"schema_version": "cutsell.video00.d152_semantic_authority_summary.v1"}

          rows = []
          if isinstance(engine, dict):
              diag = engine.get("diagnostics")
              if isinstance(diag, dict):
                  raw_groups = diag.get("take_judge_groups")
                  if isinstance(raw_groups, list):
                      rows = [r for r in raw_groups if isinstance(r, dict)]
          summary["source_status"] = "engine_json_present" if isinstance(engine, dict) else "engine_json_missing_or_unparseable"

          _ALLOWED = "AUTHORITATIVE"
          _ABSTAIN_INCOMPLETE = "ABSTAIN_INCOMPLETE_CONTEXT"
          _ABSTAIN_CONFLICT = "ABSTAIN_CONFLICT"
          _ADVISORY = "ADVISORY"
          _AGREEMENT_UNKNOWN = "UNKNOWN"
          _AGREEMENT_NO_COMPLETE_WINDOW = "NO_COMPLETE_WINDOW"
          _AGREEMENT_ONE_COMPLETE_WINDOW = "ONE_COMPLETE_WINDOW"
          _AGREEMENT_MULTIPLE_AGREE = "MULTIPLE_COMPLETE_WINDOWS_AGREE"
          _AGREEMENT_MULTIPLE_DISAGREE = "MULTIPLE_COMPLETE_WINDOWS_DISAGREE"

          def agreement_status_of(row):
              top = row.get("complete_window_agreement_status")
              if top is not None:
                  return str(top)
              nested = row.get("semantic_authority_observability")
              if isinstance(nested, dict):
                  return str(nested.get("complete_window_agreement_status") or _AGREEMENT_UNKNOWN)
              return _AGREEMENT_UNKNOWN

          def ci_row(row):
              candidates = row.get("semantic_candidates")
              candidates = candidates if isinstance(candidates, list) else []
              winner_ids = [
                  str(c.get("clip_id")) for c in candidates
                  if isinstance(c, dict) and str(c.get("label") or "") == "winner"
              ]
              nested = row.get("semantic_authority_observability")
              complete_window_count = nested.get("complete_window_count") if isinstance(nested, dict) else None
              return {
                  "family_id": str(row.get("group_id") or ""),
                  "member_count": len(candidates),
                  "family_complete_context": row.get("family_complete_context"),
                  "complete_window_count": complete_window_count,
                  "complete_window_agreement_status": agreement_status_of(row),
                  "complete_context_conflict": bool(row.get("complete_context_conflict", False)),
                  "semantic_authority_before": row.get("semantic_authority_before"),
                  "semantic_authority_gate_status": row.get("semantic_authority_gate_status"),
                  "semantic_authority_gate_reason": row.get("semantic_authority_gate_reason"),
                  "semantic_authority_after": row.get("semantic_authority_after"),
                  "semantic_fast_path_candidate": row.get("semantic_fast_path_candidate"),
                  "semantic_winner_id": winner_ids[0] if len(winner_ids) == 1 else None,
                  "deliveryscore_winner_id": row.get("deliveryscore_top_candidate"),
                  "winner_path_after": row.get("winner_path_after"),
              }

          gate_status_counts = Counter()
          agreement_counts = Counter()
          gate_evaluated_count = 0
          complete_context_conflict_count = 0
          family_rows = []
          for row in rows:
              if row.get("semantic_authority_gate_evaluated"):
                  gate_evaluated_count += 1
              gate_status_counts[str(row.get("semantic_authority_gate_status") or "")] += 1
              agreement_counts[agreement_status_of(row)] += 1
              if bool(row.get("complete_context_conflict", False)):
                  complete_context_conflict_count += 1
              family_rows.append(ci_row(row))

          summary["counts"] = {
              "family_count": len(rows),
              "semantic_authority_gate_evaluated_count": gate_evaluated_count,
              "semantic_authority_allowed_count": gate_status_counts.get(_ALLOWED, 0),
              "semantic_authority_abstain_incomplete_count": gate_status_counts.get(_ABSTAIN_INCOMPLETE, 0),
              "semantic_authority_abstain_conflict_count": gate_status_counts.get(_ABSTAIN_CONFLICT, 0),
              "semantic_authority_advisory_count": gate_status_counts.get(_ADVISORY, 0),
              "families_with_one_complete_window": agreement_counts.get(_AGREEMENT_ONE_COMPLETE_WINDOW, 0),
              "families_with_multiple_complete_windows": (
                  agreement_counts.get(_AGREEMENT_MULTIPLE_AGREE, 0) + agreement_counts.get(_AGREEMENT_MULTIPLE_DISAGREE, 0)
              ),
              "families_with_complete_window_agreement": agreement_counts.get(_AGREEMENT_MULTIPLE_AGREE, 0),
              "families_with_complete_context_conflict": complete_context_conflict_count,
              "families_with_no_complete_window": agreement_counts.get(_AGREEMENT_NO_COMPLETE_WINDOW, 0),
          }
          summary["families"] = family_rows

          os.makedirs("artifact", exist_ok=True)
          out_path = "artifact/video00-modal-d152-semantic-authority-summary.json"
          with open(out_path, "w") as f:
              json.dump(summary, f, indent=2, sort_keys=True)

          size = os.path.getsize(out_path)
          print("--- D-150 Semantic Authority gate qualification summary (D-152; a pure projection of existing take_judge_groups diagnostics -- recomputes no family formation, semantic label, gate decision, DeliveryScorer score, or BestTake winner) ---")
          print(f"summary file: {out_path} ({size} bytes)")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Print compact D-164 Watch+Listen BestTake evidence qualification summary (tail-safe)
        # D-164: same D-119/D-123/D-152 pattern applied to D-163's own new
        # `diagnostics.watch_listen_besttake_evidence` (run-level) and the
        # `watch_listen_besttake_*` fields D-163's pipeline.py wiring already
        # spreads onto each `take_judge_groups` row when
        # CUTSELL_WATCH_LISTEN_BESTTAKE_EVIDENCE_ENABLED=1. A SEPARATE,
        # LATE-STAGE, BOUNDED summary reading `artifact/video00-modal.json`
        # (already on disk, never a live pipe -- no D-117 SIGPIPE risk) and
        # projecting ONLY fields D-163's own (unchanged in this task) guard
        # already computed. Recomputes NO guard decision, usability state,
        # or BestTake winner -- every field here is copied verbatim from the
        # existing row. D-163's `watch_listen_besttake_group_row` only
        # persists `candidate_usability_summary` as a per-candidate
        # DELIVERY-usability map (not the full per-candidate evidence
        # record -- entry/exit usability, breaking_character_during_
        # delivery, conflict_flags, etc. exist only transiently inside
        # pipeline.py's per-family loop and are not serialized); this step
        # honestly reports that limitation rather than fabricating fields,
        # per this task's own "no cutsell_worker editorial change" scope.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python - <<'PY'
          import json, os, sys

          def load(path):
              if not os.path.exists(path) or os.path.getsize(path) == 0:
                  return None
              with open(path) as f:
                  try:
                      return json.load(f)
                  except Exception as e:
                      print(f"WARNING: failed to parse {path}: {e}", file=sys.stderr)
                      return None

          engine = load("artifact/video00-modal.json")
          regression_fixture = load("benchmarks/video00_regression_qa.json")

          summary = {"schema_version": "cutsell.video00.d164_watch_listen_besttake_summary.v1"}
          summary["source_status"] = "engine_json_present" if isinstance(engine, dict) else "engine_json_missing_or_unparseable"
          summary["per_candidate_evidence_schema_note"] = (
              "D-163's watch_listen_besttake_group_row persists only "
              "candidate_usability_summary (a per-candidate DELIVERY-usability "
              "map). Full per-candidate WatchListenBestTakeEvidence fields "
              "(entry/exit usability, breaking_character_during_delivery, "
              "reset_or_fumble_during_delivery, performance_continuity_status, "
              "conflict_flags, editability_status) exist only transiently "
              "inside pipeline.py's per-family loop and are not serialized to "
              "this JSON -- not reported here, per D-164's no-cutsell_worker-"
              "editorial-change scope."
          )

          groups = []
          clip_text = {}
          run_level = {"status": "absent"}
          if isinstance(engine, dict):
              diag = engine.get("diagnostics")
              if isinstance(diag, dict):
                  raw_groups = diag.get("take_judge_groups")
                  if isinstance(raw_groups, list):
                      groups = [r for r in raw_groups if isinstance(r, dict)]
                  run_level = diag.get("watch_listen_besttake_evidence") or {"status": "absent"}
              for bucket in ("selected", "alternates", "discarded"):
                  for clip in engine.get(bucket) or []:
                      if isinstance(clip, dict) and clip.get("clip_id"):
                          clip_text[clip["clip_id"]] = str(clip.get("text") or "")

          summary["run_level"] = run_level

          family_rows = []
          for row in groups:
              if not row.get("watch_listen_besttake_evaluated"):
                  continue
              semantic_candidates = row.get("semantic_candidates") or []
              member_ids = sorted({
                  c.get("clip_id") for c in semantic_candidates
                  if isinstance(c, dict) and c.get("clip_id")
              }) or sorted((row.get("case_b_evidence") or {}).keys())
              family_rows.append({
                  "group_id": row.get("group_id"),
                  "member_ids": member_ids,
                  "meaning_sufficient_candidates": row.get("meaning_sufficient_candidates"),
                  "semantic_fast_path_candidate": row.get("semantic_fast_path_candidate"),
                  "deliveryscore_top_candidate": row.get("deliveryscore_top_candidate"),
                  "winner_path_after": row.get("winner_path_after"),
                  "final_selected_clip_id": row.get("final_winner", row.get("selected_clip_id")),
                  "semantic_authority_gate_status": row.get("semantic_authority_gate_status"),
                  "watch_listen_besttake_candidate_count": row.get("watch_listen_besttake_candidate_count"),
                  "watch_listen_besttake_current_winner": row.get("watch_listen_besttake_current_winner"),
                  "watch_listen_besttake_guard_status": row.get("watch_listen_besttake_guard_status"),
                  "watch_listen_besttake_guard_reason": row.get("watch_listen_besttake_guard_reason"),
                  "watch_listen_besttake_dominant_candidate": row.get("watch_listen_besttake_dominant_candidate"),
                  "watch_listen_besttake_winner_before": row.get("watch_listen_besttake_winner_before"),
                  "watch_listen_besttake_winner_after": row.get("watch_listen_besttake_winner_after"),
                  "watch_listen_besttake_action_applied": row.get("watch_listen_besttake_action_applied"),
                  "watch_listen_besttake_existing_ladder_agrees": row.get("watch_listen_besttake_existing_ladder_agrees"),
                  "candidate_usability_summary": row.get("candidate_usability_summary"),
                  "winner_immutability_check": (
                      "OK" if row.get("watch_listen_besttake_winner_before") == row.get("watch_listen_besttake_winner_after")
                      else "REGRESSION_WINNER_CHANGED"
                  ),
              })

          summary["families_with_watch_listen_besttake_evidence"] = len(family_rows)
          summary["families"] = family_rows

          # Pimples QA cross-check (QA/reporting only) -- same substring-match
          # mechanism the existing D-123 step (D-125) already uses against the
          # checked-in benchmarks/video00_regression_qa.json fixture.
          pimples_texts = []
          if isinstance(regression_fixture, dict):
              for check in regression_fixture.get("checks") or []:
                  if not isinstance(check, dict) or not str(check.get("id", "")).startswith("pimples_"):
                      continue
                  if check.get("kind") == "required_order":
                      continue
                  text = check.get("text")
                  if text:
                      pimples_texts.append(str(text))

          def _norm(s):
              return " ".join(str(s or "").lower().split())

          normalized_refs = [t for t in (_norm(x) for x in pimples_texts) if t]

          if regression_fixture is None:
              summary["pimples"] = {"status": "reference_fixture_absent"}
          elif not normalized_refs:
              summary["pimples"] = {"status": "no_pimples_checks_in_reference_fixture"}
          else:
              pimples_clip_ids = sorted({
                  cid for cid, text in clip_text.items()
                  if any(ref in _norm(text) for ref in normalized_refs)
              })
              if not pimples_clip_ids:
                  summary["pimples"] = {"status": "no_pimples_reference_text_found_in_this_runs_clips"}
              else:
                  matching = [r for r in family_rows if set(r["member_ids"]) & set(pimples_clip_ids)]
                  if not matching:
