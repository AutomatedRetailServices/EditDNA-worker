              "genuine_split_evidence_count": genuine_split_evidence,
              "missing_or_uncertain_count": missing_or_uncertain_count,
              "retry_correction_continuation_successfully_grouped": retry_correction_continuation_grouped,
              "singleton_group_count": run_summary.get("singleton_group_count"),
