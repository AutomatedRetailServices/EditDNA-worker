                  "terminal_besttake_confidence_reason": row.get("terminal_besttake_confidence_reason"),
                  "terminal_besttake_candidate_count": row.get("terminal_besttake_candidate_count"),
                  "terminal_besttake_top_candidate_id": row.get("terminal_besttake_top_candidate_id"),
                  "terminal_besttake_runner_up_candidate_id": row.get("terminal_besttake_runner_up_candidate_id"),
                  "terminal_besttake_top_score": row.get("terminal_besttake_top_score"),
                  "terminal_besttake_runner_up_score": row.get("terminal_besttake_runner_up_score"),
                  "terminal_besttake_score_margin": row.get("terminal_besttake_score_margin"),
                  "terminal_besttake_structured_dominance_present": row.get("terminal_besttake_structured_dominance_present"),
                  "terminal_besttake_conflict_present": row.get("terminal_besttake_conflict_present"),
                  "bounded_finalist_arbiter_eligible": row.get("bounded_finalist_arbiter_eligible"),
                  "bounded_finalist_arbiter_candidate_count": row.get("bounded_finalist_arbiter_candidate_count"),
                  "bounded_finalist_arbiter_state": row.get("bounded_finalist_arbiter_state"),
                  "bounded_finalist_arbiter_decision": row.get("bounded_finalist_arbiter_decision"),
                  "bounded_finalist_arbiter_preferred_candidate_id": row.get("bounded_finalist_arbiter_preferred_candidate_id"),
                  "bounded_finalist_arbiter_reason": row.get("bounded_finalist_arbiter_reason"),
                  "bounded_finalist_arbiter_meaning_parity": row.get("bounded_finalist_arbiter_meaning_parity"),
                  "bounded_finalist_arbiter_performance_status": row.get("bounded_finalist_arbiter_performance_status"),
                  "bounded_finalist_arbiter_editability_status": row.get("bounded_finalist_arbiter_editability_status"),
                  "bounded_finalist_arbiter_prosodic_audio_status": row.get("bounded_finalist_arbiter_prosodic_audio_status"),
                  "bounded_finalist_arbiter_conflict": row.get("bounded_finalist_arbiter_conflict"),
                  "bounded_finalist_arbiter_missing_evidence": row.get("bounded_finalist_arbiter_missing_evidence"),
                  "bounded_finalist_arbiter_action_applied": row.get("bounded_finalist_arbiter_action_applied"),
              })

