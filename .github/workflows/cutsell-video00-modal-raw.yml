      - name: D-198 P1 local group formation real-media qualification
        # D-198 (docs/CUTSELL_DECISIONS.md D-198): real-media qualification
        # of D-197's local-group formation on the SAME canonical Video00
        # RAW that D-196 originally found LOCAL_GROUPING_TOO_BROAD on.
        # Reads the SAME `artifact/video00-modal.json` the D-196 step above
        # reads, and PURE-PROJECTS/re-audits already-serialized `moments`
        # (D-198's own `relation_to_predecessor` field included, per
        # docs/CUTSELL_DECISIONS.md D-198's own pre-RAW observability
        # repair), `local_groups`, and `sequences` -- recomputes NO
        # relation, NO moment role, NO sequence kind, NO group membership.
        # Every classification below (per-group quality, whole-run
        # assessment, over-fragmentation cause, consistency audit) is a
        # REPORTING-ONLY categorization derived from already-serialized
        # fields; none of it is fed back into cutsell_worker.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import sys

          def load(path):
              if not os.path.exists(path) or os.path.getsize(path) == 0:
                  return None
              with open(path) as f:
                  try:
                      return json.load(f)
                  except Exception as e:
                      print(f"WARNING: failed to parse {path}: {e}", file=sys.stderr)
                      return None

          engine = load("artifact/video00-modal.json")
          regression_fixture = load("benchmarks/video00_regression_qa.json")

          summary = {"schema_version": "cutsell.video00.d198_local_group_formation_qualification.v1"}
          summary["source_status"] = "engine_json_present" if isinstance(engine, dict) else "engine_json_missing_or_unparseable"

          diag = engine.get("diagnostics") if isinstance(engine, dict) else None
          p1_block = diag.get("editorial_moment_sequence") if isinstance(diag, dict) else None
          p1_status = (p1_block or {}).get("status") if isinstance(p1_block, dict) else "block_missing"
          summary["editorial_moment_sequence_status"] = p1_status

          clip_meta = {}
          if isinstance(engine, dict):
              for bucket in ("selected", "alternates", "discarded"):
                  for clip in engine.get(bucket) or []:
                      if isinstance(clip, dict) and clip.get("clip_id"):
                          text_norm = " ".join(str(clip.get("text") or "").lower().split())
                          clip_meta[clip["clip_id"]] = {
                              "start": clip.get("start"),
                              "end": clip.get("end"),
                              "source_asset_id": clip.get("source_asset_id"),
                              "text_hash": hashlib.sha256(text_norm.encode("utf-8")).hexdigest()[:12],
                              "_norm_text": text_norm,
                          }

          moments = []
          sequences = []
          local_groups = []
          run_summary = {}
          if isinstance(p1_block, dict):
              moments = p1_block.get("moments") or []
              sequences = p1_block.get("sequences") or []
              local_groups = p1_block.get("local_groups") or []
              run_summary = {
                  k: v for k, v in p1_block.items() if k not in ("status", "moments", "sequences", "local_groups")
              }

          summary["run_summary"] = run_summary
          summary["moment_count_in_artifact"] = len(moments)
          summary["sequence_count_in_artifact"] = len(sequences)
          summary["local_group_count_in_artifact"] = len(local_groups)

          moments_sorted = sorted(moments, key=lambda m: (m.get("source_start") or 0, m.get("source_end") or 0))
          sequences_sorted = sorted(sequences, key=lambda s: (s.get("source_start") or 0, s.get("source_end") or 0))
          groups_sorted = sorted(local_groups, key=lambda g: (g.get("source_start") or 0, g.get("source_end") or 0))
          summary["moments"] = moments_sorted
          summary["sequences"] = sequences_sorted
          summary["local_groups"] = groups_sorted

          # --- moment_id -> group_id / sequence_kind lookups (pure
          # membership indexing over already-serialized ids). ---
          moment_to_group = {}
          for g in local_groups:
              gid = g.get("group_id")
              for mid in g.get("moment_ids") or []:
                  moment_to_group[mid] = gid

          moment_to_sequence_kind = {}
          for s in sequences:
              kind = s.get("sequence_kind")
              for mid in s.get("moment_ids") or []:
                  moment_to_sequence_kind[mid] = kind

          # --- Per-group quality classification (same BOUNDED_LOCAL/
          # PLAUSIBLE_LOCAL/TOO_BROAD/AMBIGUOUS vocabulary D-196's own
          # sequence-level grouping_audit used, applied here to LOCAL
          # GROUPS -- the real unit of D-197's own decision). A singleton
          # (moment_count == 1) is always BOUNDED_LOCAL by definition --
          # nothing to span. ---
          def _group_quality(g):
              start, end, count = g.get("source_start"), g.get("source_end"), g.get("moment_count")
              if not isinstance(start, (int, float)) or not isinstance(end, (int, float)) or not isinstance(count, int) or count < 1:
                  return "AMBIGUOUS", None
              if count == 1:
                  return "BOUNDED_LOCAL", 0.0
              duration = max(0.0, end - start)
              if duration <= 120.0:
                  return "BOUNDED_LOCAL", duration
              if duration <= 600.0:
                  return "PLAUSIBLE_LOCAL", duration
              return "TOO_BROAD", duration

          per_group_findings = []
          too_broad_group_count = 0
          ambiguous_group_count = 0
          for g in groups_sorted:
              classification, duration = _group_quality(g)
              if classification == "TOO_BROAD":
                  too_broad_group_count += 1
              if classification == "AMBIGUOUS":
                  ambiguous_group_count += 1
              per_group_findings.append({
                  "group_id": g.get("group_id"),
                  "source_asset_id": g.get("source_asset_id"),
                  "source_start": g.get("source_start"),
                  "source_end": g.get("source_end"),
                  "span_duration_sec": duration,
                  "moment_count": g.get("moment_count"),
                  "grouping_reason": g.get("grouping_reason"),
                  "relation_support": g.get("relation_support"),
                  "confidence": g.get("confidence"),
                  "conflict_flags": g.get("conflict"),
                  "classification": classification,
              })
          summary["per_group_findings"] = per_group_findings
          summary["too_broad_group_count"] = too_broad_group_count
          summary["ambiguous_group_count"] = ambiguous_group_count

          # --- Whole-source collapse check: NO local group may absorb
          # ~all of the source's real moments -- INDEPENDENT of the
          # duration-based per-group classification above. D-196's own
          # real failure (353.14s) fell UNDER the 600s "TOO_BROAD" span
          # threshold, so gating this check on that classification would
          # have silently missed the exact failure D-198 exists to catch
          # -- moment-count share is the structural signal that actually
          # distinguishes "one real local group" from "the whole source
          # collapsed into one group regardless of its span." The >=5
          # floor avoids flagging a trivially small, genuinely single-
          # group RAW as a "collapse". ---
          total_moments = len(moments)
          whole_source_collapse = total_moments >= 5 and any(
              (f.get("moment_count") or 0) >= 0.9 * total_moments
              for f in per_group_findings
          )
          summary["whole_source_collapse_detected"] = whole_source_collapse

          # --- Consistency / relation-by-relation / join-split audit. One
          # source at a time (Video00 is single-source; defensive for any
          # future multi-source RAW). Predecessor is the immediately prior
          # moment in that source's own source_start/source_end order --
          # the exact order build_editorial_moments_for_source builds
          # `local_sequence_position` in. ---
          JOIN_RELATIONS = {"RETRY", "CORRECTION", "CONTINUATION"}
          KNOWN_RELATIONS = {
              "RETRY", "CORRECTION", "CONTINUATION", "NEW_AUDIENCE_BEAT",
              "DISTINCT_PROPOSITION", "COMPLEMENTARY", "UNCERTAIN",
          }

          by_source = {}
          for m in moments_sorted:
              by_source.setdefault(m.get("source_asset_id"), []).append(m)

          relation_counts = {k: 0 for k in KNOWN_RELATIONS}
          relation_counts["MISSING"] = 0
          relation_counts["OTHER"] = 0
          joins_by_relation = {k: 0 for k in relation_counts}
          splits_by_relation = {k: 0 for k in relation_counts}
          inconsistencies = []
          retry_correction_continuation_grouped = 0
          missing_or_uncertain_count = 0
          consistency_rows = []

          for src_id, src_moments in by_source.items():
              for idx in range(1, len(src_moments)):
                  predecessor = src_moments[idx - 1]
                  current = src_moments[idx]
                  relation = current.get("relation_to_predecessor")
                  bucket = relation if relation in KNOWN_RELATIONS else ("MISSING" if relation is None else "OTHER")
                  relation_counts[bucket] += 1
                  if bucket in ("MISSING", "UNCERTAIN"):
                      missing_or_uncertain_count += 1

                  pred_group = moment_to_group.get(predecessor.get("editorial_moment_id"))
                  cur_group = moment_to_group.get(current.get("editorial_moment_id"))
                  same_group = pred_group is not None and pred_group == cur_group
                  if same_group:
                      joins_by_relation[bucket] += 1
                      if bucket in JOIN_RELATIONS:
                          retry_correction_continuation_grouped += 1
                  else:
                      splits_by_relation[bucket] += 1

                  expected_same_group = bucket in JOIN_RELATIONS
                  if expected_same_group != same_group:
                      inconsistencies.append({
                          "source_asset_id": src_id,
                          "predecessor_moment_id": predecessor.get("editorial_moment_id"),
                          "current_moment_id": current.get("editorial_moment_id"),
                          "relation_to_predecessor": relation,
                          "predecessor_group_id": pred_group,
                          "current_group_id": cur_group,
                          "expected_same_group": expected_same_group,
                          "actual_same_group": same_group,
                      })
                  consistency_rows.append({
                      "source_asset_id": src_id,
                      "predecessor_moment_id": predecessor.get("editorial_moment_id"),
                      "predecessor_source_start": predecessor.get("source_start"),
                      "predecessor_source_end": predecessor.get("source_end"),
                      "current_moment_id": current.get("editorial_moment_id"),
                      "current_source_start": current.get("source_start"),
                      "current_source_end": current.get("source_end"),
                      "relation_to_predecessor": relation,
                      "same_local_group": same_group,
                  })

          summary["relation_counts"] = relation_counts
          summary["joins_by_relation"] = joins_by_relation
          summary["splits_by_relation"] = splits_by_relation
          summary["consistency_rows"] = consistency_rows
          summary["inconsistency_count"] = len(inconsistencies)
          summary["inconsistencies"] = inconsistencies

          # --- NEW_AUDIENCE_BEAT control: every real NEW_AUDIENCE_BEAT
          # boundary must have occurred BEFORE that moment (i.e. split,
          # never same-group) -- already covered by the consistency audit
          # above; surfaced here explicitly per its own required section. ---
          new_audience_beat_rows = [r for r in consistency_rows if r["relation_to_predecessor"] == "NEW_AUDIENCE_BEAT"]
          summary["new_audience_beat_control"] = {
              "count": len(new_audience_beat_rows),
              "all_split_correctly": all(not r["same_local_group"] for r in new_audience_beat_rows),
              "rows": new_audience_beat_rows,
          }

          # --- Over-fragmentation classification (structural, no invented
          # numeric ratio). A genuine grouper defect (inconsistency_count >
          # 0) is OVER_FRAGMENTED outright. Otherwise: whether the
          # boundaries actually observed are dominated by genuine editorial
          # split evidence (NEW_AUDIENCE_BEAT/DISTINCT_PROPOSITION/
          # COMPLEMENTARY) vs. the live evidence layer simply having no/
          # uncertain relation to offer (MISSING/UNCERTAIN). ---
          total_edges = sum(relation_counts.values())
          genuine_split_evidence = relation_counts["NEW_AUDIENCE_BEAT"] + relation_counts["DISTINCT_PROPOSITION"] + relation_counts["COMPLEMENTARY"]
          total_splits = missing_or_uncertain_count + genuine_split_evidence
          if total_edges == 0:
              fragmentation_classification = "NOT_APPLICABLE"
          elif inconsistencies:
              fragmentation_classification = "OVER_FRAGMENTED"
          elif total_splits == 0:
              fragmentation_classification = "NOT_APPLICABLE"
          elif missing_or_uncertain_count > genuine_split_evidence:
