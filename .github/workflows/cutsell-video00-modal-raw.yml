          import hashlib
          import json
          import os
          import sys

          from cutsell_worker.bounded_finalist_arbiter import bounded_finalist_arbiter_run_summary
          from cutsell_worker.pipeline import terminal_besttake_confidence_run_summary

          def load(path):
              if not os.path.exists(path) or os.path.getsize(path) == 0:
                  return None
              with open(path) as f:
                  try:
                      return json.load(f)
                  except Exception as e:
                      print(f"WARNING: failed to parse {path}: {e}", file=sys.stderr)
                      return None

          engine = load("artifact/video00-modal.json")
          regression_fixture = load("benchmarks/video00_regression_qa.json")

          summary = {"schema_version": "cutsell.video00.d186a_terminal_besttake_arbiter_summary.v1"}
          summary["source_status"] = "engine_json_present" if isinstance(engine, dict) else "engine_json_missing_or_unparseable"

          rows = []
          clip_meta = {}  # clip_id -> {start, end, source_asset_id, text_hash, _norm_text (in-process only)}
          if isinstance(engine, dict):
              diag = engine.get("diagnostics")
              if isinstance(diag, dict):
                  raw_groups = diag.get("take_judge_groups")
                  if isinstance(raw_groups, list):
                      rows = [r for r in raw_groups if isinstance(r, dict)]
              for bucket in ("selected", "alternates", "discarded"):
                  for clip in engine.get(bucket) or []:
                      if isinstance(clip, dict) and clip.get("clip_id"):
                          text_norm = " ".join(str(clip.get("text") or "").lower().split())
                          clip_meta[clip["clip_id"]] = {
                              "start": clip.get("start"),
                              "end": clip.get("end"),
                              "source_asset_id": clip.get("source_asset_id"),
                              "text_hash": hashlib.sha256(text_norm.encode("utf-8")).hexdigest()[:12],
                              "_norm_text": text_norm,
                          }

