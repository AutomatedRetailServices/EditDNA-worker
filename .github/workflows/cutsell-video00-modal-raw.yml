          elif fragmentation_classification == "OVER_FRAGMENTED":
              whole_run_assessment = "OVER_FRAGMENTED"
          elif ambiguous_group_count > 0 and ambiguous_group_count < len(groups_sorted):
              whole_run_assessment = "MIXED_QUALITY"
          elif ambiguous_group_count > 0 and ambiguous_group_count == len(groups_sorted):
              whole_run_assessment = "EVIDENCE_INSUFFICIENT"
          else:
              whole_run_assessment = "BOUNDED_USEFUL"
          summary["whole_run_grouping_assessment"] = whole_run_assessment

          # --- Sequence membership contract: every sequence's moments must
          # come from exactly ONE local group. ---
          cross_group_sequences = []
          for s in sequences_sorted:
              group_ids = {moment_to_group.get(mid) for mid in (s.get("moment_ids") or [])}
              group_ids.discard(None)
              if len(group_ids) != 1:
                  cross_group_sequences.append({"sequence_id": s.get("sequence_id"), "group_ids_found": sorted(group_ids)})
          summary["sequence_membership_contract"] = {
              "cross_group_sequence_count": len(cross_group_sequences),
              "cross_group_sequences": cross_group_sequences,
          }

          # --- False-positive / thin-support PREASSEMBLED_FINAL_SEQUENCE
          # audit (D-196's own false-positive check, plus D-198's new
          # CONTINUATION-only thin-support firewall). ---
          false_positive_final_sequences = [
              s for s in sequences_sorted
              if s.get("sequence_kind") == "PREASSEMBLED_FINAL_SEQUENCE"
              and s.get("proposition_progression_status") != "FORWARD_PROGRESS"
          ]
          summary["false_positive_final_sequence_count"] = len(false_positive_final_sequences)
          summary["false_positive_final_sequences"] = false_positive_final_sequences

          thin_support_sequences = []
          for s in sequences_sorted:
              if s.get("sequence_kind") != "PREASSEMBLED_FINAL_SEQUENCE":
                  continue
              group_ids = {moment_to_group.get(mid) for mid in (s.get("moment_ids") or [])}
              group_ids.discard(None)
              owning_group = next((g for g in local_groups if g.get("group_id") in group_ids), None)
              relation_support = set((owning_group or {}).get("relation_support") or [])
              if relation_support == {"CONTINUATION"}:
                  thin_support_sequences.append({"sequence_id": s.get("sequence_id"), "group_id": owning_group.get("group_id") if owning_group else None})
          summary["preassembled_support_too_thin_count"] = len(thin_support_sequences)
          summary["preassembled_support_too_thin_sequences"] = thin_support_sequences

