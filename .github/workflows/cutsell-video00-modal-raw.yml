          summary["bounded_finalist_arbiter_run_summary"] = d184_run_summary
          summary["family_count"] = len(family_rows)
          summary["families"] = family_rows
          summary["region_source_mapping"] = {
              "pimples": _region_candidates("pimples"),
              "gynecologist": _region_candidates("gynecologist", GYNECOLOGIST_SPAN),
          }

          os.makedirs("artifact", exist_ok=True)
          out_path = "artifact/d186a_terminal_besttake_arbiter_summary.json"
          with open(out_path, "w") as f:
              json.dump(summary, f, indent=2, sort_keys=True)

          size = os.path.getsize(out_path)
          print("--- D-186A D-183 D-184 compact diagnostics (a pure projection of already-computed take_judge_groups fields -- recomputes no confidence classification, no arbiter verdict, no BestTake decision, no score) ---")
          print(f"summary file: {out_path} ({size} bytes)")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

