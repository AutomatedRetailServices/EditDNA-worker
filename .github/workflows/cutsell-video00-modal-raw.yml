      - name: D-235G Selection Freeze diagnostics -> sibling-safe extraction
        # D-235G (docs/CUTSELL_DECISIONS.md D-235/D-235F/D-235G): D-235F's
        # own finding was that answering "why didn't Pacing V2 serialize?"
        # required the 68.7 MB `cutsell-video00-modal-human-review`
        # artifact, which this session's own egress policy could not
        # download. This step is the fix: read the SAME `artifact/video00-
        # modal.json` the D-196/D-200/D-204/D-209/D-218R steps read, and
        # PURE-PROJECT the already-serialized `diagnostics["selection_
        # freeze_diagnostics"]` block (D-235G, `cutsell_worker/selection_
        # freeze_diagnostics.py`) verbatim into a small, bounded,
        # SIBLING-SAFE file -- no Video00 golden-file content, no expected-
        # selection-count assumption, generic for any source. Recomputes
        # NO Freeze/coherence/repair-loop/resolver/D-090 decision -- every
        # field is copied, never re-derived. Runs regardless of whether
        # Freeze blocked (`if: always()`, same convention as the
        # architecture/Human-Gold steps below) since this step's own job
        # is to explain a blocked Freeze, not depend on an unblocked one.
        # FAILS LOUDLY (non-zero exit) when the block is absent -- it is
        # expected on every run once a draft contract exists, blocked or
        # not; a silent absence would itself be the kind of undetected gap
        # D-218 already found once for Pacing V2.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python3 - <<'PY'
          import json
          import os
          import sys

          def load(path):
              if not os.path.exists(path) or os.path.getsize(path) == 0:
                  return None
              with open(path) as f:
                  try:
                      return json.load(f)
                  except Exception as e:
                      print(f"WARNING: failed to parse {path}: {e}", file=sys.stderr)
                      return None

          engine = load("artifact/video00-modal.json")
          out_path = "artifact/selection-freeze-diagnostics.json"

          if not isinstance(engine, dict):
              print("ERROR: artifact/video00-modal.json missing or unparseable -- cannot extract Selection Freeze diagnostics.", file=sys.stderr)
              with open(out_path, "w") as f:
                  json.dump({"schema_version": "cutsell.video00.d235g_selection_freeze_diagnostics_extraction.v1",
                             "source_status": "engine_json_missing_or_unparseable"}, f, indent=2)
              sys.exit(1)

          diag = engine.get("diagnostics") if isinstance(engine.get("diagnostics"), dict) else {}
          block = diag.get("selection_freeze_diagnostics")

          if not isinstance(block, dict):
              print("=" * 78, file=sys.stderr)
              print("ERROR: diagnostics['selection_freeze_diagnostics'] IS MISSING FROM THE SERIALIZED RESULT.", file=sys.stderr)
              print("Expected on every run once a draft contract exists (Video00 or sibling,", file=sys.stderr)
              print("Freeze blocked or not) -- see cutsell_worker/selection_freeze_diagnostics.py.", file=sys.stderr)
              print("FAILING LOUDLY instead of emitting an empty artifact.", file=sys.stderr)
              print("=" * 78, file=sys.stderr)
              with open(out_path, "w") as f:
                  json.dump({"schema_version": "cutsell.video00.d235g_selection_freeze_diagnostics_extraction.v1",
                             "source_status": "engine_json_present", "selection_freeze_diagnostics_block_status": "MISSING_FROM_SERIALIZATION"},
                            f, indent=2)
              sys.exit(1)

          # --- Pure re-projection: every field is copied verbatim from
          # the already-computed D-235G block -- no Freeze/coherence/
          # repair-loop/resolver/D-090 decision is recomputed here. ---
          summary = {"schema_version": "cutsell.video00.d235g_selection_freeze_diagnostics_extraction.v1"}
          summary["source_status"] = "engine_json_present"
          summary["selection_freeze_diagnostics_block_status"] = "PRESENT"
          summary["selection_freeze_diagnostics"] = block
          summary["selected_clip_count_top_level"] = len(engine.get("selected") or [])

          os.makedirs("artifact", exist_ok=True)
          with open(out_path, "w") as f:
              json.dump(summary, f, indent=2, sort_keys=True, default=str)

          size = os.path.getsize(out_path)
          print("--- D-235G Selection Freeze Diagnostics -> Sibling-Safe Extraction (pure re-projection of already-computed diagnostics['selection_freeze_diagnostics'] -- recomputes NO Freeze/coherence/repair-loop/resolver/D-090 decision; sibling-safe, no Video00 golden-file content) ---")
          print(f"summary file: {out_path} ({size} bytes)")
          print(json.dumps(summary, indent=2, sort_keys=True, default=str))
          PY

