          clean_delivery_count = kind_counts.get("CLEAN_DELIVERY_SEQUENCE", 0)
          summary["clean_delivery_sequence_count"] = clean_delivery_count
          summary["clean_delivery_reachability_analysis"] = (
              "B: relation-driven auto-grouping structurally prevents this shape on the live path "
