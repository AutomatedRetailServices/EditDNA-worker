name: CutSell iOS White Indigo screenshots

# Builds the iPhone app for the Simulator (Debug) and takes one screenshot of every redesigned
# screen using the Debug-only "-CutSellScreen <name>" launch argument (sample content, no network,
# no camera, no photo library). The PNGs are pushed to the branch "design-screenshots" so they can
# be placed next to the Figma frames. Contains no keys, videos or personal data.
# Temporary trigger on feat/ios-captions-v2 (no manual button until this file is on main).

on:
  workflow_dispatch: {}
  push:
    branches: [feature/white-indigo]
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/cutsell-ios-white-indigo-shots.yml'

concurrency:
  group: cutsell-ios-white-indigo-shots
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Generate the Xcode project
        working-directory: mobile/ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the Simulator
        working-directory: mobile/ios
        run: |
          set +e
          xcodebuild -project CutSell.xcodeproj -scheme CutSell -sdk iphonesimulator \
            -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build \
            > "$RUNNER_TEMP/build.log" 2>&1
          status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" "$RUNNER_TEMP/build.log" | sort -u | head -40
          if [ "$status" -ne 0 ]; then
            grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -10 | while IFS= read -r line; do
              echo "::error title=build::$(echo "$line" | sed 's#.*/mobile/ios/##' | cut -c1-400)"
            done
            exit "$status"
          fi
          echo "::notice title=build::build ok"

      - name: Screenshots on a small and a large iPhone
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          APP="build/Build/Products/Debug-iphonesimulator/CutSell.app"
          BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          screens="$(sed -n '/static let whiteIndigo = \[/,/\]/p' CutSell/DesignScreenshots.swift | grep -oE '"[a-z0-9_]+"' | tr -d '"')"
          picks="$(xcrun simctl list devices available --json | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(r,x["name"],x["udid"]) for r,v in d.items() if "iOS" in r for x in v if x["name"].startswith("iPhone")]
          c.sort()
          newest=c[-1][0]
          now=[x for x in c if x[0]==newest]
          small=[x for x in now if "SE" in x[1] or x[1].endswith("e")] or [x for x in now if "mini" in x[1]] or [x for x in now if "Pro" not in x[1] and "Plus" not in x[1] and "Max" not in x[1]]
          large=[x for x in now if "Pro Max" in x[1]] or [x for x in now if "Plus" in x[1]] or now
          print("small", small[0][2], small[0][1].replace(" ","_"))
          print("large", large[0][2], large[0][1].replace(" ","_"))')"
          echo "$picks"
          ok=0
          while read -r size udid name; do
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl ui "$udid" appearance light || true
            xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
            xcrun simctl install "$udid" "$APP"
            mkdir -p "$RUNNER_TEMP/shots/$size"
            echo "$name" > "$RUNNER_TEMP/shots/$size/DEVICE.txt"
            for s in $screens; do
              xcrun simctl terminate "$udid" "$BUNDLE" >/dev/null 2>&1 || true
              xcrun simctl launch "$udid" "$BUNDLE" -CutSellScreen "$s" -CutSellCatalogMock -CutSellPlanMock >/dev/null
              sleep 4
              xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/shots/$size/$s.png" >/dev/null 2>&1 && ok=$((ok+1))
            done
            xcrun simctl shutdown "$udid" || true
          done <<< "$picks"
          echo "::notice title=screenshots::$ok screenshots"

      - name: Push the screenshots to the design-screenshots-wi branch
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/out"
          git clone --quiet --no-checkout "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$dir"
          cd "$dir"
          git checkout --quiet --orphan design-screenshots-wi
          git rm -rf --quiet . >/dev/null 2>&1 || true
          mkdir -p wi
          cp -R "$RUNNER_TEMP"/shots/* wi/
          echo "source commit: ${{ github.sha }}" > wi/SOURCE.txt
          git add wi
          git -c user.name="cutsell-ci" -c user.email="ci@cutsell.invalid" commit --quiet -m "White Indigo screenshots for ${{ github.sha }}"
          git push --quiet --force origin design-screenshots-wi
          echo "::notice title=screenshots::pushed to design-screenshots-wi for ${{ github.sha }}"

      - name: Shut down the Simulator
        if: always()
        run: xcrun simctl shutdown all || true
