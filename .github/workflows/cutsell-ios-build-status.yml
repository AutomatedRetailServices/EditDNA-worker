name: CutSell iOS build status (TestFlight, on request)

# Shows the newest TestFlight builds: processing state, expired, encryption-compliance and beta groups. No paid compute.
on:
  push:
    branches: [ios-buildstatus/request]

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUNDLE_ID: ai.cutsell.app
    steps:
      - name: Install
        run: pip install --quiet --disable-pip-version-check 'pyjwt[crypto]' requests
      - name: Status
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python - <<'PY'
          import os, time, jwt, requests
          key = os.environ.pop("ASC_KEY_P8")
          def token():
              now = int(time.time())
              return jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 1100, "aud": "appstoreconnect-v1"},
                                key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          def get(path, **params):
              r = requests.get("https://api.appstoreconnect.apple.com" + path, params=params,
                               headers={"Authorization": "Bearer " + token()}, timeout=60)
              return r.status_code, (r.json() if r.content else {})
          _, apps = get("/v1/apps", **{"filter[bundleId]": os.environ["BUNDLE_ID"]})
          app_id = apps["data"][0]["id"]
          code, builds = get("/v1/builds", **{"filter[app]": app_id, "sort": "-uploadedDate", "limit": 4,
                                              "include": "buildBetaDetail,betaGroups"})
          print("builds HTTP", code)
          inc = {(i["type"], i["id"]): i for i in builds.get("included", [])}
          for b in builds.get("data", []):
              a = b["attributes"]
              rel = b.get("relationships", {})
              det = rel.get("buildBetaDetail", {}).get("data")
              d = inc.get((det["type"], det["id"]), {}).get("attributes", {}) if det else {}
              groups = [inc.get((g["type"], g["id"]), {}).get("attributes", {}).get("name") for g in rel.get("betaGroups", {}).get("data", [])]
              print(f"build {a.get('version')}: processing={a.get('processingState')} expired={a.get('expired')} "
                    f"usesNonExemptEncryption={a.get('usesNonExemptEncryption')} uploaded={a.get('uploadedDate')} "
                    f"internal={d.get('internalBuildState')} external={d.get('externalBuildState')} groups={groups}")
          PY
