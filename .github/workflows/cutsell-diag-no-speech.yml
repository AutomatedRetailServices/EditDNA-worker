name: CutSell diag · why "no speech" (one-off, PO approved 29 Oct)

# Read-only: runs ops/diag_no_speech.py once on Modal (ephemeral, nothing deployed). Prints numbers only.
# Cost: a few cents at most (one small container, ~9 short Deepgram calls).

on:
  push:
    branches: [perf/diagnostico]
    paths: [ops/diag_no_speech.py, .github/workflows/cutsell-diag-no-speech.yml]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/simple-engine-v1
      - uses: actions/checkout@v4
        with:
          path: diag
      - name: Run the diagnosis on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          pip install -q modal
          cp diag/ops/diag_no_speech.py ./diag_no_speech.py
          modal run diag_no_speech.py
