name: EditDNA December Historical Comparison
on:
  workflow_dispatch:
  push:
    branches: [feat/gpt-whisperx-video00]
    paths: [.github/workflows/editdna-december-comparison.yml]
permissions:
  contents: read
concurrency:
  group: cutsell-video00-modal-raw-${{ github.ref }}
  cancel-in-progress: false
jobs:
  historical:
    if: >-
      github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'benchmark: authorized December historical comparison')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install transport
        run: pip install -q modal requests boto3
      - name: Run one historical full engine
        run: python benchmarks/run_editdna_december.py
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: december-reports
          path: |
            december-artifacts/*.json
            december-artifacts/*.log
          if-no-files-found: warn
      - name: Preserve video A
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: december-A
          path: december-artifacts/A/
          if-no-files-found: ignore
      - name: Preserve video B
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: december-B
          path: december-artifacts/B/
          if-no-files-found: ignore
      - name: Preserve video C
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: december-C
          path: december-artifacts/C/
          if-no-files-found: ignore
      - name: Preserve video D
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: december-D
          path: december-artifacts/D/
          if-no-files-found: ignore
      - name: Preserve video E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: december-E
          path: december-artifacts/E/
          if-no-files-found: ignore
      - name: Preserve video F
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: december-F
          path: december-artifacts/F/
          if-no-files-found: ignore
      - name: Preserve video G
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: december-G
          path: december-artifacts/G/
          if-no-files-found: ignore
      - name: Preserve video H
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: december-H
          path: december-artifacts/H/
          if-no-files-found: ignore
      - name: Preserve video I
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: december-I
          path: december-artifacts/I/
          if-no-files-found: ignore
      - name: Preserve video J
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: december-J
          path: december-artifacts/J/
          if-no-files-found: ignore
      - name: Preserve video K
        if: always()
