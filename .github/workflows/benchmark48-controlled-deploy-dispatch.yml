name: Benchmark 48 Controlled Deploy and Dispatch
run-name: Benchmark 48 exact-image staging deploy and single benchmark dispatch

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/benchmark48-controlled-deploy-dispatch.yml

permissions:
  contents: read
  actions: write

jobs:
  deploy-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      RUNPOD_TEMPLATE_NAME: EditDNA-Worker-2
      SOURCE_SHA: 82aacb7ce714bc90e3bef2885a971f99ca48ca3c
      IMAGE_DIGEST: sha256:809b0e56eb8121ae4c6dd799ceb0df21f1e211fc5548a2b20df66556abec45a8
      IMMUTABLE_IMAGE: ghcr.io/automatedretailservices/cutsell-worker:82aacb7ce714bc90e3bef2885a971f99ca48ca3c@sha256:809b0e56eb8121ae4c6dd799ceb0df21f1e211fc5548a2b20df66556abec45a8
      POD_ID: ''
      DISPATCHED: '0'
    steps:
      - name: Validate exact approved Benchmark 48 image
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "82aacb7ce714bc90e3bef2885a971f99ca48ca3c"
          test "$IMAGE_DIGEST" = "sha256:809b0e56eb8121ae4c6dd799ceb0df21f1e211fc5548a2b20df66556abec45a8"
          test "$IMMUTABLE_IMAGE" = "ghcr.io/automatedretailservices/cutsell-worker:82aacb7ce714bc90e3bef2885a971f99ca48ca3c@sha256:809b0e56eb8121ae4c6dd799ceb0df21f1e211fc5548a2b20df66556abec45a8"
          test -n "${RUNPOD_API_KEY:-}" || { echo 'RUNPOD_API_KEY missing'; exit 3; }
          test -n "${REDIS_URL:-}" || { echo 'REDIS_URL missing'; exit 3; }
          test -n "${GEMINI_API_KEY:-}" || { echo 'GEMINI_API_KEY missing'; exit 3; }
          echo "::add-mask::$GEMINI_API_KEY"

      - name: Prove immutable image exists at exact digest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMMUTABLE_IMAGE" > image-inspect.txt
          resolved=$(awk '/^Digest:/ {print $2; exit}' image-inspect.txt)
          test "$resolved" = "$IMAGE_DIGEST" || { echo "Digest mismatch: $resolved"; exit 3; }
          echo "BENCHMARK48_IMMUTABLE_IMAGE=$IMMUTABLE_IMAGE"

      - name: Refuse any duplicate CutSell staging worker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --url "https://rest.runpod.io/v1/pods" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output pods-before.json
          count=$(jq '[.[] | select(.name == "cutsell-staging-worker")] | length' pods-before.json)
          test "$count" = "0" || { echo "cutsell-staging-worker already exists ($count); refusing duplicate paid Pod"; jq '[.[] | select(.name == "cutsell-staging-worker") | {id,name,desiredStatus,imageName}]' pods-before.json; exit 4; }

      - name: Snapshot existing RQ workers before Pod creation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'redis>=5.0' 'rq>=2.6'
          python - <<'PY'
          import json, os
          from redis import Redis
          from rq import Worker
          connection = Redis.from_url(os.environ['REDIS_URL'])
          workers = Worker.all(connection=connection)
          names = sorted(worker.name for worker in workers)
          with open('rq-workers-before.json', 'w', encoding='utf-8') as handle:
              json.dump(names, handle)
          print('RQ workers before:', names)
          PY

      - name: Build safe runtime baseline from EditDNA-Worker-2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --url "https://rest.runpod.io/v1/templates" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output templates.json
          TEMPLATE=$(jq -c --arg name "$RUNPOD_TEMPLATE_NAME" '[.[] | select(.name == $name)][0]' templates.json)
          test "$TEMPLATE" != "null" || { echo 'RunPod baseline template not found'; exit 5; }
          printf '%s' "$TEMPLATE" | jq -c '{ASR_DEVICE:.env.ASR_DEVICE,ASR_ENABLED:.env.ASR_ENABLED,BAD_TAKES_ENABLED:.env.BAD_TAKES_ENABLED,BOUNDARY_REFINER_ENABLED:.env.BOUNDARY_REFINER_ENABLED,BOUNDARY_REFINER_HEAD_STEP_SEC:.env.BOUNDARY_REFINER_HEAD_STEP_SEC,BOUNDARY_REFINER_MIN_DURATION_SEC:.env.BOUNDARY_REFINER_MIN_DURATION_SEC,BOUNDARY_REFINER_TAIL_STEP_SEC:.env.BOUNDARY_REFINER_TAIL_STEP_SEC,FFMPEG_BIN:.env.FFMPEG_BIN,FFPROBE_BIN:.env.FFPROBE_BIN,HEAD_TRIM_SEC:.env.HEAD_TRIM_SEC,PRESIGN_EXPIRES:.env.PRESIGN_EXPIRES,PYTHONPATH:.env.PYTHONPATH,S3_ACL:.env.S3_ACL,S3_BUCKET:.env.S3_BUCKET,S3_PREFIX:.env.S3_PREFIX,TAIL_TRIM_SEC:.env.TAIL_TRIM_SEC,VISION_ENABLED:.env.VISION_ENABLED,VISION_INTERVAL_SEC:.env.VISION_INTERVAL_SEC,VISION_MAX_SAMPLES:.env.VISION_MAX_SAMPLES,VISUAL_BAD_THRESHOLD:.env.VISUAL_BAD_THRESHOLD,WHISPER_DEVICE:.env.WHISPER_DEVICE,WHISPER_MODEL:.env.WHISPER_MODEL,W_FACE:.env.W_FACE,W_VISION:.env.W_VISION,W_VISUAL:.env.W_VISUAL,AWS_ACCESS_KEY_ID:.env.AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY:.env.AWS_SECRET_ACCESS_KEY,AWS_REGION:.env.AWS_REGION} | with_entries(select(.value != null and .value != ""))' > safe-template-env.json
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_BUCKET; do
            value=$(jq -r --arg key "$key" '.[$key] // empty' safe-template-env.json)
            test -n "$value" || { echo "$key missing from EditDNA-Worker-2"; exit 6; }
            echo "::add-mask::$value"
          done
          VOLUME_MOUNT=$(printf '%s' "$TEMPLATE" | jq -r '.volumeMountPath // "/workspace"')
          echo "VOLUME_MOUNT=$VOLUME_MOUNT" >> "$GITHUB_ENV"

      - name: Create exactly one staging GPU worker using baked image CMD
        shell: bash
        run: |
          set -euo pipefail
          jq --arg name "cutsell-staging-worker" --arg image "$IMMUTABLE_IMAGE" --arg redis "$REDIS_URL" --arg gemini "$GEMINI_API_KEY" --arg mount "$VOLUME_MOUNT" '. + {REDIS_URL:$redis,GEMINI_API_KEY:$gemini,CUTSELL_BRAIN_BACKEND:"runpod_local",CUTSELL_EDITORIAL_MODE:"clean_cut",CUTSELL_ASR_MODEL:"medium",CUTSELL_CLEAN_CUT_JUDGE:"0",CUTSELL_HYBRID_PROVIDER:"google",CUTSELL_HYBRID_LLM_ENABLED:"1",CUTSELL_HYBRID_PRIMARY_MODEL:"gemini-3.5-flash-lite",CUTSELL_HYBRID_ESCALATION_MODEL:"gemini-3.6-flash",CUTSELL_HYBRID_MAX_SESSION_USD:"0.0075",CUTSELL_HYBRID_TEST_BUDGET_USD:"0.50"} | {name:$name,imageName:$image,cloudType:"COMMUNITY",computeType:"GPU",gpuCount:1,gpuTypeIds:["NVIDIA RTX A5000","NVIDIA RTX A4000","NVIDIA L4","NVIDIA A40","NVIDIA RTX A6000","NVIDIA GeForce RTX 3090","NVIDIA GeForce RTX 4090"],gpuTypePriority:"custom",interruptible:false,containerDiskInGb:30,volumeInGb:20,volumeMountPath:$mount,env:.}' safe-template-env.json > create-pod.json
          if jq -e '.env | has("OPENAI_API_KEY") or has("EDITDNA_USE_LLM") or has("EDITDNA_LLM_MODEL")' create-pod.json >/dev/null; then
            echo 'Refusing deployment: forbidden OpenAI/legacy provider key present'; exit 7
          fi
          if jq -e 'has("dockerEntrypoint") or has("dockerStartCmd")' create-pod.json >/dev/null; then
            echo 'Refusing deployment: baked Docker CMD must not be overridden'; exit 7
          fi
          code=$(curl --silent --show-error --write-out '%{http_code}' --request POST \
            --url "https://rest.runpod.io/v1/pods" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --header "Content-Type: application/json" \
            --data @create-pod.json --output pod.json)
          rm -f create-pod.json safe-template-env.json
          test "$code" = "201" || { echo "RunPod create HTTP status: $code"; jq '{error,errors,message}' pod.json || true; exit 8; }
          POD_ID=$(jq -r '.id // empty' pod.json)
          test -n "$POD_ID" || { echo 'RunPod returned no Pod id'; exit 8; }
          echo "POD_ID=$POD_ID" >> "$GITHUB_ENV"
          echo "POD_CREATED_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
          echo "BENCHMARK48_POD_ID=$POD_ID"
          jq '{id,name,desiredStatus,imageName,costPerHr,adjustedCostPerHr}' pod.json

      - name: Confirm exact Pod identity and immutable image
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --url "https://rest.runpod.io/v1/pods/$POD_ID" \
              --header "Authorization: Bearer $RUNPOD_API_KEY" \
              --output pod-confirm.json; then
              break
            fi
            sleep 2
          done
          test "$(jq -r '.id // empty' pod-confirm.json)" = "$POD_ID"
          test "$(jq -r '.name // empty' pod-confirm.json)" = "cutsell-staging-worker"
          actual_image=$(jq -r '.imageName // empty' pod-confirm.json)
          test "$actual_image" = "$IMMUTABLE_IMAGE" || { echo "Unexpected Pod image: $actual_image"; exit 9; }
          jq '{id,name,desiredStatus,imageName,costPerHr,adjustedCostPerHr}' pod-confirm.json

      - name: Wait for a fresh RQ worker created by this Pod
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from datetime import datetime, timezone
          from redis import Redis
          from rq import Worker
          connection = Redis.from_url(os.environ['REDIS_URL'])
          before = set(json.load(open('rq-workers-before.json', encoding='utf-8')))
          created_epoch = float(os.environ['POD_CREATED_EPOCH'])
          deadline = time.time() + 600
          while time.time() < deadline:
              workers = Worker.all(connection=connection)
              now = datetime.now(timezone.utc)
              for worker in workers:
                  heartbeat = worker.last_heartbeat
                  if heartbeat is None or worker.name in before:
                      continue
                  if heartbeat.tzinfo is None:
                      heartbeat = heartbeat.replace(tzinfo=timezone.utc)
                  age = (now - heartbeat).total_seconds()
                  if heartbeat.timestamp() >= created_epoch - 5 and age <= 30 and worker.get_state() in {'idle', 'busy'}:
                      print('Fresh Benchmark 48 RQ worker:', worker.name, worker.get_state(), heartbeat.isoformat())
                      raise SystemExit(0)
              time.sleep(10)
          raise SystemExit('No fresh RQ worker registered by the exact Benchmark 48 Pod within 10 minutes')
          PY

      - name: Reconfirm exact staging Pod immediately before benchmark dispatch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --url "https://rest.runpod.io/v1/pods/$POD_ID" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output pod-ready.json
          test "$(jq -r '.id // empty' pod-ready.json)" = "$POD_ID"
          test "$(jq -r '.name // empty' pod-ready.json)" = "cutsell-staging-worker"
          test "$(jq -r '.imageName // empty' pod-ready.json)" = "$IMMUTABLE_IMAGE"
          jq '{id,name,desiredStatus,imageName,costPerHr,adjustedCostPerHr}' pod-ready.json

      - name: Dispatch exactly one Benchmark 48 validation
        shell: bash
        run: |
          set -euo pipefail
          DISPATCH_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "DISPATCH_AT=$DISPATCH_AT" >> "$GITHUB_ENV"
          jq -n --arg ref "cutsell/mobile-v1-clean" --arg pod "$POD_ID" '{ref:$ref,inputs:{approval_token:"RUN39",pod_id:$pod}}' > dispatch.json
          code=$(curl --silent --show-error --write-out '%{http_code}' --request POST \
            --url "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/cutsell-unseen-clean-cut-benchmark.yml/dispatches" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data @dispatch.json --output dispatch-response.txt)
          rm -f dispatch.json
          test "$code" = "204" || { echo "Benchmark workflow_dispatch HTTP status: $code"; cat dispatch-response.txt; exit 10; }
          echo "DISPATCHED=1" >> "$GITHUB_ENV"
          echo "Benchmark 48 workflow_dispatch accepted for exact Pod $POD_ID at $DISPATCH_AT"

      - name: Capture exact Benchmark 48 workflow run ID
        shell: bash
        run: |
          set -euo pipefail
          found=''
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error \
              --url "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/cutsell-unseen-clean-cut-benchmark.yml/runs?event=workflow_dispatch&branch=cutsell%2Fmobile-v1-clean&per_page=10" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output benchmark-runs.json
            found=$(jq -r --arg t "$DISPATCH_AT" '[.workflow_runs[] | select(.created_at >= $t)] | sort_by(.created_at) | last | .id // empty' benchmark-runs.json)
            [ -n "$found" ] && break
            sleep 2
          done
          test -n "$found" || { echo 'Dispatch succeeded but exact Benchmark 48 run ID was not observable yet; Pod intentionally left for benchmark cleanup'; exit 11; }
          echo "BENCHMARK48_RUN_ID=$found"
          jq --argjson id "$found" '.workflow_runs[] | select(.id == $id) | {id,run_number,status,conclusion,head_sha,created_at,html_url}' benchmark-runs.json

      - name: Cleanup exact Pod only if deployment failed before benchmark dispatch
        if: ${{ failure() && env.POD_ID != '' && env.DISPATCHED != '1' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --url "https://rest.runpod.io/v1/pods" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output cleanup-pods.json
          name=$(jq -r --arg id "$POD_ID" '[.[] | select(.id == $id)][0].name // empty' cleanup-pods.json)
          if [ -z "$name" ]; then
            echo "Benchmark 48 Pod already absent after pre-dispatch failure: $POD_ID"
            exit 0
          fi
          test "$name" = "cutsell-staging-worker" || { echo 'Exact failed-deploy Pod is not cutsell-staging-worker; refusing broad cleanup'; exit 12; }
          code=$(curl --silent --show-error --write-out '%{http_code}' --request DELETE \
            --url "https://rest.runpod.io/v1/pods/$POD_ID" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output cleanup-delete.txt)
          echo "Benchmark 48 pre-dispatch cleanup DELETE status: $code"
          test "$code" = "204"
          sleep 2
          curl --fail --silent --show-error \
            --url "https://rest.runpod.io/v1/pods" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output cleanup-after.json
          remaining=$(jq --arg id "$POD_ID" '[.[] | select(.id == $id)] | length' cleanup-after.json)
          test "$remaining" = "0" || { echo 'Benchmark 48 failed-deploy Pod still present after cleanup'; exit 13; }
          echo "Benchmark 48 failed-deploy Pod deleted and explicitly verified absent: $POD_ID"
