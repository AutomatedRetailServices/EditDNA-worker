name: Round 12 Status Probe

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/benchmark52-round12-status-probe.yml

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutsell/mobile-v1-clean
          fetch-depth: 1
      - name: Capture Round 12 orchestrator status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/benchmark52-round7-controlled.yml/runs?branch=cutsell%2Fmobile-v1-clean&event=push&per_page=10"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api" > /tmp/runs.json
          jq '[.workflow_runs[] | select(.head_sha == "4d8e21f9809add0e14fec5a3649b98b4de1139c2")][0] | {id,run_number,status,conclusion,head_sha,created_at,updated_at}' /tmp/runs.json > ops/benchmark52-round12-status.json
          test "$(jq -r '.id // empty' ops/benchmark52-round12-status.json)" != ""
          cat ops/benchmark52-round12-status.json
      - name: Persist status snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/benchmark52-round12-status.json
          git diff --cached --quiet && exit 0
          git commit -m "ops: snapshot Round 12 status"
          git push origin HEAD:cutsell/mobile-v1-clean
