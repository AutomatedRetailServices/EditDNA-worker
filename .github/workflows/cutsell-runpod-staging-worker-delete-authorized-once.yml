name: Delete CutSell RunPod Staging Worker Authorized Once

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - ".cutsell/staging-worker-delete-authorized-once.txt"

permissions:
  contents: read

jobs:
  delete-staging-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      POD_ID: ruza8oup8z3sq0
    steps:
      - uses: actions/checkout@v4
      - name: Require exact delete authorization
        run: |
          set -euo pipefail
          grep -qx 'approval=APPROVE_DELETE_STAGING_WORKER' .cutsell/staging-worker-delete-authorized-once.txt
          test -n "${RUNPOD_API_KEY:-}"
      - name: Verify exact Pod identity
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --url "https://rest.runpod.io/v1/pods" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output pods.json
          name=$(jq -r --arg id "$POD_ID" '[.[] | select(.id == $id)][0].name // empty' pods.json)
          test "$name" = "cutsell-staging-worker" || { echo 'Refusing delete: Pod identity mismatch'; exit 4; }
      - name: Delete exact staging Pod
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --write-out '%{http_code}' \
            --request DELETE \
            --url "https://rest.runpod.io/v1/pods/$POD_ID" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output delete-response.txt)
          echo "RunPod delete HTTP status: $code"
          test "$code" = "204"
      - name: Confirm Pod is gone
        run: |
          set -euo pipefail
          sleep 2
          curl --fail --silent --show-error \
            --url "https://rest.runpod.io/v1/pods" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output pods-after.json
          count=$(jq --arg id "$POD_ID" '[.[] | select(.id == $id)] | length' pods-after.json)
          echo "remaining matching pods: $count"
          test "$count" = "0"
