name: CutSell Shape it review sheet (free, on request only)

# Builds one review image (original | Google | kie.ai) in the PRIVATE bucket. No paid calls, nothing image-like here.
on:
  push:
    branches: [shape-kie/sheet]

permissions:
  contents: read

jobs:
  sheet:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check --quiet boto3 requests pillow
      - env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python scripts/shape_kie_sheet.py
