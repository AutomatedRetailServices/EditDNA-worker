name: CutSell Run38 Watch

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/cutsell-run37-watch.yml

permissions:
  actions: read
  contents: write

jobs:
  record-run38:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutsell/mobile-v1-clean

      - name: Resolve exact Run38 workflow run
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=""
          for attempt in $(seq 1 60); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=cutsell%2Fmobile-v1-clean&per_page=100")
            found=$(printf '%s' "$runs" | jq -c '[.workflow_runs[] | select(.name == "CutSell Run38 Gold One-Shot" and .event == "push")][0] // empty')
            if [ -n "$found" ]; then
              break
            fi
            sleep 10
          done
          test -n "$found" || { echo 'Run38 workflow run not found'; exit 2; }
          run_id=$(printf '%s' "$found" | jq -r '.id')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          printf '%s' "$found" | jq '{run_id:.id,name,status,conclusion,head_sha,event,created_at,updated_at,html_url}' > run38-found.json
          cat run38-found.json

      - name: Record Run38 run id on branch
        shell: bash
        env:
          RUN38_RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p ops
          cp run38-found.json ops/run38-watch.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/run38-watch.json
          git commit -m "Record Run38 workflow run id" || true
          git push origin HEAD:cutsell/mobile-v1-clean
