name: CutSell Pod MINIMAL EXECUTION ISOLATION (final root-cause test)

# D-042 follow-up: "FINAL POD EXECUTION ISOLATION -- MINIMAL KNOWN-GOOD
# IMAGE." Three live Pods across two cloud types and two execution
# transports -- all running the CutSell image -- have hit the identical
# `machine: {}` empty-record signature (see docs/CUTSELL_DECISIONS.md
# D-042). This workflow isolates the one remaining shared variable: is
# the failure in the CutSell image/runtime, or in RunPod's account/host
# execution layer for this account, which would show up regardless of
# image?
#
# Deliberately does NOT build, push, or reference the CutSell image at
# all -- no GHCR login, no Docker build step, no CutSell env vars, no S3,
# no AWS/Gemini/Redis credentials, no pod_job_server, no port 8080, no
# Video00. Uses a minimal public CUDA-compatible image and a trivial
# shell command instead (see runpod_pod_minimal_isolation_gate.py).
#
# Independent from every other D-042 QA workflow: does not touch
# cutsell-video00-pod-raw.yml, cutsell-video00-pod-direct-raw.yml, or
# RunPod Serverless. One-off diagnostic, not a recurring benchmark path.
#
# Bootstrap note: GitHub's workflow_dispatch REST API 404s for a workflow
# that has never completed a run via any trigger. A narrow, self-scoped
# `push:` trigger (limited to this file's own path, on this isolated QA
# branch only) registers the workflow on its first push; the actual
# Pod-creating step is explicitly gated to `workflow_dispatch` so that
# bootstrap run stays genuinely inert (RUNPOD_API_KEY comes from repo
# secrets regardless of trigger type, so without this gate a push-
# triggered run would still create a real Pod with this workflow's
# defaults). Removed once workflow_dispatch is confirmed working, same
# as every other workflow this session bootstrapped this way.

on:
  push:
    branches:
      - feature/runpod-pod-on-demand
    paths:
      - '.github/workflows/cutsell-pod-minimal-isolation-raw.yml'
  workflow_dispatch:
    inputs:
      existing_pod_id:
        description: "Optional: reuse this isolation Pod id instead of creating a fresh one. Leave blank to create new."
        required: false
        default: ""
      qa_pod_cost_ceiling_usd_per_hr:
        description: "Pod hourly cost ceiling in USD. Never provisions above this."
        required: false
        default: "1.50"
      pod_isolation_image:
        description: >-
          Minimal public image to test (NOT the CutSell image). Leave
          blank for the script's own default (nvidia/cuda:12.4.1-base-
          ubuntu22.04).
        required: false
        default: ""
      pod_isolation_start_command:
        description: >-
          Trivial command that proves the container executed. Leave
          blank for the script's own default
          (sh -c 'echo POD_EXECUTION_OK; sleep 60').
        required: false
        default: ""
      pod_isolation_container_disk_gb:
        description: "Container disk size in GB. The minimal image needs very little."
        required: false
        default: "20"
      pod_isolation_cloud_type:
        description: "RunPod cloud type for this isolation test. SECURE per the standing directive."
        required: false
        default: "SECURE"
      observe_window_s:
        description: "Bounded seconds to snapshot the Pod's own GET state (never S3, never CutSell-specific) before stopping."
        required: false
        default: "90"
      observe_poll_interval_s:
        description: "Seconds between Pod-state snapshots during the observation window."
        required: false
        default: "15"

concurrency:
  # Independent identity from every other D-042 QA Pod group -- never
  # shares a lock with the HTTP-transport gate, the direct-execution
  # gate, or Serverless.
  group: cutsell-pod-minimal-isolation
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
  EXISTING_POD_ID: ${{ github.event.inputs.existing_pod_id }}
  QA_POD_COST_CEILING_USD_PER_HR: ${{ github.event.inputs.qa_pod_cost_ceiling_usd_per_hr }}
  POD_ISOLATION_IMAGE: ${{ github.event.inputs.pod_isolation_image }}
  POD_ISOLATION_START_COMMAND: ${{ github.event.inputs.pod_isolation_start_command }}
  POD_ISOLATION_CONTAINER_DISK_GB: ${{ github.event.inputs.pod_isolation_container_disk_gb }}
  POD_ISOLATION_CLOUD_TYPE: ${{ github.event.inputs.pod_isolation_cloud_type }}
  OBSERVE_WINDOW_S: ${{ github.event.inputs.observe_window_s }}
  OBSERVE_POLL_INTERVAL_S: ${{ github.event.inputs.observe_poll_interval_s }}

jobs:
  pod-minimal-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact test head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Run minimal-image Pod execution isolation gate
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: python3 runpod_pod_minimal_isolation_gate.py

      - name: Upload isolation summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-pod-minimal-isolation-summary
          path: pod-minimal-isolation-summary.json
          retention-days: 14
          if-no-files-found: warn

      - name: Print isolation summary + decision hint
        if: always()
        shell: bash
        run: |
          set +e
          if [ -s pod-minimal-isolation-summary.json ]; then
            cat pod-minimal-isolation-summary.json
            classification=$(jq -r '.classification // empty' pod-minimal-isolation-summary.json)
            echo ""
            case "$classification" in
              CONTAINER_EXECUTION_CONFIRMED)
                echo "DECISION B: the minimal public image executed successfully. RunPod Pod compute works for this account -- root cause is the CutSell image/runtime/startup, not RunPod. Do not blame RunPod; audit Dockerfile.cutsell.serverless and Pod startup from first principles."
                ;;
              CONTAINER_EXECUTION_NOT_CONFIRMED)
                echo "DECISION A: the minimal public image also never executed. RunPod/account/host execution problem is effectively confirmed. Stop further Pod experiments; escalate to RunPod Support with this evidence."
                ;;
              POD_LIFECYCLE_FAILED)
                echo "Pod never reached a usable state (lifecycle failure, e.g. capacity) -- not evidence either way. See lifecycle_classification above."
                ;;
              *)
                echo "No definitive classification recorded -- see the summary above for why."
                ;;
            esac
          else
            echo "No pod-minimal-isolation-summary.json was written -- the isolation gate script did not complete normally."
          fi

      - name: Force-stop and force-delete isolation Pod (independent safety net)
        if: always()
        shell: bash
        run: |
          set +e
          pod_id=""
          if [ -s pod-minimal-isolation-summary.json ]; then
            pod_id=$(jq -r '.pod_id // empty' pod-minimal-isolation-summary.json)
          fi
          if [ -z "$pod_id" ]; then
            pod_id="${EXISTING_POD_ID:-}"
          fi
          if [ -z "$pod_id" ]; then
            echo "No Pod id known to this run; nothing to force-stop/delete."
            exit 0
          fi
          curl --silent --show-error \
            --request POST \
            --url "https://rest.runpod.io/v1/pods/$pod_id/stop" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output /tmp/pod-force-stop-response.json || true
          echo "Force-stop issued for Pod $pod_id (safety net; a no-op if the gate script already stopped it)."
          curl --silent --show-error \
            --request DELETE \
            --url "https://rest.runpod.io/v1/pods/$pod_id" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output /tmp/pod-force-delete-response.json || true
          echo "Force-delete issued for Pod $pod_id (safety net; a no-op if the gate script already deleted it)."
