name: CutSell Modal secret names (no values)

# Prints only the NAMES of the storage variables inside the Modal secret `cutsell-worker` (never a
# value), checks the 4 FALLBACK_* and AWS_ENDPOINT_URL_S3 exist and that the endpoint is R2 by its
# domain only. Runs on push to probe/modal-secret-names.
on:
  push:
    branches: [probe/modal-secret-names]
permissions:
  contents: read
jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Names inside the secret
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          pip install -q modal
          cat > check.py <<'PY'
          import modal
          app = modal.App("cutsell-secret-names-check")
          @app.function(secrets=[modal.Secret.from_name("cutsell-worker")], timeout=60)
          def names():
              import os
              from urllib.parse import urlparse
              keys = sorted(k for k in os.environ if k.startswith(("AWS_", "FALLBACK_", "S3_")))
              endpoint = urlparse(os.environ.get("AWS_ENDPOINT_URL_S3", "")).hostname or ""
              return {"names": keys, "endpoint_domain": endpoint.split(".", 1)[-1] if endpoint else "",
                      "bucket_is_cutsell_videos": os.environ.get("S3_BUCKET") == "cutsell-videos",
                      "region_is_auto": os.environ.get("AWS_REGION") == "auto",
                      "fallback_region_set": bool(os.environ.get("FALLBACK_AWS_REGION")),
                      "bucket_stripped_ok": os.environ.get("S3_BUCKET", "").strip().strip('"').strip("'") == "cutsell-videos",
                      "bucket_same_as_fallback": os.environ.get("S3_BUCKET", "").strip() == os.environ.get("FALLBACK_S3_BUCKET", "").strip(),
                      "bucket_length": len(os.environ.get("S3_BUCKET", "")),
                      "region_stripped_ok": os.environ.get("AWS_REGION", "").strip().strip('"').lower() == "auto",
                      "region_same_as_fallback": os.environ.get("AWS_REGION", "").strip() == os.environ.get("FALLBACK_AWS_REGION", "").strip(),
                      "key_same_as_fallback": os.environ.get("AWS_ACCESS_KEY_ID", "") == os.environ.get("FALLBACK_AWS_ACCESS_KEY_ID", "")}
          @app.local_entrypoint()
          def main():
              r = names.remote()
              need = ["AWS_ENDPOINT_URL_S3", "FALLBACK_S3_BUCKET", "FALLBACK_AWS_REGION", "FALLBACK_AWS_ACCESS_KEY_ID", "FALLBACK_AWS_SECRET_ACCESS_KEY"]
              print("::notice title=names::" + ", ".join(r["names"]))
              print("::notice title=required::" + ", ".join(f"{n}={'yes' if n in r['names'] else 'MISSING'}" for n in need))
              print("::notice title=details::" + ", ".join(f"{k}={r[k]}" for k in ("bucket_stripped_ok", "bucket_same_as_fallback", "bucket_length", "region_stripped_ok", "region_same_as_fallback", "key_same_as_fallback")))
              print(f"::notice title=storage::endpoint domain {r['endpoint_domain']}; bucket cutsell-videos={r['bucket_is_cutsell_videos']}; region auto={r['region_is_auto']}")
          PY
          modal run check.py
