name: CutSell Unified Selection Schema Isolation

# Isolates the Gemini 400 seen in Video00 RAW #116/#117 without spending a
# paid RunPod GPU RAW. See scripts/isolate_unified_selection_schema.py and
# docs/claude-handoff/CUTSELL_COMPLETE_HANDOFF.md ("NEW CURRENT LIVE
# BLOCKER") for context. This mirrors cutsell-hybrid-llm-bakeoff.yml's cheap,
# GPU-free pattern: a few real but small Gemini calls on ubuntu-latest.

on:
  push:
    branches: [cutsell/mobile-v1-clean]
    paths:
      - .github/workflows/cutsell-unified-selection-schema-isolate.yml
      - scripts/isolate_unified_selection_schema.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify secret without revealing value
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}" || { echo 'GEMINI_API_KEY missing'; exit 3; }
          echo 'Gemini credential is present.'

      - name: Install minimal dependencies
        shell: bash
        run: pip install requests

      - name: Run schema isolation probe
        shell: bash
        run: python scripts/isolate_unified_selection_schema.py

      - name: Upload isolation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutsell-unified-selection-schema-isolation-${{ github.sha }}
          path: artifacts/unified-selection-schema-isolation.json
          if-no-files-found: warn
          retention-days: 14
