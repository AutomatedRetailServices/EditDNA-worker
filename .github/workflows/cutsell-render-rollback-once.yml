name: CutSell Render Rollback Once

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - ".cutsell/render-rollback-once.txt"

permissions:
  contents: read

jobs:
  rollback-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_ID: srv-d9rdlsvavr4c73912uo0
      API_BASE: https://cutsell-api.onrender.com
      CURRENT_DEPLOY: dep-d9re89740ujc73b9ena0
      PREVIOUS_DEPLOY: dep-d9rdlt7avr4c73912vr0
    steps:
      - uses: actions/checkout@v4
      - name: Require marker
        run: grep -qx 'run=render-rollback' .cutsell/render-rollback-once.txt
      - name: Roll back to previous successful deploy and verify
        shell: bash
        run: |
          set -euo pipefail
          trigger() {
            target="$1"; outfile="$2"
            code=$(curl --silent --show-error --write-out '%{http_code}' --request POST \
              --url "https://api.render.com/v1/services/$SERVICE_ID/rollback" \
              --header 'Accept: application/json' --header 'Content-Type: application/json' \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --data "{\"deployId\":\"$target\"}" --output "$outfile")
            echo "rollback target=$target HTTP=$code"
            test "$code" = "201"
          }
          wait_deploy() {
            file="$1"; id=$(jq -r '.id // .deploy.id // empty' "$file"); test -n "$id"
            echo "new rollback deploy=$id"
            for _ in $(seq 1 90); do
              curl --fail --silent --show-error --url "https://api.render.com/v1/services/$SERVICE_ID/deploys/$id" \
                --header 'Accept: application/json' --header "Authorization: Bearer $RENDER_API_KEY" --output status.json
              status=$(jq -r '.status // .deploy.status // empty' status.json)
              echo "deploy $id status=$status"
              [ "$status" = live ] && return 0
              case "$status" in build_failed|update_failed|canceled|pre_deploy_failed) return 8;; esac
              sleep 8
            done
            return 9
          }
          health() {
            for _ in $(seq 1 45); do
              if curl --fail --silent "$API_BASE/v1/healthz" > health.json; then
                if jq -e '.ok == true and .queue_ready == true and .storage_ready == true and .semantic_ready == true' health.json >/dev/null; then
                  cat health.json; return 0
                fi
              fi
              sleep 4
            done
            return 10
          }
          trigger "$PREVIOUS_DEPLOY" rollback-old.json
          wait_deploy rollback-old.json
          health
          echo RENDER_ROLLBACK_PREVIOUS_PASS
      - name: Restore original live deploy and verify
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --write-out '%{http_code}' --request POST \
            --url "https://api.render.com/v1/services/$SERVICE_ID/rollback" \
            --header 'Accept: application/json' --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --data "{\"deployId\":\"$CURRENT_DEPLOY\"}" --output restore.json)
          echo "restore HTTP=$code"; test "$code" = "201"
          id=$(jq -r '.id // .deploy.id // empty' restore.json); test -n "$id"
          for _ in $(seq 1 90); do
            curl --fail --silent --show-error --url "https://api.render.com/v1/services/$SERVICE_ID/deploys/$id" \
              --header 'Accept: application/json' --header "Authorization: Bearer $RENDER_API_KEY" --output restore-status.json
            status=$(jq -r '.status // .deploy.status // empty' restore-status.json)
            echo "restore deploy $id status=$status"
            [ "$status" = live ] && break
            case "$status" in build_failed|update_failed|canceled|pre_deploy_failed) exit 8;; esac
            sleep 8
          done
          for _ in $(seq 1 45); do
            if curl --fail --silent "$API_BASE/v1/healthz" > restore-health.json && \
              jq -e '.ok == true and .queue_ready == true and .storage_ready == true and .semantic_ready == true' restore-health.json >/dev/null; then
              cat restore-health.json
              echo RENDER_RESTORE_CURRENT_PASS
              exit 0
            fi
            sleep 4
          done
          exit 10
