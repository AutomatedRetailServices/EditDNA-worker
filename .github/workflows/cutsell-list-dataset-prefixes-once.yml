name: CutSell List Dataset Prefixes Once

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/cutsell-list-dataset-prefixes-once.yml

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutsell/mobile-v1-clean
      - name: List candidate CutSell S3 dataset prefixes and video keys
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}" || { echo 'RUNPOD_API_KEY missing'; exit 3; }
          python -m pip install -q 'boto3>=1.34'
          curl --fail --silent --show-error --url "https://rest.runpod.io/v1/templates" --header "Authorization: Bearer $RUNPOD_API_KEY" --output templates.json
          TEMPLATE=$(jq -c '[.[] | select(.name == "EditDNA-Worker-2")][0]' templates.json)
          test "$TEMPLATE" != "null" || exit 4
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_BUCKET; do
            value=$(printf '%s' "$TEMPLATE" | jq -r --arg key "$key" '.env[$key] // empty')
            test -n "$value" || { echo "$key missing"; exit 5; }
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
      - name: Persist prefixes and likely RAW mixed video keys
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import PurePosixPath
          import boto3
          s3=boto3.client('s3',region_name=os.environ['AWS_REGION'])
          bucket=os.environ['S3_BUCKET']
          top=s3.list_objects_v2(Bucket=bucket,Delimiter='/',MaxKeys=1000)
          top_prefixes=[p.get('Prefix','') for p in top.get('CommonPrefixes',[])]
          likely=[]
          token=None
          scanned=0
          while scanned < 5000:
              kwargs={'Bucket':bucket,'MaxKeys':1000}
              if token: kwargs['ContinuationToken']=token
              r=s3.list_objects_v2(**kwargs)
              for item in r.get('Contents',[]):
                  key=str(item.get('Key') or '')
                  scanned += 1
                  if PurePosixPath(key).suffix.lower() not in {'.mp4','.mov','.m4v','.webm'}:
                      continue
                  low=key.lower()
                  if any(term in low for term in ('raw','bloop','editdna','final','mixed','training','train','longform','long form','validation')):
                      likely.append(key)
              if not r.get('IsTruncated') or scanned >= 5000: break
              token=r.get('NextContinuationToken')
          os.makedirs('ops',exist_ok=True)
          with open('ops/run35-dataset-prefix-audit.json','w',encoding='utf-8') as f:
              json.dump({'top_prefixes':top_prefixes,'likely_video_keys':likely,'scanned_objects':scanned},f,ensure_ascii=False,indent=2)
          print(json.dumps({'top_prefixes':top_prefixes,'likely_video_keys':likely[:200],'scanned_objects':scanned},ensure_ascii=False,indent=2))
          PY
      - name: Commit prefix audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/run35-dataset-prefix-audit.json
          git commit -m 'Record Run35 dataset prefix audit'
          git push origin HEAD:cutsell/mobile-v1-clean
