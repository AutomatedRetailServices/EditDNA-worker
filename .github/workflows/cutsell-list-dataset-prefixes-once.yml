name: CutSell Run35 Retry Build Observer Once

on:
  push:
    branches:
      - cutsell/mobile-v1-clean
    paths:
      - .github/workflows/cutsell-list-dataset-prefixes-once.yml

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: c8af5661b0cf2d40a6f8e73c8e9d9da5a7d041bc
      WORKFLOW_FILE: cutsell-feature-worker-one-shot-build.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutsell/mobile-v1-clean
      - name: Observe exact retry build and persist immutable digest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          run_id=""
          status=""
          conclusion=""
          for i in $(seq 1 100); do
            runs=$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "$api/actions/workflows/$WORKFLOW_FILE/runs?branch=cutsell/mobile-v1-clean&per_page=50")
            run_id=$(printf '%s' "$runs" | jq -r --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)][0].id // empty')
            status=$(printf '%s' "$runs" | jq -r --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)][0].status // empty')
            conclusion=$(printf '%s' "$runs" | jq -r --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)][0].conclusion // empty')
            if [ -n "$run_id" ] && [ "$status" = "completed" ]; then break; fi
            sleep 12
          done
          test -n "$run_id" || { echo 'Exact retry build run was not found'; exit 2; }
          test "$status" = "completed" || { echo 'Exact retry build did not complete'; exit 3; }
          test "$conclusion" = "success" || { echo "Exact retry build failed: $conclusion"; exit 4; }
          jobs=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$api/actions/runs/$run_id/jobs?per_page=50")
          job_id=$(printf '%s' "$jobs" | jq -r '[.jobs[] | select(.name == "docker")][0].id // empty')
          test -n "$job_id" || { echo 'Retry build docker job not found'; exit 5; }
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$api/actions/jobs/$job_id/logs" -o retry-build.log
          digest=$(grep -Eo 'sha256:[0-9a-f]{64}' retry-build.log | tail -1)
          test -n "$digest" || { echo 'Retry build digest not found'; exit 6; }
          mkdir -p ops
          jq -n --arg sha "$TARGET_SHA" --arg digest "$digest" --argjson run_id "$run_id" --argjson job_id "$job_id" \
            '{head_sha:$sha,run_id:$run_id,job_id:$job_id,conclusion:"success",image_digest:$digest}' > ops/run35-build-status.json
      - name: Persist retry build status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/run35-build-status.json
          git commit -m 'Record Run35 retry worker build digest'
          git pull --rebase origin cutsell/mobile-v1-clean
          git push origin HEAD:cutsell/mobile-v1-clean
